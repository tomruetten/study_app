        guided: [
          { id: 'g_rst4_1', badge: 'Antriebsstrang', title: 'Aufbau des elektrischen Antriebsstrangs', body: 'Prinzipieller Aufbau (in Energieflussrichtung):\n\nBatterie (DC) → Inverter (DC→AC) → E-Maschine → Getriebe → Rad\n\nDazu die Regelung als Kaskadenregelung: Stromregler (Stellgröße Spannung) → Drehzahlregler (Stellgröße Strom) → ggf. Lageregler. Im Fahrzeug ist keine Lageregelung nötig — die „Drehzahlregelung“ übernimmt der Fahrer (Fahrpedal).\n\nHauptanforderungen an den Antrieb (Klausurklassiker): hohe Leistung bei geringem Gewicht (Leistungsgewicht), hohe Effizienz/Wirkungsgrad, passende Charakteristik/Fahrbarkeit, Zuverlässigkeit über die Renndistanz, Package/Bauraum, Kühlbarkeit.', example: '🔑 Merke die Kette: Batterie → Inverter → E-Maschine → Getriebe, plus Kaskadenregelung (Strom → Drehzahl).' },
          { id: 'g_rst4_2', badge: 'E-Maschine', title: 'Maschinenarten — warum die PSM im Motorsport gewinnt', body: 'Übersicht:\n• Gleichstrommaschine: einfache Regelung, aber mechanischer Verschleiß (Bürsten), Verluste im Rotor\n• Asynchronmaschine (ASM): günstig, robust, keine Magnete — aber Rotorverluste, niedrigere Effizienz & Leistungsdichte\n• Fremderregte Synchronmaschine: keine Magnete, aber Erregerübertragung auf Rotor + Rotorverluste\n• Permanenterregte Synchronmaschine (PSM): HOHE EFFIZIENZ, HOHE LEISTUNGSDICHTE — dafür hohe Kosten und Entmagnetisierungsgefahr → Standard im Motorsport!\n\nBetriebsbereiche: Grunddrehzahlbereich (max. Drehmoment, Leistung steigt linear) → ab Nenndrehzahl Feldschwächbereich (Spannungsgrenze erreicht, Leistung konstant; negativer d-Strom schwächt das Feld). Wirkungsgrad-Bestpunkt meist bei mittlerer Drehzahl im Feldschwächbereich.', example: '🔑 Motorsport = PSM wegen Effizienz + Leistungsdichte. Serie vs. Motorsport: Motorsport opfert Lebensdauer, Kosten, Geräusch — maximiert Effizienz, Leistungsdichte, geringe Rotorträgheit (CoFe-Bleche, dünnere Lamellen).' },
          { id: 'g_rst4_3', badge: 'Inverter', title: 'Inverter: PWM, Raumzeiger & SiC vs. IGBT', body: 'Der Inverter wandelt die DC-Spannung der Batterie in dreiphasige Wechselspannung:\n• Pulsweitenmodulation (PWM): sinusförmige Sollspannung vs. dreiecksförmiges Trägersignal\n• Raumzeigermodulation: 2³ = 8 Grundraumzeiger durch die Schaltzustände der Leistungsschalter; Sollraumzeiger aus den 3 Nachbarn dargestellt\n\nLeistungsmodule: IGBT → Hybrid-SiC → Voll-SiC (Siliziumkarbid). Motorsport braucht Voll-SiC: höhere Taktfrequenz (wegen hoher MGU-Drehzahl bis 60.000 U/min) nur mit geringen Schaltverlusten darstellbar; geringere Verluste in der E-Maschine, kleinerer Zwischenkreis.', example: '🔑 Serie stellt von IGBT auf SiC um; im Motorsport ist Voll-SiC wegen der hohen Taktfrequenz Pflicht.' },
          { id: 'g_rst4_4', badge: 'Energiespeicher', title: 'F1-Energiespeicher: Anforderungen & Technologien', body: 'FIA-Reglement F1 (ab 2026) für den Energiespeicher:\n• max. 350 kW Boost-/Rekuperationsleistung (MGU-K)\n• max. 4 MJ Energiehub (SoC-Delta) pro Runde\n• max. 9 MJ Rekuperation pro Runde\n• min. 35 kg Gewicht, max. 1000 V Zwischenkreisspannung\n\nVergleich Serie (VW ID.3: >50 kWh, 150 kW, 400–600 kg) vs. F1 (<4 kWh, 350 kW, 35 kg): völlig andere Auslegung — LEISTUNGSdichte statt ENERGIEdichte!\n\nEnergiespeicher-Technologien (Klausurklassiker mit Vor-/Nachteilen):\n• Batterie (Li-Ion): hohe Energiedichte, mittlere Leistungsdichte — thermische Limits, Degradation\n• Superkondensatoren: sehr hohe Leistungsdichte, sehr geringe Energiedichte, hohe Zyklenfestigkeit\n• Schwungrad (Flywheel): hohe Leistungsdichte, mechanisch komplex, Gyroskopie-Effekte\n\nBei Effizienz-/Verlustleistungskurven: Batterie = höhere Energie, mehr Verluste bei hoher Leistung; Kondensator = effizient bei Leistungsspitzen.', example: '🔑 WS16-Klausur: „Energiespeichermöglichkeiten mit Vor-/Nachteilen“ + WS24/25: „Effizienz und Verlustleistung zwei Speichermethoden zuordnen“.' },
          { id: 'g_rst4_5', badge: 'Batterie-System', title: 'Aufbau Batteriesystem & Performance-Hebel', body: 'Komponenten eines Batteriesystems: Zellen (+Verbindungstechnik/Busbars), Sicherung, Schütze, Shunt/Stromsensor, Gehäuse, Schnittstellen, Batteriemanagementsystem (BMS), Isolationswächter, Kühlsystem.\n\n• Die Li-Ion-ZELLE dominiert die Performance (>80 % der Verluste): ohmsche Verluste, Ladungstransfer-/Aktivierungsüberspannungen, Transport-/Konzentrationsüberspannungen.\n• Zellkontaktierung: Bereits +100 µΩ Kontaktwiderstand × 250 Zellen × 500 A = 12,5 V Spannungsabfall = 6250 W Verluste! (Laser-/Ultraschallschweißen)\n• Thermomanagement: konventionelle Kühlplatten (leicht, lokal begrenzt) vs. Full-Immersion-Kühlung (homogen, hohe Kühlleistung, aber schwerer) → Zielkonflikt Gewicht vs. Kühlwirkung\n• BMS: garantiert sicheren Betrieb an den Grenzen (Safe Operating Area: Spannungs-, Strom-, Temperaturlimits), Zustandserfassung & -prädiktion (SoC).', example: '🔑 Gegenläufige Wechselwirkung: hohe Temperatur senkt den Innenwiderstand (mehr Leistung), beschleunigt aber die Degradation.' },
        ],
        flashcards: [
          { id: 'fc_rst4_1', front: 'Nenne die Komponenten des elektrischen Antriebsstrangs in Energieflussrichtung.', back: 'Batterie → Inverter (DC→AC) → E-Maschine → Getriebe → Rad. Dazu die Antriebsregelung als Kaskadenregelung (Stromregler → Drehzahlregler).' },
          { id: 'fc_rst4_2', front: 'Welche Hauptanforderungen werden an den (Renn-)Antrieb gestellt?', back: '• Hohe Leistung / niedriges Leistungsgewicht (kg/kW)\n• Hohe Effizienz / Wirkungsgrad\n• Passende Charakteristik & Fahrbarkeit\n• Zuverlässigkeit über die Renndistanz\n• Package/Bauraum & Kühlbarkeit\n• Verbrauch (Energielimit) & Reglementkonformität' },
          { id: 'fc_rst4_3', front: 'Warum setzt der Motorsport auf die permanenterregte Synchronmaschine (PSM)?', back: 'Höchste Effizienz und höchste Leistungsdichte (keine Rotor-Erregerverluste). Nachteile (hohe Kosten, Entmagnetisierungsgefahr) sind im Motorsport akzeptabel.' },
          { id: 'fc_rst4_4', front: 'Beschreibe die zwei Betriebsbereiche einer E-Maschine.', back: '• Grunddrehzahlbereich: maximales Drehmoment, Leistung/Spannung steigen linear.\n• Feldschwächbereich (ab Nenndrehzahl): Spannungsgrenze erreicht, Leistung konstant; negativer d-Strom schwächt das Feld. Bestpunkt des Wirkungsgrads meist bei mittlerer Drehzahl im Feldschwächbereich.' },
          { id: 'fc_rst4_5', front: 'Warum nutzt der Motorsport-Inverter Voll-SiC statt IGBT?', back: 'Hohe MGU-Drehzahlen (bis 60.000 U/min) erfordern hohe Taktfrequenzen — nur mit den geringen Schaltverlusten von Voll-SiC darstellbar. Zusätzlich: geringere Verluste in der E-Maschine, kleinerer Zwischenkreis.' },
          { id: 'fc_rst4_6', front: 'Nenne die FIA-Eckdaten des F1-Energiespeichers (ab 2026).', back: '• 350 kW max. Boost-/Rekuperationsleistung\n• 4 MJ max. Energiehub (SoC-Delta) pro Runde\n• 9 MJ max. Rekuperation pro Runde\n• min. 35 kg Gewicht\n• max. 1000 V Zwischenkreisspannung' },
          { id: 'fc_rst4_7', front: 'Vergleiche die 3 Energiespeicher-Technologien mit Vor-/Nachteilen.', back: '• Li-Ion-Batterie: hohe Energiedichte, gute Leistungsdichte — Degradation, Thermik, Brandlast.\n• Superkondensator: sehr hohe Leistungsdichte & Zyklenfestigkeit — sehr geringe Energiedichte.\n• Schwungrad: hohe Leistungsdichte, robust gegen Zyklen — mechanisch komplex, Gyroskopie, Sicherheit.' },
          { id: 'fc_rst4_8', front: 'F1 Power Unit 2026: Kennzahlen von ICE und MGU-K?', back: 'ICE: 1,6-l-Turbo, ca. 400 kW, min. 130 kg, 3000 MJ/h Kraftstoffenergiedurchfluss.\nMGU-K: max. 350 kW, max. 60.000 U/min, fixe Übersetzung zur Kurbelwelle. MGU-H entfällt ab 2026. Getriebe: 8 Vorwärtsgänge, seamless.' },
          { id: 'fc_rst4_9', front: 'Warum ist die Zellkontaktierung ein entscheidender Performance-Hebel?', back: 'Kleine Widerstandserhöhungen skalieren mit der Zellanzahl: 100 µΩ × 250 Zellen × 500 A = 12,5 V Abfall = 6250 W Verlust. Fügeverfahren: Laser- und Ultraschallschweißen.' },
          { id: 'fc_rst4_10', front: 'Konventionelle Kühlung vs. Full-Immersion-Kühlung der Batterie?', back: 'Kühlplatten/-kanäle: bewährt, leicht, einfache Integration — aber lokal begrenzte, inhomogene Kühlung.\nFull-Immersion: hohe, homogene Kühlleistung — aber hohes Gewicht (Kühlmittel) und Package. → Zielkonflikt Gewicht vs. Kühlwirkung.' },
          { id: 'fc_rst4_11', front: 'Welche Aufgaben hat das BMS?', back: 'Sicherer Betrieb in allen Situationen: Überwachung von Spannungs-, Strom- und Temperaturgrenzen (Safe Operating Area), Zustandserfassung & -prädiktion (SoC), Balancing — im Rennen Betrieb AN den Grenzen für maximale Performance.' },
        ],
        quiz: [
          { id: 'qz_rst4_1', category: 'RST 4 — E-Antriebe', question: 'Welche Reihenfolge beschreibt den elektrischen Antriebsstrang korrekt?', options: ['Batterie → E-Maschine → Inverter → Getriebe', 'Batterie → Inverter → E-Maschine → Getriebe', 'Inverter → Batterie → Getriebe → E-Maschine', 'E-Maschine → Batterie → Inverter → Getriebe'], correct: 1, explanation: 'Die Batterie liefert DC, der Inverter wandelt in AC, die E-Maschine wandelt elektrisch→mechanisch, das Getriebe übersetzt zum Rad.' },
          { id: 'qz_rst4_2', category: 'RST 4 — E-Antriebe', question: 'Welche Maschinenart dominiert im Motorsport und warum?', options: ['Die Asynchronmaschine, vor allem wegen ihrer Robustheit generell', 'Die Gleichstrommaschine, wegen der einfachen Regelung im Regelfall', 'Die permanenterregte Synchronmaschine, wegen Effizienz und Dichte', 'Die fremderregte Synchronmaschine, weil sie ohne Magnete auskommt'], correct: 2, explanation: 'Die PSM bietet die höchste Effizienz und Leistungsdichte; Kosten und Entmagnetisierungsgefahr werden in Kauf genommen.' },
          { id: 'qz_rst4_3', category: 'RST 4 — E-Antriebe', question: 'Was passiert im Feldschwächbereich einer E-Maschine?', options: ['Das Drehmoment steigt weiterhin linear mit der Drehzahl generell', 'Spannungsgrenze erreicht; ein negativer d-Strom schwächt das Feld', 'Die Maschine wird ab hier rein generatorisch betrieben generell', 'Der Wirkungsgrad der Maschine fällt auf nahezu null in der Praxis'], correct: 1, explanation: 'Ab der Nenndrehzahl ist die Spannungsgrenze erreicht — Feldschwächung über negativen d-Strom, Leistung konstant.' },
          { id: 'qz_rst4_4', category: 'RST 4 — E-Antriebe', question: 'Warum ist der Motorsport-Inverter nur mit Voll-SiC-Modulen darstellbar?', options: ['Weil SiC deutlich billiger ist als vergleichbare IGBT generell', 'Hohe Taktfrequenz: nur SiC hat genügend geringe Schaltverluste', 'Weil IGBT-Module im Reglement ausdrücklich verboten sind meist', 'Weil SiC-Module gänzlich ohne aktive Kühlung auskommen generell'], correct: 1, explanation: 'Hohe Drehzahlen (bis 60.000 U/min) erfordern hohe elektrische Frequenzen/Taktfrequenzen; die Schaltverluste von IGBTs wären zu groß.' },
          { id: 'qz_rst4_5', category: 'RST 4 — E-Antriebe', question: 'Wie viele Grundraumzeiger erzeugen die Leistungsschalter eines Drehstrom-Inverters?', options: ['3', '6', '8 (2³ Schaltzustände)', '12'], correct: 2, explanation: 'Drei Halbbrücken mit je 2 Zuständen ergeben 2³ = 8 Grundraumzeiger; der Sollraumzeiger wird aus den Nachbarn zusammengesetzt.' },
          { id: 'qz_rst4_6', category: 'RST 4 — E-Antriebe', question: 'Welche Kombination beschreibt die F1-Energiespeicher-Anforderungen (ab 2026) korrekt?', options: ['150 kW, 50 kWh Kapazität, rund 400 kg Masse meist', '350 kW, max. 4 MJ/Runde, min. 35 kg, max. 1000 V', '500 kW, 20 MJ pro Runde, 100 kg, rund 400 V meist', '350 kW, unbegrenzte Energie, mindestens 130 kg'], correct: 1, explanation: '350 kW Boost/Rekuperation, 4 MJ SoC-Delta und 9 MJ Rekuperation pro Runde, 35 kg Mindestgewicht, 1000 V max.' },
          { id: 'qz_rst4_7', category: 'RST 4 — E-Antriebe', question: 'Welcher Energiespeicher hat die höchste LEISTUNGSdichte bei geringster ENERGIEdichte?', options: ['Li-Ion-Batterie', 'Superkondensator', 'Schwungradspeicher', 'Wasserstofftank'], correct: 1, explanation: 'Superkondensatoren liefern extreme Leistungsdichte und Zyklenfestigkeit, speichern aber nur sehr wenig Energie.' },
          { id: 'qz_rst4_8', category: 'RST 4 — E-Antriebe', question: 'Warum dominiert die Li-Ion-Zelle die Performance des Energiespeichersystems?', options: ['Weil sie das größte Einzelbauteil im Speicher ist generell', 'Weil über 80 % der Verluste in der Zelle entstehen generell', 'Weil das gesamte BMS direkt in der Zelle sitzt im Regelfall', 'Weil die verbindenden Busbars supraleitend ausgeführt sind'], correct: 1, explanation: 'Die elektro-thermische Performance wird von den Zellverlusten dominiert: ohmsche Verluste, Aktivierungs- und Konzentrationsüberspannungen.' },
          { id: 'qz_rst4_9', category: 'RST 4 — E-Antriebe', question: 'Welcher Zielkonflikt prägt das Batterie-Thermomanagement im Motorsport?', options: ['Reichweite gegen die verfügbare Ladezeit im Regelfall', 'Gewicht gegen Kühlwirkung (Kühlplatte vs. Immersion)', 'Zellspannung gegen den maximalen Strom in der Praxis', 'Zellformat gegen die gewählte Zellchemie im Regelfall'], correct: 1, explanation: 'Full-Immersion kühlt homogen und stark, wiegt aber mehr; Kühlplatten sind leicht, kühlen aber lokal begrenzt.' },
          { id: 'qz_rst4_10', category: 'RST 4 — E-Antriebe', question: 'Was ändert sich an der F1 Power Unit ab 2026?', options: ['Die MGU-H entfällt; die MGU-K leistet bis 350 kW', 'Der Verbrennungsmotor entfällt dann komplett meist', 'Die Batteriekapazität wächst auf ganze 50 kWh', 'Die Leistung der MGU-H wird glatt verdoppelt meist'], correct: 0, explanation: 'Ab 2026: Entfall der MGU-H, MGU-K max. 350 kW mit fixer Übersetzung zur Kurbelwelle, ICE ~400 kW mit nachhaltigem Kraftstoff.' },
        ],
        open: [
          { id: 'op_rst4_1', points: '4 Pkt.', question: 'Nenne die Hauptanforderungen an den Antrieb eines Rennfahrzeugs.', answer: '• Hohe Leistung bei geringem Gewicht — niedriges Leistungsgewicht kg/kW (1).\n• Hohe Effizienz/Wirkungsgrad (Energie-/Verbrauchslimits) (1).\n• Fahrbare Charakteristik (Ansprechverhalten, Drehmomentverlauf) (1).\n• Zuverlässigkeit über die Renndistanz + Package/Kühlung (1).' },
          { id: 'op_rst4_2', points: '6 Pkt.', question: 'Nenne drei Energiespeichermöglichkeiten mit je einem Vor- und Nachteil.', answer: '• Li-Ion-Batterie: + hohe Energiedichte / − thermische Limits & Degradation, Brandlast (2).\n• Superkondensator: + sehr hohe Leistungsdichte & Zyklenfestigkeit / − sehr geringe Energiedichte (2).\n• Schwungradspeicher: + hohe Leistungsdichte, unempfindlich gegen Zyklen / − mechanisch komplex, Gyroskopie-Effekte, Berstschutz nötig (2).' },
          { id: 'op_rst4_3', points: '4 Pkt.', question: 'Erkläre, warum ein F1-Energiespeicher völlig anders ausgelegt wird als eine Serien-HV-Batterie.', answer: '• F1: <4 kWh Energie, aber 350 kW Leistung bei min. 35 kg → Auslegung auf LEISTUNGSdichte (2).\n• Serie (z.B. ID.3): >50 kWh, 150 kW, 400–600 kg → Auslegung auf ENERGIEdichte, Lebensdauer und Kosten (1).\n• F1-Betrieb an den Zell-Grenzen (Temperatur/Spannung) mit BMS-Prädiktion statt konservativer Serienauslegung (1).' },
          { id: 'op_rst4_4', points: '3 Pkt.', question: 'Beschreibe die Struktur einer Antriebsregelung (Kaskadenregelung).', answer: '• Innerste Schleife: Strom-/Drehmomentregler — Stellgröße Spannung (1).\n• Darüber: Drehzahlregler — Stellgröße Strom (1).\n• Äußerste Schleife: Lageregelung — im Fahrzeug nicht nötig, Drehzahlvorgabe durch Fahrer/Tempomat (1).' },
        ],

      {
        id: 'rst5', name: 'Flügel & Aerodynamik-Grundlagen', icon: '🪽', color: '#64d2ff', examWeight: 11,
        slideDeck: 'Folien_Rennsporttechnik/Fluegel_a.pdf',
        guided: [
          { id: 'g_rst5_1', badge: 'Auftrieb', title: 'Warum ein gekrümmtes Profil funktioniert', body: 'Flache Platte unter Anstellwinkel: Strömungsabriss auf der Oberseite schon bei geringen Winkeln → großes Totwassergebiet → viel Widerstand; Auftrieb fast nur durch Überdruck auf der Unterseite.\n\nGekrümmte Platte / Profil (Lilienthals Erkenntnis vom Vogelflügel: gewölbtes Profil, runde Vorderkante, spitze Hinterkante):\n• Strömung liegt auf der Oberseite an — KEIN Totwassergebiet\n• Unterdruckgebiet auf der Oberseite (Saugseite) — der Auftrieb wird ÜBERWIEGEND von der Unterdruckseite erzeugt!\n• Deutlich mehr Auftrieb bei weniger Widerstand, resultierende Kraft steht aufrechter\n\nErklärungsansätze für Auftrieb: Druckgebiete, Bernoulli ($p + ρ/2·v² = const$ — schneller = weniger Druck), Impuls/Fliehkraft („Luft nach unten → Flügel nach oben“). Die Teilchenstrecken-Erklärung („Teilchen treffen sich wieder“) ist WIDERLEGT — die Saugseite ist schneller.', example: '🔑 Beim Rennwagen ist alles umgedreht: Das Profil steht auf dem Kopf, die Saugseite zeigt zur Straße → Abtrieb.' },
          { id: 'g_rst5_2', badge: 'Randwirbel', title: 'Induzierter Widerstand & Endplatten', body: 'An den Flügelenden gleicht sich der Druckunterschied zwischen Druck- und Saugseite aus → RANDWIRBEL:\n• Der Druckausgleich reduziert den Auftrieb/Abtrieb\n• Der Wirbel erzeugt Unterdruck im Kern → INDUZIERTER WIDERSTAND\n\nGegenmaßnahmen (Vorbild Natur):\n• Große Streckung (Spannweite/Tiefe) mit kleinem Querschnitt an den Enden (Segler, Albatros)\n• Geometrische Barriere bei geringer Streckung → im Motorsport: ENDPLATTEN — einfach herzustellen, gute Abschirmung, deutliche Effizienzsteigerung\n• Wirbelreduktion durch gezieltes „Anblasen“ entgegen der Wirbelrichtung (opfert Überdruck, erhöht Effizienz)', example: '🔑 Da das Reglement die Spannweite begrenzt (geringe Streckung), sind Endplatten die Standard-Lösung im Motorsport.' },
          { id: 'g_rst5_3', badge: 'Mehrteilig', title: 'Mehrteilige Flügel, Spalt & Gurney Flap', body: 'Mehrteilige Flügel: Bei extremer Wölbung verliert die wandnahe Strömung Energie und reißt vor der Hinterkante ab. Ein SPALT bringt saubere, energiereiche Luft von der Druckseite auf die Saugseite → die Strömung folgt dem Flap bis zur Hinterkante. Der Spalt hängt von 3 Faktoren ab: Distanz, Winkel, Überstand.\n\nGurney Flap (kleine senkrechte Leiste an der Hinterkante):\n• Verlangsamt die Strömung auf der Druckseite → mehr Überdruck\n• Erzeugt ein Unterdruckgebiet HINTER dem Gurney → verzögert Rückströmung/Ablösung auf der Saugseite\n• Ergebnis: deutlich mehr Abtrieb bei nur geringem Widerstandsanstieg = höhere EFFIZIENZ\n\nWeitere Tricks: Flexi-Wings (Anstellwinkel-Änderung oder Spaltverschluss bei hoher Geschwindigkeit), innere Kanäle/F-Duct (gezielter Strömungsabriss auf der Geraden), Flügel als Vortex-Generatoren (Wirbel lenken Luft, gegensinnige Wirbelpaare erzeugen gerichtete Strömung).', example: '🔑 Historie fürs Verständnis: Opel RAK (1928, erster Flügel am Auto), Michael May 1956 (erster verstellbarer Flügel, Porsche 550), Chaparral 2E/2F (1966/67), F1 ab 1968.' },
        ],
        flashcards: [
          { id: 'fc_rst5_1', front: 'Warum erzeugt eine gekrümmte Platte mehr Auftrieb bei weniger Widerstand als eine flache Platte?', back: 'Die Strömung liegt auf der Saugseite an (kein Ablösen, kein Totwassergebiet). Es entsteht ein Unterdruckgebiet auf der Oberseite — der Auftrieb kommt überwiegend von der Saugseite; die resultierende Kraft steht aufrechter.' },
          { id: 'fc_rst5_2', front: 'Wie lautet die Bernoulli-Gleichung und was folgt daraus für Flügel?', back: '$p + ρ/2·v² + ρgz = const$ — höhere Geschwindigkeit bedeutet geringeren statischen Druck. Die schnellere Strömung auf der Saugseite erzeugt Unterdruck → Auftrieb/Abtrieb.' },
          { id: 'fc_rst5_3', front: 'Welche Auftriebs-Erklärung ist experimentell widerlegt?', back: 'Die „Teilchenstrecken“-Erklärung (Teilchen von Ober- und Unterseite treffen sich an der Hinterkante wieder). Windkanalversuche zeigen: Die Teilchen treffen sich NICHT — die Saugseite ist schneller.' },
          { id: 'fc_rst5_4', front: 'Wie entstehen Randwirbel und was bewirken sie?', back: 'Am Flügelende gleicht sich der Druck zwischen Druck- und Saugseite aus. Folgen: Auftriebs-/Abtriebsverlust und induzierter Widerstand (Unterdruck im Wirbelkern).' },
          { id: 'fc_rst5_5', front: 'Welche 2 Strategien gegen Randwirbel zeigt die Natur — und was nutzt der Motorsport?', back: '1. Große Streckung (Spannweite/Tiefe) mit kleinem Querschnitt außen.\n2. Geometrische Barriere bei geringer Streckung.\nMotorsport (Spannweite reglementiert): Endplatten — einfach, gute Abschirmung, deutliche Effizienzsteigerung.' },
          { id: 'fc_rst5_6', front: 'Wozu dient der Spalt bei mehrteiligen Flügeln? Von welchen 3 Faktoren hängt er ab?', back: 'Er führt energiereiche Luft von der Druck- auf die Saugseite, damit die Strömung dem stark gewölbten Flap bis zur Hinterkante folgt (keine Ablösung).\nFaktoren: Distanz, Winkel, Überstand.' },
          { id: 'fc_rst5_7', front: 'Wie funktioniert ein Gurney Flap?', back: 'Kleine senkrechte Leiste an der Hinterkante: verlangsamt die Strömung auf der Druckseite (mehr Überdruck) und erzeugt ein Unterdruckgebiet dahinter, das die Ablösung auf der Saugseite verzögert → mehr Abtrieb bei geringem Widerstandszuwachs = höhere Effizienz.' },
          { id: 'fc_rst5_8', front: 'Nenne die wichtigsten Konstruktionsgrößen eines Flügelprofils.', back: 'Chord (Profiltiefe), Camber (Wölbung), Leading Edge (runde Vorderkante) mit Entry Angle, Trailing Edge (spitze Hinterkante) mit Exit Angle, Druckseite (Pressure Side) und Saugseite (Suction Side). Flügelfläche = Spannweite × Tiefe; Streckung = Spannweite/Tiefe.' },
          { id: 'fc_rst5_9', front: 'Was bedeutet NACA 2412?', back: 'NACA-4-stellige Profilserie: 2 % Krümmung (Camber), Krümmungsposition bei 40 % der Tiefe, 12 % Dicke. NACA = Vorgängerorganisation der NASA, systematische Profiluntersuchungen ab den 1930ern.' },
          { id: 'fc_rst5_10', front: 'Welche zwei Varianten von Flexi-Wings gibt es?', back: '1. Änderung des Anstellwinkels bei Geschwindigkeit (weiche Halterung/Endplatten).\n2. Verschließen des Flügelspalts durch bewusst weichen Flap → Strömungsabriss bei hoher Geschwindigkeit (weniger Widerstand auf der Geraden).' },
          { id: 'fc_rst5_11', front: 'Vor-/Nachteile der Heckflügelhalterung von unten vs. von oben (Schwanenhals)?', back: 'Von unten: leicht, direkte Kraftableitung — aber Halterung stört die sensible Saugseite (V-förmige Ablösung).\nVon oben (Schwanenhals): saubere Flügelunterseite = mehr Abtrieb — aber mehr Material/Gewicht und Totwasser der Halterung.' },
        ],
        quiz: [
          { id: 'qz_rst5_1', category: 'RST 5 — Flügel', question: 'Der Auftrieb eines gewölbten Profils wird überwiegend erzeugt durch…', options: ['Überdruck auf der Druckseite', 'Unterdruck auf der Saugseite', 'die Endplatten', 'die Profildicke'], correct: 1, explanation: 'Lilienthals Versuche und moderne Messungen zeigen: Der überwiegende Anteil kommt vom Unterdruckgebiet der Saugseite.' },
          { id: 'qz_rst5_2', category: 'RST 5 — Flügel', question: 'Was passiert bei einer flachen Platte unter Anstellwinkel schon bei geringen Winkeländerungen?', options: ['Die Strömung bleibt vollständig anliegend am Profil', 'Strömungsabriss oben mit großem Totwassergebiet meist', 'Der aerodynamische Widerstand sinkt deutlich ab meist', 'Es bildet sich ein wirksamer Venturi-Kanal aus meist'], correct: 1, explanation: 'Die flache Platte reißt oben früh ab → Totwasser → hoher Widerstand; deshalb gewölbte Profile mit runder Vorderkante.' },
          { id: 'qz_rst5_3', category: 'RST 5 — Flügel', question: 'Induzierter Widerstand entsteht durch…', options: ['Durch reine Reibung in der Grenzschicht des Flügels', 'Durch die Randwirbel am Flügelende (Druckausgleich)', 'Durch den zusätzlich angebrachten Gurney Flap meist', 'Durch einen deutlich zu hohen Reifendruck generell'], correct: 1, explanation: 'Am Flügelende gleicht sich der Druck aus; der entstehende Wirbel hat einen Unterdruckkern und erzeugt induzierten Widerstand.' },
          { id: 'qz_rst5_4', category: 'RST 5 — Flügel', question: 'Welche Funktion hat der Spalt bei mehrteiligen Flügeln?', options: ['Er dient in erster Linie der Kühlung des Flügels in der Praxis', 'Er reduziert vor allem das Gewicht des Flügels im Normalbetrieb', 'Er führt energiereiche Luft nach oben, verhindert die Ablösung', 'Er erzeugt gezielt den ablösenden Randwirbel im Normalbetrieb'], correct: 2, explanation: 'Ohne Spalt könnte die energiearme Grenzschicht der extremen Wölbung nicht bis zur Hinterkante folgen.' },
          { id: 'qz_rst5_5', category: 'RST 5 — Flügel', question: 'Ein Gurney Flap erhöht die aerodynamische Effizienz, weil er…', options: ['er den Flügel insgesamt spürbar verkleinert generell', 'er die Strömung auf der Saugseite blockiert generell', 'er den Anstellwinkel des ganzen Flügels senkt meist', 'er viel mehr Abtrieb bei kaum mehr Widerstand bringt'], correct: 3, explanation: 'Mehr Überdruck auf der Druckseite + Unterdruckgebiet hinter der Leiste, das die Ablösung auf der Saugseite verzögert.' },
          { id: 'qz_rst5_6', category: 'RST 5 — Flügel', question: 'Endplatten am Flügel dienen dazu…', options: ['den Flügel gegen Verwindung zu versteifen im Normalbetrieb', 'den Druckausgleich am Ende abzuschirmen (weniger Randwirbel)', 'die Strömung am Flügelende gezielt abreißen zu lassen meist', 'eine Lücke im technischen Reglement auszunutzen im Regelfall'], correct: 1, explanation: 'Endplatten sind die geometrische Barriere gegen den Druckausgleich — deutliche Effizienzsteigerung bei reglementierter Spannweite.' },
          { id: 'qz_rst5_7', category: 'RST 5 — Flügel', question: 'Wer setzte 1956 erstmals einen verstellbaren Flügel an einem Rennfahrzeug ein?', options: ['Colin Chapman (Lotus)', 'Michael May (Porsche 550 Spyder)', 'Jim Hall (Chaparral)', 'Ferdinand Porsche (Mercedes T80)'], correct: 1, explanation: 'Der Student Michael May fuhr 1956 mit verstellbarem Flügel (+Endplatten) 4 s/Runde schneller als das Porsche-Werksteam; Chaparral folgte 1966, die F1 1968.' },
          { id: 'qz_rst5_8', category: 'RST 5 — Flügel', question: 'Flügel als Vortex-Generatoren werden eingesetzt, um…', options: ['den Abtrieb des Flügels selbst zu maximieren', 'mit gezielten Wirbeln die Luft zu lenken meist', 'die Temperatur der Reifen abzusenken generell', 'den Luftwiderstand der Räder zu erhöhen meist'], correct: 1, explanation: 'Wirbel drücken den Luftstrom in gewünschte Richtungen; gegensinnig drehende Wirbelpaare erzeugen starke gerichtete Strömungen (z.B. zur Unterboden-Abdichtung).' },
        ],
        open: [
          { id: 'op_rst5_1', points: '4 Pkt.', question: 'Erkläre den Unterschied im Strömungsbild zwischen einer flachen und einer gekrümmten Platte unter Anstellwinkel.', answer: '• Flache Platte: früher Strömungsabriss auf der Oberseite, großes Totwassergebiet → hoher Widerstand; Auftrieb v.a. durch Überdruck unten (2).\n• Gekrümmte Platte: anliegende Strömung auf der Oberseite, kein Totwasser; Unterdruckgebiet oben liefert den Hauptanteil des Auftriebs; resultierende Kraft steht aufrechter, weniger Widerstand (2).' },
          { id: 'op_rst5_2', points: '4 Pkt.', question: 'Beschreibe Entstehung und Folgen von Randwirbeln sowie zwei Gegenmaßnahmen.', answer: '• Entstehung: Druckausgleich zwischen Druck- und Saugseite am Flügelende (1).\n• Folgen: Abtriebsverlust + induzierter Widerstand durch Unterdruck im Wirbelkern (1).\n• Maßnahme 1: große Streckung / kleiner Querschnitt außen (1).\n• Maßnahme 2: Endplatten als geometrische Barriere (bzw. Anblasen entgegen der Wirbelrichtung) (1).' },
          { id: 'op_rst5_3', points: '3 Pkt.', question: 'Erkläre die Funktionsweise des Gurney Flaps.', answer: '• Senkrechte Leiste an der Hinterkante verlangsamt die Strömung auf der Druckseite → mehr Überdruck (1).\n• Unterdruckgebiet hinter dem Gurney verzögert Rückströmung und Ablösung auf der Saugseite (1).\n• Ergebnis: deutlich mehr Abtrieb bei geringem Widerstandsanstieg → höhere Aero-Effizienz; funktioniert umgekehrt auch zur Abtriebsreduzierung (1).' },
        ],
      },
      {
        id: 'rst6', name: 'Aerodynamik & Fahrdynamik F1', icon: '💨', color: '#ff375f', examWeight: 13,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_12_Aero_Fahrdynamik.pdf',
        guided: [
          { id: 'g_rst6_1', badge: 'Abtriebsformel', title: 'Die Klausur-Rechnungen: Abtrieb & Leistung', body: 'DIE zwei Rechenaufgaben der Klausur:\n\nAbtrieb: $F_z = c_z · A · ρ/2 · v²$\nLuftwiderstand: $F_w = c_w · A · ρ/2 · v²$\n\n1. „An der Decke fahren“: Das Fahrzeug kann kopfüber fahren, wenn der Abtrieb das Gewicht trägt: $F_z ≥ m·g$. Gesucht ist meist $c_z = 2·m·g / (ρ·A·v²)$ bei gegebener Geschwindigkeit (z.B. 200 km/h → v = 55,6 m/s). Ein F1-Auto könnte ab ca. 170 km/h an der Decke fahren!\n\n2. Leistung für konstante Geschwindigkeit: $P = F_w · v = c_w · A · ρ/2 · v³$ (ggf. + Rollwiderstand $F_R = f_R·m·g$, geteilt durch Antriebsstrang-Wirkungsgrad η).\n\nHöhen-Effekt (WS24/25): Auf hochgelegenen Strecken (z.B. Mexiko) sinkt die Luftdichte ρ → Abtrieb UND Widerstand sinken proportional. Die Aero-Effizienz $c_z/c_w$ bleibt gleich, aber die absoluten Kräfte fallen — weniger Grip bei gleichem Topspeed-Vorteil.', example: '🔑 Einheiten sauber: v in m/s (km/h ÷ 3,6), ρ ≈ 1,2 kg/m³. Merke: Widerstandsleistung wächst mit v³!' },
          { id: 'g_rst6_2', badge: '3 Abtriebserzeuger', title: 'Die 3 Haupt-Aero-Elemente & ihre Effizienz', body: 'Ein F1-Fahrzeug hat DREI Haupt-Aero-Elemente (Klausur: „Nenne die 3 Hauptabtriebserzeuger“):\n\n1. Frontflügel (FW): Flügelprofile + Ground Effect (bodennah). Aero-Effizienz $c_z/c_x$ ≈ 4–6. Stellt die AEROBALANCE ein (Flap-Winkel); seine Wirbel steuern die gesamte dahinterliegende Strömung.\n2. Unterboden mit Diffusor: „ebene Platte mit Diffusor“ nach dem VENTURI-Prinzip (seit 2022 ausgeprägt). GRÖSSTER Anteil am Gesamtabtrieb, Effizienz ≈ 8–10! Stark abhängig von Bodenabstand und seitlicher Abdichtung (Wirbelschleppen dichten den Kanal ab).\n3. Heckflügel (RW): umgedrehtes Flugzeugprofil, Effizienz ≈ 2–2,4 (kurzer Flügel, große Profiltiefe). Bestimmt Topspeed/Abtriebslevel je Strecke.\n\nSortierung nach Effizienz: Unterboden (8–10) > Frontflügel (4–6) > Heckflügel (2–2,4).\n\nWeitere Elemente: Radaufhängung (Pushrod/Pullrod-Wahl aerodynamisch bestimmt!), Bremsbelüftung, Bodywork/Engine Cover (äußere Umströmung für RW/Diffusor, innere Durchströmung für Kühlung).', example: '🔑 WS18: „Sortiere die Bauteile nach höchstem Abtrieb bzw. Widerstand“ — Abtrieb & Effizienz: Unterboden zuerst. Widerstand: freistehende Räder haben den größten cx-Anteil (F1 cx ≈ 1,1–1,4 vs. PKW 0,25–0,3).' },
          { id: 'g_rst6_3', badge: 'Balance', title: 'Aerobalance, Ride Height & Bouncing', body: 'Aerobalance = prozentualer Anteil des VORDERACHS-Abtriebs am Gesamtabtrieb. Sie muss der statischen Gewichtsverteilung und über der Geschwindigkeit der Reifencharakteristik folgen. Das Fahrverhalten (Unter-/Übersteuern) im mittleren und hohen Geschwindigkeitsbereich wird hauptsächlich von der Aerobalance bestimmt (Through-Corner-Balance).\n\nRide-Height-Sensitivität (Klausur WS17: „VA oder HA?“):\n• VORDERACHSE: Abtrieb reagiert sehr empfindlich auf den Bodenabstand vorn — kleiner Abstand = mehr Abtrieb (Ground Effect des FW), fällt steil mit steigendem RH_Front → eine stark mit Bodenabstand abnehmende Abtriebskurve gehört zur VA/zum Unterboden-Frontbereich.\n• HINTERACHSE: flachere Abhängigkeit vom RH_Rear (Diffusor arbeitet mit Rake).\n\nBOUNCING (Porpoising): Bei zu geringem dynamischen Bodenabstand reißt die Unterboden-Strömung ab → schlagartiger Abtriebsverlust → Fahrzeug federt aus → Strömung legt wieder an → Abtrieb zieht das Auto wieder runter … eine selbsterregte vertikale Schwingung. Abtrieb ist abhängig vom dynamischen Bodenabstand!', example: '🔑 Klausur: „Was bedeutet Bouncing und wie entsteht das Phänomen?“ → periodischer Strömungsabriss/-wiederanlage am Unterboden durch Kopplung Abtrieb ↔ Bodenabstand.' },
          { id: 'g_rst6_4', badge: 'Kennzahlen', title: 'F1 vs. PKW: die Performance-Zahlen', body: 'Vergleich (Rampf, 2025):\n• Querbeschleunigung: PKW 1,2 g — F1 bis 5,2 g (geschwindigkeitsabhängig!)\n• Bremsverzögerung: PKW 1,3 g — F1 bis 5,5 g\n• Reibwert Reifen: PKW ~1,3 — F1 ~1,6\n• Abtriebsbeiwert: PKW cz ≈ 0 (meist leicht positiv = Auftrieb) — F1 cz > −5 (bei 160 km/h ~8 kN Abtrieb); Mindestgewicht 2025: 800 kg\n• cx: PKW 0,25–0,3 — F1 1,1–1,4 (freistehende Räder!)\n\nEinfluss auf die Rundenzeit (High-Downforce-Strecke): 1 % Reifengrip = 0,4 s | 1 % Gewicht = 0,25 s | 1 % Abtrieb = 0,15 s → Reifen > Gewicht > Abtrieb!\n\nBremsen Monza: 345→90 km/h: F1 2,7 s / 150 m — PKW 6,5 s / 350 m. Windkanal: max. 300 km/h, Reglement erlaubt nur 180 km/h; CFD ist Voraussetzung für die Windkanalarbeit (Konzept, Flow-Field, Optimierung), der Windkanal liefert die Referenz-Aeromap (Abtrieb, Widerstand, Balance über alle Fahrzustände).', example: '🔑 Sensitivitäten-Ranking für die Klausur: Grip (0,4 s) > Gewicht (0,25 s) > Abtrieb (0,15 s) pro 1 % Verbesserung.' },
        ],
        flashcards: [
          { id: 'fc_rst6_1', front: 'Nenne die 3 Hauptabtriebserzeuger eines F1-Fahrzeugs mit Funktionsprinzip.', back: '1. Frontflügel: Flügelprofile + Ground Effect (bodennah) — stellt die Aerobalance ein.\n2. Unterboden mit Diffusor: Venturi-Prinzip — größter Anteil am Gesamtabtrieb.\n3. Heckflügel: umgedrehtes Flugzeugprofil — bestimmt Abtriebslevel/Topspeed.' },
          { id: 'fc_rst6_2', front: 'Sortiere die Aero-Elemente nach Aero-Effizienz (cz/cx) mit Werten.', back: '1. Unterboden mit Diffusor: ≈ 8–10 (Ground Effect)\n2. Frontflügel: ≈ 4–6 (Flügel + Ground Effect)\n3. Heckflügel: ≈ 2–2,4 (kurzer Flügel, große Profiltiefe)' },
          { id: 'fc_rst6_3', front: 'Wie lauten Abtriebs- und Luftwiderstandsformel?', back: '$F_z = c_z · A · ρ/2 · v²$ (Abtrieb, vorn/hinten getrennt mit czv/czh)\n$F_w = c_w · A · ρ/2 · v²$ (Widerstand)\nLeistung: $P = F_w · v = c_w·A·ρ/2·v³$' },
          { id: 'fc_rst6_4', front: 'Ab welcher Bedingung könnte ein F1-Auto „an der Decke fahren“? Wie rechnet man den nötigen cz?', back: 'Wenn der Abtrieb das Gewicht trägt: $F_z ≥ m·g$.\n$c_z = 2·m·g / (ρ·A·v²)$ — bei einem F1-Fahrzeug ab ca. v = 170 km/h erfüllt.' },
          { id: 'fc_rst6_5', front: 'Was ist die Aerobalance und was bestimmt sie?', back: 'Prozentualer Anteil des Vorderachs-Abtriebs am Gesamtabtrieb. Sie bestimmt das Unter-/Übersteuern im mittleren und oberen Geschwindigkeitsbereich, muss zur Gewichtsverteilung passen und über v der Reifencharakteristik folgen. Eingestellt primär über die Frontflügel-Flaps.' },
          { id: 'fc_rst6_6', front: 'Was ist Bouncing und wie entsteht es?', back: 'Selbsterregte Vertikalschwingung: Bei zu geringem Bodenabstand reißt die Unterbodenströmung ab → Abtriebsverlust → Auto federt aus → Strömung legt wieder an → Abtrieb zieht es wieder runter. Ursache: starke Kopplung Abtrieb ↔ dynamischer Bodenabstand (Venturi-Unterboden).' },
          { id: 'fc_rst6_7', front: 'Woran erkennt man, ob eine Abtrieb-über-Bodenabstand-Kurve zur Vorder- oder Hinterachse gehört?', back: 'Vorderachse: sehr steile Abnahme des Abtriebs mit steigendem Bodenabstand (Ground Effect von FW/Unterboden-Front reagiert empfindlich).\nHinterachse: deutlich flacherer Verlauf über größeren RH-Bereich.' },
          { id: 'fc_rst6_8', front: 'Warum sinkt die absolute Aero-Performance auf hochgelegenen Strecken?', back: 'Geringere Luftdichte ρ → Abtrieb und Widerstand sinken proportional (F ∝ ρ). Die Effizienz cz/cx bleibt, aber der Grip aus Abtrieb fehlt in den Kurven.' },
          { id: 'fc_rst6_9', front: 'Wie stark beeinflussen Grip, Gewicht und Abtrieb die F1-Rundenzeit?', back: 'Pro 1 % Verbesserung (High-DF-Strecke):\n• Reifengrip: 0,4 s\n• Gewicht: 0,25 s\n• Abtrieb: 0,15 s\n→ Reihenfolge: Grip > Gewicht > Abtrieb.' },
          { id: 'fc_rst6_10', front: 'Vergleiche F1 und PKW: Querbeschleunigung, Bremsverzögerung, Reibwert, cx.', back: '• Querbeschleunigung: F1 bis 5,2 g / PKW 1,2 g\n• Bremsen: F1 bis 5,5 g / PKW 1,3 g\n• Reibwert: F1 ~1,6 / PKW ~1,3\n• cx: F1 1,1–1,4 (freistehende Räder!) / PKW 0,25–0,3' },
          { id: 'fc_rst6_11', front: 'Welche Aufgaben teilen sich CFD und Windkanal in der F1-Aeroentwicklung?', back: 'CFD: macht das Flow Field sichtbar, Konzeptentwicklung (auch nicht-reale Bauteile), Optimierung/Morphing, Basis für Aeroelastik — „Vorentwicklung“.\nWindkanal: misst Gesamtabtrieb, Widerstand und Aerobalance über alle Fahrzustände (Aeromap), Kühlungsoptionen — Referenzdaten für Simulation & Strecke.' },
          { id: 'fc_rst6_12', front: 'Was bestimmt Heckflügel bzw. Frontflügel beim Setup?', back: 'Heckflügel: cx-Niveau und Topspeed → Abtriebslevel der Strecke (Monza = Low-DF, Barcelona = High-DF).\nFrontflügel: die Aerobalance (Flap-Anstellwinkel). Ab 2026: aktive Aerodynamik an FW+RW (Corner Mode / Straight Mode).' },
        ],
        quiz: [
          { id: 'qz_rst6_1', category: 'RST 6 — Aero & Fahrdynamik', question: 'Welches Aero-Element hat den größten Anteil am Gesamtabtrieb eines modernen F1-Fahrzeugs?', options: ['Der Heckflügel', 'Der Frontflügel', 'Der Unterboden mit Diffusor', 'Die Bremsbelüftung'], correct: 2, explanation: 'Der Venturi-Unterboden liefert mit Effizienz ~8–10 den größten Abtriebsanteil — deshalb ist der Bodenabstand so kritisch.' },
          { id: 'qz_rst6_2', category: 'RST 6 — Aero & Fahrdynamik', question: 'Die korrekte Sortierung nach Aero-Effizienz (cz/cx) lautet…', options: ['Heckflügel vor Frontflügel vor Unterboden im Normalbetrieb', 'Unterboden (8-10) > Frontflügel (4-6) > Heckflügel (2-2,4)', 'Frontflügel vor Heckflügel vor Unterboden im Normalbetrieb', 'Alle drei Elemente sind etwa gleich effizient im Regelfall'], correct: 1, explanation: 'Der Ground Effect des Unterbodens erzeugt Abtrieb fast „umsonst“; der kurze, tiefe Heckflügel ist am ineffizientesten.' },
          { id: 'qz_rst6_3', category: 'RST 6 — Aero & Fahrdynamik', question: 'Ein Fahrzeug (m = 800 kg, A = 1,5 m², ρ = 1,2 kg/m³) soll bei 200 km/h (55,6 m/s) an der Decke fahren. Welcher Abtriebsbeiwert ist mindestens nötig?', options: ['cz ≈ 1,4', 'cz ≈ 2,8', 'cz ≈ 5,6', 'cz ≈ 0,9'], correct: 1, explanation: 'cz = 2·m·g/(ρ·A·v²) = 2·800·9,81/(1,2·1,5·55,6²) ≈ 15.696/5.564 ≈ 2,8.' },
          { id: 'qz_rst6_4', category: 'RST 6 — Aero & Fahrdynamik', question: 'Wie skaliert die zum Überwinden des Luftwiderstands nötige Antriebsleistung mit der Geschwindigkeit?', options: ['Linear (∝ v)', 'Quadratisch (∝ v²)', 'Kubisch (∝ v³)', 'Exponentiell'], correct: 2, explanation: 'P = Fw·v = cw·A·ρ/2·v³ — doppelte Geschwindigkeit braucht die 8-fache Leistung.' },
          { id: 'qz_rst6_5', category: 'RST 6 — Aero & Fahrdynamik', question: 'Was passiert mit der Aero-Performance auf einer hochgelegenen Strecke (z.B. Mexiko-Stadt)?', options: ['Der Abtrieb steigt, während der Widerstand sinkt generell', 'Abtrieb und Widerstand sinken mit der Dichte, cz/cx bleibt', 'Nur der Luftwiderstand des Fahrzeugs sinkt im Normalbetrieb', 'Die Aerobalance wandert von selbst nach vorn in der Praxis'], correct: 1, explanation: 'Beide Kräfte sind ∝ ρ. Weniger Dichte = weniger Abtrieb UND weniger Widerstand — das Auto hat weniger Kurven-Grip.' },
          { id: 'qz_rst6_6', category: 'RST 6 — Aero & Fahrdynamik', question: 'Bouncing (Porpoising) entsteht durch…', options: ['durch die viel zu weich gewählten Reifen im Normalbetrieb', 'periodisches Ablösen/Anlegen am Boden bei zu geringer Höhe', 'durch defekte oder ausgeschlagene Dämpfer im Normalbetrieb', 'durch einen zu hohen Heckflügel-Anstellwinkel im Regelfall'], correct: 1, explanation: 'Die Kopplung Abtrieb ↔ Bodenabstand erzeugt eine selbsterregte Vertikalschwingung: Abriss → Ausfedern → Wiederanlegen → Einfedern.' },
          { id: 'qz_rst6_7', category: 'RST 6 — Aero & Fahrdynamik', question: 'Der Abtrieb der VORDERACHSE über dem Bodenabstand zeichnet sich aus durch…', options: ['einen ausgesprochen flachen, konstanten Verlauf', 'völlige Unabhängigkeit vom gewählten Bodenabstand', 'eine steile Abnahme des Abtriebs mit größerer Höhe', 'einen Anstieg des Abtriebs mit zunehmender Höhe'], correct: 2, explanation: 'Der Ground Effect vorn reagiert sehr empfindlich: kleiner RH_Front = viel Abtrieb, steiler Abfall mit steigendem Abstand (Klausur WS17!).' },
          { id: 'qz_rst6_8', category: 'RST 6 — Aero & Fahrdynamik', question: 'Welche 1-%-Verbesserung bringt auf einer High-Downforce-Strecke den größten Rundenzeitgewinn?', options: ['1 % mehr Abtrieb (0,15 s)', '1 % weniger Gewicht (0,25 s)', '1 % mehr Reifengrip (0,4 s)', 'Alle gleich'], correct: 2, explanation: 'Reifengrip 0,4 s > Gewicht 0,25 s > Abtrieb 0,15 s pro Runde.' },
          { id: 'qz_rst6_9', category: 'RST 6 — Aero & Fahrdynamik', question: 'Den größten Einfluss auf den hohen cx-Wert (1,1–1,4) eines F1-Fahrzeugs haben…', options: ['die Spiegel', 'die freistehenden Räder', 'die Endplatten', 'der Unterboden'], correct: 1, explanation: 'Die rotierenden, freistehenden Räder sind der größte Einzelposten im Luftwiderstand — deshalb ab 2026 schmälere Reifen (−10 %).' },
          { id: 'qz_rst6_10', category: 'RST 6 — Aero & Fahrdynamik', question: 'Die seitliche „Abdichtung“ des Venturi-Unterbodens gegen einströmende Luft erfolgt beim Reglement 2022 durch…', options: ['bewegliche Schürzen wie schon im Jahr 1979 generell', 'umlaufende Gummilippen entlang des Bodens generell', 'gezielt erzeugte Wirbelschleppen an der Bodenkante', 'aktive Unterdruckpumpen unter dem Fahrzeug generell'], correct: 2, explanation: 'Wirbelschleppen entlang des Unterbodens dichten den Kanal ab und verhindern den Abtriebsverlust durch seitlich einströmende Luft.' },
        ],
        open: [
          { id: 'op_rst6_1', points: '5 Pkt.', question: 'Berechne den Abtriebsbeiwert, damit ein Fahrzeug (m = 750 kg, A = 1,4 m², ρ = 1,2 kg/m³) bei 200 km/h an der Decke fahren kann.', answer: '• Bedingung: Fz ≥ m·g (1).\n• v = 200/3,6 = 55,6 m/s (1).\n• cz = 2·m·g / (ρ·A·v²) (1).\n• cz = 2·750·9,81 / (1,2·1,4·55,6²) = 14.715 / 5.193 ≈ 2,83 (2).' },
          { id: 'op_rst6_2', points: '5 Pkt.', question: 'Berechne die nötige Antriebsleistung, damit ein Fahrzeug (cw = 1,0, A = 1,5 m², ρ = 1,2 kg/m³, fR·m·g = 300 N, η = 0,9) konstant 200 km/h fährt.', answer: '• v = 55,6 m/s (1).\n• Luftwiderstand: Fw = cw·A·ρ/2·v² = 1,0·1,5·0,6·3.086 ≈ 2.778 N (1,5).\n• Gesamtwiderstand: F = Fw + FR = 2.778 + 300 = 3.078 N (1).\n• P = F·v/η = 3.078·55,6/0,9 ≈ 190 kW (1,5).' },
          { id: 'op_rst6_3', points: '4 Pkt.', question: 'Nenne die drei Hauptabtriebserzeuger eines F1-Fahrzeugs und deren Funktionsprinzip.', answer: '• Frontflügel: Flügelprofile + Ground Effect durch Bodennähe; stellt die Aerobalance ein (1,5).\n• Unterboden mit Diffusor: Venturi-Prinzip (bodennahe Platte mit Diffusor), größter Abtriebsanteil (1,5).\n• Heckflügel: umgedrehtes Flugzeugflügelprofil, bestimmt Abtriebslevel/Topspeed (1).' },
          { id: 'op_rst6_4', points: '3 Pkt.', question: 'Was bedeutet „Bouncing“ und wie entsteht das Phänomen?', answer: '• Selbsterregte vertikale Schwingung des Fahrzeugs (Porpoising) (1).\n• Bei zu geringem dynamischen Bodenabstand reißt die Unterboden-/Diffusorströmung ab → schlagartiger Abtriebsverlust → Aufbau federt aus (1).\n• Strömung legt wieder an → Abtrieb steigt → Aufbau wird wieder heruntergezogen → Zyklus wiederholt sich (1).' },
          { id: 'op_rst6_5', points: '2 Pkt.', question: 'Was passiert mit der Aero-Effizienz auf hochgelegenen Rennstrecken?', answer: '• Die Luftdichte ρ sinkt → Abtrieb und Widerstand sinken beide proportional (1).\n• Die Effizienz cz/cx bleibt unverändert, aber die absoluten Abtriebskräfte (Kurven-Grip) fehlen (1).' },

      {
        id: 'rst7', name: 'CFD & Simulation', icon: '🌀', color: '#bf5af2', examWeight: 11,
        slideDeck: 'Folien_Rennsporttechnik/RacecarCFD2025.pdf',
        guided: [
          { id: 'g_rst7_1', badge: 'Navier-Stokes', title: 'Die Erhaltungsgleichungen der Strömungsmechanik', body: 'CFD (Computational Fluid Dynamics) = numerisches Lösen der Navier-Stokes-Gleichungen. Sie sind ERHALTUNGSGLEICHUNGEN:\n\n1. Massenerhaltung (Kontinuitätsgleichung): $∂ρ/∂t + ∇·(ρv) = 0$\n2. Impulserhaltung (in alle 3 Raumrichtungen)\n3. Energieerhaltung\n\nMathematisch: nichtlineare partielle Differentialgleichungen 2. Ordnung — es ist nicht einmal bewiesen, ob im Allgemeinen eine Lösung existiert (Millennium-Problem). Wir lösen sie numerisch.\n\nDas „Kochrezept“ zum Lösen: 1. Physics auswählen → 2. Randbedingungen (Boundary Conditions) → 3. Diskretisierung (Meshing + Zeitschritt) → 4. Matrix aufstellen → 5. Lösungsverfahren → 6. Post-Processing.', example: '🔑 Gedächtnisprotokoll WS24/25: „3 Erhaltungsgleichungen der Navier-Stokes-Gleichungen“ → Masse, Impuls, Energie.' },
          { id: 'g_rst7_2', badge: 'Turbulenz', title: 'RANS → DES → LES → DNS: modellieren vs. simulieren', body: 'Turbulenz-Behandlung nach steigender Genauigkeit UND steigendem Rechenaufwand:\n\n• RANS (Reynolds-Averaged Navier-Stokes): Es werden nur Mittelwert + mittlere Schwankung der Strömungsgrößen berechnet (Annahme: Strömung im Mittel zeitinvariant). Dadurch unterbestimmt → „Closure Problem“ → semi-empirische TURBULENZMODELLE. Meist ausreichend, Standard für Design-Studien und die ERSTE Fahrzeugauslegung!\n• DES (Detached Eddy Simulation): RANS-LES-Hybrid\n• LES (Large Eddy Simulation): große Wirbel simuliert, kleine modelliert — höchste kommerziell genutzte Auflösung\n• DNS (Direct Numerical Simulation): alles aufgelöst — nur akademisch\n\nMerkregel: RANS/DES = „modellieren“, LES/DNS = „simulieren“.', example: '🔑 WS24/25: „Welche Art von Simulation benutzt du für die erste Auslegung des Fahrzeugs?“ → RANS (schnell, robust, für Design-Deltas ausreichend).' },
          { id: 'g_rst7_3', badge: 'Meshing', title: 'Die 3 Mesh-Typen', body: 'Räumliche Diskretisierung = Meshing. Drei grundsätzliche Mesh-Typen (Klausur: „Welche Meshes gibt es? Nenne je einen Vorteil“):\n\n• Tetraeder (Tet): sehr einfache, robuste automatische Vernetzung beliebig komplexer Geometrien\n• Hexaeder (Hex): beste numerische Qualität/Genauigkeit bei gerichteten Strömungen, wenige Zellen bei strukturierter Topologie\n• Polyeder (Poly): weniger Zellen als Tet bei ähnlicher Genauigkeit, gute Konvergenz (viele Nachbarn pro Zelle)\n\nZur Darstellung einer Strömungsstruktur gilt: Ein 2D-Wirbel braucht mindestens 4 Zellen — jede Zelle trägt eine Strömungsgeschwindigkeit. Feineres Netz = kleinere auflösbare Strukturen, aber mehr Rechenaufwand.', example: '🔑 Merksatz: Tet = einfach zu erzeugen, Hex = genau/effizient strukturiert, Poly = weniger Zellen + gute Konvergenz.' },
          { id: 'g_rst7_4', badge: 'Sim vs. Windkanal', title: 'Simulation vs. Experiment — Vor- und Nachteile', body: 'Windkanal/Experiment:\n+ „Echte“ Strömung wird gemessen\n− Messung liefert nur LOKAL Daten und BEEINFLUSST die Strömung\n− Geometrische Skalierung + Modellbau nötig, physischer Prototyp erforderlich\n− Bedingt parallelisier-/automatisierbar\n\nCFD-Simulation:\n+ ALLE Daten jederzeit vollständig abrufbar, Messung beeinflusst nichts\n+ Keine Skalierung, kein Prototyp nötig, gefahrlos\n+ Beliebig parallelisierbar & automatisierbar → Optimierungsverfahren\n− Diskretisierungs-, Modell- und numerische Fehler\n− Geometrische Vereinfachungen; Randbedingungen nachzubilden\n\nF1-Praxis: 1:1-Übereinstimmung mit dem Windkanal? NEIN — die DELTAS zählen: Sagt CFD „Design A besser als B“, sagt der Windkanal (und die Realität) dasselbe. Hochautomatisiert, tausende gleichartige Simulationen pro Jahr, 1 CFD-Methodiker pro Team, dutzende Aero-Ingenieure.\n\nWas wird außer externer Aero simuliert? Batterie (Kühlung, Thermal Runaway, Sub-Zell-Level), In-Zylinder-Verbrennung (ICE, neue Kraftstoffe 2026), Splash & Spray/Mehrphasen (Getriebeschmierung, Kolbenkühlung, Regenreifen — auch SPH), Fluid-Struktur-Interaktion, Aeroakustik, Kühlkreisläufe.', example: '🔑 „All models are wrong, some are useful“ (George Box). Klausur: Vor-/Nachteile CFD vs. Windkanal + „Was wird abgesehen von externer Aero simuliert?“' },
        ],
        flashcards: [
          { id: 'fc_rst7_1', front: 'Nenne die 3 Erhaltungsgleichungen der Navier-Stokes-Gleichungen.', back: '1. Massenerhaltung (Kontinuitätsgleichung): $∂ρ/∂t + ∇·(ρv) = 0$\n2. Impulserhaltung (alle 3 Raumrichtungen)\n3. Energieerhaltung\nMathematisch: nichtlineare partielle DGL 2. Ordnung.' },
          { id: 'fc_rst7_2', front: 'Was ist RANS und was ist das Closure Problem?', back: 'Reynolds-Averaged Navier-Stokes: Berechnung nur von Mittelwert + mittlerer Schwankung (Annahme zeitinvarianter Mittelströmung). Dadurch ist das Gleichungssystem unterbestimmt → Closure Problem → semi-empirische Turbulenzmodelle schließen es.' },
          { id: 'fc_rst7_3', front: 'Ordne RANS, DES, LES, DNS nach Genauigkeit/Rechenaufwand und Einsatz.', back: 'RANS (Design-Studien, meist ausreichend) → DES (RANS-LES-Hybrid) → LES (höchste kommerzielle Auflösung) → DNS (nur akademisch). Genauigkeit und Rechenaufwand steigen in dieser Reihenfolge. RANS/DES = „modellieren“, LES/DNS = „simulieren“.' },
          { id: 'fc_rst7_4', front: 'Welche Simulationsart nutzt man für die ERSTE Auslegung eines Rennfahrzeugs?', back: 'RANS — schnell, robust, hochautomatisiert; für Design-Deltas (A besser als B?) ausreichend genau.' },
          { id: 'fc_rst7_5', front: 'Nenne die 3 Mesh-Typen mit je einem Vorteil.', back: '• Tetraeder: einfache, robuste automatische Vernetzung komplexer Geometrien\n• Hexaeder: beste Genauigkeit/Effizienz bei strukturierter, gerichteter Strömung\n• Polyeder: weniger Zellen als Tet bei ähnlicher Genauigkeit, gute Konvergenz' },
          { id: 'fc_rst7_6', front: 'Nenne je 3 Vorteile von CFD und Windkanal.', back: 'CFD: alle Daten überall abrufbar; keine Skalierung/kein Prototyp; automatisierbar/parallelisierbar (Optimierung); gefahrlos.\nWindkanal: echte Strömung; Referenz-/Kalibrierdaten (Aeromap); keine Modell-/Diskretisierungsfehler der Numerik.' },
          { id: 'fc_rst7_7', front: 'Warum reichen der F1 die CFD-„Deltas“, obwohl CFD nicht 1:1 dem Windkanal entspricht?', back: 'Absolute Werte weichen ab (Modellfehler), aber die RANGFOLGE stimmt: Sagt CFD „Design A besser als B“, bestätigt das der Windkanal/die Realität. Entwicklung = Vergleich vieler Varianten.' },
          { id: 'fc_rst7_8', front: 'Was wird im Rennfahrzeug außer der externen Aerodynamik simuliert?', back: '• Batterie: Kühlung, Thermal Runaway, Zellaufbau\n• In-Zylinder/ICE-Verbrennung (neue Kraftstoffe, −30 % Verbrauch 2026)\n• Splash & Spray / Mehrphasen: Getriebeschmierung, Kolbenkühlung, Regenreifen (auch SPH)\n• Kühlkreisläufe, Fluid-Struktur-Interaktion, Aeroakustik' },
          { id: 'fc_rst7_9', front: 'Welche 5 Effekte werden beim Batterie-Thermal-Runaway simuliert (mit Zeitskalen)?', back: '1. Gas Venting (klassische CFD, ms)\n2. Heat Propagation (Wärmeleitung, s)\n3. Schmelzprozesse (min)\n4. Partikelausstoß (Lagrange, ms)\n5. Verbrennung von Gasen/Partikeln (µs)\n→ Problem: extrem unterschiedliche Zeitskalen!' },
          { id: 'fc_rst7_10', front: 'Wie viele Zellen braucht die Darstellung eines 2D-Wirbels mindestens?', back: '4 Zellen — jede Zelle trägt genau eine Strömungsgeschwindigkeit. Kleinere Strukturen als die Zellgröße können nicht aufgelöst werden.' },
        ],
        quiz: [
          { id: 'qz_rst7_1', category: 'RST 7 — CFD', question: 'Die Navier-Stokes-Gleichungen sind Erhaltungsgleichungen für…', options: ['Masse, Impuls und Energie in der Praxis', 'Druck, Temperatur und Dichte im Regelfall', 'Auftrieb, Widerstand und Moment generell', 'Geschwindigkeit, Beschleunigung und Ruck'], correct: 0, explanation: 'Kontinuitätsgleichung (Masse), Impulserhaltung (3 Richtungen) und Energieerhaltung — nichtlineare partielle DGL 2. Ordnung.' },
          { id: 'qz_rst7_2', category: 'RST 7 — CFD', question: 'Welche Simulationsart nutzt man typischerweise für die erste Auslegung / Design-Studien eines Rennfahrzeugs?', options: ['DNS', 'LES', 'RANS', 'SPH'], correct: 2, explanation: 'RANS ist schnell und für Vergleiche (Deltas) meist ausreichend; LES/DNS sind um Größenordnungen teurer.' },
          { id: 'qz_rst7_3', category: 'RST 7 — CFD', question: 'Das „Closure Problem“ bei RANS entsteht, weil…', options: ['weil das verwendete Rechennetz zu grob aufgelöst ist bei üblicher Auslegung', 'Mittelung macht die Gleichungen unterbestimmt; Turbulenzmodelle schließen', 'weil der gewählte Zeitschritt viel zu groß ist im typischen Anwendungsfall', 'weil die Geometrie zu stark vereinfacht werden muss bei üblicher Auslegung'], correct: 1, explanation: 'Die Reynolds-Mittelung erzeugt zusätzliche unbekannte Terme (Reynolds-Spannungen) → Turbulenzmodelle schließen das System.' },
          { id: 'qz_rst7_4', category: 'RST 7 — CFD', question: 'Welcher Mesh-Typ kommt bei ähnlicher Genauigkeit mit weniger Zellen aus als Tetraeder und konvergiert gut?', options: ['Hexaeder', 'Polyeder', 'Prismen', 'Pyramiden'], correct: 1, explanation: 'Poly-Meshes haben viele Nachbarzellen pro Zelle → gute Konvergenz und weniger Zellen als Tet-Netze.' },
          { id: 'qz_rst7_5', category: 'RST 7 — CFD', question: 'Welche Aufzählung nennt NUR Vorteile der CFD gegenüber dem Windkanal?', options: ['Echte Strömung, lokale Messdaten, aber Prototyp nötig generell', 'Alle Daten abrufbar, beliebig parallelisierbar, kein Prototyp', 'Keine Modellfehler, keine Randbedingungen, dazu kostenlos meist', 'Messung beeinflusst die Daten, plus geometrische Skalierung'], correct: 1, explanation: 'CFD: vollständige Daten, Automatisierung/Optimierung, kein physischer Prototyp, gefahrlos. Dafür: Diskretisierungs-/Modell-/numerische Fehler.' },
          { id: 'qz_rst7_6', category: 'RST 7 — CFD', question: 'In der F1 gilt für das Verhältnis CFD ↔ Windkanal:', options: ['CFD ersetzt den Windkanal inzwischen vollständig generell', 'Der Windkanal ist grundsätzlich genauer als die Realität', 'CFD-Absolutwerte stimmen 1:1 mit dem Windkanal überein', 'Absolutwerte weichen ab, aber die Deltas sind verlässlich'], correct: 3, explanation: '„1:1-Ergebnisse zum Windkanal? NEIN! Die Deltas sind wichtig“ — Variantenvergleich ist der Kern der Aeroentwicklung.' },
          { id: 'qz_rst7_7', category: 'RST 7 — CFD', question: 'Bei welcher Anwendung wird die Gasphase gar nicht simuliert (Smoothed-Particle Hydrodynamics)?', options: ['Die externe Fahrzeugaerodynamik', 'Splash & Spray bzw. Getriebeschmierung', 'Die In-Zylinder-Verbrennung im Motor', 'Die Windkanal-Korrelationsrechnung'], correct: 1, explanation: 'SPH ist ein partikelbasiertes Verfahren für freie Oberflächen (Öl, Wasser) — die Gasphase entfällt komplett.' },
          { id: 'qz_rst7_8', category: 'RST 7 — CFD', question: 'Welche drei Themen werden in der Batterie simuliert?', options: ['Kühlung, Thermal Runaway, Zellaufbau', 'Reifenverschleiß, Aerodynamik und Akustik', 'Ladeinfrastruktur, Reichweite und Kosten', 'Schweißnähte, Lackierung und Recycling'], correct: 0, explanation: 'Kühlung (leistungsrelevant, 1D+3D gekoppelt), thermisches Durchgehen (Sicherheit) und Zellaufbau bis Sub-Zell-Level.' },

        open: [
          { id: 'op_rst7_1', points: '3 Pkt.', question: 'Nenne die drei Erhaltungsgleichungen, auf denen die Navier-Stokes-Gleichungen basieren.', answer: '• Massenerhaltung / Kontinuitätsgleichung (1).\n• Impulserhaltung in allen drei Raumrichtungen (1).\n• Energieerhaltung (1).' },
          { id: 'op_rst7_2', points: '3 Pkt.', question: 'Welche Mesh-Typen gibt es? Nenne je einen Vorteil.', answer: '• Tetraeder: robuste, automatische Vernetzung beliebig komplexer Geometrien (1).\n• Hexaeder: höchste numerische Genauigkeit/Effizienz bei strukturierten, gerichteten Strömungen (1).\n• Polyeder: weniger Zellen als Tet bei ähnlicher Genauigkeit, gute Konvergenz (1).' },
          { id: 'op_rst7_3', points: '4 Pkt.', question: 'Nenne je zwei Vor- und Nachteile der CFD-Simulation im Vergleich zum Windkanal.', answer: '• Vorteil 1: alle Strömungsgrößen überall und jederzeit abrufbar, Messung beeinflusst die Strömung nicht (1).\n• Vorteil 2: kein Prototyp/keine Skalierung, beliebig parallelisier- und automatisierbar → Optimierung (1).\n• Nachteil 1: Diskretisierungs-, Modell- (Turbulenz) und numerische Fehler (1).\n• Nachteil 2: geometrische Vereinfachungen und Randbedingungen müssen die Realität erst nachbilden — Validierung nötig (1).' },
          { id: 'op_rst7_4', points: '2 Pkt.', question: 'Welche Art von Simulation wählst du für die erste Auslegung des Fahrzeugs und warum?', answer: '• RANS-Simulation (1).\n• Begründung: geringer Rechenaufwand, robust und automatisierbar; für Konzeptvergleiche (Deltas) ausreichend genau — LES/DNS wären um Größenordnungen zu teuer (1).' },
