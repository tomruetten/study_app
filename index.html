      {
        id: 'rst8', name: 'Rennstrategie', icon: '♟️', color: '#ffd60a', examWeight: 10,
        slideDeck: 'Folien_Rennsporttechnik/VorlesungRennsporttechnikStrategie 2025.pdf',
        guided: [
          { id: 'g_rst8_1', badge: 'Grundlagen', title: 'Was Rennstrategie ist — und was nicht', body: 'Strategie = „längerfristig ausgerichtetes Anstreben eines Ziels unter Berücksichtigung der verfügbaren Mittel und Ressourcen.“\n\nWichtigste Erkenntnis (Klausur-Statement): Die Strategie macht ein langsames Auto NICHT schneller. Man gewinnt mit guter Strategie selten ein Rennen, für das man zu langsam ist — aber man kann mit SCHLECHTER Strategie ein gutes Ergebnis wegwerfen. Eine gute Strategie erlaubt es, die im Auto vorhandene Performance freizusetzen.\n\nAufteilung:\n• Generelle Strategie (VOR dem Rennen): Anzahl Boxenstopps, Reifenwahl, grobe Stintlängen, Fahrzeugsetup (Abtriebsniveau)\n• Aktuelle Strategie (WÄHREND des Rennens): Reaktion auf die Situation, Energie-/Reifenmanagement, Anpassung von Reifenwahl und Stintlänge\n\nEinflussparameter: Basisstrategie (Stops/Runden), Reifen (Performance über Runden, prime/option, Management), Fahrzeuggewicht/Benzin, Zeitverlust pro Boxenstopp, erwartete Performance (Quali → Startposition), Interaktion mit Konkurrenten (Verkehr, Überholmodelle), ERS/DRS, Sporting Regulations.', example: '🔑 Team-Abläufe: VOR dem Rennen Szenarien durchrechnen + Basisstrategie wählen; WÄHREND: Ist-Zustand erfassen, Modelle updaten, Optionen permanent durchrechnen, auf das Unerwartete warten; NACH: Analyse, Fehler abstellen, Modelle verbessern.' },
          { id: 'g_rst8_2', badge: 'Reifenphasen', title: 'Die 6 Phasen der Reifenperformance', body: 'Reifenperformance über die Runden (zeichnen können!):\n\n1. Anwärmphase: 1 bis mehrere Runden bis zum Temperaturfenster\n2. Peak Performance: Maximalleistung — die „eine schnelle Runde“ im Qualifying\n3. Stabiles Verhalten: niedrigeres, konstantes Niveau; Rundenzeiten fallen durchs leichter werdende Auto\n4. Geringer Abbau: konstanter, geringer Performanceverlust\n5. Starker Abbau: Lebensdauer-Ende — spätestens jetzt Boxenstopp!\n6. Reifen komplett am Ende: kaum noch Grip, Auto nahezu unfahrbar\n\nReifenwahl prime/option: Option = weicher, schneller, baut früher ab; Prime = härter, langsamer, hält länger. Reifenmanagement: bewusst unterhalb des Limits fahren, um die Abbauphase zu verzögern (Kurve „tyre management“ vs. „aggressive“).', example: '🔑 Der Reifenverschleiß macht das Auto langsamer, der Kraftstoffverbrauch (leichteres Auto) schneller — beide Effekte überlagern sich in der Rundenzeit.' },
          { id: 'g_rst8_3', badge: 'Boxenstopp', title: 'Zeitverlust beim Stopp & die Standardzüge', body: 'Zeitverlust Boxenstopp = (Boxengassen-Durchfahrt bei Tempolimit − normale Rundenzeit auf diesem Abschnitt) + Standzeit. Klausur-Rechnung: Rundenzeiten-Vergleich mit/ohne Stopp — ab welcher Runde lohnt der Stopp? Der Undercut-Gewinn kommt aus schnelleren Runden auf frischen Reifen.\n\nStandardzüge im „Strategieschach“:\n• Ein Stopp mehr oder weniger als der Gegner\n• Unterschiedliche Reifenwahl\n• Zwischen-/Endspurt\n• Einsatz des Teamkollegen\n• Vorgezogener Stopp: UNDERCUT (früher stoppen, auf frischen Reifen die Differenz herausfahren) / OVERCUT (länger draußen bleiben) / Offset (andere Reifenphase)\n\nSafety Car / VSC / Red Flag:\n• Unter SC/VSC ist der Zeitverlust beim Stopp KLEINER (Feld fährt langsam) → „billiger“ Stopp\n• Draußen bleiben = Positionsgewinn, aber reales SC schiebt das Feld zusammen\n• Red Flag = in der F1 freier Reifenwechsel\n\nWetter: durchfahren oder stoppen? Zu früher Stopp = Risiko, zu später = Zeitverlust; „Cut-off“-Time beachten. Gewicht: weniger Benzin = schneller — aber Benzinsparen kostet Performance (Lift & Coast); Gewicht wirkt auch auf den Reifenverschleiß.', example: '🔑 Klausur (WS16): „Rechnung zu Rundenzeiten und Zeitverlust bei Tankstopp“ — Zeitverlust pro Stopp gegen Rundenzeitgewinn frischer Reifen/leichteren Autos abwägen; Break-Even-Runde bestimmen.' },
        ],
        flashcards: [
          { id: 'fc_rst8_1', front: 'Was kann eine gute Rennstrategie leisten — und was nicht?', back: 'Sie macht ein langsames Auto NICHT schneller und gewinnt selten Rennen gegen schnellere Autos. Aber: Eine schlechte Strategie kann ein gutes Ergebnis wegwerfen. Gute Strategie = die vorhandene Performance freisetzen, ohne von äußeren Umständen aufgehalten zu werden.' },
          { id: 'fc_rst8_2', front: 'Wie teilt sich die Rennstrategie auf?', back: '• Generelle Strategie (vor dem Rennen): Anzahl Stopps, Reifenwahl, grobe Stintlängen, Setup.\n• Aktuelle Strategie (während des Rennens): Reaktion auf Situation, Energie-/Reifenmanagement, Anpassung von Reifenwahl/Stintlänge.' },
          { id: 'fc_rst8_3', front: 'Nenne die 6 Phasen der Reifenperformance über die Runden.', back: '1. Anwärmphase → 2. Peak Performance (Quali-Runde) → 3. Stabiles Verhalten → 4. Geringer Abbau → 5. Starker Abbau (spätestens jetzt stoppen!) → 6. Reifen komplett am Ende (unfahrbar).' },
          { id: 'fc_rst8_4', front: 'Was bedeutet Undercut und Overcut?', back: 'Undercut: früher als der Gegner stoppen und auf frischen Reifen die Differenz herausfahren — beim Stopp des Gegners ist man vorbei.\nOvercut: länger draußen bleiben (z.B. wenn frische Reifen lange brauchen oder Verkehr droht).' },
          { id: 'fc_rst8_5', front: 'Warum ist ein Boxenstopp unter Safety Car „billiger“?', back: 'Das Feld fährt langsam (ECU-Tempo) → der relative Zeitverlust der Boxendurchfahrt gegenüber der Streckenzeit ist kleiner. Aber: Reales SC schiebt das Feld zusammen; draußen bleiben bringt Positionen.' },
          { id: 'fc_rst8_6', front: 'Welche Parameter beeinflussen die Rennstrategie?', back: 'Basisstrategie (Anzahl/Timing der Stopps), Reifen (Degradation, prime/option), Fahrzeuggewicht/Benzinverbrauch, Zeitverlust pro Boxenstopp, erwartete Performance (Quali/Rennen), Interaktion mit Konkurrenten (Verkehr, Überholen), ERS/DRS, Sporting Regulations (Pflichtstopps, Parc fermé).' },
          { id: 'fc_rst8_7', front: 'Wie wirken Gewicht und Benzin auf die Strategie?', back: 'Weniger Masse = schnellere Rundenzeit (Auto wird über den Stint schneller, ~verbranntes Benzin). Benzinsparen (Lift & Coast) kostet aber unmittelbar Rundenzeit. Gewicht erhöht zudem den Reifenverschleiß. Nachtanken: nur wenn erlaubt relevant.' },
          { id: 'fc_rst8_8', front: 'Beschreibe die Team-Abläufe vor, während und nach dem Rennen.', back: 'Vor: Szenarien durchrechnen, Basisstrategie + Alternativen wählen, mit neuen Daten updaten.\nWährend: Ist-Zustand erfassen, Modelle updaten, permanent Optionen rechnen, aufs Unerwartete warten, vorab festgelegte Entscheidungen umsetzen.\nNach: Analyse, Fehler abstellen, Rechenmodelle & Strategieprogramme weiterentwickeln.' },
          { id: 'fc_rst8_9', front: 'Was bedeutet Red Flag strategisch in der F1?', back: 'Rennunterbrechung — die Abstände werden eingefroren und es gibt einen FREIEN Reifenwechsel (free tyre change) → wer kurz vorher gestoppt hat, verliert seinen Vorteil.' },
        ],
        quiz: [
          { id: 'qz_rst8_1', category: 'RST 8 — Strategie', question: 'Welche Aussage über Rennstrategie ist korrekt?', options: ['Eine gute Strategie macht ein langsames Auto schneller generell', 'Mit guter Strategie schlägt man fast immer schnellere Autos meist', 'Rennstrategie ist eigentlich nur bei Regen relevant im Regelfall', 'Gute Strategie setzt Performance frei, schlechte verschenkt sie'], correct: 3, explanation: 'Kernaussage der Vorlesung: Strategie macht das Auto nicht schneller, verhindert aber, dass äußere Umstände Performance kosten.' },
          { id: 'qz_rst8_2', category: 'RST 8 — Strategie', question: 'In welcher Reifenphase fährt man die „eine schnelle Runde“ im Qualifying?', options: ['Anwärmphase', 'Peak Performance', 'Stabiles Verhalten', 'Geringer Abbau'], correct: 1, explanation: 'Nach der Anwärmphase folgt die Peak Performance — manchmal reicht es für zwei schnelle Runden oder eine zweite nach einer Cool-down-Runde.' },
          { id: 'qz_rst8_3', category: 'RST 8 — Strategie', question: 'Ein Undercut funktioniert, weil…', options: ['weil man mit vollem Tank grundsätzlich schneller fährt', 'man stoppt früher und ist auf frischen Reifen schneller', 'weil der Gegner dabei eine Zeitstrafe kassiert generell', 'weil die Boxengasse dadurch effektiv verkürzt wird meist'], correct: 1, explanation: 'Der früher Stoppende fährt auf frischen Reifen schnellere Runden; stoppt der Gegner eine Runde später, kommt er dahinter heraus.' },
          { id: 'qz_rst8_4', category: 'RST 8 — Strategie', question: 'Warum stoppt man bevorzugt unter Safety Car oder VSC?', options: ['Weil sich die reine Standzeit dabei verkürzt generell', 'Weil neue Reifen unter Safety Car billiger sind meist', 'Der Zeitverlust zum langsamen Feld ist kleiner meist', 'Weil der Tankvorgang in dieser Phase schneller läuft'], correct: 2, explanation: 'Das Feld fährt mit reduziertem Tempo — die Boxendurchfahrt kostet relativ weniger Zeit als unter Rennbedingungen.' },
          { id: 'qz_rst8_5', category: 'RST 8 — Strategie', question: 'Was gehört zur GENERELLEN Strategie (vor dem Rennen)?', options: ['Die spontane Reaktion auf ein Safety Car meist', 'Stoppzahl, erste Reifenwahl, Stintlängen, Setup', 'Das Energiemanagement in Runde 30 des Rennens', 'Die Anpassung der Stintlänge nach einem Unfall'], correct: 1, explanation: 'Generell = vorab geplant (Stopps, Reifen, Stints, Setup); aktuell = Reaktion während des Rennens.' },
          { id: 'qz_rst8_6', category: 'RST 8 — Strategie', question: 'Wie wirkt der Kraftstoffverbrauch auf die Rundenzeit im Stint?', options: ['Er wirkt sich gar nicht auf die Rundenzeit aus im Regelfall', 'Das leichter werdende Auto wird schneller, überlagert Abbau', 'Weniger Benzin macht das Auto spürbar langsamer im Regelfall', 'Der Effekt ist nur bei Regen überhaupt relevant im Regelfall'], correct: 1, explanation: 'Rundenzeit-Bilanz: Reifendegradation macht langsamer, Gewichtsverlust durch verbranntes Benzin schneller (z.B. ~0,03 s/kg).' },
          { id: 'qz_rst8_7', category: 'RST 8 — Strategie', question: 'Eine rote Flagge bedeutet in der F1 strategisch…', options: ['einen freien Reifenwechsel während der Unterbrechung', 'den Verlust aller Positionen bei üblicher Auslegung', 'eine Durchfahrtsstrafe für alle bei üblicher Auslegung', 'dass keine Reifen mehr gewechselt werden dürfen meist'], correct: 0, explanation: '„red flag bedeutet in der F1 einen free tyre change“ — das kann ganze Strategien entwerten.' },
          { id: 'qz_rst8_8', category: 'RST 8 — Strategie', question: 'Welche „Standardzüge im Strategieschach“ nennt die Vorlesung?', options: ['Ausschließlich der klassische Undercut allein', 'Mehr/weniger Stopps, Reifenwahl, Under-/Overcut', 'Ausschließlich reine Wetterentscheidungen im Rennen', 'Verschiedene Taktiken allein über den Boxenfunk'], correct: 1, explanation: 'Die fünf Standardzüge: ±1 Stopp, Reifenwahl, Spurt, Teamkollege, vorgezogener Stopp.' },
        ],
        open: [
          { id: 'op_rst8_1', points: '4 Pkt.', question: 'Skizziere/beschreibe die Reifenperformance über die Runden mit allen Phasen.', answer: '• Anwärmphase (1–n Runden) bis zum Temperaturfenster (1).\n• Peak Performance (Quali-Niveau), danach Abfall auf stabiles Niveau (1).\n• Stabiles Verhalten → geringer Abbau (konstanter kleiner Verlust) (1).\n• Starker Abbau (Boxenstopp!) → Reifen komplett am Ende (kaum Grip) (1).' },
          { id: 'op_rst8_2', points: '5 Pkt.', question: 'Rechenaufgabe: Ein Boxenstopp kostet 25 s. Frische Reifen sind 0,8 s/Runde schneller. Nach wie vielen Runden hat sich der Stopp amortisiert? Was ändert sich unter Safety Car (Zeitverlust nur 12 s)?', answer: '• Break-Even: 25 / 0,8 = 31,25 → ab Runde 32 nach dem Stopp ist man in Summe schneller (2).\n• Unter SC: 12 / 0,8 = 15 → Amortisation schon nach 15 Runden (2).\n• Folgerung: Unter SC/VSC ist der Stopp deutlich „billiger“ → bevorzugtes Stopp-Fenster (1).' },
          { id: 'op_rst8_3', points: '4 Pkt.', question: 'Erkläre Undercut und Overcut und nenne je eine Situation, in der sie funktionieren.', answer: '• Undercut: früher stoppen, auf frischen Reifen schnelle Runden fahren; funktioniert, wenn frische Reifen sofort Zeit bringen und freie Strecke da ist (2).\n• Overcut: später stoppen; funktioniert, wenn der Gegner nach dem Stopp im Verkehr steckt oder seine Reifen lange zum Anwärmen brauchen (2).' },
        ],
      },
      {
        id: 'rst9', name: 'From Sensor to Mind — Datentechnik', icon: '📡', color: '#0a84ff', examWeight: 8,
        slideDeck: 'Folien_Rennsporttechnik/2025_Rennsporttechnik_FromSensorToMind.pdf',
        guided: [
          { id: 'g_rst9_1', badge: 'Datenweg', title: 'Der Weg der Daten', body: 'Die 5 Stationen (Klausur-Kette):\n\nSensor → Steuergerät (ECU) → Übertragen/Speichern → Aufbereitung → Visualisierung\n\n• Sensor: generiert Rohdaten\n• ECU: verarbeitet Sensordaten — Kalibrierung, Nullung, Verrechnung (Raddrehzahl → Geschwindigkeit), Sensorüberwachung, Zustandserkennung, Filterung, Min/Max/Mean, Integration (Leistung → Energie), Ableitung. Hauptaufgabe bleibt die STEUERUNG der Fahrzeugsysteme!\n• Übertragen/Speichern: Telemetrie (live, Stream, limitiert durch Übertragungsrate) vs. Logging (historisch, Dateien/Datenbank, limitiert durch Speicher)\n• Aufbereitung: Berechnungen, KPIs, Filtern, Verknüpfen mit anderen Quellen, Sensorfusion, State Estimation, ML, Abgleich mit Simulation\n• Visualisierung: große Datenmengen grafisch darstellen oder aufs Wichtigste reduzieren\n\nWozu Daten? Einzig OBJEKTIVE Entscheidungsgrundlage fürs Setup, Performanceanalyse, Fahrertraining, Abgleich mit Simulation, Fehlersuche, Sicherheit/Überwachung, Benchmarking.', example: '🔑 Fahrzeugnetzwerk: CAN-Bus ist immer noch Standard; Ethernet zunehmend bei E-Antrieben; analoge Sensoren via ADC.' },
          { id: 'g_rst9_2', badge: 'KPI', title: 'KPIs, Lap Stats & Digitalisierung', body: 'KPI (Key Performance Indicator) — Klausurfrage: „KPI beschreiben und 2 Beispiele“:\nHerunterbrechen der Fahrzeugperformance auf wenige Metriken. Wichtigster KPI: die RUNDENZEIT. KPIs beziehen sich auf Runden oder frei gewählte Bereiche (End of Straight, Apex).\nBeispiele: Lift-and-Coast-Distanz pro Runde, Spritverbrauch pro Runde, EOS-Geschwindigkeit, EOS-Reifen-/Bremstemperatur, Volllastanteil, Bremsdistanz, Kurvenscheitel-Geschwindigkeit, Reifenschlupf-Energien.\n\nLap Stats: Min/Max/Mittelwert/Integral wichtiger Parameter pro Runde — zur Überwachung und Früherkennung von Abnormalitäten.\n\nDatenrate = Auflösung (Bit) × Frequenz (Hz). Klausuraufgabe „Signal händisch digitalisieren mit 2 Hz und 3 Bit“: alle 0,5 s einen Messwert nehmen (Abtastung) und auf die nächstgelegene von 2³ = 8 Quantisierungsstufen runden.', example: '🔑 Telemetrie- und Logging-Frequenz können vom Sensor abweichen und für Ereignisse (Schaltvorgang, Start) temporär erhöht werden.' },
          { id: 'g_rst9_3', badge: 'Sensorik', title: 'Sensoren am Rennfahrzeug & Visualisierung', body: 'Sensorkategorien (je 1–2 Beispiele kennen):\n• Temperatur: Thermoelemente (Typ K), Pt100, IR (Thermopile/Bolometer)\n• Druck: Differenz-/Absolutdruck (wenige Pa Aero bis mehrere 100 bar Hydraulik)\n• Drehzahl/Geschwindigkeit: Induktions-/Inkrementalgeber, optisch (Correvit), GPS\n• Position: Hallsensoren, Potenziometer, Laser-Abstand (Fahrhöhe!)\n• Kraft/Moment: DMS, Kraftmessdosen, magnetoelastisch\n• Beschleunigung/Gierrate: IMU\n\nMehr Sensoren = besser? Vorteile: Verständnis, Redundanz, mehrere Quellen. Nachteile: Gewicht, Strom, Signalverarbeitungslimit, Ausfallrisiko, Aero-Störung!\n\nVisualisierung: Waveform (zeit- vs. WEGbasiert — wegbasiert für Overlays/Bremspunkte!), Scatter (g-g-Diagramm), Histogramm (Dämpfergeschwindigkeiten, Streckencharakteristik), Heatmap (Ride-Heights, Drehmoment-Drehzahl), FFT (Eigenfrequenzen, Schwingungen). Tools: McLaren ATLAS, MoTeC i2, WinDarab.', example: '🔑 Downforce messen: Pushrod-Kräfte (+ Korrektur um Reifen-/Brems-/Massenkräfte) ODER Druckbohrungen (Cp→Downforce-Mapping aus dem Windkanal).' },
        ],
        flashcards: [
          { id: 'fc_rst9_1', front: 'Beschreibe den „Weg der Daten“ im Rennsport (5 Stationen).', back: 'Sensor (Rohdaten) → Steuergerät (Verarbeitung/Kalibrierung) → Übertragen/Speichern (Telemetrie/Logging) → Aufbereitung (KPIs, Filter, Fusion) → Visualisierung (Diagramme, Reports).' },
          { id: 'fc_rst9_2', front: 'Was ist ein KPI? Nenne 2 Beispiele.', back: 'Key Performance Indicator: Herunterbrechen der Fahrzeugperformance auf wenige Metriken (wichtigster: Rundenzeit); bezogen auf Runden oder Streckenbereiche.\nBeispiele: Lift-and-Coast-Distanz pro Runde, End-of-Straight-Geschwindigkeit, Volllastanteil, Bremsdistanz, Spritverbrauch/Runde.' },
          { id: 'fc_rst9_3', front: 'Wozu werden Daten im Rennsport benutzt?', back: '• Einzige OBJEKTIVE Entscheidungsgrundlage fürs Setup\n• Performanceanalyse & Fahrzeugverständnis\n• Fahrertraining\n• Vergleich mit Simulation\n• Fehlersuche, Sicherheit/Überwachung, Benchmarking' },
          { id: 'fc_rst9_4', front: 'Telemetrie vs. Logging — Unterschiede und Limitierungen?', back: 'Telemetrie (live): Daten im Stream; limitiert durch die Übertragungsrate.\nLogging (historic): Dateien/Datenbank; limitiert durch Speicher/Dateigröße.\nBeide: Datenmenge = Datentyp × Frequenz; Frequenz kann vom Sensor abweichen und bei Ereignissen temporär erhöht werden.' },
          { id: 'fc_rst9_5', front: 'Wovon hängt die Datenrate eines Signals ab? Wie digitalisiert man mit 2 Hz / 3 Bit?', back: 'Datenrate = Auflösung (Bit) × Abtastfrequenz (Hz).\n2 Hz = alle 0,5 s ein Abtastwert; 3 Bit = 2³ = 8 Quantisierungsstufen — jeden Abtastwert auf die nächste Stufe runden (Treppensignal).' },
          { id: 'fc_rst9_6', front: 'Nenne 4 Sensorkategorien am Rennfahrzeug mit je einem Beispiel.', back: '• Temperatur: Thermoelement Typ K / Pt100 / IR\n• Druck: Absolut-/Differenzdrucksensor\n• Geschwindigkeit: optischer Correvit-Sensor, GPS\n• Kraft/Moment: DMS, Kraftmessdose\n• (Position: Laser-Abstand/Potenziometer; Bewegung: IMU)' },
          { id: 'fc_rst9_7', front: 'Vor- und Nachteile von mehr Sensoren am Fahrzeug?', back: 'Pro: besseres Verständnis, Redundanz, mehrere Datenquellen pro Fragestellung.\nContra: Gewicht, Stromverbrauch, Limit der Signalverarbeitung, Ausfallrisiko, Störung der Aerodynamik.' },
          { id: 'fc_rst9_8', front: 'Wann nutzt man weg- statt zeitbasierte Liniendiagramme?', back: 'Wegbasiert für Runden-OVERLAYS: Bremspunkte und Scheitelpunkte verschiedener Runden liegen übereinander und lassen sich vergleichen. Zeitbasiert: eindeutig, gut fürs Debugging (Logging ist zeitbasiert).' },
          { id: 'fc_rst9_9', front: 'Welche Visualisierungsarten gibt es in der Datenanalyse?', back: 'Waveform (Linien, zeit-/wegbasiert), Scatter (x-y, z.B. g-g-Diagramm), Histogramm (Häufigkeiten, z.B. Dämpfergeschwindigkeiten), Heatmap/2D-Histogramm (z.B. Ride-Heights), FFT (Frequenzanalyse/Eigenfrequenzen), Trackmap, Boxplots.' },
        ],
        quiz: [
          { id: 'qz_rst9_1', category: 'RST 9 — Datentechnik', question: 'Der „Weg der Daten“ lautet in korrekter Reihenfolge…', options: ['Sensor → Visualisierung → Steuergerät → Speichern', 'Sensor → Steuergerät → Übertragen → Aufbereiten → Anzeige', 'Steuergerät → Sensor → Cloud → Fertiger Report', 'Aufbereitung → Sensor → Steuergerät → Anzeige'], correct: 1, explanation: 'Sensor generiert Rohdaten, die ECU verarbeitet, dann Telemetrie/Logging, Aufbereitung (KPIs, Filter) und Visualisierung.' },
          { id: 'qz_rst9_2', category: 'RST 9 — Datentechnik', question: 'Was ist der wichtigste KPI im Rennsport?', options: ['Die Motortemperatur', 'Der Reifendruck', 'Die Rundenzeit', 'Die Anzahl der Schaltvorgänge'], correct: 2, explanation: 'KPIs brechen die Performance auf wenige Metriken herunter — die Rundenzeit ist die oberste.' },
          { id: 'qz_rst9_3', category: 'RST 9 — Datentechnik', question: 'Ein Signal soll mit 2 Hz und 3 Bit digitalisiert werden. Was bedeutet das?', options: ['Alle 2 s ein Wert mit 3 Nachkommastellen generell', 'Alle 0,5 s ein Wert, quantisiert auf 8 Stufen (2³)', 'Alle 0,5 s ein Wert, quantisiert auf nur 3 Stufen', 'Zwei Werte pro Minute mit je 8 Bit Auflösung meist'], correct: 1, explanation: '2 Hz → Abtastintervall 0,5 s; 3 Bit → 2³ = 8 Quantisierungsstufen.' },
          { id: 'qz_rst9_4', category: 'RST 9 — Datentechnik', question: 'Welches Bussystem ist im Rennfahrzeug immer noch Standard?', options: ['FlexRay', 'LIN', 'CAN-Bus', 'MOST'], correct: 2, explanation: 'CAN-Bus ist Standard; Ethernet kommt vermehrt bei elektrischen Antrieben zum Einsatz.' },
          { id: 'qz_rst9_5', category: 'RST 9 — Datentechnik', question: 'Warum sind wegbasierte Liniendiagramme für Rundenvergleiche besser als zeitbasierte?', options: ['Sie belegen insgesamt deutlich weniger Speicher generell', 'Brems- und Scheitelpunkte liegen im Overlay übereinander', 'Die zeitbasierte Achse ist grundsätzlich ungenau generell', 'Sie zeigen automatisch die gefahrene Ideallinie generell'], correct: 1, explanation: 'Über der Wegstrecke aufgetragen lassen sich Bremspunkte/Apex-Geschwindigkeiten direkt vergleichen; kleine Streckenlängen-Unterschiede möglich.' },
          { id: 'qz_rst9_6', category: 'RST 9 — Datentechnik', question: 'Womit erkennt man Eigenfrequenzen und schädliche Schwingungen (z.B. im Feder-Dämpfer-System)?', options: ['Histogramm', 'Scatter-Plot', 'Trackmap', 'FFT (Frequenzanalyse)'], correct: 3, explanation: 'Die FFT zeigt das Frequenzspektrum über einen definierten Zeitraum — z.B. für Fahrwerkslasten und Aufbaueigenfrequenzen.' },
          { id: 'qz_rst9_7', category: 'RST 9 — Datentechnik', question: 'Was ist ein Nachteil von mehr Sensorik am Rennfahrzeug?', options: ['Eine insgesamt bessere Redundanz der Messdaten generell', 'Störung der Aerodynamik plus Gewicht und Ausfallrisiko', 'Mehr Datenquellen für ein und dieselbe Fragestellung', 'Ein insgesamt besseres Verständnis des Fahrzeugs meist'], correct: 1, explanation: 'Mehr Sensoren kosten Gewicht, Strom und können die Aerodynamik stören — Vor- und Nachteile müssen abgewogen werden.' },
          { id: 'qz_rst9_8', category: 'RST 9 — Datentechnik', question: 'Die Hauptaufgabe des Steuergeräts (ECU) ist…', options: ['die grafische Visualisierung der erfassten Daten generell', 'das reine Loggen aller anfallenden Messdaten in der Praxis', 'Steuerung der Fahrzeugsysteme; Aufbereitung ist Nebensache', 'der Aufbau des Sprechfunks zur Boxenmannschaft im Regelfall'], correct: 2, explanation: 'Die ECU verarbeitet zwar Sensordaten (Kalibrierung, Filterung), ihre Hauptaufgabe bleibt die Steuerung der Fahrzeugsysteme.' },
        ],
        open: [
          { id: 'op_rst9_1', points: '4 Pkt.', question: 'Beschreibe einen Key Performance Indicator (KPI) und nenne zwei Beispiele.', answer: '• KPI = Herunterbrechen der Fahrzeugperformance auf wenige aussagekräftige Metriken; auf Runden oder Streckenbereiche bezogen; wichtigster KPI ist die Rundenzeit (2).\n• Beispiel 1: Lift-and-Coast-Distanz pro Runde/Sektor (1).\n• Beispiel 2: End-of-Straight-Geschwindigkeit oder Volllastanteil / Bremsdistanz / Spritverbrauch pro Runde (1).' },
          { id: 'op_rst9_2', points: '4 Pkt.', question: 'Digitalisiere ein Signal mit 2 Hz Abtastrate und 3 Bit Auflösung — beschreibe das Vorgehen.', answer: '• Abtastung: alle 0,5 s (1/2 Hz) einen Messwert entnehmen (1).\n• Quantisierung: Wertebereich in 2³ = 8 Stufen einteilen (1).\n• Jeden Abtastwert auf die nächstgelegene Stufe runden (1).\n• Ergebnis: Treppensignal; Informationsverlust durch Abtastung + Quantisierung (1).' },
          { id: 'op_rst9_3', points: '3 Pkt.', question: 'Nenne den Weg der Daten von der Messung bis zur Entscheidung.', answer: '• Sensor generiert Rohdaten → ECU verarbeitet (Kalibrierung, Verrechnung, Überwachung) (1).\n• Übertragen (Telemetrie) oder Speichern (Logging) → Aufbereitung: Filtern, KPIs, Verknüpfen, Fusion (1).\n• Visualisierung (Waveforms, Histogramme, Reports) als Entscheidungsgrundlage z.B. fürs Setup (1).' },
        ],
      },
      {
        id: 'rst10', name: 'Packaging', icon: '📦', color: '#ff9f0a', examWeight: 8,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_10_Packaging.pdf',
        guided: [
          { id: 'g_rst10_1', badge: 'Definition', title: 'Was ist Packaging?', body: 'Packaging = das Zusammensetzen einzelner Komponenten zu einem möglichst gut funktionierenden System — inklusive der Kombination MEHRERER Funktionen in EINEM Bauteil.\n\nSchwerpunkte des Packagings:\n• Aerodynamik\n• Schwerpunktlage\n• Reduzierte Trägheit\n• Ermöglichung regulatorischer Vorteile\n• Reparierbarkeit\n• Vereinfachung\n\nBeispiele aus der F1: Elektronik unter dem Kühler oder unter dem Fahrer (kalte vs. heiße Zonen), extremer Seitenkasten-Unterschnitt, schmalstes Getriebegehäuse für maximalen Diffusor-Volumenstrom, Auspuff-Anordnung mit „Hitzeschutzblechen“ für den angeblasenen Diffusor (regulatorischer Vorteil).', example: '🔑 Sitzposition F1 heute: flachste Position, erhöhte Beine → höherer Schwerpunkt wird in Kauf genommen, weil mehr Luft unter das Auto = mehr Abtrieb bringt. Aero schlägt Schwerpunkt!' },
          { id: 'g_rst10_2', badge: '4 Grundkonzepte', title: 'Die 4 Grundkonzepte der Packaging-Auslegung', body: 'Klausurfrage WS24/25: „Welche 4 Grundkonzepte gibt es in der Packaging-Auslegung?“\n\n1. Aerodynamik hat oberste Priorität: Anordnung der Komponenten folgt der aerodynamischen Grundform (Tropfenform, Unterschnitt, Diffusor-Volumen).\n\n2. Mechanisches Grundkonzept: schwere Komponenten nahe des Schwerpunkts (geringe Trägheit), gewichtsveränderliche Teile (Tank!) IM Schwerpunkt (geringe Balanceänderung), kurze Leitungslängen, vorhandene Bauräume nutzen.\n\n3. Vereinfachung: Bauteile eliminieren (Rahmen, Kardanwellen), Bauteile als Strukturteil nutzen (Motor als tragendes Element seit Lotus 49, Sitz in Außenhaut integriert).\n\n4. Thermisches Gesamtkonzept: heiße und kalte Temperaturzonen schaffen — das Package muss als GESAMTKONZEPT funktionieren (Elektronik kalt, Auspuff/Turbo heiß).', example: '🔑 Merkhilfe „AMVT“: Aerodynamik — Mechanik (Schwerpunkt/Trägheit) — Vereinfachung — Thermik.' },
          { id: 'g_rst10_3', badge: 'Historie', title: 'Packaging-Meilensteine', body: 'Benz Patentwagen (1885): hecklastig, hoher Schwerpunkt. Horch (1901–04): Standardantrieb — Kühler & Motor vorn, Getriebe angeflanscht, Kardanwelle.\n\nRumpler Tropfenwagen (1921): Neuanordnung vorhandener Komponenten → cw = 0,28 (üblich damals: 0,7–1,0)! Package folgt der Tropfenform, Mittelmotor, Eliminierung der Kardanwelle.\n\nAuto Union GP (1934, Porsche/Rosenberger): Mittelmotor-GP-Wagen; Mercedes W154 (1938): Motor schräg/geneigt eingebaut, seitliche Kardanwelle → tiefere Sitzposition.\n\nLotus 25 (1962): Aluminium-Monocoque mit integrierten Tanks, kein Getrieberahmen. Lotus/F1 1967+: Motor als Strukturbauteil (kein Motorrahmen). F1 1979: Ground-Effect-Fahrzeuge mit „leeren“ bzw. integrierten Seitenkästen und Abdichtung. F1 1984: Carbon-Chassis, flacher Unterboden.\n\nHeute: Grundstruktur = Monocoque + Motor + Getriebe als tragende Kette; Batterie/Turbo/Hydraulik in thermischen Zonen.', example: '🔑 Roter Faden der Historie: Komponenten neu anordnen (Tropfenwagen) → Bauteile eliminieren (Monocoque) → Bauteile als Struktur (Motor) → Aero-dominiertes Gesamtpackage (Ground Effect).' },
        ],
        flashcards: [
          { id: 'fc_rst10_1', front: 'Was ist Packaging?', back: 'Das Zusammensetzen einzelner Komponenten zu einem möglichst gut funktionierenden Gesamtsystem + Kombination mehrerer Funktionen in einem Bauteil.' },
          { id: 'fc_rst10_2', front: 'Nenne die 4 Grundkonzepte der Packaging-Auslegung.', back: '1. Aerodynamik als oberste Priorität (aerodynamische Grundform)\n2. Mechanisches Grundkonzept: schwere Teile nahe SP, veränderliche Massen im SP, kurze Leitungen\n3. Vereinfachung: Bauteile eliminieren / als Strukturteil nutzen\n4. Thermisches Gesamtkonzept: heiße und kalte Zonen' },
          { id: 'fc_rst10_3', front: 'Warum sollen gewichtsveränderliche Teile (Tank) im Schwerpunkt liegen?', back: 'Damit sich die Fahrzeugbalance nicht ändert, wenn sich die Masse ändert (Benzinverbrauch über den Stint) — konstantes Fahrverhalten von voll bis leer.' },
          { id: 'fc_rst10_4', front: 'Was war der Durchbruch des Rumpler Tropfenwagens (1921)?', back: 'Neuanordnung vorhandener Komponenten für die Tropfenform: cw = 0,28 statt üblicher 0,7–1,0; Mittelmotor, Kardanwelle eliminiert — Package im Dienst der Aerodynamik.' },
          { id: 'fc_rst10_5', front: 'Welche Vereinfachungs-Strategien nutzt modernes Packaging?', back: '• Eliminieren von Bauteilen: Rahmen (Monocoque, Lotus 25), Kardanwellen\n• Bauteile als Strukturteil: Motor & Getriebe tragend (seit Lotus 49), Sitz in Außenhaut integriert' },
          { id: 'fc_rst10_6', front: 'Warum sitzt der F1-Fahrer heute mit erhöhten Beinen, obwohl das den Schwerpunkt anhebt?', back: 'Die flache Sitzposition erlaubt mehr Luft unter das Auto → mehr Abtrieb über den Unterboden. Aerodynamik hat im Packaging oberste Priorität — der Abtriebsgewinn überwiegt den Schwerpunktnachteil.' },
          { id: 'fc_rst10_7', front: 'Gib ein Beispiel für Packaging zur Erreichung regulatorischer Vorteile.', back: 'Angeblasener Diffusor: Löcher im Diffusor verboten, aber Hitzeschutzbleche erlaubt → Auspuff so positioniert, dass die „Hitzeschutzbleche“ die Abgase in den Diffusor leiten.' },
          { id: 'fc_rst10_8', front: 'Welche thermischen Zonen hat ein modernes F1-Package?', back: 'Kalte Zone: Elektronik, Batterie (z.B. unter dem Kühler oder unter dem Fahrer).\nHeiße Zone: Auspuff, Turbo, Hydraulik-Umfeld. Das Package muss als thermisches Gesamtkonzept funktionieren.' },
        ],
        quiz: [
          { id: 'qz_rst10_1', category: 'RST 10 — Packaging', question: 'Welche 4 Grundkonzepte prägen die Packaging-Auslegung?', options: ['Design, Komfort, Kosten und Wartungsfreundlichkeit generell', 'Aero-Priorität, Schwerpunkt/Trägheit, Vereinfachung, Thermik', 'Motor, Getriebe, Fahrwerk und Fahrzeugelektronik im Regelfall', 'Sicherheit, Ergonomie, Stückzahl und Logistik in der Praxis'], correct: 1, explanation: 'Aero zuerst; schwere Teile nahe SP & veränderliche Massen im SP; Bauteile eliminieren/als Struktur nutzen; heiße/kalte Zonen.' },
          { id: 'qz_rst10_2', category: 'RST 10 — Packaging', question: 'Warum werden schwere Komponenten nahe des Schwerpunkts angeordnet?', options: ['Wegen der besseren Crashsicherheit im Aufprall', 'Für kleine Trägheitsmomente und agiles Handling', 'Für möglichst kurze Kabel- und Leitungswege meist', 'Weil das technische Reglement es vorschreibt'], correct: 1, explanation: 'Massen nahe des SP minimieren die Trägheitsmomente — das Fahrzeug reagiert agiler auf Richtungswechsel.' },
          { id: 'qz_rst10_3', category: 'RST 10 — Packaging', question: 'Der Rumpler Tropfenwagen (1921) erreichte welchen cw-Wert (üblich damals: 0,7–1,0)?', options: ['0,50', '0,28', '0,15', '0,90'], correct: 1, explanation: 'Durch das der Tropfenform folgende Package: cw = 0,28 — eine drastische Effizienzsteigerung.' },
          { id: 'qz_rst10_4', category: 'RST 10 — Packaging', question: 'Was führte Lotus 1962 mit dem Typ 25 ein?', options: ['Den ersten hydraulisch verstellbaren Heckflügel', 'Das Aluminium-Monocoque mit Integraltanks', 'Den ersten aufgeladenen V8-Turbomotor', 'Das voll tragende Carbon-Faser-Chassis'], correct: 1, explanation: 'Das Monocoque ersetzte den Rahmen (Bauteile-Elimination) und integrierte die Tanks; Carbon kam 1981/84.' },
          { id: 'qz_rst10_5', category: 'RST 10 — Packaging', question: '„Motor als Strukturbauteil“ bedeutet…', options: ['Der Motor ist besonders steif im Rahmen gelagert im Normalbetrieb', 'Der Motor trägt als Struktur die Hinterachse; der Rahmen entfällt', 'Der Motor sitzt möglichst genau im Schwerpunkt im Normalbetrieb', 'Der Motor wird zur Kühlung des Fahrzeugs genutzt im Normalbetrieb'], correct: 1, explanation: 'Seit Ende der 1960er (Lotus 49): Monocoque–Motor–Getriebe als tragende Kette, keine separaten Rahmen.' },
          { id: 'qz_rst10_6', category: 'RST 10 — Packaging', question: 'Beispiel „Hitzeschutzbleche“ am Auspuff: Wofür steht es?', options: ['Für die Umsetzung des thermischen Grundkonzepts meist', 'Für Packaging zum Regelvorteil (verkappter Diffusor)', 'Für die einfache Reparierbarkeit im Rennen generell', 'Für die Reduktion der Leitungslängen im Heck generell'], correct: 1, explanation: 'Löcher im Diffusor waren verboten, Hitzeschutzbleche erlaubt — das Package nutzte die Reglement-Lücke für den Anblas-Effekt.' },
        ],
        open: [
          { id: 'op_rst10_1', points: '4 Pkt.', question: 'Welche 4 Grundkonzepte gibt es in der Packaging-Auslegung?', answer: '• Aerodynamik als oberste Priorität — Komponenten folgen der aerodynamischen Grundform (1).\n• Mechanisches Grundkonzept: schwere Komponenten nahe des Schwerpunkts, gewichtsveränderliche Teile im Schwerpunkt, kurze Leitungen, Bauräume nutzen (1).\n• Vereinfachung: Bauteile eliminieren (Rahmen, Kardanwelle) bzw. als Strukturteil nutzen (Motor) (1).\n• Thermisches Gesamtkonzept: heiße und kalte Temperaturzonen schaffen (1).' },
          { id: 'op_rst10_2', points: '3 Pkt.', question: 'Definiere Packaging und nenne drei seiner Schwerpunkte.', answer: '• Definition: Zusammensetzen einzelner Komponenten zu einem möglichst gut funktionierenden System; Kombination mehrerer Funktionen in einem Bauteil (1).\n• Schwerpunkte (3 nennen): Aerodynamik, Schwerpunktlage, reduzierte Trägheit, regulatorische Vorteile, Reparierbarkeit, Vereinfachung (2).' },
        ],

      {
        id: 'rst11', name: 'Rennfahrzeuge vs. Straßenfahrzeuge', icon: '🆚', color: '#30d158', examWeight: 12,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_13_Rennfahrzeuge_StraÃenfahrzeuge.pdf',
        guided: [
          { id: 'g_rst11_1', badge: 'Entwicklungsziele', title: 'Anforderungen: Serie vs. Rennsport', body: 'Ziel des Rennwagens: eine bestimmte Strecke innerhalb der Reglementvorgaben möglichst schnell durchfahren + schnell zu reparieren sein.\n\nAnforderungsvergleich (3 Entwicklungsziele mit Ausprägung nennen können!):\n• Sicherheit: Serie hoch (Gesetze, NCAP) — Rennen reglementbedingt (Monocoque, Käfig, HANS)\n• Komfort: Serie hoch — Rennen niedrig\n• Design: Serie wichtig — Rennen unwichtig (Form follows Function)\n• Lebensdauer: Serie 10–15 Jahre — Rennen 1–3 Jahre\n• Kosten: Serie wichtig (Wirtschaftlichkeit) — Rennen eher unwichtig (Reglement/Budget bestimmt)\n• Wartung: Serie selten — Rennen sehr häufig (vor/nach jedem Rennen)\n• Planung: Serie 3–5 Jahre — Rennen oft unter 1 Jahr\n• Produktion: Serie hohe Stückzahlen — Rennen Einzelstücke/Kleinserie\n\nEntscheidende Performance-Faktoren des Rennwagens: Aerodynamik, Motorleistung, Fahrer, Masse, Reifen.', example: '🔑 Klausur WS17: „3 Entwicklungsziele von Straßen- und Rennfahrzeugen mit jeweiliger Ausprägung“ — Tabelle lernen!' },
          { id: 'g_rst11_2', badge: 'Fahrdynamik', title: 'Vertikal-, Quer- & Längsdynamik im Vergleich', body: 'Vertikaldynamik: Rennfahrzeug will hohen Abtrieb + geringe Radlastschwankung + stabilen Bodenabstand (Aero!); Serienfahrzeug optimiert Komfort (Aufbaubeschleunigung ≈ 0) und Fahrsicherheit. Rennfahrzeug: höhere Aufbaueigenfrequenz, höhere Radlastschwankung, geringere Bodenabstandsschwankung; das Abstimmungsfenster ist wegen der Aero eng. Faustzahl: Fahrwerksfedersteifigkeit F1 ≈ Faktor 10 (bis ~50) höher als PKW.\n\nQuerdynamik: Zuordnungsaufgabe LMP vs. Tourenwagen: Der Sportprototyp (LMP) hat durch Aero-Anbauteile stark mit v steigende ACHSLAST und die höchsten Querbeschleunigungen; der Tourenwagen deutlich flachere Verläufe; das Serienfahrzeug fast konstante Achslast (kein Abtrieb). Schräglaufsteifigkeit steigt mit abtriebsinduzierter Radlast OHNE Massenzunahme → Fahrzeug wird mit v agiler und stärker gedämpft.\n\nLängsdynamik: Achslastverlagerung beim Bremsen $a/g = l_v/h$; Le Mans: Volllastanteil überwiegt; F1-Rennen 2000–2600 Schaltvorgänge, Le Mans 15.800 — sequentielle Getriebe, kurze Schaltzeiten ohne schlagartigen Zugkrafteinsatz.\n\nBeschleunigungswerte (Tabelle!): F1 ≈ 2g Antrieb / 5g Bremsen / 4g quer; LMP ≈ 1,5/4/3,5g; Tourenwagen ≈ 1/3/2,5g; Rallye ≈ 1,3/1,8/1,7g; Serie ≈ 0,8/1,2/1g.', example: '🔑 Klausur: „Diagramme Vertikalkräfte/Querkräfte über Geschwindigkeit LMP vs. Tourenwagen zuordnen“ — steile v²-Kurven = LMP (viel Aero), flache = Tourenwagen/Serie.' },
          { id: 'g_rst11_3', badge: 'Kurvenfahrt', title: 'Kammscher Kreis & Phasen der Kurvenfahrt', body: 'Der Kammsche Kreis begrenzt die resultierende Reifenkraft: $√(F_x² + F_y²) ≤ μ·F_z$. Der Fahrer versucht permanent am Grenzbereich (Kreisrand) zu fahren:\n\n1. Gerade: maximale Längsbeschleunigung (unten am Kreis)\n2. Bremspunkt: maximale Verzögerung (oben)\n3. Einlenken auf der Bremse (Trail Braking): Kombination Bremsen + Lenken — resultierende Beschleunigung schöpft das Reifenpotenzial aus\n4. Kurvenmitte (Apex): maximale Querbeschleunigung (seitlich am Kreis)\n5. Auslenken + Beschleunigungsaufbau kombiniert\n6. Volle Längsbeschleunigung\n\nWICHTIG: Durch Abtrieb wächst der Grenzbereich (Kreis) mit der Geschwindigkeit!\n\nKlassiker „Warum untersteuert ein Fahrzeug in engen Kurven?“: In langsamen Kurven fehlt der Abtrieb; beim Herausbeschleunigen (Hinterachse überträgt Längskraft) bzw. Einlenken auf der Bremse (Vorderachse durch Bremskraft am Limit) ist das kombinierte Kraftpotenzial der VA schnell ausgeschöpft — die Vorderreifen können die geforderte Querkraft nicht mehr zusätzlich aufbauen → Untersteuern. Übersteuern am Kurvenausgang: Antriebskraft an der HA verbraucht deren Querkraftpotenzial.', example: '🔑 Klausur: „Mit Kammschem Kreis erklären, warum ein Fahrzeug in engen Kurven oft untersteuert“ + „Kammschen Kreis für Schikanendurchfahrt zeichnen“ (Beschleunigungsverlauf entlang des Kreisrandes).' },
          { id: 'g_rst11_4', badge: 'Setup', title: 'Setup & Fahrverhalten abstimmen', body: 'Setup-Ziel: Für einen bestimmten Fahrer das Fahrzeug auf Strecke und Witterung anpassen → möglichst NEUTRALES Fahrverhalten, beste Reifenhaftung, kontrollierbare Leistungsentfaltung.\n\nMöglichkeiten: Massenreduktion, Getriebeabstufung, Fahrwerksabstimmung (Federn, Dämpfer, Stabilisatoren, Rollmomentenverteilung), aerodynamische Abstimmung (Flügelwinkel), Motorabstimmung. Varianten: Basis- → Grob- → Feinabstimmung; schrittweise, dokumentiert, nach jeder Änderung fahren.\n\nKlassiker „Untersteuern in langsamen Kurven, Übersteuern in schnellen — was tun?“:\n• Langsame Kurven (mechanischer Grip): Untersteuern → vordere Feder-/Stabilisatorsteifigkeit reduzieren bzw. Rollmomentenverteilung nach hinten, mehr Frontsturz\n• Schnelle Kurven (Aero-Grip): Übersteuern → Aerobalance nach hinten = mehr Heckflügel-Anstellwinkel (bzw. weniger Frontflügel)\n→ Mechanik wirkt v.a. langsam, Aero v.a. schnell — so lassen sich beide Bereiche getrennt einstellen!\n\nSetupeinflüsse auf den Reifen: Druck (Contact Patch, Steifigkeit, Temperatur), Sturz (Querkraft außen ↑), Spur, Radlasten/Balance — alles wirkt auf das Temperaturfenster.', example: '🔑 WS18-Aufgabe: „Neutrales Verhalten bei Untersteuern am Eingang langsamer Kurven + Übersteuern in schnellen Kurven“ → mechanisch vorne weicher UND Aerobalance nach hinten (mehr Heckflügel).' },
          { id: 'g_rst11_5', badge: 'Sicherheit & Antrieb', title: 'Sicherheit, Getriebe, Hybrid & Baugruppen', body: 'Sicherheit Rennfahrzeug (andere Auslegung als Serie): trainierter Fahrer, alle fahren in eine Richtung, abgesperrte Strecke → mehr PASSIVE Systeme: Monocoque, Überrollkäfig/-bügel, KEIN Airbag, Feuerlöschsystem, HANS. Aufbau: Schutzzonen/Schottwände, Seitenaufprallschutz, Knautschzonen, Heckaufprallelement. Serie: Gesetze, NCAP-Crashtests, Airbags, aktive Systeme (ABS, ESP).\n\nBaugruppen des Rennfahrzeugs (benennen können): Cockpit, Rahmen/Monocoque, Motor, Antriebsstrang, Kraftstoffsystem, Fahrwerk, Lenkung, Räder & Reifen, Bremsanlage, Außenhaut, Elektrik/Hilfssysteme — GLEICHE Baugruppen wie das Serienfahrzeug, nur eingeschränktes Teilespektrum!\n\nGetriebe: sequentiell, schnelle Schaltvorgänge ohne schlagartigen Zugkraft-Wiedereinsatz (Fahrstabilität an der Haftgrenze!), Übersetzungen je Streckencharakteristik.\n\nHybrid/KERS: Bremsenergierückgewinnung; Arten: seriell, parallel, leistungsverzweigt (wie Serie, aber viel höhere Leistungsdichte); Beispiel Porsche 911 GT3 R Hybrid: elektrisches Schwungrad.', example: '🔑 Effektive Zugkrafthysterese (WS24/25): Zugkraft über v je Gang einzeichnen — optimale Schaltpunkte an den Schnittpunkten der Gangkurven; theoretische v_max am Schnitt Zugkraft = Fahrwiderstand, effektive v_max ggf. durch Drehzahllimit im letzten Gang.' },
        ],
        flashcards: [
          { id: 'fc_rst11_1', front: 'Nenne 3 Entwicklungsziele von Straßen- und Rennfahrzeugen mit ihrer jeweiligen Ausprägung.', back: '• Komfort: Serie hoch / Rennen niedrig\n• Lebensdauer: Serie 10–15 Jahre / Rennen 1–3 Jahre\n• Kosten: Serie wichtig / Rennen eher unwichtig\n(auch: Design wichtig/FFF-unwichtig, Wartung selten/sehr häufig, Produktion Großserie/Einzelstück)' },
          { id: 'fc_rst11_2', front: 'Was sind die entscheidenden Performance-Faktoren eines Rennfahrzeugs?', back: 'Aerodynamik, Motorleistung, Fahrer, Masse, Reifen (reduzierte Eigenschaftsspinne).' },
          { id: 'fc_rst11_3', front: 'Formuliere die Bedingung des Kammschen Kreises.', back: '$√(F_x² + F_y²) ≤ μ·F_z$ — die resultierende Reifenkraft aus Längs- und Querkraft ist durch das Reibwert-Radlast-Produkt begrenzt. Mit Abtrieb wächst der Kreis mit der Geschwindigkeit.' },
          { id: 'fc_rst11_4', front: 'Erkläre mit dem Kammschen Kreis, warum ein Fahrzeug in engen Kurven oft untersteuert.', back: 'In langsamen Kurven fehlt der Abtrieb (kleiner Kreis). Beim Einlenken auf der Bremse ist die VA durch die Bremskraft bereits nahe am Limit — für zusätzliche Querkraft bleibt kein Potenzial → die Front schiebt (Untersteuern). Am Ausgang verbraucht die Antriebskraft das Querpotenzial der HA → Übersteuern.' },
          { id: 'fc_rst11_5', front: 'Wie ordnet man Achslast-/Querbeschleunigungsverläufe über v den Fahrzeugen LMP und Tourenwagen zu?', back: 'LMP/Sportprototyp: stark quadratisch mit v steigende Achslast + höchste Querbeschleunigung (viel Aero, beste Reifen, tiefer SP).\nTourenwagen: deutlich flachere Verläufe. Serienfahrzeug: nahezu konstante Achslast (kein Abtrieb).' },
          { id: 'fc_rst11_6', front: 'Nenne die Beschleunigungswerte der Rennserien (längs/verzögern/quer).', back: '• F1: ~2g / ~5g / ~4g\n• Sportprototyp (LMP): ~1,5g / ~4g / ~3,5g\n• Tourenwagen: ~1g / ~3g / ~2,5g\n• Rallye: ~1,3g / ~1,8g / ~1,7g\n• Serie: ~0,8g / ~1,2g / ~1g' },
          { id: 'fc_rst11_7', front: 'Um welchen Faktor ist die Fahrwerksfedersteifigkeit eines F1 höher als beim Serien-PKW?', back: 'Größenordnung Faktor ~10 und mehr (je nach Quelle bis ~50) — nötig wegen der Abtriebskräfte und des engen Bodenabstands-Fensters (Aero-Stabilität).' },
          { id: 'fc_rst11_8', front: 'Was sind die Bewertungskriterien der Vertikaldynamik bei Renn- vs. Serienfahrzeug?', back: 'Rennfahrzeug: Fahrstabilität/Aufbaubewegung, Kraftschluss/Radlastschwankung, aerodynamische Stabilität/Bodenabstand.\nSerienfahrzeug: Fahrkomfort (Aufbaubeschleunigung ≈ 0), Fahrsicherheit (Radlastschwankung), konstruktive Restriktionen (Federwege).' },
          { id: 'fc_rst11_9', front: 'Untersteuern in langsamen und Übersteuern in schnellen Kurven — welche Setup-Änderungen?', back: 'Langsam (mechanischer Grip): vorne weicher (Federn/Stabi), Rollmomentenverteilung nach hinten, mehr Frontsturz → weniger Untersteuern.\nSchnell (Aero): Aerobalance nach hinten — mehr Heckflügel/weniger Frontflügel → weniger Übersteuern.\nMechanik wirkt langsam, Aero schnell → getrennt einstellbar.' },
          { id: 'fc_rst11_10', front: 'Warum verzichtet ein Rennfahrzeug auf Airbags?', back: 'Andere Auslegungskriterien: trainierter, angeschnallter Fahrer (6-Punkt-Gurt, HANS), alle fahren in eine Richtung, abgesperrte Strecke → passive Systeme wie Monocoque, Überrollkäfig, Feuerlöschsystem sind wirksamer.' },
          { id: 'fc_rst11_11', front: 'Nenne die wesentlichen Baugruppen eines Rennfahrzeugs.', back: 'Cockpit, Rahmen/Monocoque, Motor, Antriebsstrang, Kraftstoffsystem, Fahrwerk, Lenkung, Räder & Reifen, Bremsanlage, Außenhaut, Elektrik & Hilfssysteme — gleiche Baugruppen wie Serie, eingeschränktes Teilespektrum.' },
          { id: 'fc_rst11_12', front: 'Welche Anforderungen stellt das Renngetriebe an den Schaltvorgang?', back: 'Sequentiell, minimale Schaltzeiten, Zugkraft darf nicht schlagartig wieder einsetzen (Reifen an der Haftgrenze!), Fahrstabilität nicht beeinflussen. F1: 2000–2600 Schaltungen/Rennen, Le Mans: ~15.800.' },
          { id: 'fc_rst11_13', front: 'Welche Hybridantriebs-Arten gibt es?', back: 'Seriell, parallel, leistungsverzweigt — wie im Serienfahrzeug, im Motorsport mit viel höherer Leistungsdichte (KERS). Sonderform: Schwungmassenspeicher (Porsche 911 GT3 R Hybrid).' },
        ],
        quiz: [
          { id: 'qz_rst11_1', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Welche Zuordnung Entwicklungsziel → Ausprägung ist korrekt?', options: ['Design: Rennen wichtig, Serie unwichtig generell', 'Lebensdauer: Serie 1–3 Jahre, Rennen 10–15 Jahre', 'Wartung: Serie sehr häufig, Rennen selten meist', 'Komfort: Serie hoch, Rennen niedrig im Regelfall'], correct: 3, explanation: 'Serie: Komfort hoch, Design wichtig, Lebensdauer 10–15 J., Wartung selten. Rennen: Komfort niedrig, FFF, 1–3 J., Wartung vor/nach jedem Rennen.' },
          { id: 'qz_rst11_2', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Der Kammsche Kreis beschreibt…', options: ['den Wendekreis des Fahrzeugs bei vollem Lenkeinschlag', 'die Grenze der Reifenkraft: √(Fx²+Fy²) ≤ μ·Fz generell', 'den Verlauf der Ideallinie durch eine Kurve generell', 'die Radlastverteilung des Fahrzeugs im Stand generell'], correct: 1, explanation: 'Längs- und Querkraft teilen sich das Kraftpotenzial des Reifens — die Resultierende darf μ·Fz nicht überschreiten.' },
          { id: 'qz_rst11_3', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Warum untersteuert ein Fahrzeug beim Einlenken auf der Bremse in eine enge Kurve?', options: ['Weil die Hinterachse beim Einlenken blockiert im Normalbetrieb', 'Bremskraft schöpft die Vorderreifen aus, kaum Querkraft übrig', 'Weil der aerodynamische Abtrieb dort zu hoch ist im Regelfall', 'Weil die Lenkübersetzung viel zu direkt ausgelegt ist generell'], correct: 1, explanation: 'Kombinierte Längs+Querkraft ist begrenzt; in langsamen Kurven ohne Abtrieb ist das VA-Potenzial schnell erschöpft → die Front schiebt.' },
          { id: 'qz_rst11_4', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Steil quadratisch mit der Geschwindigkeit steigende Achslasten und Querbeschleunigungen gehören zu welchem Fahrzeug?', options: ['Serienfahrzeug', 'Tourenwagen', 'Sportprototyp (LMP)', 'Rallye-Fahrzeug'], correct: 2, explanation: 'Der LMP hat die meisten Aero-Anbauteile → Abtrieb ∝ v² erhöht Achslast und mögliche Querbeschleunigung am stärksten.' },
          { id: 'qz_rst11_5', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Bei Untersteuern in langsamen Kurven UND Übersteuern in schnellen Kurven passt man an…', options: ['Man ändert einzig den Reifendruck rundum im Regelfall', 'Vorne mechanisch weicher UND Aerobalance nach hinten', 'Man verstellt ausschließlich den Heckflügel generell', 'Man verschiebt die Bremsbalance nach vorn generell'], correct: 1, explanation: 'Mechanischer Grip dominiert langsame, Aero-Grip schnelle Kurven — beide Bereiche lassen sich getrennt abstimmen (WS18-Aufgabe).' },
          { id: 'qz_rst11_6', category: 'RST 11 — Renn- vs. Straßenfahrzeug', question: 'Warum darf die Zugkraft beim Schalten nicht schlagartig wieder einsetzen?', options: ['Wegen des dadurch steigenden Kraftstoffverbrauchs im Regelfall', 'An der Haftgrenze würde ein Kraftsprung die Reifen überfordern', 'Wegen der lauten Getriebegeräusche beim Lastwechsel generell', 'Nur um die Kupplung im Rennen zu schonen bei üblicher Auslegung'], correct: 1, explanation: 'Anders als im Serienbetrieb fährt das Rennfahrzeug permanent an der Haftgrenze; deshalb sequentielle Getriebe mit sanftem Momentenübergang.' },

  <script>
/**
 * SM-2 Spaced Repetition Algorithm
 * Based on SuperMemo SM-2 by Piotr Wozniak (1987)
 *
 * Rating scale:
 *   0 = complete blackout / again
 *   1 = incorrect, but correct answer easy to recall
 *   2 = hard — correct with serious difficulty
 *   3 = good — correct with some hesitation
 *   4 = easy — correct after brief hesitation
 *   5 = perfect — immediate correct response
 */

const SM2 = (() => {

  const STORAGE_KEY = 'cogsys_sm2_v2';

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch { return {}; }
  }

  function save(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }

  /**
   * Returns a card state object, creating a fresh one if not found.
   * cardId: unique string identifier for the card
   */
  function getCard(cardId) {
    const data = load();
    if (!data[cardId]) {
      data[cardId] = {
        id: cardId,
        interval: 1,       // days until next review
        repetition: 0,     // number of times reviewed successfully
        ef: 2.5,           // easiness factor
        nextReview: 0,     // timestamp ms — 0 = new, due now
        lastReview: null,
        totalReviews: 0,
        correctStreak: 0,
      };
      save(data);
    }
    return data[cardId];
  }

  /**
   * Apply a rating (0-5) to a card and return the updated card.
   */
  function review(cardId, rating) {
    const data = load();
    let card = data[cardId] || getCard(cardId);

    const now = Date.now();
    card.lastReview = now;
    card.totalReviews += 1;

    if (rating < 3) {
      // Failed — reset repetition, keep ef, short interval
      card.repetition = 0;
      card.interval = 1;
      card.correctStreak = 0;
    } else {
      // Passed
      card.correctStreak += 1;
      if (card.repetition === 0) {
        card.interval = 1;
      } else if (card.repetition === 1) {
        card.interval = 6;
      } else {
        card.interval = Math.round(card.interval * card.ef);
      }
      card.repetition += 1;

      // Update EF: EF' = EF + (0.1 - (5-q) * (0.08 + (5-q) * 0.02))
      const q = rating;
      card.ef = card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
      if (card.ef < 1.3) card.ef = 1.3;
    }

    // Cap interval at 365 days
    card.interval = Math.min(card.interval, 365);

    // Schedule next review
    card.nextReview = now + card.interval * 24 * 60 * 60 * 1000;

    data[cardId] = card;
    save(data);
    return card;
  }

  /**
   * Returns true if card is due now (or new).
   */
  function isDue(cardId) {
    const card = getCard(cardId);
    return Date.now() >= card.nextReview;
  }

  /**
   * Format next review interval nicely.
   */
  function formatInterval(cardId) {
    const card = getCard(cardId);
    if (!card.lastReview) return 'Neu';
    const days = card.interval;
    if (days < 1) return 'Heute';
    if (days === 1) return '1 Tag';
    if (days < 7) return `${days} Tage`;
    if (days < 30) return `${Math.round(days/7)} Wo.`;
    return `${Math.round(days/30)} Mon.`;
  }

  /**
   * Get all due cards from a list of card IDs.
   */
  function getDueCards(cardIds) {
    return cardIds.filter(id => isDue(id));
  }

  /**
   * Get stats for a set of card IDs.
   */
  function getStats(cardIds) {
    const data = load();
    let newCards = 0, due = 0, learned = 0, totalReviews = 0;
    const now = Date.now();

    cardIds.forEach(id => {
      const card = data[id];
      if (!card || card.totalReviews === 0) {
        newCards++;
      } else if (now >= card.nextReview) {
        due++;
      } else {
        learned++;
      }
      if (card) totalReviews += card.totalReviews || 0;
    });

    return { newCards, due, learned, totalReviews, total: cardIds.length };
  }

  /**
   * Sort card IDs: due first (sorted by most overdue), then new.
   */
  function sortForStudy(cardIds) {
    const data = load();
    const now = Date.now();

    return [...cardIds].sort((a, b) => {
      const ca = data[a];
      const cb = data[b];
      const aNew = !ca || ca.totalReviews === 0;
      const bNew = !cb || cb.totalReviews === 0;

      if (aNew && bNew) return 0;
      if (aNew) return 1;   // new cards after due
      if (bNew) return -1;

      const aDue = now - ca.nextReview;
      const bDue = now - cb.nextReview;
      return bDue - aDue; // most overdue first
    });
  }

  /**
   * Reset all SM2 data (for debugging).
   */
  function resetAll() {
    localStorage.removeItem(STORAGE_KEY);
  }

  /**
   * Get overall progress across all known cards.
   */
  function getAllStats() {
    const data = load();
    const allIds = Object.keys(data);
    return getStats(allIds);
  }

  return { getCard, review, isDue, formatInterval, getDueCards, getStats, sortForStudy, resetAll, getAllStats };
})();

  <script>
/**
 * Quiz SRS — Leitner-style adaptive weighting for multiple-choice quiz mode
 * Wrong / new questions come back around far more often than mastered ones,
 * mirroring the SM-2 flashcard behaviour but tuned for MC quizzes.
 *
 * box 0 = new or just missed → always included, shown first
 * box 1 = correct once        → always included
 * box 2 = correct 2x in a row → included ~75% of the time
 * box 3 = correct 3x in a row → included ~50% of the time
 * box 4 = mastered (4x+)      → included ~30% of the time (light retention check)
 */
const QuizSRS = (() => {
  const KEY = 'quiz_srs_v1';
  const INCLUDE_PROB = [1, 1, 0.75, 0.5, 0.3];

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
  }
  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {}
  }

  function getEntry(id) {
    const d = load();
    return d[id] || { box: 0, seen: 0, correct: 0, wrong: 0, streak: 0, lastSeen: null };
  }

  function record(id, correct) {
    const d = load();
    const e = d[id] || { box: 0, seen: 0, correct: 0, wrong: 0, streak: 0, lastSeen: null };
    e.seen += 1;
    e.lastSeen = Date.now();
    if (correct) {
      e.correct += 1;
      e.streak += 1;
      e.box = Math.min(e.box + 1, 4);
    } else {
      e.wrong += 1;
      e.streak = 0;
      e.box = 0;
    }
    d[id] = e;
    save(d);
    return e;
  }

  /** Build an adaptively-ordered question list: weak items first, mastered items thinned out. */
  function buildSession(ids) {
    const d = load();
    const weak = [];
    const rest = [];
    ids.forEach(id => {
      const e = d[id];
      const box = e ? e.box : 0;
      if (!e || e.seen === 0 || box === 0) { weak.push(id); return; }
      const prob = INCLUDE_PROB[Math.min(box, INCLUDE_PROB.length - 1)];
      if (Math.random() < prob) rest.push(id);
    });
    if (weak.length === 0 && rest.length === 0) rest.push(...ids);
    return [...shuffleArray(weak), ...shuffleArray(rest)];
  }

  function getStats(ids) {
    const d = load();
    let mastered = 0, learning = 0, wrong = 0, unseen = 0;
    ids.forEach(id => {
      const e = d[id];
      if (!e || e.seen === 0) unseen++;
      else if (e.box >= 3) mastered++;
      else if (e.box === 0) wrong++;
      else learning++;
    });
    return { mastered, learning, wrong, unseen, total: ids.length };
  }

  function resetAll() { localStorage.removeItem(KEY); }

  return { getEntry, record, buildSession, getStats, resetAll };
})();

/**
 * Game — XP, Levels & Titles
 * Turns studying into a light RPG progression system.
 */
const Game = (() => {
  const KEY = 'game_xp_v1';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{"xp":0}'); } catch { return { xp: 0 }; }
  }
  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {}
  }

  function getXP() { return load().xp || 0; }

  function addXP(n) {
    const d = load();
    d.xp = (d.xp || 0) + n;
    save(d);
    return d.xp;
  }

  function levelXPFloor(level) { return (level - 1) * (level - 1) * 40; }

  function levelForXP(xp) {
    let level = 1;
    while (xp >= levelXPFloor(level + 1)) level++;
    return level;
  }

  const TITLES = [
    'Novize', 'Lernling', 'Grübler', 'Wissenshungrig', 'Konzept-Jäger',
    'Fleißige Biene', 'Klausur-Kadett', 'Prüfungs-Stratege', 'Fusions-Adept',
    'Reaktor-Ingenieur', 'Klausur-Meister', 'Quiz-Champion', 'Wissens-Titan', 'Legende',
  ];
  function titleForLevel(level) { return TITLES[Math.min(level - 1, TITLES.length - 1)]; }

  function getLevelInfo() {
    const xp = getXP();
    const level = levelForXP(xp);
    const curFloor = levelXPFloor(level);
    const nextFloor = levelXPFloor(level + 1);
    const pct = Math.round(((xp - curFloor) / Math.max(nextFloor - curFloor, 1)) * 100);
    return { xp, level, title: titleForLevel(level), curFloor, nextFloor, pct: Math.max(0, Math.min(100, pct)) };
  }

  function resetAll() { localStorage.removeItem(KEY); }

  const COMBO_KEY = 'game_best_combo_v1';
  function getBestCombo() {
    try { return parseInt(localStorage.getItem(COMBO_KEY) || '0'); } catch { return 0; }
  }
  function reportCombo(n) {
    if (n > getBestCombo()) { try { localStorage.setItem(COMBO_KEY, String(n)); } catch {} }
  }

  return { addXP, getXP, getLevelInfo, resetAll, getBestCombo, reportCombo };
})();

/**

 * Handles: navigation, all 4 study modes, SM-2 integration, progress tracking

  sessionCorrect: 0,
  cardFlipped: false,
  combo: 0,
  bestCombo: 0,
  examMode: false,

// ── Storage helpers ──────────────────────────────────────────────────────────
const Store = {
  KEY: 'cogsys_progress_v2',
  STREAK_KEY: 'cogsys_streak_v2',
  BASICS_LANG_KEY: 'cogsys_basics_lang',

  getBasicsLang() {
    try { return localStorage.getItem(this.BASICS_LANG_KEY) || 'de'; } catch { return 'de'; }
  },
  setBasicsLang(lang) {
    try { localStorage.setItem(this.BASICS_LANG_KEY, lang); } catch {}
  },

  load() {
    try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch { return {}; }
  },
  save(data) {
    try { localStorage.setItem(this.KEY, JSON.stringify(data)); } catch {}
  },
  markResult(itemId, correct) {
    const d = this.load();
    if (!d[itemId]) d[itemId] = { seen: 0, correct: 0, lastSeen: null };
    d[itemId].seen += 1;
    if (correct) d[itemId].correct += 1;
    d[itemId].lastSeen = Date.now();
    this.save(d);
  },
  getAccuracy(itemId) {
    const d = this.load();
    const s = d[itemId];
    if (!s || s.seen === 0) return null;
    return Math.round((s.correct / s.seen) * 100);
  },
  getTopicProgress(topicId) {
    const topic = DATA.getTopic(topicId);
    if (!topic) return 0;
    const allIds = [
      ...(topic.flashcards||[]).map(c=>c.id),
      ...(topic.quiz||[]).map(c=>c.id),
      ...(topic.fillblank||[]).map(c=>c.id),
      ...(topic.open||[]).map(c=>c.id),
    ];
    if (allIds.length === 0) return 0;
    const d = this.load();
    const seen = allIds.filter(id => d[id] && d[id].seen > 0).length;
    return Math.round((seen / allIds.length) * 100);
  },
  updateStreak() {
    try {
      const today = new Date().toDateString();
      let s = JSON.parse(localStorage.getItem(this.STREAK_KEY) || '{"dates":[],"last":null}');
      if (s.last !== today) {
        s.dates.push(today);
        if (s.dates.length > 30) s.dates = s.dates.slice(-30);
        s.last = today;
        localStorage.setItem(this.STREAK_KEY, JSON.stringify(s));
      }
    } catch {}
  },
  getStreak() {
    try {
      return JSON.parse(localStorage.getItem(this.STREAK_KEY) || '{"dates":[],"last":null}');
    } catch { return { dates: [], last: null }; }
  }
};

// ── Cross-module helpers ─────────────────────────────────────────────────────

function getTopicItemIds(topic, type) {
  if (type) return (topic[type === 'flashcard' ? 'flashcards' : type] || []).map(c => c.id);
  return [
    ...(topic.flashcards || []).map(c => c.id),
    ...(topic.quiz || []).map(c => c.id),
    ...(topic.fillblank || []).map(c => c.id),
    ...(topic.open || []).map(c => c.id),
  ];
}

function getModuleItemIds(module, type) {
  return (module.topics || []).flatMap(t => getTopicItemIds(t, type));
}

function moduleHasMode(module, type) {
  return (module.topics || []).some(t => (getTopicItemIds(t, type)).length > 0);
}

function getModuleQuizStats(module) {
  return QuizSRS.getStats(getModuleItemIds(module, 'quiz'));
}

function getModuleProgressPct(module) {
  const allIds = getModuleItemIds(module);
  if (allIds.length === 0) return 0;
  const d = Store.load();
  const seen = allIds.filter(id => d[id] && d[id].seen > 0).length;
  return Math.round((seen / allIds.length) * 100);

function showXPToast(text) {
  const el = document.createElement('div');
  el.className = 'xp-toast';
  el.textContent = text;
  document.body.appendChild(el);

function renderRing(pct, color, sizeClass, centerHtml) {
  const deg = Math.max(0, Math.min(100, pct)) * 3.6;
  return `
    <div class="ring ${sizeClass || ''}" style="background:conic-gradient(${color} ${deg}deg, rgba(255,255,255,0.07) ${deg}deg);">
      <div class="ring-center">${centerHtml}</div>
    </div>
  `;
}

/** Multi-segment donut, e.g. [{value, color}, ...] for mastered/learning/wrong/unseen breakdowns. */
function renderMultiRing(segments, sizeClass, centerHtml) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let acc = 0;
  const stops = segments.map(seg => {
    const start = (acc / total) * 360;
    acc += seg.value;
    const end = (acc / total) * 360;
    return `${seg.color} ${start}deg ${end}deg`;
  }).join(', ');
  return `
    <div class="ring ${sizeClass || ''}" style="background:conic-gradient(${stops});">
      <div class="ring-center">${centerHtml}</div>
    </div>
  `;
}

// ── Neuron Net Canvas ────────────────────────────────────────────────────────
function drawNeuronNet() {
  const canvas = document.getElementById('neuronNet');
  if (!canvas || canvas.tagName !== 'CANVAS') {
    // Replace div with canvas
    const c = document.createElement('canvas');
    c.id = 'neuronNet';
    c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
    canvas.replaceWith(c);
    animateNeuronNet(c);
  }
}

function animateNeuronNet(canvas) {
  const ctx = canvas.getContext('2d');
  let nodes = [];
  let w, h;

  function resize() {
    w = canvas.width  = canvas.offsetWidth  || window.innerWidth;
    h = canvas.height = canvas.offsetHeight || window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); initNodes(); });

  function initNodes() {
    const count = Math.floor((w * h) / 18000);
    nodes = Array.from({length: Math.min(count, 40)}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: 2 + Math.random() * 2,
      pulse: Math.random() * Math.PI * 2,
    }));
  }
  initNodes();

  let raf;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    const t = Date.now() / 1000;

    nodes.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
      n.pulse += 0.02;
    });

    // Draw edges
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(10,132,255,${0.15 * (1 - dist/150)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    // Draw nodes
    nodes.forEach(n => {
      const pulse = 0.5 + 0.5 * Math.sin(n.pulse);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100,210,255,${0.3 + 0.4 * pulse})`;
      ctx.fill();
    });

    raf = requestAnimationFrame(draw);
  }
  draw();

  // Pause when off-screen
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else draw();
  });
}

// ── Basics Section (module reference sheet) ─────────────────────────────────
/**
 * Renders the module-level `basics` array: grouped term/one-sentence pairs meant
 * for looking things up, not for drilling. Pure reference — no SRS, no progress.
 */
const BASICS_COPY = {
  de: {
    title: '📌 Basics &amp; Bauteile',
    sub: n => `${n} Begriffe, je ein Satz — zum Nachschlagen und Wiederholen vor dem Quiz.`,
    placeholder: 'Suchen… z.B. Divertor, Lawson, Quench',
    empty: 'Kein Begriff gefunden.',
  },
  en: {
    title: '📌 Basics &amp; Key Components',
    sub: n => `${n} terms, one sentence each — for reference and review, in exam English.`,
    placeholder: 'Search… e.g. divertor, Lawson, quench',
    empty: 'No matching term found.',
  },
};

function renderBasicsList(el, module) {
  const groups = module.basics || [];
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  const lang = Store.getBasicsLang();
  const copy = BASICS_COPY[lang];
  const prevQuery = el.querySelector('#basicsSearch') ? el.querySelector('#basicsSearch').value : '';

  const groupTitle = g => (lang === 'en' ? (g.groupEn || g.group) : g.group);
  const itemTerm = it => (lang === 'en' ? (it.termEn || it.term) : it.term);
  const itemText = it => (lang === 'en' ? (it.textEn || it.text) : it.text);

  const groupsHtml = groups.map((g, gi) => `
    <div class="basics-group" data-group="${gi}">
      <div class="basics-group-head">
        <span class="bgh-icon">${g.icon || '•'}</span>
        <span class="bgh-title">${esc(groupTitle(g))}</span>
        <span class="bgh-count">${g.items.length}</span>
      </div>
      ${g.items.map(it => `
        <div class="basics-item" data-search="${esc((it.term + ' ' + it.text + ' ' + (it.termEn||'') + ' ' + (it.textEn||'')).toLowerCase())}">
          <div class="bi-term">${esc(itemTerm(it))}</div>
          <div class="bi-text">${esc(itemText(it))}</div>
        </div>
      `).join('')}
    </div>
  `).join('');

  el.innerHTML = `
    <div class="basics-intro">
      <div class="basics-intro-top">
        <div class="basics-intro-copy">
          <div class="basics-intro-title">${copy.title}</div>
          <div class="basics-intro-sub">${copy.sub(total)}</div>
        </div>
        <div class="basics-lang-toggle" role="group" aria-label="Language">
          <button type="button" class="blt-btn ${lang === 'de' ? 'active' : ''}" data-lang="de">DE</button>
          <button type="button" class="blt-btn ${lang === 'en' ? 'active' : ''}" data-lang="en">EN</button>
        </div>
      </div>
      <input type="search" class="basics-search" id="basicsSearch" placeholder="${esc(copy.placeholder)}" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="basics-empty hidden" id="basicsEmpty">${esc(copy.empty)}</div>
    </div>
    ${groupsHtml}
  `;

  el.querySelectorAll('.blt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.lang === Store.getBasicsLang()) return;
      Store.setBasicsLang(btn.dataset.lang);
      renderBasicsList(el, module);
    });
  });

  const input = el.querySelector('#basicsSearch');
  const empty = el.querySelector('#basicsEmpty');
  function applyFilter() {
    const q = input.value.trim().toLowerCase();
    let hits = 0;
    el.querySelectorAll('.basics-item').forEach(item => {
      const hit = !q || item.dataset.search.indexOf(q) !== -1;
      item.classList.toggle('hidden', !hit);
      if (hit) hits++;
    });
    el.querySelectorAll('.basics-group').forEach(g => {
      const shown = g.querySelectorAll('.basics-item:not(.hidden)').length;
      g.classList.toggle('hidden', shown === 0);
      g.querySelector('.bgh-count').textContent = shown;
    });
    empty.classList.toggle('hidden', hits > 0);
  }
  input.addEventListener('input', applyFilter);
  if (prevQuery) { input.value = prevQuery; applyFilter(); }
}

/** Minimal HTML escaping — basics text is authored data, but keep it safe anyway. */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ── Topic List Screen ────────────────────────────────────────────────────────
function renderTopicList() {
  const el = document.getElementById('topicList');
  const module = State.activeModule || MODULES[0];

  if (State.activeMode === 'basics') { renderBasicsList(el, module); return; }

  const topics = module.topics;
  const mode = State.activeMode;

  el.innerHTML = topics.map(t => {
    const prog = Store.getTopicProgress(t.id);
    const count = getTopicItemIds(t, mode).length;
    let dueText = '';
    if (mode === 'flashcard') {
      const due = SM2.getDueCards(getTopicItemIds(t, 'flashcard')).length;
      if (due > 0) dueText = `<div class="ti-due">⚡ ${due} Karte${due > 1 ? 'n' : ''} fällig</div>`;
    } else if (mode === 'quiz') {
      const stats = QuizSRS.getStats(getTopicItemIds(t, 'quiz'));
      if (stats.wrong > 0) dueText = `<div class="ti-due">⚡ ${stats.wrong} zum Wiederholen</div>`;
    }
    const deckLink = t.slideDeck ? `<a href="${encodeURI(t.slideDeck)}" target="_blank" rel="noopener" class="ti-deck-link" onclick="event.stopPropagation()">📄 Folien öffnen</a>` : '';
    return `
      <div class="topic-item ${count === 0 ? 'topic-item-empty' : ''}" data-topic="${t.id}">
        <div class="ti-icon">${t.icon}</div>
        <div class="ti-body">
          <div class="ti-name">${t.name}</div>
          <div class="ti-meta">${count} ${MODE_LABELS[mode] || ''} · ~${t.examWeight}% der Klausur</div>
          ${dueText}
          <div class="ti-mini-bar"><div class="ti-mini-fill" style="width:${prog}%"></div></div>
          ${deckLink}
        </div>
        <div class="ti-arrow">›</div>
      </div>
    `;
  }).join('');

  const simQuizIds = getModuleItemIds(module, 'quiz');
  if (simQuizIds.length >= 10) {
    const nQ = Math.min(EXAM_QUESTION_COUNT, simQuizIds.length);
    el.insertAdjacentHTML('afterbegin', `
      <div class="exam-sim-card" id="examSimCard" style="margin:0 0 4px;">
        <div class="esc-icon">🎓</div>
        <div style="flex:1;min-width:0;">
          <div class="esc-name">Klausur-Simulation</div>
          <div class="esc-sub">${nQ} zufällige Fragen aus allen Themen · ${Math.round(nQ * EXAM_SECONDS_PER_Q / 60)} min Countdown · mit Note</div>
        </div>
        <div class="ti-arrow">›</div>
      </div>
    `);
    el.querySelector('#examSimCard').addEventListener('click', () => startExamSession(module));
  }

  el.querySelectorAll('.topic-item').forEach(item => {
    item.addEventListener('click', () => {
      const topic = DATA.getTopic(item.dataset.topic);
      if (!topic) return;
      if (getTopicItemIds(topic, State.activeMode).length === 0) return;
      State.activeTopic = topic;
      startStudySession();
    });
  });
}

// ── Mode Pills (dynamic per module) ─────────────────────────────────────────
function renderModePills() {
  const el = document.getElementById('modePills');
  const module = State.activeModule || MODULES[0];
  const available = MODE_TYPES.filter(t => moduleHasMode(module, t));
  // The reference sheet lives on the module, not on the topics — append it manually.
  if ((module.basics || []).length > 0) available.push('basics');

  if (!available.includes(State.activeMode)) {
    State.activeMode = available[0] || 'quiz';
  }

  el.innerHTML = available.map(t =>
    `<button class="pill ${t === State.activeMode ? 'active' : ''}" data-mode="${t}">${MODE_LABELS[t]}</button>`
  ).join('');

  el.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      el.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      State.activeMode = pill.dataset.mode;
      renderTopicList();
    });
  });
}

// ── Start Study Session ──────────────────────────────────────────────────────
function startStudySession() {
  const topic = State.activeTopic;
  if (!topic) return;
  State.examMode = false;
  stopExamTimer();

  const mode = State.activeMode;
  let items = [];

  if (mode === 'guided') {
    items = topic.guided || [];
  } else if (mode === 'flashcard') {
    const ids = SM2.sortForStudy((topic.flashcards||[]).map(c=>c.id));
    items = ids.map(id => DATA.getItem(id)).filter(Boolean);
    if (items.length === 0) items = topic.flashcards || [];
  } else if (mode === 'quiz') {
    const quizItems = topic.quiz || [];
    const ids = QuizSRS.buildSession(quizItems.map(c => c.id));
    items = ids.map(id => DATA.getItem(id)).filter(Boolean);
    if (items.length === 0) items = shuffleArray([...quizItems]);
  } else if (mode === 'fillblank') {
    items = shuffleArray([...(topic.fillblank||[])]);
  } else if (mode === 'open') {
    items = topic.open || [];
  }

  if (items.length === 0) {
    alert('Für diesen Modus gibt es hier noch keine Inhalte — probiere einen anderen Modus!');
    return;
  }

  State.sessionItems = items;
  State.sessionIndex = 0;
  State.sessionCorrect = 0;
  State.cardFlipped = false;
  State.combo = 0;
  State.bestCombo = 0;

  Store.updateStreak();
  showScreen('study');
  renderStudyItem();
}

function updateStudyProgress() {
  const total = State.sessionItems.length;
  const current = State.sessionIndex;
  const pct = total > 0 ? (current / total) * 100 : 0;
  document.getElementById('studyProgressBar').style.width = pct + '%';
  document.getElementById('studyProgressLabel').textContent = `${current}/${total}`;
}

function renderStudyItem() {
  const mode = State.activeMode;
  updateStudyProgress();

  // Hide all mode containers
  document.querySelectorAll('.mode-container').forEach(c => c.classList.add('hidden'));

  if (State.sessionIndex >= State.sessionItems.length) {
    showSessionComplete();
    return;
  }

  const item = State.sessionItems[State.sessionIndex];

  if (mode === 'guided')    renderGuided(item);
  if (mode === 'flashcard') renderFlashcard(item);
  if (mode === 'quiz')      renderQuiz(item);
  if (mode === 'fillblank') renderFillBlank(item);
  if (mode === 'open')      renderOpenQuestion(item);
}

// ── Guided Mode ──────────────────────────────────────────────────────────────
function renderGuided(item) {
  const el = document.getElementById('mode-guided');
  el.classList.remove('hidden');

  document.getElementById('guidedBadge').textContent = item.badge || '';
  document.getElementById('guidedTitle').textContent = item.title || '';

document.getElementById('guidedNext').addEventListener('click', () => {
  State.sessionIndex++;

});
document.getElementById('guidedPrev').addEventListener('click', () => {

});

// ── Flashcard Mode ───────────────────────────────────────────────────────────
function renderFlashcard(item) {
  const el = document.getElementById('mode-flashcard');
  el.classList.remove('hidden');

  State.cardFlipped = false;
  const card = document.getElementById('flipCard');
  card.classList.remove('flipped');

  document.getElementById('fcFront').innerHTML = formatCardText(item.front);
  document.getElementById('fcBack').innerHTML  = formatCardText(item.back);

  const sm2 = SM2.getCard(item.id);
  document.getElementById('fcStats').textContent =
    `Wiederholungen: ${sm2.totalReviews} · Intervall: ${SM2.formatInterval(item.id)} · EF: ${sm2.ef.toFixed(2)}`;

  // Hide rating buttons until flipped
  document.getElementById('sm2Row').style.opacity = '0.3';
  document.getElementById('sm2Row').style.pointerEvents = 'none';
