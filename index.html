      {
        id: 'p6',
        name: 'Reinforcement Learning',
        icon: '🎮',
        color: '#ff453a',
        examWeight: 24,

        guided: [
          { id: 'g_p6_1', badge: 'Foundations', title: 'MDP & the Agent-Environment Interaction Loop', body: 'Humans/animals learn from interaction with the environment without examples; the learning is goal-directed (e.g. a new-born gazelle learns to run within 30 minutes). RL is one of three ML paradigms:\n• Supervised: learn a mapping input→output from explicit teacher instructions.\n• Unsupervised: learn statistical regularities in the input data.\n• Reinforcement: learn which action to choose in order to maximize an external reward signal through interaction with the environment.\n\nA Markov Process ⟨S, P⟩ is a sequence of states where the Markov property holds: the next state depends ONLY on the current state, not on the full history.\n\nA Markov Decision Process (MDP) ⟨S, A, P, R, γ⟩ extends this: actions steer states (and rewards). S = finite set of states, A = finite set of actions, P = state transition probability matrix, R = reward function, γ = discount factor.', example: '🔑 Markov property = memoryless: P[S_{t+1}|S_t] = P[S_{t+1}|S_1,…,S_t]. Cart-Pole is the lecture\'s MDP example: states = position/angle, actions = ±1 force, reward = +1/step, terminal = pole falls or cart leaves the track.' },
          { id: 'g_p6_2', badge: 'Core Concepts', title: 'Reward Hypothesis, Return, Policy & Value Functions', body: 'Reward Hypothesis: all goals/purposes can be thought of as maximizing the expected value of the cumulative sum of a received scalar reward signal.\n\nReturn G_t (simplest form): sum of all future rewards. For continuing (non-episodic) tasks this sum can be infinite — solved by discounting:\nG_t = R_{t+1} + γR_{t+2} + γ²R_{t+3} + …\nAs γ→0 the agent becomes shortsighted (only immediate reward matters); as γ→1 it becomes farsighted.\n\nPolicy: deterministic a=π(s) (e.g. Greedy) or stochastic π(a|s) = P[A_t=a | S_t=s] (e.g. ε-greedy) — a strategy mapping states to actions/action-probabilities.\n\nState-value function: v_π(s) = E_π[G_t | S_t=s]\nAction-value function: q_π(s,a) = E_π[G_t | S_t=s, A_t=a]', example: '🔑 Know BOTH value-function formulas cold, AND the discounting argument: why the plain sum of future rewards is undefined for continuing tasks, and how γ trades off short- vs farsightedness — both have appeared as full exam questions.' },
          { id: 'g_p6_3', badge: 'Bellman Eq.', title: 'Bellman Equations & Optimality', body: 'An important property of value functions is the recursive relationship between consecutive states. Bellman equation for v_π (holds for all s ∈ S, independent of policy/state):\nv_π(s) = Σ_a π(a|s) Σ_{s\',r} p(s\',r|s,a)[r + γv_π(s\')]\n\nBellman equation for q_π:\nq_π(s,a) = Σ_{s\',r} p(s\',r|s,a)[r + γ Σ_{a\'} π(a\'|s\')q_π(s\',a\')]\n\nBellman OPTIMALITY equations replace the policy-weighted sum Σ_a π(a|s)(…) with a max_a(…):\nv*(s) = max_a Σ_{s\',r} p(s\',r|s,a)[r + γv*(s\')]\nq*(s,a) = Σ_{s\',r} p(s\',r|s,a)[r + γ max_{a\'} q*(s\',a\')]\n\nA "backup diagram" visualizes which states/actions are looked ahead to compute an update. Algorithms that solve the optimality equations: Value Iteration (DP), Q-Learning (TD).', example: '🔑 Exam: draw/derive the backup diagram for q_π given v_π, and name ONE algorithm that solves the Bellman optimality equation (DP→Value Iteration, TD→Q-Learning — naming just "DP" or "TD" is also accepted).' },
          { id: 'g_p6_4', badge: 'GPI', title: 'Generalized Policy Iteration & the Conditioning Link', body: 'A value function depends on the policy; the policy depends on the value function — so we iteratively alternate:\n1. Policy Evaluation = PREDICTION: find v_π for the current policy π.\n2. Policy Improvement: update π greedily based on v_π. Evaluation + Improvement together = CONTROL.\n\nDirect link the lecture draws to learning psychology: Prediction ↔ CLASSICAL conditioning. Control ↔ OPERANT/instrumental conditioning — and under operant conditioning a policy itself can be interpreted as the stimulus-response relationship.\n\nExploration problem: a non-exploratory (always-greedy) policy may converge to a sub-optimal solution, since not all state-action pairs are guaranteed to be visited. ε-greedy fixes this by keeping a non-zero probability for every action:\nπ(a*|s) = 1 − ε + ε/|A|  (the greedy/optimal action)\nπ(a≠a*|s) = ε/|A|  (every other action)', example: '🔑 Exam fill-in-the-blank: "___ conditioning is the corresponding learning process for prediction, while ___ conditioning is the corresponding learning process for control." → Classical / Operant. Also: ε-greedy is STOCHASTIC, Greedy is DETERMINISTIC.' },
          { id: 'g_p6_5', badge: 'Dynamic Programming', title: 'DP: Policy Evaluation, Policy & Value Iteration', body: 'Dynamic Programming assumes the MDP (S, A, P, R) is fully KNOWN.\n\nDP Prediction (Policy Evaluation): iteratively sweep over all states, updating v(s) with the Bellman equation for the current π. Propagating values between consecutive states by exploiting this recursive Bellman relationship is called BOOTSTRAPPING (no environment interaction needed — it only requires the known model).\n\nDP Control — improve the policy by greedily acting on v. Two ways to combine evaluation + improvement (both = GPI):\n• Policy Iteration: an EXHAUSTIVE evaluation sweep (repeat until v converges), then a greedy improvement step — repeat until the policy is stable.\n• Value Iteration: a single combined evaluation+improvement update per sweep (no exhaustive evaluation); converges to v*, and the greedy policy is extracted only at the end.', example: '🔑 Policy Iteration = full evaluation each round, then improve. Value Iteration = one combined update per round. Both require a known model — that\'s what makes them "Dynamic Programming" and not Monte Carlo / TD.' },
          { id: 'g_p6_6', badge: 'Monte Carlo', title: 'Monte Carlo: Prediction & Control', body: 'In practice the MDP is usually UNKNOWN. Monte Carlo (MC) methods don\'t require knowledge of the MDP — they learn from sampled, complete state trajectories.\n\nMC Prediction: the return is computed for all states visited in a sampled trajectory; the value function is the AVERAGE of the experienced returns for each state (first-visit MC: only the first occurrence of a state per episode counts; can be computed incrementally).\n\nMC Control: without a model, state-values alone don\'t determine a policy — MC instead estimates ACTION-values q(s,a), updating value and policy after every sampled episode.\n• Exploring Starts: every state-action pair is guaranteed a non-zero chance of being the episode\'s start (needed because a deterministic π may otherwise never visit some pairs).\n• Without Exploring Starts: use an ε-greedy policy instead to keep exploring all actions.', example: '🔑 MC never bootstraps — it must wait for the full episode to terminate before it can update, unlike DP/TD which update from estimates mid-episode.' },
          { id: 'g_p6_7', badge: 'Algorithms', title: 'Temporal Difference: On-policy vs Off-policy, SARSA vs Q-Learning', body: 'TD is a mixture of DP and MC: it SAMPLES (like MC) AND BOOTSTRAPS (like DP). TD(0) / 1-step TD prediction updates v(s) after every single time step using the Bellman equation with the sampled next reward+state — no need to wait for the episode to end.\n\nTarget policy π(a|s): the policy whose value is being estimated/improved.\nBehavior policy b(a|s): the policy actually used to sample actions from the environment.\nOn-policy: behavior = target (e.g. SARSA). Off-policy: behavior ≠ target (e.g. Q-Learning). Validity condition for off-policy: π(a|s) > 0 wherever b(a|s) > 0 (coverage).\n\nSARSA (on-policy TD control): target = r + γ·Q(s\',a\') — uses the ACTUAL next action taken.\nQ-Learning (off-policy TD control): target = r + γ·max_a Q(s\',a) — uses the MAXIMUM over next actions.\nThe exam shows Python code — you identify which one from how next_action is obtained.', example: '🔑 Code uses next_action (passed in/sampled) → SARSA. Code uses max/argmax over next-state Q-values → Q-Learning. Off-policy\'s advantage: separates the optimal target policy from the exploratory behavior policy, handling exploration better than on-policy (which only learns a near-optimal, still-exploring policy).' },
          { id: 'g_p6_8', badge: 'Comparison', title: 'Cliff Walking, n-step Bootstrapping & DP/MC/TD Comparison', body: 'Cliff Walking example: Q-learning (off-policy) learns values for the OPTIMAL path, but online performance suffers because ε-greedy exploration occasionally drops it over the cliff. SARSA (on-policy) factors its own exploratory action selection into the update, so it learns a longer but SAFER path → SARSA achieves higher online performance than Q-learning here.\n\nn-step Bootstrapping unifies TD and MC: an n-step TD algorithm waits for n samples before bootstrapping.\nn = 1 → (1-step) TD.  n = ∞ (full episode) → Monte Carlo.\n\nKey ideas all three paradigms share: (1) estimate value functions, (2) back up value updates, (3) Generalized Policy Iteration. They differ in DEPTH (steps before backing up: DP=1, TD=1, MC=full episode) and WIDTH (sample vs. full-expectation backups: DP uses the full model expectation, MC and TD sample).', example: '🔑 Bootstrapping ≠ sampling! DP bootstraps but does NOT sample (uses the full expectation over the known model). MC samples but does NOT bootstrap. TD does BOTH — exactly why it\'s "a mixture of DP and MC."' },
          { id: 'g_p6_9', badge: 'Approximate RL', title: 'Approximate RL: Deep Q-Networks', body: 'For large/continuous state spaces, the Q-table is replaced by a function approximator — a neural network (DQN) trained via SGD for semi-gradient Q-evaluation. Input: state S_t (e.g. camera signal, joint angle/speed). Output: one Q-value per possible action — the network generalizes states using a non-linear function approximator (NN).\n\nThis design (state-only input, one Q-value PER ACTION as a vector output) generalizes ONLY on states, not on actions — a SINGLE forward pass at every time step is enough to obtain all action-values and pick max_a Q(s,a). (The alternative, a network taking state+action jointly as input, would instead need |A| separate forward passes per time step.)\n\nThe output layer uses a LINEAR activation function: Q-value estimation is a REGRESSION problem (the target can be any real value), not a classification problem, so linear (not e.g. softmax/sigmoid) output is appropriate.', example: '🔑 Examiners ask these separately: (1) which architecture — state-only input, vector of Q-values output (2) generalizes on states only (3) needs only ONE forward pass per time step to find max_a Q(s,a) (4) WHY linear output — regression, not classification.' },
          { id: 'g_p6_10', badge: 'Conditioning', title: 'Classical vs Operant Conditioning', body: 'Classical and operant conditioning are two basic ASSOCIATIVE learning processes that link sensory stimuli to corresponding actions; both are common across vertebrate animals.\n\nClassical conditioning: a subject learns the relationship between an initially neutral conditioned stimulus (CS) and an unconditioned stimulus (US) that reflexively produces a conditioned response (CR). After the CS and US are repeatedly presented together, the CS alone eventually produces the CR (Pavlov\'s dog).\n\nOperant/instrumental conditioning: a subject learns the relationship between a STIMULUS and its OWN BEHAVIOUR. A stimulus (reinforcer) is presented only in response to a certain action and increases or decreases the probability of that action recurring (reward/punishment).\n\nLink to GPI: Classical conditioning ↔ Prediction (policy evaluation). Operant conditioning ↔ Control (evaluation + improvement); a policy can be interpreted as the operant stimulus-response relationship.', example: '🔑 Classical = stimulus↔stimulus association, passive/reflexive (CS+US→CR). Operant = behaviour↔consequence association, active (reward/punishment shapes future action probability) — exactly the reward signal\'s role in RL.' },
        ],

        flashcards: [
          { id: 'fc_p6_1',  front: 'What are the 5 components of an MDP ⟨S,A,P,R,γ⟩?',                                back: 'S = finite set of states, A = finite set of actions, P = state transition probability matrix, R = reward function, γ = discount factor.' },
          { id: 'fc_p6_2',  front: 'State the Markov property.',                                                    back: 'The probability of the next state depends only on the current state, not on the full history: P[S_{t+1}|S_t] = P[S_{t+1}|S_1,…,S_t].' },
          { id: 'fc_p6_3',  front: 'Briefly define supervised, unsupervised and reinforcement learning.',           back: 'Supervised: learn input→output mapping from explicit teacher instructions.\nUnsupervised: learn statistical regularities in input data.\nReinforcement: learn which action to choose to maximize an external reward via environment interaction.' },
          { id: 'fc_p6_4',  front: 'State the Reward Hypothesis.',                                                  back: 'All goals/purposes can be thought of as the maximization of the expected value of the cumulative sum of a received scalar signal (the reward).' },
          { id: 'fc_p6_5',  front: 'Why is the plain (undiscounted) sum of future rewards problematic for continuing tasks, and how does discounting fix it?', back: 'For continuing tasks T=∞, so the undiscounted return could be infinite. Discounting (γ<1): G_t = R_{t+1}+γR_{t+2}+γ²R_{t+3}+… keeps it finite; γ→0 = shortsighted, γ→1 = farsighted.' },
          { id: 'fc_p6_6',  front: 'Deterministic vs stochastic policy — give the formula and one example of each.',  back: 'Deterministic: a = π(s), e.g. Greedy.\nStochastic: π(a|s) = P[A_t=a | S_t=s], e.g. ε-greedy.' },
          { id: 'fc_p6_7',  front: 'Write the state-value and action-value function formulas.',                    back: 'v_π(s) = E_π[G_t | S_t=s]\nq_π(s,a) = E_π[G_t | S_t=s, A_t=a]' },
          { id: 'fc_p6_8',  front: 'Write the Bellman equation for v_π(s).',                                        back: 'v_π(s) = Σ_a π(a|s) Σ_{s\',r} p(s\',r|s,a)[r + γv_π(s\')]' },
          { id: 'fc_p6_9',  front: 'Write the Bellman optimality equation for v*(s).',                              back: 'v*(s) = max_a Σ_{s\',r} p(s\',r|s,a)[r + γv*(s\')]' },
          { id: 'fc_p6_10', front: 'Name one algorithm that solves the Bellman optimality equation for DP, and one for TD.', back: 'DP → Value Iteration.\nTD → Q-Learning.' },
          { id: 'fc_p6_11', front: 'Describe Generalized Policy Iteration (GPI) and its 2 steps.',                 back: 'Iterative alternation: 1. Policy Evaluation (Prediction): find v_π for current π. 2. Policy Improvement: update π greedily from v_π.' },
          { id: 'fc_p6_12', front: '"___ conditioning is the learning process for prediction, ___ conditioning is the learning process for control." Fill the blanks.', back: 'Classical conditioning ↔ prediction (policy evaluation).\nOperant/instrumental conditioning ↔ control (evaluation + improvement).' },
          { id: 'fc_p6_13', front: 'What is the ε-greedy formula?',                                                 back: 'π(a*|s) = 1 − ε + ε/|A|\nπ(a≠a*|s) = ε/|A|\nProbability of a non-optimal action: ε·(|A|−1)/|A|' },
          { id: 'fc_p6_14', front: 'What does Dynamic Programming require that Monte Carlo and TD do not?',         back: 'A fully known MDP (S, A, P, R) — DP needs the model; MC and TD learn from sampled experience instead.' },
          { id: 'fc_p6_15', front: 'Policy Iteration vs Value Iteration — what\'s the key difference?',             back: 'Policy Iteration: exhaustive evaluation sweep until convergence, then greedy improvement. Value Iteration: a single combined evaluation+improvement update per sweep; greedy policy extracted only after final convergence.' },
          { id: 'fc_p6_16', front: 'What is Monte Carlo prediction?',                                               back: 'The return is computed for all states in a sampled (complete) trajectory; the value function estimate is the average of experienced returns per state.' },
          { id: 'fc_p6_17', front: 'Why are "Exploring Starts" needed in MC control, and what\'s the alternative?', back: 'A deterministic policy may never visit some state-action pairs; Exploring Starts guarantees every pair can start an episode. Alternative: use an ε-greedy policy instead.' },
          { id: 'fc_p6_18', front: 'Why is TD described as "a mixture of DP and MC"?',                              back: 'TD samples experience like MC, but bootstraps (updates from an estimate) like DP — it does both.' },
          { id: 'fc_p6_19', front: 'Define target policy and behavior policy.',                                    back: 'Target policy π(a|s): the policy being estimated/improved. Behavior policy b(a|s): the policy actually used to sample actions from the environment.' },
          { id: 'fc_p6_20', front: 'On-policy vs Off-policy — define, example each.',                               back: 'On-policy: behavior = target policy (e.g. SARSA).\nOff-policy: behavior ≠ target policy (e.g. Q-Learning).' },
          { id: 'fc_p6_21', front: 'Advantage of off-policy learning?',                                             back: 'Separates the optimal target policy from the exploratory behavior policy → handles exploration better. On-policy only learns a near-optimal, still-exploring policy.' },
          { id: 'fc_p6_22', front: 'What is the validity condition for off-policy learning?',                        back: 'π(a|s) > 0 wherever b(a|s) > 0 (coverage condition).' },
          { id: 'fc_p6_23', front: 'SARSA vs Q-Learning — how to identify from code?',                             back: 'SARSA: target = r + γ·Q(s\', next_action) — uses the actual next action → on-policy TD.\nQ-Learning: target = r + γ·max Q(s\', a) — uses max → off-policy TD.' },
          { id: 'fc_p6_24', front: 'In the Cliff Walking example, why does SARSA outperform Q-learning online?', back: 'Q-learning targets the optimal (cliff-edge) path but its ε-greedy exploration occasionally falls off; SARSA factors its own exploration into the update and learns a longer but safer path.' },
          { id: 'fc_p6_25', front: 'What does n-step bootstrapping unify, and for which n values?',                back: 'Unifies TD and MC. n=1 → (1-step) TD. n=∞ (full episode) → Monte Carlo.' },
          { id: 'fc_p6_26', front: 'Which paradigms bootstrap? Which does NOT?',                                    back: 'Dynamic Programming: YES. Temporal Difference: YES. Monte Carlo: NO (must wait for episode completion).' },
          { id: 'fc_p6_27', front: 'Why use a linear output activation in a DQN?',                                  back: 'Q-function estimation is a REGRESSION task (output can be any real value), not classification → linear activation is appropriate.' },
          { id: 'fc_p6_28', front: 'A DQN takes only the state as input and outputs one Q-value per action. What does this generalize on, and how many forward passes are needed to find max_a Q(s,a)?', back: 'Generalizes on states only (not actions). A single forward pass per time step yields all action-values at once.' },
          { id: 'fc_p6_29', front: 'Classical vs operant conditioning — define both.',                              back: 'Classical: a conditioned stimulus (CS), repeatedly paired with an unconditioned stimulus (US), eventually triggers the conditioned reaction (CR) alone. Operant: a stimulus given as a consequence of a behaviour strengthens or weakens that behaviour.' },
          { id: 'fc_p6_30', front: 'In classical conditioning, what are the US, CS and CR?',                       back: 'US = unconditioned stimulus (naturally/reflexively triggers a reaction); CS = conditioned stimulus (initially neutral); CR = conditioned reaction (triggered by the CS alone after pairing).' },
        ],

        quiz: [
          { id: 'qz_p6_1', category: 'P6 — RL', question: 'Which property defines a Markov Process?', options: ['The next state depends on the entire past history', 'The next state depends only on the current state overall', 'The states always transition fully deterministically', 'The rewards received are always strictly positive'], correct: 1, explanation: 'Markov property: P[S_{t+1}|S_t] = P[S_{t+1}|S_1,…,S_t] — the next state depends only on the current state.' },
          { id: 'qz_p6_2', category: 'P6 — RL', question: 'Which of these is NOT one of the 5 MDP components ⟨S,A,P,R,γ⟩?', options: ['State transition probability matrix', 'Reward function', 'Discount factor', 'Loss function'], correct: 3, explanation: 'An MDP is ⟨S,A,P,R,γ⟩: states, actions, transition matrix, reward function, discount factor. No loss function.' },
          { id: 'qz_p6_3', category: 'P6 — RL', question: 'Why is discounting (γ<1) introduced for the return G_t in continuing tasks?', options: ['It speeds up the convergence of the algorithm overall', 'An undiscounted infinite reward sum could diverge', 'It removes the need to define any policy at all', 'It ensures no reward can ever be negative overall'], correct: 1, explanation: 'For continuing tasks T=∞; without discounting, the sum of rewards could diverge to infinity.' },
          { id: 'qz_p6_4', category: 'P6 — RL', question: 'As γ approaches 0, the agent becomes...', options: ['Farsighted', 'Shortsighted', 'Risk-averse', 'Deterministic'], correct: 1, explanation: 'γ→0 weighs immediate rewards much more than distant ones → shortsighted behaviour.' },
          { id: 'qz_p6_5', category: 'P6 — RL', question: 'Which is a stochastic policy?', options: ['A fixed mapping a = π(s) from state to action', 'Strictly greedy selection of the best action', 'π(a|s) = P[A=a|S=s], such as ε-greedy', 'The value-iteration update applied to states'], correct: 2, explanation: 'A stochastic policy assigns a probability distribution over actions, e.g. ε-greedy. Greedy / a=π(s) is deterministic.' },
          { id: 'qz_p6_6', category: 'P6 — RL', question: 'The Bellman optimality equation v*(s) uses which operator instead of summing over π?', options: ['Average over all policies', 'Sum over all actions', 'Max over all actions', 'Min over all actions'], correct: 2, explanation: 'v*(s) = max_a (…) — takes the maximum over actions rather than a policy-weighted average.' },
          { id: 'qz_p6_7', category: 'P6 — RL', question: 'According to the lecture, which form of conditioning corresponds to "prediction" (policy evaluation)?', options: ['Operant conditioning', 'Classical conditioning', 'Latent conditioning', 'Avoidance conditioning'], correct: 1, explanation: 'Classical conditioning ↔ prediction (policy evaluation). Operant conditioning ↔ control (evaluation + improvement).' },
          { id: 'qz_p6_8', category: 'P6 — RL', question: 'In ε-greedy with |A|=4 actions and ε=0.4, what is the probability of choosing a NON-optimal action (any one of them)?', options: ['0.4', '0.1', '0.3', '0.133'], correct: 2, explanation: 'P(non-optimal, total) = ε·(|A|−1)/|A| = 0.4 × 3/4 = 0.3. Each individual non-optimal action gets ε/|A| = 0.1.' },
          { id: 'qz_p6_9', category: 'P6 — RL', question: 'Dynamic Programming requires which of the following?', options: ['Sampled episodes only', 'A fully known MDP model', 'A neural network function approximator', 'Off-policy learning'], correct: 1, explanation: 'DP assumes the MDP (S,A,P,R) is fully known and computes updates analytically by sweeping over states.' },
          { id: 'qz_p6_10', category: 'P6 — RL', question: 'Policy Iteration differs from Value Iteration because Policy Iteration...', options: ['It does not require any model of the environment overall', 'It runs a full evaluation sweep before each improvement', 'It only works for episodic, terminating tasks in general', 'It relies on neural-network function approximation overall'], correct: 1, explanation: 'Policy Iteration alternates an exhaustive (converged) evaluation with greedy improvement; Value Iteration combines both into a single sweep per update.' },
          { id: 'qz_p6_11', category: 'P6 — RL', question: 'Why does Monte Carlo control typically use "Exploring Starts" or ε-greedy?', options: ['To speed up convergence of the Bellman equation', 'A deterministic policy may never visit some pairs', 'So that no explicit value function is needed overall', 'Because MC control always needs a known model overall'], correct: 1, explanation: 'Without exploration, some state-action pairs are never sampled, so MC cannot estimate their values.' },
          { id: 'qz_p6_12', category: 'P6 — RL', question: 'Which of these correctly characterizes Temporal Difference (TD) learning?', options: ['Samples but never bootstraps', 'Bootstraps but never samples', 'Both samples and bootstraps', 'Neither samples nor bootstraps'], correct: 2, explanation: 'TD is "a mixture of DP and MC": it samples experience (like MC) and bootstraps from an estimate (like DP).' },
          { id: 'qz_p6_13', category: 'P6 — RL', question: 'A code snippet uses `target = reward + gamma * model.predict(next_state)[0][next_action]`. What algorithm is this?', options: ['Q-Learning (off-policy TD)', 'SARSA (on-policy TD)', 'Monte Carlo', 'Dynamic Programming'], correct: 1, explanation: 'Using next_action (the actual next action taken) → SARSA, on-policy TD. Q-Learning would use max/argmax.' },
          { id: 'qz_p6_14', category: 'P6 — RL', question: 'In the Cliff Walking example, why does Q-learning achieve lower online (during-training) return than SARSA?', options: ['Q-learning simply converges more slowly than SARSA for this device type', 'Q-learning targets the optimum but ε-greedy still drops it off the cliff', 'SARSA does essentially no exploration during training during operation', 'Q-learning cannot cope with discrete action spaces for this device type'], correct: 1, explanation: 'Q-learning learns values for the optimal (cliff-adjacent) path, so its ε-greedy exploration occasionally causes a fall; SARSA learns a longer but safer path.' },
          { id: 'qz_p6_15', category: 'P6 — RL', question: 'n-step bootstrapping with n=∞ (full episode) is equivalent to:', options: ['Dynamic Programming', '1-step TD', 'Monte Carlo', 'Value Iteration'], correct: 2, explanation: 'n-step TD unifies TD and MC: n=1 gives 1-step TD, n=∞ (waiting for the full episode) gives Monte Carlo.' },
          { id: 'qz_p6_16', category: 'P6 — RL', question: 'A DQN takes only the state as input and outputs one Q-value per action. What does this architecture generalize on, and how many forward passes find max_a Q(s,a)?', options: ['Generalizes on actions only; needs |A| passes', 'Generalizes on states only; needs 1 pass overall', 'Generalizes on both; needs 1 pass in practice', 'Generalizes on neither; needs |A| passes overall'], correct: 1, explanation: 'State-only input with a vector of Q-values as output generalizes on states only, and a single forward pass yields all action-values at once.' },
        ],

        open: [
          { id: 'op_p6_1', points: '6 pts', question: 'Give a brief explanation of: (i) return, (ii) action policy, (iii) state-value function.', answer: '• Return G_t: discounted sum of future rewards G_t = R_{t+1}+γR_{t+2}+… (2).\n• Policy: strategy mapping states to action probabilities π(a|s) (2).\n• State-value function: expected return from state s under π, v_π(s)=E_π[G_t|S_t=s] (2).' },
          { id: 'op_p6_2', points: '5 pts', question: 'The simple return definition G_t := R_{t+1}+R_{t+2}+…+R_T causes a problem for continuing tasks. State the problem, give the corrected (discounted) definition, and explain how it lets the agent shift between farsighted and shortsighted.', answer: '• Problem: for continuing tasks T=∞, so the return could become infinite (2).\n• Corrected: G_t := R_{t+1} + γR_{t+2} + γ²R_{t+3} + … + γ^{T−t−1}R_T (1).\n• As γ→0, immediate rewards are weighted far more strongly than distant rewards → the agent becomes more shortsighted (2).' },
          { id: 'op_p6_3', points: '4 pts', question: 'Write the Bellman equation for v_π(s) and the Bellman optimality equation for v*(s).', answer: 'v_π(s) = Σ_a π(a|s) Σ_{s\',r} p(s\',r|s,a)[r + γv_π(s\')] (2).\nv*(s) = max_a Σ_{s\',r} p(s\',r|s,a)[r + γv*(s\')] (2).' },
          { id: 'op_p6_4', points: '4 pts', question: 'Explain GPI and describe the two alternating steps.', answer: '• GPI = iterative alternation until convergence (1).\n• Policy Evaluation: find V for current π (1.5).\n• Policy Improvement: update π greedily from V (1.5).' },
          { id: 'op_p6_5', points: '4 pts', question: 'Fill in the blanks and explain: "___ conditioning is the corresponding learning process for prediction, while ___ conditioning is the corresponding learning process for control." Briefly explain prediction and control.', answer: '• Classical conditioning ↔ prediction; Operant/instrumental conditioning ↔ control (2).\n• Prediction: evaluation of a value function according to a policy (policy evaluation) (1).\n• Control: iterative evaluation of a value function and updating the policy accordingly (policy evaluation + improvement) (1).' },
          { id: 'op_p6_6', points: '4 pts', question: 'Explain bootstrapping in RL. State which paradigms bootstrap and which do not.', answer: '• Bootstrapping: propagating value between consecutive states by iteratively exploiting the recursive relationship formulated by the Bellman equation (2).\n• DP: bootstraps. TD: bootstraps. Monte Carlo: does NOT bootstrap (2).' },
          { id: 'op_p6_7', points: '6 pts', question: 'Explain on-policy vs off-policy learning (define target and behavior policy), the advantage of off-policy, and the validity condition.', answer: '• Target policy π(a|s): policy used for the improvement step. Behavior policy b(a|s): policy used to sample actions from the environment (1).\n• On-policy: behavior = target policy, e.g. SARSA (1). Off-policy: behavior ≠ target, e.g. Q-Learning (1).\n• Advantage: separates the optimal target policy from the exploratory behavior policy → handles the exploration problem better; on-policy only learns a near-optimal, still-exploring policy (2).\n• Condition: π(a|s)>0 wherever b(a|s)>0 (coverage) (1).' },
          { id: 'op_p6_8', points: '5 pts', question: 'A Python function `train_model(state, action, reward, next_state, next_action)` computes `target = reward + gamma * model.predict(next_state)[0][next_action]`. (i) Name the exact algorithm and its category. (ii) Assuming an ε-greedy action-selection strategy is used to pick actions, is this on-policy or off-policy? Justify.', answer: '• (i) SARSA — an on-policy Temporal Difference control algorithm (uses the actual sampled next_action, not a max) (2).\n• (ii) On-policy: the behavior policy (ε-greedy, used to select next_action) is the same policy whose value is being estimated/improved by the target — there is no separate greedy target policy (3).' },
          { id: 'op_p6_9', points: '6 pts', question: 'A DQN-style network approximates the action-value function q_π(s,a) by taking only the state as input and outputting one Q-value per action (k possible actions). (i) State what this architecture generalizes on. (ii) How many forward passes are needed per time step to find max_a Q(s,a)? (iii) Why does the output layer use a linear activation function?', answer: '• (i) It generalizes on states only (2).\n• (ii) One forward pass per time step (2).\n• (iii) The output approximates a real-valued Q-value — a regression problem, not classification — so a linear activation is appropriate (2).' },
          { id: 'op_p6_10', points: '4 pts', question: 'Describe and state the differences between classical and operant conditioning.', answer: '• Classical: a subject learns the relationship between an initially neutral conditioned stimulus (CS) and an unconditioned stimulus (US) that reflexively produces a conditioned response (CR); after repeated CS+US pairing, the CS alone eventually produces the CR (2).\n• Operant: a subject learns the relationship between a stimulus and its own behaviour — a stimulus presented only in response to an action serves as a reinforcer that increases/decreases the probability of that action (2).' },
        ],
      },
    ],
  },

      {
        id: 'kf1', name: 'Introduction: Fusion as an Energy Source', icon: '⚛️', color: '#0a84ff', examWeight: 10,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 01 - Introduction - Fusion as an Energy Source.pdf',
        quiz: [
  { id: 'qz_kf_l01_03', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The atomic number Z of a nucleus is defined as…', options: ['the count of protons, which fixes the chemical element', 'the count of neutrons, which fixes the isotope involved', 'the count of all nucleons bound together in the nucleus', 'the count of electrons orbiting in the outermost shell'], correct: 0, explanation: 'Z is the number of protons in the nucleus and defines which chemical element the atom belongs to, as distinct from A (mass number) and N (neutron number). (Lecture 01, Folie 34)' },
  { id: 'qz_kf_l01_04', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'Given the mass number A and atomic number Z of a nucleus, the number of neutrons N is calculated as…', options: ['N = Z − A', 'N = A − Z', 'N = A + Z', 'N = A / Z'], correct: 1, explanation: 'The mass number A is the total number of nucleons (protons + neutrons), so the neutron number is obtained by subtracting the proton number Z from A: N = A − Z, which determines the isotope. (Lecture 01, Folie 34)' },
  { id: 'qz_kf_l01_07', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'Nuclear fusion is best described as the process by which…', options: ['a heavy nucleus is split into two lighter fragments plus neutrons', 'a nucleus ejects an alpha particle and becomes a lighter nucleus', 'a proton captures an electron and becomes a neutron plus neutrino', 'two light nuclei are combined into a heavier nucleus plus particles'], correct: 3, explanation: 'The lecture defines nuclear fusion as the combination of two atomic nuclei into a heavier nucleus (plus subatomic particles), with the associated mass difference releasing or absorbing energy according to the difference in binding energy. (Lecture 01, Folie 38)' },
  { id: 'qz_kf_l01_11', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The nuclear binding energy fundamentally arises from the balance between…', options: ['gravitational attraction opposed by the weak nuclear force', 'Coulomb attraction opposed by neutron degeneracy pressure', 'the attractive strong force opposed by Coulomb repulsion', 'thermal particle pressure opposed by magnetic pressure'], correct: 2, explanation: 'The lecture states binding energy is related to the balance of the strong nuclear force, which attracts nucleons together, and the electromagnetic force, which causes repulsion between protons — this balance determines nuclear stability. (Lecture 01, Folie 40)' },
  { id: 'qz_kf_l01_12', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The mass defect Δm of a nucleus is defined as…', options: ['the sum of the free nucleon masses minus the real mass of the nucleus', 'the difference between the neutron mass and the proton mass involved', 'the mass that a nucleus loses when it emits an alpha particle in decay', 'the gap between the measured mass and the liquid-drop model estimate'], correct: 0, explanation: 'Δm = Z·mp + N·mn − mA: because the nucleus mass mA is always less than the sum of its free constituent nucleon masses, this "missing" mass corresponds to the binding energy released when the nucleus formed, via ΔE = Δm·c².  (Lecture 01, Folie 41)' },
  { id: 'qz_kf_l01_13', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The relationship ΔE = Δm·c² expresses that…', options: ['the Coulomb barrier grows with the square of the atomic number', 'the mass defect of a nucleus is equivalent to a released energy', 'binding energy per nucleon grows with the square of mass number', 'the kinetic energy grows with the square of the particle speed'], correct: 1, explanation: 'This is the mass-energy equivalence relation applied to nuclear mass defect: the mass "missing" from a bound nucleus compared to its separated nucleons corresponds to energy ΔE = Δm·c², which is the energy released during fusion (or needed to break the nucleus apart). (Lecture 01, Folie 41)' },
  { id: 'qz_kf_l01_14', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'On the curve of average binding energy per nucleon (ΔE/A) versus mass number A, the absolute maximum occurs at…', options: ['A ≈ 4 (helium region)', 'A ≈ 12 (carbon region)', 'A ≈ 238 (uranium region)', 'A ≈ 56 (iron region)'], correct: 3, explanation: 'The curve rises steeply for very light nuclei, peaks near A = 56 for highly stable nuclei like iron and nickel, then slowly decreases for heavier nuclei — this is why fission (heavy nuclei splitting toward A ≈ 56) and fusion (light nuclei combining toward A ≈ 56) both release energy. (Lecture 01, Folie 43)' },
  { id: 'qz_kf_l01_15', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'A fusion reaction is exothermic when…', options: ['the product nucleus has a lower total binding energy than the reactants', 'the mass number of the product equals the sum of the reactant masses', 'the product nucleus has a higher total binding energy than the reactants', 'both reactant nuclei happen to share the same atomic and mass number'], correct: 2, explanation: 'Just as fission releases energy when product binding energy exceeds the reactant\'s, fusion releases energy when the newly formed heavier nucleus has greater total binding energy than the sum of the binding energies of the two lighter reactant nuclei. (Lecture 01, Folie 43)' },
  { id: 'qz_kf_l01_18', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The D-T fusion reaction (D + T → ⁴He + n) releases about 17.59 MeV, distributed as approximately…', options: ['14.1 MeV to the neutron and 3.52 MeV to the alpha particle', '3.52 MeV to the neutron and 14.1 MeV to the alpha particle', '8.80 MeV to the neutron and 8.79 MeV to the alpha particle', '17.59 MeV to the alpha particle and none at all to the neutron'], correct: 0, explanation: 'Due to momentum conservation, the lighter neutron carries away most of the kinetic energy (14.1 MeV) while the heavier alpha particle (⁴He) carries the smaller share (3.52 MeV), even though the total released energy is 17.59 MeV. (Lecture 01, Folie 46)' },
  { id: 'qz_kf_l01_21', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The D-T reaction is considered the most easily achievable fusion reaction for energy production mainly because of which combination of factors?', options: ['It demands the highest temperature, which guarantees full ionization', 'It works at moderate energy, has a large cross section and high yield', 'It releases no neutrons at all, so no radiation shielding is needed', 'It burns only naturally abundant fuels and needs no breeding step'], correct: 1, explanation: 'The lecture lists three reasons D-T is preferred: it is feasible at relatively low temperature/energy, occurs with relatively large cross sections (high reaction probability), and releases a large amount of energy per reaction — despite tritium having to be bred rather than being naturally abundant. (Lecture 01, Folie 48)' },
  { id: 'qz_kf_l01_22', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'Why must tritium be bred inside a fusion reactor rather than mined or stockpiled from natural sources?', options: ['It reacts far too slowly to serve as a fusion fuel on its own', 'It is chemically identical to deuterium and cannot be separated', 'Natural tritium would set off an uncontrolled chain reaction', 'It decays with a 12.3-year half-life and is therefore scarce'], correct: 3, explanation: 'Tritium spontaneously decays with a 12.4-year half-life and is therefore scarce on Earth, so it cannot simply be stockpiled; instead it must be continuously bred inside the reactor from lithium via neutron reactions. (Lecture 01, Folie 51)' },
  { id: 'qz_kf_l01_23', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'Tritium breeding for a fusion reactor is achieved primarily through neutron reactions with…', options: ['Beryllium, acting as a neutron multiplier', 'Boron-11 coated onto the first wall tiles', 'Lithium, in its ⁶Li and ⁷Li isotopes', 'Deuterium injected as a cold gas puff'], correct: 2, explanation: 'The lecture gives the two breeding reactions n + ⁶Li → ³H + ⁴He + 4.78 MeV and n + ⁷Li → ³H + ⁴He + n − 2.5 MeV, showing that lithium is the key breeding material and therefore part of the fusion fuel mix alongside deuterium. (Lecture 01, Folie 51)' },
  { id: 'qz_kf_l01_30', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'The phenomenon that explains why fusing nuclei can react at energies well below the classical Coulomb barrier height is known as…', options: ['the quantum tunnel effect', 'Debye charge shielding', 'the Meissner expulsion effect', 'Bremsstrahlung energy loss'], correct: 0, explanation: 'The lecture explains that this counterintuitive behavior can only be understood through quantum mechanics: particles are described by probability amplitudes rather than deterministic trajectories, allowing a nonzero probability of "tunneling" through the Coulomb barrier even without classically sufficient energy. (Lecture 01, Folie 54)' },
  { id: 'qz_kf_l01_32', category: 'L1 — Introduction: Fusion as an Energy Source', question: 'A key environmental and resource advantage of D-T fusion power highlighted in the wrap-up is that…', options: ['it needs no neutron shielding whatsoever around the reactor', 'it emits no CO2 and its fuels D and Li are abundant on Earth', 'its fuel cycle involves no radioactive substances whatsoever', 'it leaves high-level radioactive waste much like fission does'], correct: 1, explanation: 'The lecture emphasizes that D-T fusion power generation would be entirely free of CO2 emissions, and its fuel resources — deuterium and lithium — are very abundant in the Earth\'s crust and seawater, supporting fusion as a long-term sustainable energy source. (Lecture 01, Folie 55)' }
],

      {
        id: 'kf2', name: 'Obtaining Nuclear Fusion', icon: '🔆', color: '#64d2ff', examWeight: 8,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 02 - Obtaining Nuclear Fusion.pdf',
        quiz: [
  { id: 'qz_kf_l02_01', category: 'L2 — Obtaining Nuclear Fusion', question: 'Thermonuclear fusion is best described as fusion driven by…', options: ['neutron capture reactions taking place inside a very dense target', 'gravitational compression of the fuel mass, exactly as in a star', 'acceleration of the fuel ions in an externally applied E field', 'thermal motion supplying the energy to beat the Coulomb barrier'], correct: 3, explanation: 'The slide defines thermonuclear fusion as fusion obtained when high particle (thermal) temperature provides the kinetic energy needed to overcome the Coulomb barrier, as opposed to other methods like acceleration in an external field. (Lecture 02, Folie 4)' },
  { id: 'qz_kf_l02_03', category: 'L2 — Obtaining Nuclear Fusion', question: 'Plasma, described as the fourth state of matter, is best characterized as…', options: ['a conductive cloud of charges that responds to EM fields', 'a neutral gas of atoms that carries no free electric charges at all', 'a crystalline solid lattice assembled out of fully ionized atoms', 'a liquid metal that is circulated purely to cool hot components'], correct: 0, explanation: 'The slide defines plasma as made of charged particles (ions and/or electrons), electrically conductive, with particle dynamics affected by internal and external electromagnetic fields — and notes it is the most abundant form of ordinary matter in the universe. (Lecture 02, Folie 6)' },
  { id: 'qz_kf_l02_04', category: 'L2 — Obtaining Nuclear Fusion', question: 'In stars, what keeps the fusing plasma confined at the necessary high densities and temperatures?', options: ['Externally wound magnetic field coils', 'The star’s own gravitational attraction', 'Inertial confinement by laser implosion', 'An electrostatic cage of charged grids'], correct: 1, explanation: 'The slide explains that gravitation keeps the stellar plasma confined at the high energies and densities needed for fusion — this is the "fusion gravity drive" unique to stars, unlike man-made reactors which need magnetic or inertial confinement. (Lecture 02, Folie 7)' },
  { id: 'qz_kf_l02_08', category: 'L2 — Obtaining Nuclear Fusion', question: 'The gravity-fusion balance mechanism in stars works such that if the fusion reaction rate decreases…', options: ['the star immediately puffs up and turns into a red giant', 'the star is extinguished at once and stops radiating light', 'gravity compresses the star until the rate has recovered', 'the internal magnetic field of the star suddenly collapses'], correct: 2, explanation: 'The slide describes a self-regulating feedback: a lower reaction rate reduces internal plasma pressure, letting gravity compress the star, raising density and temperature, which in turn increases the reaction rate and restores the pressure balance. (Lecture 02, Folie 10)' },
  { id: 'qz_kf_l02_17', category: 'L2 — Obtaining Nuclear Fusion', question: 'The fusion cross section σ, as introduced via accelerator physics in the lecture, is best described as…', options: ['the physically machined bore area of the vacuum vessel', 'a probability measure linking collisions to densities', 'the confinement time that a given device is able to reach', 'the ratio of fusion power output to external heating power'], correct: 1, explanation: 'The slide defines σ from dn1/dx = -σ n1(x) n2, the proportionality constant linking the number of collisions to beam and target densities — it quantifies the probability that a nuclear reaction occurs, and is measured in barns (10^-28 m2). (Lecture 02, Folie 26)' },
  { id: 'qz_kf_l02_19', category: 'L2 — Obtaining Nuclear Fusion', question: 'The reaction parameter (or reactivity), denoted <σv>, is defined as…', options: ['cross section × velocity, averaged over the distribution', 'the confinement time divided by the particle number density', 'the number of reaction barns per cubic metre of the plasma', 'the fusion power output divided by the external heating power'], correct: 0, explanation: 'The slide defines the reaction rate as r = n1 n2 <σv>, where <σv>, the product of cross section and velocity averaged over the Maxwellian velocity distribution, is called the reaction parameter or reactivity, and is a key figure of merit for fusion power generation. (Lecture 02, Folie 27)' },
  { id: 'qz_kf_l02_20', category: 'L2 — Obtaining Nuclear Fusion', question: 'The two main confinement methods mankind has used to create significant quantities of nuclear fusion are…', options: ['accelerator confinement and cryogenic confinement', 'gravitational confinement and electrostatic confinement', 'thermal confinement and chemical confinement', 'magnetic confinement and inertial confinement'], correct: 3, explanation: 'The slide states that, since accelerators alone cannot yield net positive energy output, mankind instead relies on magnetic confinement (plasma held by magnetic fields) and inertial confinement (extremely short explosive-style reactions confined by the mass\'s own inertia). (Lecture 02, Folie 28)' },
  { id: 'qz_kf_l02_21', category: 'L2 — Obtaining Nuclear Fusion', question: 'In inertial confinement fusion, plasma confinement is achieved because…', options: ['strong external magnetic fields hold the plasma in a closed volume', 'a static field between wire grids drives the ions to a common centre', 'the reaction is over so fast that the mass’s own inertia suffices', 'the fuel is held together by its own gravity, exactly as in a star'], correct: 2, explanation: 'The slide explains that in inertial confinement, reactions occur in an extremely short, explosive-like time so that the inertia of the imploding mass provides sufficient confinement time to fuse the fuel, unlike the steady magnetic confinement approach. (Lecture 02, Folie 28)' },
  { id: 'qz_kf_l02_24', category: 'L2 — Obtaining Nuclear Fusion', question: 'Why does the neutron produced in a D-T fusion reaction not contribute to internal (alpha-particle-style) heating of the plasma?', options: ['It turns back into a proton before it can leave the plasma volume', 'It is uncharged, so it leaves the fields and takes its energy away', 'It is absorbed almost at once by the deuterium nuclei around it', 'It carries far too little kinetic energy to deposit any heat at all'], correct: 1, explanation: 'The slide explains that because the neutron carries no electric charge, it is unaffected by the magnetic/electric confinement and leaves the plasma without interacting, so its energy is deposited outside the plasma rather than heating it, unlike the charged alpha particle which stays confined and heats the plasma via collisions. (Lecture 02, Folie 35)' },
  { id: 'qz_kf_l02_25', category: 'L2 — Obtaining Nuclear Fusion', question: 'Ignition in a D-T fusion plasma is defined in the lecture as the condition where…', options: ['alpha heating alone covers the losses, so PH can be switched off', 'the externally applied heating power exceeds the alpha heating power', 'the pressure inside the vacuum vessel drops below 10^-9 mbar', 'the toroidal plasma current has been ramped down to exactly zero'], correct: 0, explanation: 'The slide defines ignition as the condition where the power balance PH + Pα = PL is satisfied even with PH = 0, i.e. alpha heating alone compensates the power losses, allowing external heating to be turned off while the plasma temperature is self-sustained. (Lecture 02, Folie 36)' },
  { id: 'qz_kf_l02_26', category: 'L2 — Obtaining Nuclear Fusion', question: 'The energy confinement time τE, as defined in the lecture\'s power balance for a fusion plasma, represents…', options: ['the time the plasma current needs to reach steady state', 'the time needed to cool the magnets to cryogenic levels', 'the stored plasma energy E divided by the power loss PL', 'the average lifetime of a single fusion reaction event'], correct: 2, explanation: 'The slide defines the power loss as PL = E / τE, so τE = E / PH under steady-state balance (PH = PL) — it characterizes how well the plasma retains its thermal energy against losses, a key figure of merit alongside density and temperature. (Lecture 02, Folie 34)' },
  { id: 'qz_kf_l02_27', category: 'L2 — Obtaining Nuclear Fusion', question: 'The Lawson criterion, derived from the ignition power balance for D-T reactions, states that ignition requires nτE to exceed approximately what value, and at what optimal temperature?', options: ['nτE > 3×10^21 m^-3 s at T = 10 keV', 'nτE > 1.5×10^20 m^-3 s at T = 300 keV', 'nτE > 1.5×10^14 m^-3 s at T = 30 keV', 'nτE > 1.5×10^20 m^-3 s at T = 30 keV'], correct: 3, explanation: 'The slide shows the ignition condition nτE > 12 <σv>/(kT) reaches its minimum value at T = 30 keV, giving nτE > 1.5×10^20 m^-3 s as the Lawson criterion for D-T reactions, first formulated by J. D. Lawson. (Lecture 02, Folie 38)' },
  { id: 'qz_kf_l02_28', category: 'L2 — Obtaining Nuclear Fusion', question: 'The fusion triple product nTτE is best described as…', options: ['the alpha heating power divided by the neutron energy loss rate', 'density × temperature × confinement time, gauging ignition', 'a unit that serves only to quantify the vacuum vessel pressure', 'a theoretical figure that cannot be used to compare any devices'], correct: 1, explanation: 'The slide derives the triple product nTτE > 3×10^21 m^-3 keV s (for flat profiles) from the ignition condition using the T^2 approximation for <σv>, and states it gives a quantitative measure of how far a device is from reactor/ignition conditions, making it a key figure of merit used to compare different fusion devices. (Lecture 02, Folie 39)' },
  { id: 'qz_kf_l02_29', category: 'L2 — Obtaining Nuclear Fusion', question: 'The fusion gain factor Q is defined as the ratio of…', options: ['thermonuclear power produced over external heating power supplied', 'external heating power supplied over thermonuclear power produced', 'alpha particle energy over the energy carried away by the neutrons', 'plasma kinetic pressure over the confining magnetic pressure'], correct: 0, explanation: 'The slide defines Q = Pfusion / PH, the thermonuclear power produced divided by the external heating power supplied; since Pα is only 1/5 of the total fusion power, Q = 1 corresponds to Pα being 20% of PH, and Q → ∞ at ignition since PH → 0. (Lecture 02, Folie 40)' },
  { id: 'qz_kf_l02_30', category: 'L2 — Obtaining Nuclear Fusion', question: 'The lecture states that a value of Q = 10 is generally considered…', options: ['the exact Q value at which ignition is reached', 'the highest Q value any fusion device can reach', 'a practical minimum for economical reactor operation', 'irrelevant, since only Q = 1 breakeven really matters'], correct: 2, explanation: 'The slide states that while ignition (Q → ∞) is not strictly required for a fusion reactor to be viable, Q = 10 is considered a practical minimum for economical operation. (Lecture 02, Folie 40)' }

      {
        id: 'kf3', name: 'Outline of Nuclear Fusion Devices', icon: '🧲', color: '#bf5af2', examWeight: 9,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 03 - Outline of Nuclear Fusion Devices.pdf',
        quiz: [
  { id: 'qz_kf_l03_04', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'Why can the ~100 million Kelvin fusion fuel not be physically contained by a material wall?', options: ['because the plasma has practically no pressure at such temperatures', 'because plasma at 100 MK would vaporize any solid wall it touches', 'because material walls are magnetic and therefore repel the plasma', 'because the plasma carries no net charge that a wall could grip'], correct: 1, explanation: 'The lecture states the fuel must be heated to above 100 MK to enter the plasma state, and due to its temperature it cannot be physically contained — hence the need for magnetic or inertial confinement instead of a material vessel wall. (Lecture 03, Folie 7)' },
  { id: 'qz_kf_l03_05', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In magnetic confinement, charged particles are "tied" to magnetic field lines because…', options: ['the field brings all motion of the particles to a standstill', 'the field acts only on the electrically neutral particles', 'they gyrate helically around a line but slide freely along it', 'the field freezes the particles into a rigid solid-like lattice'], correct: 2, explanation: 'Ions and electrons gyrate helically around field lines due to the Lorentz force but can move freely in the longitudinal direction along them, which is the basic mechanism enabling magnetic confinement away from material walls. (Lecture 03, Folie 8)' },
  { id: 'qz_kf_l03_07', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'The Larmor radius of a gyrating charged particle in a magnetic field depends on…', options: ['the perpendicular velocity, the mass, the charge and the field B', 'the parallel velocity component v∥ and on nothing else besides', 'the local plasma number density and on nothing else besides', 'the applied magnetic field strength and on nothing else besides'], correct: 0, explanation: 'The Larmor radius is derived by balancing the Lorentz force with the centrifugal force, giving ρ = v⊥·m / (q·B); it therefore depends on velocity (i.e. temperature), mass, charge, and field strength — and since ions are heavier than electrons, ρ_ion > ρ_electron. (Lecture 03, Folie 11)' },
  { id: 'qz_kf_l03_11', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'A solenoid alone cannot serve as a particle confinement device because…', options: ['its winding can never be manufactured as a superconductor at all', 'it can only ever generate a purely poloidal field geometry inside', 'its magnetic field is far too weak to confine any particle at all', 'it is open-ended, so particles stream out along the field lines'], correct: 3, explanation: 'A solenoid can guide particles along its field lines, but because it is open-ended, particles are free to stream out at the ends — motivating the idea of bending the solenoid into a closed toroid. (Lecture 03, Folie 15-16)' },
  { id: 'qz_kf_l03_13', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'A simple toroidal magnetic field alone is insufficient for stable plasma confinement mainly because…', options: ['it stops any electric current from flowing inside the plasma', 'it cancels the Larmor gyration radius of the particles entirely', 'curvature and the 1/R non-uniformity drive drifts to the wall', 'it heats the plasma to a temperature that cannot be controlled'], correct: 2, explanation: 'Because B is inversely proportional to radius and curved, non-uniformities and curvature cause guiding-center drifts that migrate particles outward until they hit the walls, drastically reducing confinement time — this is why an additional poloidal field is required. (Lecture 03, Folie 17)' },
  { id: 'qz_kf_l03_17', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In a magnetic mirror configuration, a particle moving from a weak-field region toward a strong-field throat is reflected back because…', options: ['its magnetic moment μ shrinks while its parallel velocity grows', 'the particle loses its electric charge inside the field throat', 'the total kinetic energy of the particle grows without any bound', 'with μ conserved, v⊥ grows and v∥ falls to zero as B increases'], correct: 3, explanation: 'Conservation of the magnetic moment μ = ½mv⊥²/B and of total kinetic energy means that as B increases toward the mirror throat, v⊥ must grow and v∥ must shrink; if B is high enough, v∥ reaches zero and the particle is reflected back to the weak-field region. (Lecture 03, Folie 23)' },
  { id: 'qz_kf_l03_19', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In a simple (non-tokamak) toroidal confinement device, the combined effect of the ∇B drift pushing ions and electrons to opposite sides of the torus is that…', options: ['the charge separation sets up an E×B drift pushing outward', 'the confining magnetic field is made perfectly uniform everywhere', 'the toroidal plasma current vanishes completely from the device', 'tritium breeding in the surrounding blanket is strongly boosted'], correct: 0, explanation: 'The ∇B drift separates ions and electrons to opposite sides of the torus, producing a vertical electric field; the resulting E×B drift combines with the curvature drift to push particles radially outward, which is exactly the confinement problem that the poloidal field is designed to solve. (Lecture 03, Folie 26)' },
  { id: 'qz_kf_l03_20', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'The addition of a poloidal magnetic field to the toroidal field in a tokamak solves the drift-induced confinement problem primarily because…', options: ['it exactly cancels the toroidal field throughout the plasma volume', 'it twists the field lines into helices, so no charge can pile up', 'it halts all streaming of the particles along the field lines', 'it makes any magnetic field in the device unnecessary altogether'], correct: 1, explanation: 'Combining toroidal and poloidal fields produces helical field lines; as particles travel along these helical paths around the torus, they visit both the top and bottom, preventing the sustained charge accumulation that caused the outward E×B drift. (Lecture 03, Folie 27)' },
  { id: 'qz_kf_l03_22', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In a tokamak, the poloidal magnetic field is mainly generated by…', options: ['a set of external helical coils wound around the vessel', 'the central solenoid acting as a fixed permanent magnet', 'the tungsten divertor plates sitting at the vessel bottom', 'an electric current flowing in the plasma column itself'], correct: 3, explanation: 'Rather than placing a physical current loop inside the extremely hot plasma, the tokamak instead induces a current to flow directly in the plasma itself, and this plasma current generates the poloidal field. (Lecture 03, Folie 29)' },
  { id: 'qz_kf_l03_23', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'The plasma current in a tokamak is induced through which physical process?', options: ['a ramped solenoid flux induces an E-field that ionizes and drives it', 'an external current loop is inserted directly into the plasma core', 'lithium vapour chemically ionizes the deuterium-tritium gas mixture', 'the frozen fuel pellet is compressed gravitationally until it burns'], correct: 0, explanation: 'The tokamak works like a transformer: ramping the current in the central solenoid changes the magnetic flux, inducing an electric field per Maxwell-Faraday\'s law that ionizes the gas (breakdown) and accelerates the resulting charged particles, driving the plasma current. (Lecture 03, Folie 30)' },
  { id: 'qz_kf_l03_24', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'A tokamak is inherently a "pulsed" machine mainly because…', options: ['the toroidal field coils would overheat almost instantaneously', 'the divertor must be exchanged after every single plasma pulse', 'the solenoid current saturates and must be reset each cycle', 'the plasma fuel has to be completely replaced every few seconds'], correct: 2, explanation: 'The current in the central solenoid must keep increasing to sustain the induced plasma current; once it reaches its maximum (saturation), both currents must be ramped down before the cycle can restart, making pulsed rather than continuous operation an intrinsic feature of the classic tokamak concept. (Lecture 03, Folie 31)' },
  { id: 'qz_kf_l03_26', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'A stellarator can operate in steady state primarily because…', options: ['external coils alone create both the toroidal and the poloidal field', 'it drives a pulsed central solenoid like a tokamak, only much bigger', 'the plasma is held together purely by the inertia of its own mass', 'it manages essentially without any magnetic field around the plasma'], correct: 0, explanation: 'In stellarators, helical (or modular) external coils generate the poloidal field directly, so unlike a tokamak, no current needs to be induced in the plasma — this removes the need for a central solenoid and allows genuinely steady-state operation. (Lecture 03, Folie 37)' },
  { id: 'qz_kf_l03_29', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In Inertial Confinement Fusion (ICF), the fuel is confined by…', options: ['a strong externally applied toroidal magnetic field', 'a magnetic mirror built from two high-field throats', 'its own inertia — it burns before it can fly apart', 'a continuously driven toroidal plasma current loop'], correct: 2, explanation: 'ICF relies on extremely rapid heating so that the fusion reaction completes before the compressed fuel has time to move or disperse significantly — the particles are confined by their own inertia rather than by any magnetic field. (Lecture 03, Folie 42)' },
  { id: 'qz_kf_l03_31', category: 'L3 — Outline of Nuclear Fusion Devices', question: 'In indirect-drive inertial confinement fusion, the "Hohlraum" serves to…', options: ['it stores the deuterium-tritium fuel before it is frozen to a pellet', 'it converts the laser light into X-rays which then implode the pellet', 'it shields the sensitive laser optics against neutron radiation damage', 'it compresses the fuel pellet purely mechanically, without radiation'], correct: 1, explanation: 'In indirect drive, laser beams heat the inner surface of a small container (the Hohlraum) surrounding the pellet, producing X-rays that are absorbed by the target surface and implode it, achieving the same compression effect as direct laser illumination but via X-ray drive. (Lecture 03, Folie 44)' },

      {
        id: 'kf4', name: 'The Plasma', icon: '🌪️', color: '#ffd60a', examWeight: 7,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 04 - The Plasma.pdf',
        quiz: [
  { id: 'qz_kf_l04_01', category: 'L4 — The Plasma', question: 'A plasma is formally defined as…', options: ['an ionized gas in which recombination is always the dominant process', 'a completely neutral gas that contains no free electric charges at all', 'any gas that has simply been heated above ordinary room temperature', 'a quasi-neutral gas of charged particles showing collective behaviour'], correct: 3, explanation: 'The lecture defines a plasma as a quasi-neutral gas of charged and neutral particles that exhibits collective behavior, distinguishing it from an ordinary ionized gas. This collective, long-range electromagnetic interaction is the defining feature of the plasma state. (Lecture 04, Folie 4)' },
  { id: 'qz_kf_l04_06', category: 'L4 — The Plasma', question: 'The \'collective behavior\' of a plasma refers to the fact that…', options: ['motion also depends on distant regions, through long-range EM fields', 'the particles themselves never produce any electric or magnetic field', 'every particle moves with exactly the same velocity at all times', 'motion is set only by immediate local collisions, as in a neutral gas'], correct: 0, explanation: 'Unlike neutral gas molecules that interact only through direct collisions, charged plasma particles generate electric and magnetic fields that influence particles far away, so plasma dynamics depend on conditions elsewhere in the plasma, not just locally. (Lecture 04, Folie 8)' },
  { id: 'qz_kf_l04_07', category: 'L4 — The Plasma', question: 'A plasma is fully characterized, in the simplest description, by which two parameters?', options: ['Pressure p and volume V', 'Magnetic field B and current I', 'Density n and temperature T', 'Debye length λD and Larmor radius'], correct: 2, explanation: 'The lecture states that a plasma can be characterized by two parameters: density n and temperature T, even though these vary by many orders of magnitude across different plasma applications (n by about 28 orders of magnitude, T by about 7). (Lecture 04, Folie 8)' },
  { id: 'qz_kf_l04_15', category: 'L4 — The Plasma', question: 'Debye shielding describes the phenomenon in which…', options: ['the plasma turns completely opaque to all electromagnetic radiation', 'the magnetic field lines are pushed entirely out of the plasma volume', 'the ions in the plasma can no longer respond to any electric field', 'an inserted charge is screened by a counter-charge cloud around it'], correct: 3, explanation: 'Charged particles of opposite sign are attracted toward an introduced potential, forming a screening cloud; beyond the Debye length the electric field of the source charge is effectively canceled by this shielding cloud. (Lecture 04, Folie 24-25)' },
  { id: 'qz_kf_l04_17', category: 'L4 — The Plasma', question: 'For a system to behave as a true plasma rather than a mere collection of charges, the Debye length λD must satisfy…', options: ['λD ≫ L, the system dimension', 'λD ≪ L, the system dimension', 'λD exactly equal to the Larmor radius', 'λD equal to zero at every point'], correct: 1, explanation: 'The lecture states that electric potentials are shielded out over a distance short compared with the system dimensions L, i.e. λD ≪ L, so that the bulk of the plasma remains quasi-neutral outside the thin shielding clouds around individual charges. (Lecture 04, Folie 25)' },
  { id: 'qz_kf_l04_19', category: 'L4 — The Plasma', question: 'As plasma temperature increases toward thermonuclear values, plasma resistivity…', options: ['drops, which is what eventually limits ohmic heating', 'rises proportionally to T, just as in an ordinary metal', 'stays exactly constant, whatever the temperature is', 'becomes infinite, because of the Meissner effect'], correct: 0, explanation: 'Unlike a normal metal, plasma resistivity decreases with increasing temperature (it is comparable to copper at Te ≈ 1.4 keV and roughly an order of magnitude lower at tokamak thermonuclear temperatures), which is why ohmic heating alone becomes insufficient at high temperature and additional heating systems are needed. (Lecture 04, Folie 26)' },
  { id: 'qz_kf_l04_20', category: 'L4 — The Plasma', question: 'Runaway electrons in a tokamak plasma arise because…', options: ['the collision frequency rises with heat and slows all electrons evenly', 'Bremsstrahlung radiation continuously decelerates every free electron', 'the confining magnetic field is entirely absent in normal operation', 'the collision rate drops, so fast electrons reach relativistic speeds'], correct: 3, explanation: 'As temperature rises, electron collision frequency drops, so electrons in the high-energy tail of the velocity distribution can be accelerated by even a modest electric field toward relativistic speeds without being sufficiently slowed by collisions, escaping normal confinement and damaging the first wall. (Lecture 04, Folie 27)' },
  { id: 'qz_kf_l04_23', category: 'L4 — The Plasma', question: 'The plasma parameter β is defined as the ratio of…', options: ['kinetic particle pressure to magnetic pressure', 'magnetic pressure to kinetic particle pressure', 'electron temperature to ion temperature', 'energy confinement time to collision time'], correct: 0, explanation: 'β = 2μ0(n_iT_i + n_eT_e)/B², i.e. particle pressure divided by magnetic pressure B²/2μ0; a high β is economically desirable in fusion because it means a given plasma pressure can be confined with a smaller (cheaper) magnetic field. (Lecture 04, Folie 30-31)' },
  { id: 'qz_kf_l04_24', category: 'L4 — The Plasma', question: 'Why is a high β value desirable in a fusion device?', options: ['It makes the divertor entirely superfluous in the machine', 'A given plasma pressure needs a smaller, cheaper magnet', 'It renders tritium breeding in the blanket unnecessary', 'It stretches the Debye length beyond the system size'], correct: 1, explanation: 'Since fusion power scales with plasma pressure while magnets are expensive, achieving high plasma pressure relative to magnetic pressure (high β) is economically desirable; however, stability constraints in tokamaks currently limit β to about 0.3 at best. (Lecture 04, Folie 31)' },
  { id: 'qz_kf_l04_26', category: 'L4 — The Plasma', question: 'The safety factor q = 2π/ι in a tokamak is best described as…', options: ['the plasma resistivity divided by the resistivity of pure copper', 'the ratio of the tritium breeding rate to the total fusion power', 'the toroidal turns per poloidal turn — larger q is more stable', 'the fraction of alpha particles that is reabsorbed by the plasma'], correct: 2, explanation: 'q equals the number of toroidal turns per poloidal turn (q=1 corresponds to ι=2π); higher q values increase MHD stability, but since q varies with minor radius and too-high q degrades particle confinement, a trade-off between stability and confinement is required. (Lecture 04, Folie 33)' },
  { id: 'qz_kf_l04_28', category: 'L4 — The Plasma', question: 'In a magnetically confined fusion plasma, the dominant radiative loss channel that must be considered in practice comes mainly from…', options: ['the superconducting field coils sitting outside the vacuum vessel', 'electrons, because their small mass gives them a large acceleration', 'ions, because their large mass makes them accelerate very strongly', 'neutral background atoms located exclusively in the plasma edge'], correct: 1, explanation: 'Radiated power from accelerated charges depends on acceleration, and because electrons are far lighter than ions they accelerate much more strongly under the same force, so in practice only electron radiation needs to be considered. (Lecture 04, Folie 34)' },
  { id: 'qz_kf_l04_29', category: 'L4 — The Plasma', question: 'Bremsstrahlung radiation in a plasma is produced specifically by…', options: ['electrons decelerated in Coulomb collisions with the ions', 'ions gyrating around the confining magnetic field lines', 'neutral particles recombining with free plasma electrons', 'photons scattered off the wall of the vacuum vessel'], correct: 0, explanation: 'The lecture distinguishes two mechanisms of electron acceleration: collisions (producing Bremsstrahlung radiation) and cyclotron motion (producing cyclotron/synchrotron radiation). Bremsstrahlung specifically arises from collisional deceleration/acceleration of electrons in the Coulomb field of ions. (Lecture 04, Folie 34)' },
  { id: 'qz_kf_l04_31', category: 'L4 — The Plasma', question: 'High-Z impurities (e.g. Fe, Cr, Ni sputtered from plasma-facing components) are particularly harmful to a fusion plasma mainly because…', options: ['they force the safety factor q beyond its stability limits', 'they shrink the Debye length of the plasma down to zero', 'they suppress the diamagnetic response of the plasma itself', 'they drive up the Bremsstrahlung losses via the Zeff term'], correct: 3, explanation: 'Since Bremsstrahlung losses depend strongly on Zeff (a density-weighted average of Z²), even small amounts of high-Z impurity ions from sputtered wall material sharply raise radiative losses, which is why ingress of such impurities must be minimized. (Lecture 04, Folie 35)' },
  { id: 'qz_kf_l04_34', category: 'L4 — The Plasma', question: 'Energy losses at the edge of a magnetically confined plasma are mainly attributed to…', options: ['parallel thermal conduction running along the magnetic field lines', 'a breakdown of Debye shielding right at the boundary of the plasma', 'perpendicular cross-field conduction plus convective particle diffusion', 'rising values of the safety factor q in the very centre of the plasma'], correct: 2, explanation: 'While parallel conduction quickly equilibrates temperature along field lines, it is the comparatively weak perpendicular conduction and convective diffusion across the field that cause net energy and particle losses at the plasma boundary. (Lecture 04, Folie 37-38)' },
],
