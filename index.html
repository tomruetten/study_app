      {
        id: 'kf5', name: 'Tokamaks: Plasma Main Operation', icon: '🍩', color: '#30d158', examWeight: 8,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 05 - Tokamaks - Plasma main operation.pdf',
        quiz: [
  { id: 'qz_kf_l05_02', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The H-mode (high confinement mode) of tokamak plasmas was first discovered in the early 1980s on which device?', options: ['JET', 'TFTR', 'JT-60', 'ASDEX'], correct: 3, explanation: 'The H-mode was discovered in 1982 on the ASDEX tokamak at IPP Germany, and it remains the reference confinement scenario for future machines such as ITER. (Lecture 05, Folie 4, 28)' },
  { id: 'qz_kf_l05_07', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'A tokamak plasma discharge cycle is generally divided into which three main phases?', options: ['Ramp-up, flat-top (burn), ramp-down', 'Breakdown, thermal quench, recovery', 'Pre-magnetization, discharge, cooldown', 'Ignition, burn phase, extinguishment'], correct: 0, explanation: 'Every tokamak discharge is structured into a ramp-up phase where current is built up, a flat-top (burn) phase of steady operation, and a ramp-down phase where the current is reduced back to zero. (Lecture 05, Folie 10)' },
  { id: 'qz_kf_l05_09', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The bootstrap current in a tokamak plasma is best described as…', options: ['a current supplied entirely by the neutral beam injection system', 'a current induced exclusively by the central solenoid transformer', 'a self-driven, non-inductive current fed by the pressure gradient', 'a current that flows only during the plasma breakdown phase'], correct: 2, explanation: 'The bootstrap current is a self-generated plasma current arising from density/pressure gradients in the plasma, and it is one of several non-inductive current drive mechanisms alongside NBI and RF/microwave heating. (Lecture 05, Folie 10)' },
  { id: 'qz_kf_l05_10', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The main limitation on the duration of the inductive ramp-up/ramp-down phases in a tokamak is set by…', options: ['the thermal insulation performance of the cryostat walls', 'the tritium breeding ratio reached by the blanket modules', 'the melting point of the tungsten divertor target tiles', 'the maximum current, and thus flux, of the solenoid'], correct: 3, explanation: 'Inductive current drive relies on flux swing in the central solenoid; the total available magnetic flux is limited by the maximum current the central solenoid can reach, which caps how much inductive current drive is available. (Lecture 05, Folie 11)' },
  { id: 'qz_kf_l05_14', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The last closed magnetic flux surface that separates the confined plasma from the scrape-off layer, formed once the plasma enters the divertor configuration, is called the…', options: ['pedestal', 'halo boundary', 'separatrix', 'scrape-off surface'], correct: 2, explanation: 'When the plasma is moved into the divertor configuration, a last closed magnetic surface called the separatrix forms, with the inboard/outboard sides crossing at one or two X-points (null points). (Lecture 05, Folie 12)' },
  { id: 'qz_kf_l05_15', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The points where the inboard and outboard sides of the separatrix cross are known as…', options: ['X points (null points)', 'kink instability points', 'pedestal edge points', 'plasma breakdown points'], correct: 0, explanation: 'These crossing points of the separatrix are called X-points or null points; a single-null configuration has one such point (typically at the bottom), while a double-null configuration has a second one at the top. (Lecture 05, Folie 12-13)' },
  { id: 'qz_kf_l05_24', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The plasma elongation κ is defined as…', options: ['κ = R / a (aspect ratio)', 'κ = b / a (height over width)', 'κ = a / b (width over height)', 'κ = B_φ / B_θ (field ratio)'], correct: 1, explanation: 'Plasma elongation is defined as κ = b/a, the ratio of the vertical (b) to horizontal (a) minor radius; vertically elongated plasmas allow higher plasma currents without increasing the major radius. (Lecture 05, Folie 17)' },
  { id: 'qz_kf_l05_35', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The H-mode (high confinement mode) is best characterized as a regime in which…', options: ['ohmic heating on its own already becomes sufficient to reach ignition', 'confinement stays permanently worse than L-mode above the threshold', 'the toroidal plasma current has to be driven down to exactly zero', 'confinement improves by roughly a factor 2 above a power threshold'], correct: 3, explanation: 'H-mode is an enhanced confinement regime discovered on ASDEX in which confinement improves discontinuously by nearly a factor of 2 once a specific power threshold is exceeded, compared to the lower L-mode confinement below that threshold. (Lecture 05, Folie 21, 28)' },
  { id: 'qz_kf_l05_36', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'Edge Localized Modes (ELMs) are specifically associated with which confinement regime\'s dedicated scaling law in the lecture (IPB98(y,2))?', options: ['L-mode confinement', 'H-mode confinement', 'Purely ohmic confinement', 'Limiter-configuration transport'], correct: 1, explanation: 'The IPB98(y,2) scaling law given in the lecture is specifically derived for H-mode plasmas exhibiting edge localized modes (ELMs), distinct from the general H-mode ITERH93-P scaling. (Lecture 05, Folie 28)' },
  { id: 'qz_kf_l05_40', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The kink instability is best described as…', options: ['a current-driven mode that shifts the column off its axis', 'a sudden thermal collapse of the hot core region of the plasma', 'a local density perturbation that stays confined to the plasma edge', 'an instability caused purely by neutral-beam ripple particle losses'], correct: 0, explanation: 'The kink instability is a current-driven macro-instability in which the plasma column translates laterally from its undisturbed centerline; when displaced, the poloidal field weakens in the direction of the perturbation, causing the displacement to grow. (Lecture 05, Folie 33)' },
  { id: 'qz_kf_l05_43', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'A major tokamak disruption is characterized fundamentally by…', options: ['a slow, gradual decay of the plasma density over several minutes', 'a sudden loss of confinement: thermal quench, then current quench', 'a smooth ramp-down identical to the normal end-of-pulse shutdown', 'the abrupt onset of the Meissner effect inside the plasma volume'], correct: 1, explanation: 'A major disruption involves the plasma confinement being suddenly destroyed, typically evolving as a thermal quench (rapid core temperature collapse) followed by a current quench (rapid decay of the plasma current to zero). (Lecture 05, Folie 35, 38)' },
  { id: 'qz_kf_l05_46', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'The four typical phases of a disruption event, in order, are…', options: ['Precursor, pre-precursor, current quench, thermal quench', 'Thermal quench, current quench, precursor, pre-precursor', 'Pre-precursor, precursor, thermal quench, current quench', 'Current quench, thermal quench, pre-precursor, precursor'], correct: 2, explanation: 'A disruption evolves through a pre-precursor phase (conditions drift toward instability), a precursor phase (onset of MHD instability, ~10 ms), a thermal quench (core temperature collapse, ~1 ms), and finally a current quench (current decays to zero, e.g. at ~100 MA/s). (Lecture 05, Folie 38)' },
  { id: 'qz_kf_l05_47', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'A Vertical Displacement Event (VDE) is specifically associated with the instability of…', options: ['vertically elongated plasmas against vertical displacement', 'circular, unelongated plasmas against horizontal displacement', 'the tungsten divertor tiles against sputtering by the plasma', 'the central solenoid winding against thermal overheating'], correct: 0, explanation: 'A VDE arises from the inherent instability of vertically elongated plasmas to gross vertical displacement, which can be triggered by a control system failure or as a consequence of another disruption; large VDEs are considered rare accidental events to be avoided. (Lecture 05, Folie 40)' },
  { id: 'qz_kf_l05_48', category: 'L5 — Tokamaks: Plasma Main Operation', question: 'During a large Vertical Displacement Event, the halo current is best described as…', options: ['the current that provides the ohmic heating during the ramp-up phase', 'a current induced purely inside the winding of the central solenoid', 'a share of the plasma current closing through in-vessel structures', 'a current that circulates only within the toroidal field coil casings'], correct: 2, explanation: 'As the plasma contacts the plasma-facing components during a VDE, the halo current — a portion of the plasma current flowing along field lines and then through the conductive vacuum vessel and in-vessel components — closes its circuit there, generating large forces that must be accounted for in structural design. (Lecture 05, Folie 40, 42)' },
],

      {
        id: 'kf6', name: 'Superconducting Magnets', icon: '🧲', color: '#0a84ff', examWeight: 11,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 06 - Superconducting Magnets.pdf',
        quiz: [
  { id: 'qz_kf_l06_03', category: 'L6 — Superconducting Magnets', question: 'The BCS theory, developed in 1957, explains conventional superconductivity as arising from…', options: ['thermal expansion of the crystal lattice', 'classical repulsion between the electrons', 'a quantum mechanical effect near 0 K', 'flux pinning at the grain boundaries'], correct: 2, explanation: 'Bardeen, Cooper and Schrieffer (BCS, 1972 Nobel Prize) explained conventional superconductivity in metals near absolute zero as a quantum mechanical effect, distinguishing it fundamentally from classical resistive conduction. (Lecture 06, Folie 6)' },
  { id: 'qz_kf_l06_04', category: 'L6 — Superconducting Magnets', question: 'A key distinguishing feature of a superconductor compared to a normal conductor like copper is that…', options: ['a current once started persists without any external power source', 'an external power source is still required to keep the current going', 'its electrical resistance rises as the temperature is lowered further', 'a normal conductor also reaches exactly zero resistance at 0 K'], correct: 0, explanation: 'Unlike normal conductors such as copper, which retain a small residual resistance even near absolute zero due to impurities, a superconductor below its Tc can sustain a persistent current indefinitely with no external power source. (Lecture 06, Folie 6-7)' },
  { id: 'qz_kf_l06_06', category: 'L6 — Superconducting Magnets', question: 'A Type I superconductor is best characterized by…', options: ['it changes gradually to the normal state and reaches high Tc and Bc', 'it only works above the boiling point of liquid nitrogen (77 K)', 'it shows no dependence at all on the applied magnetic field', 'it loses superconductivity abruptly at one single critical field Bc'], correct: 3, explanation: 'Type I superconductors (typically pure metals) lose superconductivity abruptly once the applied magnetic field exceeds their critical value Bc, in contrast to Type II materials which transition gradually and tolerate higher fields. (Lecture 06, Folie 8)' },
  { id: 'qz_kf_l06_07', category: 'L6 — Superconducting Magnets', question: 'Compared to Type I superconductors, Type II superconductors (e.g., metal alloys, ceramics) are distinguished by…', options: ['a gradual super-to-normal transition and higher Tc and Bc values', 'an abrupt transition to the normal state at one single critical field', 'the complete absence of any limit on the critical current density', 'operation that is restricted exclusively to room temperature'], correct: 0, explanation: 'Type II superconductors transition gradually between superconducting and normal states as the magnetic field increases, and generally exhibit higher critical temperatures and fields than Type I materials, which is why they are used for high-field magnet applications. (Lecture 06, Folie 8)' },
  { id: 'qz_kf_l06_08', category: 'L6 — Superconducting Magnets', question: 'The Meissner effect refers to…', options: ['the sudden rise of the critical current density as T climbs', 'the expulsion of the magnetic field from a superconductor below Tc', 'the release of the stored energy during a magnet quench event', 'the rectification of an alternating current into a direct current'], correct: 1, explanation: 'Below Tc, a superconductor expels the magnetic field from its interior (Meissner state); the field penetrates only a very small distance (e.g. ~100 nm for most Type I materials) and decays exponentially inside the material. (Lecture 06, Folie 9)' },
  { id: 'qz_kf_l06_11', category: 'L6 — Superconducting Magnets', question: 'High Temperature Superconductors (HTS) are commonly defined as those with a critical temperature…', options: ['below the boiling point of liquid helium, i.e. about 4.2 K', 'exactly at normal room temperature, i.e. about 293 K', 'above the 77 K boiling point of nitrogen, or roughly 10-20 K', 'above the melting point of pure niobium metal'], correct: 2, explanation: 'Since there is no universal consensus, HTS are typically defined either as materials with Tc above the 77 K boiling point of nitrogen, or as those whose practical operating temperature exceeds about 10-20 K, distinguishing them from LTS. (Lecture 06, Folie 11)' },
  { id: 'qz_kf_l06_13', category: 'L6 — Superconducting Magnets', question: 'The three critical limits that together define the critical surface of a superconductor are…', options: ['critical temperature, critical pressure and critical density', 'critical temperature, critical field, critical current density', 'critical voltage, critical resistance and critical inductance', 'critical strain, critical stress and critical fatigue limit'], correct: 1, explanation: 'A superconductor operates only within a three-dimensional envelope bounded by the critical temperature Tc, critical magnetic field Bc, and critical current density Jc; exceeding any one of these limits destroys superconductivity. (Lecture 06, Folie 12)' },
  { id: 'qz_kf_l06_15', category: 'L6 — Superconducting Magnets', question: 'A quench in a superconducting magnet is best described as…', options: ['a sudden return to the resistive state, dumping the stored energy', 'a slow and controlled reduction of the magnet operating current', 'the routine shutdown procedure at the end of every plasma pulse', 'a rise of the critical current density caused by extra cooling'], correct: 0, explanation: 'A quench occurs when the conductor suddenly transitions from superconducting back to resistive, producing a fast, large release of stored magnetic energy that heats the coolant and conductor; this is why an adequate temperature margin and a dedicated protection system are required. (Lecture 06, Folie 12)' },
  { id: 'qz_kf_l06_25', category: 'L6 — Superconducting Magnets', question: 'According to the lecture, superconducting magnets are essential for fusion devices mainly because they allow…', options: ['all mechanical support structures around the coils to be omitted', 'full operation without any cryogenic cooling system whatsoever', 'tritium to be bred directly inside the coil windings themselves', 'high fields with good space economy and negligible Joule losses'], correct: 3, explanation: 'Since the fusion triple product nTτE requires high magnetic fields (B is proportional to coil current), superconducting magnets provide the needed high current and field with very low energy consumption (no Joule losses) and reasonable use of space, unlike resistive magnets. (Lecture 06, Folie 17)' },
  { id: 'qz_kf_l06_30', category: 'L6 — Superconducting Magnets', question: 'A cable-in-conduit conductor (CICC), as used for ITER magnets, was developed primarily to address the need for…', options: ['the wish to cut manufacturing cost above every other consideration', 'the volume, energy handling and stability of high-field magnets', 'the need to operate the conductor at plain room temperature levels', 'the goal of doing away with any conductor jacket altogether'], correct: 1, explanation: 'Cable-in-conduit conductors bundle many superconducting strands within a structural jacket that also provides a cooling channel, a design driven by the large stored energy, volume, and stability requirements of high-performance fusion magnets such as those in ITER. (Lecture 06, Folie 22)' },
  { id: 'qz_kf_l06_31', category: 'L6 — Superconducting Magnets', question: 'In the ITER magnet system, NbTi conductor is used for the PF coils (fields below 7 T), while Nb3Sn is used for the higher-field TF coils and Central Solenoid mainly because…', options: ['NbTi is considerably more expensive to purchase than Nb3Sn', 'NbTi simply cannot be manufactured into cabled conductors', 'Nb3Sn reaches up to about 14 T, whereas NbTi stops at 6-7 T', 'Nb3Sn requires no heat treatment at all, whereas NbTi does'], correct: 2, explanation: 'Since NbTi is limited to roughly 6-7 T while Nb3Sn can operate up to about 14 T, ITER uses NbTi for the lower-field PF coils and Nb3Sn for the higher-field TF coils and Central Solenoid, despite Nb3Sn\'s more complex and costly manufacturing. (Lecture 06, Folie 23)' },
  { id: 'qz_kf_l06_37', category: 'L6 — Superconducting Magnets', question: 'The Toroidal Field (TF) Magnet in a tokamak is best described as…', options: ['a coil pulsed only briefly during the plasma start-up phase', 'the coil that induces the plasma current by transformer action', 'a coil used solely for vertical position control of the plasma', 'a permanently energized coil making the main confinement field'], correct: 3, explanation: 'The TF magnet provides the basic toroidal confinement field and remains constantly energized throughout operation, unlike the pulsed Central Solenoid, and it must withstand large centripetal and out-of-plane electromagnetic forces. (Lecture 06, Folie 36)' },
  { id: 'qz_kf_l06_38', category: 'L6 — Superconducting Magnets', question: 'The Central Solenoid in a tokamak primarily functions as…', options: ['the transformer primary that induces the plasma current and heats it', 'a passive structural support element that stiffens the TF coil cage', 'the source of the toroidal field that confines the plasma column', 'a purely diagnostic coil without any role in the plasma control'], correct: 0, explanation: 'The Central Solenoid acts as the primary transformer coil: by ramping its current, it induces the plasma current (like the secondary of a transformer) and thereby also provides ohmic heating of the plasma. (Lecture 06, Folie 36)' },
  { id: 'qz_kf_l06_39', category: 'L6 — Superconducting Magnets', question: 'The Poloidal Field (PF) Coils in a tokamak are primarily responsible for…', options: ['inducing the plasma current by transformer action', 'vertical stability, shaping and position control', 'generating the toroidal confinement field of the machine', 'breeding the tritium inside the blanket modules'], correct: 1, explanation: 'The PF coils are responsible for vertical stability of the plasma column as well as shaping and controlling the plasma cross-section, complementing the TF magnet (confinement) and Central Solenoid (current drive/heating). (Lecture 06, Folie 36)' },
],

      {
        id: 'kf7', name: 'In-Vessel Components', icon: '🛡️', color: '#ff453a', examWeight: 12,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 07 - In Vessel Components.pdf',
        quiz: [
{ id: 'qz_kf_l07_01', category: 'L7 — In-Vessel Components', question: 'In-Vessel Components are best defined as…', options: ['all the superconducting coils that surround the vacuum vessel', 'all the components sitting inside the machine vacuum vessel', 'the external heating and fuelling hardware in the tokamak hall', 'only the plasma diagnostics mounted onto the cryostat wall'], correct: 1, explanation: 'The lecture explicitly defines In-Vessel Components as all components inside the Vacuum Vessel, including plasma facing components, thermal shields, diagnostics, and auxiliary systems such as cable/cooling networks. (Lecture 07, Folie 4)' },
{ id: 'qz_kf_l07_02', category: 'L7 — In-Vessel Components', question: 'Which two systems make up the main ITER In-Vessel Components discussed in this lecture?', options: ['The Shielding Blanket System and the Divertor', 'The toroidal and the poloidal field coil sets', 'The cryopumps and the glow discharge electrodes', 'The vacuum vessel and the surrounding cryostat'], correct: 0, explanation: 'The lecture identifies the Shielding Blanket System and the Divertor as the two main ITER In-Vessel Components covered, each consisting of plasma facing components with armour, heat sink, and support structures. (Lecture 07, Folie 5)' },
{ id: 'qz_kf_l07_03', category: 'L7 — In-Vessel Components', question: 'The Plasma Facing Components (PFC) of a fusion reactor are structurally composed of…', options: ['vacuum pumps, isolation valves and pressure measuring gauges', 'superconducting cable, insulation and cryogenic coolant piping', 'plasma-facing armour, a heat sink, and supports with piping', 'one single monolithic block of solid tungsten metal'], correct: 2, explanation: 'The lecture states PFCs consist of an armour layer facing the plasma, a heat sink to remove the deposited power, and support structures and/or piping to carry coolant and mechanical loads. (Lecture 07, Folie 9)' },
{ id: 'qz_kf_l07_04', category: 'L7 — In-Vessel Components', question: 'In the ITER design, which armour material is used for the divertor targets, and which for the blanket first wall?', options: ['Beryllium on the divertor targets, tungsten on the first wall', 'CFC on the divertor targets as well as on the blanket first wall', 'Stainless steel on the divertor targets and on the first wall', 'Tungsten on the divertor targets, beryllium on the first wall'], correct: 3, explanation: 'ITER pairs tungsten armour on the divertor targets, which face the most intense heat and particle fluxes, with beryllium armour on the blanket first wall, chosen for its low atomic number and benign effect on the plasma. (Lecture 07, Folie 9)' },
{ id: 'qz_kf_l07_07', category: 'L7 — In-Vessel Components', question: 'Beryllium is favoured for the ITER first wall armour mainly because…', options: ['its low atomic number keeps Zeff and plasma pollution small', 'it has by far the highest melting point of all candidates', 'it has the highest thermal conductivity of all armours', 'it is practically immune to sputtering by the plasma'], correct: 0, explanation: 'Beryllium\'s low atomic number minimizes the effective charge Zeff introduced into the plasma if eroded, limiting radiative (bremsstrahlung) losses and fuel dilution, which is why ITER selected it for the first wall despite its relatively low melting point. (Lecture 07, Folie 14)' },
{ id: 'qz_kf_l07_08', category: 'L7 — In-Vessel Components', question: 'The copper alloy CuCrZr is chosen as the standard heat sink material for plasma facing components primarily because it…', options: ['it has the lowest atomic number to be found among all of the metals', 'it combines high thermal conductivity with hot strength', 'it is completely immune to activation under neutron irradiation', 'its thermal conductivity is lower than steel, which saves on cost'], correct: 1, explanation: 'CuCrZr retains high thermal conductivity together with good high-temperature mechanical strength, avoiding the ductility issues of alternatives, which is why it is the preferred heat sink material joined to the armour and to stainless steel support structures. (Lecture 07, Folie 15)' },
{ id: 'qz_kf_l07_19', category: 'L7 — In-Vessel Components', question: 'The primary function of the ITER Shielding Blanket System (SBS) is to…', options: ['Generate the toroidal confinement magnetic field of the machine', 'Breed all the tritium that the entire ITER fuel cycle consumes', 'Induce the plasma current by acting as a transformer core coil', 'Shield vessel and magnets, and limit the plasma impurities'], correct: 3, explanation: 'The SBS surrounds most of the plasma surface and its basic functions are to shield the vacuum vessel, magnets and external components from thermal and nuclear loads, to minimize impurity content in the plasma, and to withstand electromagnetic forces during instabilities. (Lecture 07, Folie 28)' },
{ id: 'qz_kf_l07_20', category: 'L7 — In-Vessel Components', question: 'The modular design of the ITER Shielding Blanket System is chosen primarily to allow…', options: ['each module to be replaced on its own by remote handling', 'a single seamless monolithic structure of maximum mechanical strength', 'direct hands-on human access so that replacement can be done manually', 'the water cooling of the individual modules to be dispensed with entirely'], correct: 0, explanation: 'Modularity enables individual blanket modules (limited to about 4.5 t due to remote-handling capacity) to be replaced independently through the equatorial ports without requiring full disassembly of the machine. (Lecture 07, Folie 30)' },
{ id: 'qz_kf_l07_24', category: 'L7 — In-Vessel Components', question: 'Surface erosion (sputtering) of plasma facing components is a serious concern mainly because eroded particles can…', options: ['immediately quench the superconducting magnets around the vessel', 'push the plasma current far beyond its design limit value', 'raise Zeff, dilute the fuel and trap tritium by codeposition', 'reduce the neutron wall loading essentially down to zero'], correct: 2, explanation: 'Sputtered impurities migrating into the plasma raise Zeff and radiative losses while diluting D-T fuel; when eroded carbon or beryllium compounds redeposit, they can trap tritium ("codeposition"), increasing the in-vessel tritium inventory and raising safety concerns. (Lecture 07, Folie 33)' },
{ id: 'qz_kf_l07_27', category: 'L7 — In-Vessel Components', question: 'The primary function of the ITER divertor is to…', options: ['Generate the plasma current by means of transformer action', 'Exhaust fusion heat and helium ash, and shield the walls', 'Breed the tritium fuel directly inside the plasma volume', 'Provide the main toroidal magnetic field of the machine'], correct: 1, explanation: 'Located at the bottom of the vacuum vessel, the divertor removes power and helium ash exhaust from the plasma edge, limits impurity contamination of the core plasma, and shields the surrounding vessel walls from thermal and neutronic loads. (Lecture 07, Folie 43)' },
{ id: 'qz_kf_l07_29', category: 'L7 — In-Vessel Components', question: 'The ITER divertor vertical targets must sustain a steady-state heat flux of about…', options: ['1 MW/m2, and 2 MW/m2 during slow transients', '100 MW/m2 continuously, without any transients', '10 MW/m2, and 20 MW/m2 during slow transients', '0.1 MW/m2, i.e. less than the first wall load'], correct: 2, explanation: 'The lecture states the ITER divertor vertical targets are estimated to sustain about 10 MW/m2 in steady state and up to 20 MW/m2 during slow transients — several times higher than the 5 MW/m2 design value for the first wall, reflecting the intense particle bombardment at the strike points. (Lecture 07, Folie 44)' },
{ id: 'qz_kf_l07_30', category: 'L7 — In-Vessel Components', question: 'Tungsten was selected as the ITER divertor target armour material largely because it has…', options: ['the highest melting point of all metals, confirmed by HHF tests', 'the lowest density to be found among all the candidate metals', 'the lowest thermal conductivity, which unloads the heat sink', 'no compatibility with water cooling of the target whatsoever'], correct: 0, explanation: 'Tungsten\'s exceptionally high melting point makes it best suited to survive the intense, concentrated heat fluxes at the divertor strike points; this was confirmed by an international R&D effort and successful prototype high-heat-flux testing. (Lecture 07, Folie 44)' },
],

      {
        id: 'kf8', name: 'Vacuum Vessel and Cryostat', icon: '🫙', color: '#64d2ff', examWeight: 10,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 08 - Vacuum Vessel and Cryostat.pdf',
        quiz: [
  { id: 'qz_kf_l08_01', category: 'L8 — Vacuum Vessel and Cryostat', question: 'The ITER vacuum vessel is best described as…', options: ['a single-wall aluminium chamber that merely supports the magnets', 'a thermal shield placed between the cryostat and the magnet system', 'a superconducting structure that produces the poloidal field', 'a sealed double-wall steel container that is the first barrier'], correct: 3, explanation: 'The vacuum vessel is a hermetically sealed steel container housing the fusion reactions; it provides the high-vacuum environment for the plasma and acts as the primary (first) confinement barrier for radioactivity. (Lecture 08, Folie 8)' },
  { id: 'qz_kf_l08_02', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Which of the following is NOT one of the main functions of the ITER vacuum vessel listed in the lecture?', options: ['Acting as the primary confinement barrier for the radioactivity', 'Providing the high-vacuum environment that the plasma requires', 'Breeding the tritium fuel directly inside its double steel walls', 'Mechanically supporting in-vessel parts like blanket and divertor'], correct: 2, explanation: 'Tritium breeding is a function of the blanket modules, not of the vacuum vessel structure itself; the vessel provides vacuum, shielding/stability, containment, and mechanical support. (Lecture 08, Folie 8)' },
  { id: 'qz_kf_l08_04', category: 'L8 — Vacuum Vessel and Cryostat', question: 'The 44 openings ("ports") in the ITER vacuum vessel primarily serve to…', options: ['give access for remote handling, diagnostics, heating and pumping', 'cut down the overall structural weight of the vessel considerably', 'let the plasma expand outwards beyond the first wall panels', 'act as the main structural mounting points of the PF coils'], correct: 0, explanation: 'The 44 ports provide access for remote handling operations, diagnostics, heating systems, and vacuum pumping/systems. (Lecture 08, Folie 9)' },
  { id: 'qz_kf_l08_05', category: 'L8 — Vacuum Vessel and Cryostat', question: 'In a tokamak, why is a larger vacuum chamber (vessel) volume advantageous?', options: ['It cuts down the amount of shielding material that is needed', 'It removes the need for a surrounding cryostat altogether', 'It reduces the number of vacuum pumps that the machine needs', 'It makes confinement and the high-energy regime easier'], correct: 3, explanation: 'The lecture states that the larger the vacuum chamber volume, the easier it is to confine the plasma and achieve the high-energy regime required to produce significant fusion power. (Lecture 08, Folie 9)' },
  { id: 'qz_kf_l08_12', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Which material is used for the main vessel body and the double-wall port components of the ITER vacuum vessel?', options: ['SS 304B7', 'Inconel 718', 'SS 316L(N)-IG', 'SS 430'], correct: 2, explanation: 'SS 316L(N)-IG is the main material for the vessel body and double-wall port components, chosen for high mechanical strength, corrosion resistance, good fabrication properties, and relatively low cost. (Lecture 08, Folie 14)' },
  { id: 'qz_kf_l08_15', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Why must cobalt content be kept very low (e.g. below 500 ppm) in the vacuum vessel steels?', options: ['Cobalt markedly reduces the weldability of the vessel steel', 'Cobalt activates strongly under neutrons and emits hard gammas', 'Cobalt raises the magnetic permeability and disturbs the field', 'Cobalt lowers the corrosion resistance of the vessel steel'], correct: 1, explanation: 'Cobalt has a large neutron capture cross section, so even small amounts lead to strong activation and gamma emission after neutron irradiation, so it is tightly limited. (Lecture 08, Folie 15)' },
  { id: 'qz_kf_l08_30', category: 'L8 — Vacuum Vessel and Cryostat', question: 'The cryostat is best described as…', options: ['the large vacuum chamber enclosing the vessel and all magnets', 'a small chamber that only houses the cryopumps of the machine', 'simply another name for the vacuum vessel of the tokamak', 'the cooling-water loop that serves the first wall panels'], correct: 0, explanation: 'Along with the magnet systems, the ITER vacuum vessel is entirely enclosed in a large vacuum chamber called the cryostat. (Lecture 08, Folie 9)' },
  { id: 'qz_kf_l08_31', category: 'L8 — Vacuum Vessel and Cryostat', question: 'The primary purpose of the ITER cryostat vacuum is to…', options: ['to breed the tritium fuel from lithium inside the blanket modules', 'to block convective heat to the magnets, and be the 2nd barrier', 'to cool the plasma-facing components directly with pressurized water', 'to raise the pressure around the vessel for extra rigidity'], correct: 1, explanation: 'The cryostat vacuum environment prevents convective heat transfer to the superconducting magnets/cold structures and forms the secondary (outer) confinement barrier for the radioactive inventory inside the vacuum vessel. (Lecture 08, Folie 36)' },
  { id: 'qz_kf_l08_36', category: 'L8 — Vacuum Vessel and Cryostat', question: 'What is the function of the large bellows situated between the cryostat and the vacuum vessel?', options: ['To pump the vacuum vessel down to UHV pressure levels quickly', 'To filter the neutron radiation passing between the chambers', 'To provide an electrical ground between vessel and cryostat', 'To take up thermal contraction and expansion of structures'], correct: 3, explanation: 'Large bellows between the cryostat and vacuum vessel accommodate thermal contraction and expansion of the structures that occur during operation, preventing mechanical stress buildup. (Lecture 08, Folie 37)' },
  { id: 'qz_kf_l08_41', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Inside the cryostat, high vacuum is necessary mainly in order to…', options: ['to confine the hot fusion plasma inside the chamber directly', 'to store the tritium inventory of the reactor in a safe way', 'to reach and hold the cryogenic conditions the magnets need', 'to shield the operators against escaping neutron radiation'], correct: 2, explanation: 'High vacuum inside the cryostat (typically 10⁻⁷ to 10⁻⁸ mbar) is needed to reach and maintain cryogenic conditions by eliminating convective/conductive heat transfer to the cold magnet structures. (Lecture 08, Folie 48)' },
  { id: 'qz_kf_l08_42', category: 'L8 — Vacuum Vessel and Cryostat', question: 'What are the typical target vacuum pressure levels inside the cryostat versus inside the vacuum vessel (plasma chamber)?', options: ['Cryostat 10³ mbar; vacuum vessel 10⁻³ mbar', 'Cryostat 10⁻⁷…10⁻⁸ mbar; vacuum vessel 10⁻⁹ mbar', 'Cryostat 10⁻⁹ mbar; vacuum vessel roughly 1 bar', 'Cryostat and vacuum vessel both at 10⁻³ mbar'], correct: 1, explanation: 'The cryostat operates at 10⁻⁷ to 10⁻⁸ mbar, while the vacuum vessel plasma chamber requires ultra-high vacuum (UHV) of 10⁻⁹ mbar or better. (Lecture 08, Folie 48)' },
  { id: 'qz_kf_l08_46', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Cryopumps achieve gas removal by which mechanism?', options: ['Ionizing the gas molecules and driving them out an exhaust port', 'Chemically reacting with the gas molecules to form a solid deposit', 'Mechanically compressing the gas with rotating turbomolecular blades', 'Freezing the gas molecules onto surfaces at liquid-helium temperature'], correct: 3, explanation: 'Cryopumps work by cryocondensation/cryosorption: gas molecules freeze and are captured on surfaces held at liquid-helium temperature, which is especially effective at the low pressures where mechanical pumps fail. (Lecture 08, Folie 53)' },
  { id: 'qz_kf_l08_47', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Why are cryopumps particularly necessary for fusion devices with long plasma pulses?', options: ['They keep the discharge clean by removing helium ash and gas', 'They are the only pumps that can remove tritium by chemical means', 'They generate the magnetic shielding of the vacuum vessel itself', 'They make any kind of roughing pump completely unnecessary here'], correct: 0, explanation: 'For fusion devices, cryopumps are necessary to maintain clean discharges by removing helium ash, unburnt fuel, and other exhaust gases, which is especially important as pulse length increases. (Lecture 08, Folie 53)' },
  { id: 'qz_kf_l08_52', category: 'L8 — Vacuum Vessel and Cryostat', question: 'Why must the ITER vacuum vessel be fully welded rather than joined with bolted/gasketed flanges?', options: ['Welding is simply cheaper than bolting for very large structures', 'Bolted flanges could not carry the full dead weight of the vessel', 'It is a nuclear safety rule: the barrier must stay leak-tight', 'Welding makes it easier to take the vessel apart for servicing'], correct: 2, explanation: 'The wrap-up slide states that the ITER vacuum vessel will be fully welded as a nuclear safety requirement, since welded joints avoid the leak paths and containment weaknesses of bolted/gasketed connections. (Lecture 08, Folie 57)' },
],

      {
        id: 'kf9', name: 'Fuel Cycle and Breeding Blankets', icon: '🔋', color: '#bf5af2', examWeight: 9,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 09 - Fuel Cycle and Breeding Blankets.pdf',
        quiz: [
  { id: 'qz_kf_l09_01', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'Tritium is best described as…', options: ['a stable isotope of hydrogen that is abundant in ordinary seawater', 'a radioactive lithium isotope used as a neutron multiplier', 'a radioactive hydrogen isotope that beta-decays into helium-3', 'a stable isotope of helium employed as the reactor coolant'], correct: 2, explanation: 'Tritium (³H) is a radioactive hydrogen isotope with a half-life of 12.32 years that decays via beta emission into helium-3, releasing about 18.6 keV of energy. (Lecture 09, Folie 6)' },
  { id: 'qz_kf_l09_02', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'The half-life of tritium is approximately…', options: ['5.7 years', '24.6 years', '100 years', '12.3 years'], correct: 3, explanation: 'Tritium has a half-life of 12.32 ± 0.02 years, decaying at a rate of about 5.47%/year, which is why it cannot simply be stockpiled long-term and must be bred continuously in a fusion reactor. (Lecture 09, Folie 6)' },
  { id: 'qz_kf_l09_06', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'The main reason the D-T reaction is preferred over D-D or D-³He for earth-based fusion is that…', options: ['low ignition temperature, large cross section, high yield', 'it releases no neutrons at all, which simplifies the shielding design', 'its tritium fuel occurs naturally and needs no breeding step at all', 'it needs the poorest confinement quality of all the fusion reactions'], correct: 0, explanation: 'D-T fusion is exothermic with a favorable cross section and reaches its reaction-rate peak at a relatively low temperature (~66 keV, ~730 million °C) compared to alternative fuel cycles, making it the most practical near-term choice despite tritium needing to be bred. (Lecture 09, Folie 9)' },
  { id: 'qz_kf_l09_11', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'A fusion plant fuel cycle is described as "closed" because…', options: ['tritium is never taken out of the machine once it has been bred', 'ash is removed, the isotopes separated, unburnt D and T reinjected', 'no fuel of any kind ever leaves the vacuum vessel during a pulse', 'the plasma burns up completely and leaves no exhaust behind'], correct: 1, explanation: 'In a closed fuel cycle, exhaust gases must be extracted from the vessel, the hydrogen isotopes separated, and the unburnt deuterium and tritium reinjected as new fuel — none of the valuable fuel is simply discarded. (Lecture 09, Folie 12)' },
  { id: 'qz_kf_l09_12', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'The primary purpose of tritium breeding in a fusion reactor is to…', options: ['to shield the superconducting magnets against radiation damage', 'to moderate the fast fusion neutrons before the divertor', 'to turn fusion neutrons into fresh tritium using lithium', 'to generate the toroidal magnetic field of the machine'], correct: 2, explanation: 'Since natural tritium supply is far too small for reactor operation, fusion neutrons are absorbed by lithium-enriched blanket materials surrounding the plasma to produce new tritium, closing the fuel cycle. (Lecture 09, Folie 12)' },
  { id: 'qz_kf_l09_13', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'Which of the following is NOT one of the four main functions of a breeding blanket described in the lecture?', options: ['Turning the energy of neutrons and gammas into usable heat', 'Providing radiation shielding and a physical plasma boundary', 'Breeding, extracting and controlling the tritium inventory', 'Inducing the plasma current by acting as a transformer'], correct: 3, explanation: 'The blanket\'s four functions are tritium breeding, power extraction, acting as the physical boundary around the plasma, and radiation shielding of the vacuum vessel — inducing plasma current is instead the role of the central solenoid/transformer, not the blanket. (Lecture 09, Folie 14)' },
  { id: 'qz_kf_l09_17', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'The two fundamental lithium neutron-capture reactions occurring in the blanket differ mainly in that…', options: ['the ⁷Li reaction yields no tritium at all, only helium and one neutron', '⁶Li is exothermic with slow neutrons, ⁷Li endothermic with fast ones', 'both reactions are endothermic and both need fast neutrons exclusively', 'the ⁶Li reaction runs only in liquid-metal breeders, never in ceramics'], correct: 1, explanation: '⁶Li + n → ⁴He + ³H releases +4.78 MeV and has a very high cross section at low neutron energies, whereas ⁷Li + n → ⁴He + ³H + n absorbs 2.47 MeV and works with high-energy neutrons while regenerating a neutron usable for further reactions. (Lecture 09, Folie 17)' },
  { id: 'qz_kf_l09_19', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'Among the three main 14 MeV neutron multiplier candidates (Li-7, Be-9, Pb), beryllium is characterized by…', options: ['a very low melting point of roughly 235 degrees Celsius only', 'the highest density of the three, activating into polonium-210', 'direct usability as a reactor coolant with virtually no drawbacks', 'cheap and available, but reacts with water/air and traps tritium'], correct: 3, explanation: 'Beryllium has a low threshold for (n,2n) reactions and good moderating ability, but it reacts strongly with water and air, is toxic as dust, and strongly traps tritium making recovery difficult — distinguishing it from lead (low melting point, polonium activation) and Li-7 (used as coolant, high availability). (Lecture 09, Folie 20)' },
  { id: 'qz_kf_l09_21', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'The Tritium Breeding Ratio (TBR) is defined as…', options: ['the fraction of the fusion neutrons absorbed by the first wall', 'the tritium bred divided by the tritium burnt in the reactor', 'the tritium burnt divided by the tritium bred in the reactor', 'the ratio of deuterium to tritium inside the fuel mixture'], correct: 1, explanation: 'TBR is the amount of tritium bred divided by the amount of tritium consumed by fusion reactions; for a self-sufficient reactor this ratio must exceed 1 to compensate for losses, decay, and the need to fuel new plants. (Lecture 09, Folie 23)' },
  { id: 'qz_kf_l09_22', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'For a fusion reactor to be tritium self-sufficient, the design target for the TBR is typically…', options: ['above 1, typically in the range 1.02-1.05', 'at least 5.0, for a large safety margin', 'below 1, since surplus tritium is hazardous', 'exactly 1.00, no more and no less'], correct: 0, explanation: 'The TBR must exceed 1 to account for losses, tritium decay, and the need to build up inventory for new plants, and is typically designed to be in the modest range of about 1.02-1.05. (Lecture 09, Folie 23)' },
  { id: 'qz_kf_l09_25', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'In the HCPB (Helium Cooled Pebble Bed) blanket concept, the breeder and multiplier materials are…', options: ['pure lithium metal cooled by a liquid sodium loop system', 'molten FLiBe salt that is cooled directly by water', 'ceramic breeder pebbles and beryllides, cooled by helium', 'a liquid lithium-lead alloy circulated at high speed'], correct: 2, explanation: 'HCPB uses RAFM steel structure with solid ceramic breeder pebbles and beryllium/beryllide multiplier pebbles, cooled by helium gas, and is the main line of European R&D for solid breeder blankets. (Lecture 09, Folie 26)' },
  { id: 'qz_kf_l09_39', category: 'L9 — Fuel Cycle and Breeding Blankets', question: 'According to the lecture wrap-up, lithium ceramics and beryllium/lead serve complementary roles in a breeding blanket because…', options: ['ceramics are the tritium breeders while Be and Pb multiply neutrons', 'lithium ceramics multiply the neutrons while beryllium breeds tritium', 'both of these material groups are used purely as coolants', 'both of these material groups act only as structural elements'], correct: 0, explanation: 'The summary distinguishes the two functional roles clearly: lithium-bearing ceramics (e.g. Li4SiO4, Li2TiO3) provide the tritium-breeding reaction, while beryllium and lead multiply the neutron population to sustain adequate breeding rates. (Lecture 09, Folie 48)' }
],

      {
        id: 'kf10', name: 'Plasma Heating Systems', icon: '🔥', color: '#ffd60a', examWeight: 8,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 10 - Plasma Heating Systems.pdf',
        quiz: [
  { id: 'qz_kf_l10_01', category: 'L10 — Plasma Heating Systems', question: 'Ohmic heating in a tokamak arises directly from…', options: ['resonant absorption of electromagnetic waves launched into the plasma', 'charge exchange between the injected neutrals and the plasma ions', 'neutron bombardment striking the first wall of the machine', 'the resistance of the plasma to the toroidal current it carries'], correct: 3, explanation: 'The toroidal plasma current needed to create the poloidal field also heats the plasma via resistive (Joule) dissipation from electron-ion collisions; this is the definition of Ohmic heating. (Lecture 10, Folie 6)' },
  { id: 'qz_kf_l10_02', category: 'L10 — Plasma Heating Systems', question: 'Ohmic heating becomes ineffective at high plasma temperature mainly because…', options: ['the toroidal plasma current cannot be pushed beyond about 1 MA', 'the toroidal magnetic field grows weaker as the temperature rises', 'the plasma resistivity drops with temperature, scaling as T^-3/2', 'electron-ion collisions become more frequent as temperature rises'], correct: 2, explanation: 'Plasma resistivity falls off as T^-3/2, so as the plasma gets hotter it becomes an increasingly poor resistor, and Ohmic heating power (which depends on resistance) drops sharply — this is why it cannot reach thermonuclear temperatures alone. (Lecture 10, Folie 6)' },
  { id: 'qz_kf_l10_04', category: 'L10 — Plasma Heating Systems', question: 'In Neutral Beam Injection (NBI), the beam particles must first be neutralized before entering the plasma because…', options: ['the neutralization step itself raises the kinetic energy of the beam', 'charged particles would be bent away by the field before entering', 'neutral particles undergo far more Coulomb collisions than ions do', 'only neutral particles can be accelerated by electrostatic grids'], correct: 1, explanation: 'Charged particles would be bent by the strong confinement magnetic field and driven into the vessel walls before reaching the plasma core, so the beam must travel as neutrals (which move in straight lines) and only becomes re-ionized once inside the plasma. (Lecture 10, Folie 8)' },
  { id: 'qz_kf_l10_05', category: 'L10 — Plasma Heating Systems', question: 'The NBI \'shine-through\' phenomenon refers to…', options: ['the plasma current inducing eddy currents in the vessel wall', 'RF power leaking out through the window of the vacuum vessel', 'beam power hitting the far wall because it is not fully absorbed', 'surplus tritium escaping outwards through the first wall panels'], correct: 2, explanation: 'If the plasma density or absorption length is such that too little of the beam is absorbed, unabsorbed fast neutrals continue through and strike the wall opposite the injection port, wasting power and risking wall damage — this is shine-through. (Lecture 10, Folie 13)' },
  { id: 'qz_kf_l10_07', category: 'L10 — Plasma Heating Systems', question: 'Compared to positive ion beams, negative ion beams (H⁻/D⁻) used in NBI are…', options: ['harder to produce and lower in current, but easy to neutralize', 'easy to produce at high current, but almost impossible to neutralize', 'essentially impossible to accelerate by electrostatic means at all', 'usable only for start-up heating and never for any current drive'], correct: 0, explanation: 'Negative ion sources are technically more difficult and yield lower beam current than positive ion sources, but their neutralization efficiency stays high even at very high energies, which is why they are required for the multi-hundred-keV to MeV beams needed in large devices like ITER. (Lecture 10, Folie 15)' },
  { id: 'qz_kf_l10_09', category: 'L10 — Plasma Heating Systems', question: 'For energies above about 100 keV, NBI systems must start from negative ions rather than positive ions because…', options: ['negative-ion sources deliver much higher currents at these energies', 'negative ions require no accelerator grid to reach these energies', 'positive ions cannot be accelerated to these energies in the first place', 'positive-ion neutralization drops to zero, while negatives stay near 60%'], correct: 3, explanation: 'The slides show positive-ion neutralization efficiency falling to 0% above ~200 keV, whereas negative ions maintain roughly 60% neutralization efficiency even at high energy, making them the only practical option for high-energy beams like ITER\'s 1 MeV systems. (Lecture 10, Folie 24)' },
  { id: 'qz_kf_l10_11', category: 'L10 — Plasma Heating Systems', question: 'In the ITER negative-ion NBI source, cesium is injected mainly in order to…', options: ['to cool the accelerator grids inside the ion source', 'to boost the negative-ion yield by surface production', 'to lower the plasma temperature inside the ion source', 'to neutralize the ion beam before it is accelerated'], correct: 1, explanation: 'Cesium seeding lowers the work function of the source surface, enhancing the surface production of negative ions (D⁻/H⁻), which is essential for achieving the required negative ion beam current (e.g. 40 A at 1 MeV for ITER). (Lecture 10, Folie 16)' },
  { id: 'qz_kf_l10_14', category: 'L10 — Plasma Heating Systems', question: 'Besides steady-state heating, the lecture lists which additional use of NBI in tokamaks/stellarators?', options: ['Cooling the tungsten target plates of the divertor', 'Breeding the tritium fuel inside the neutral beam', 'Driving a net plasma current for steady-state operation', 'Generating the toroidal magnetic field of the machine'], correct: 2, explanation: 'A directed flow of fast ions (I_NB) can drive a net plasma current, enabling steady-state tokamak operation; NBI is also used for heating during ramp-up/start-up and for controlling the current profile. (Lecture 10, Folie 14)' },
  { id: 'qz_kf_l10_16', category: 'L10 — Plasma Heating Systems', question: 'The three main frequency ranges used for radiofrequency/microwave plasma heating are…', options: ['electron-cyclotron, ion-cyclotron and lower-hybrid heating', 'gyrotron heating, klystron heating and tetrode heating', 'ohmic heating, bootstrap heating and neutral-beam heating', 'alpha heating, neutron heating and Bremsstrahlung heating'], correct: 0, explanation: 'ECRH heats electrons, ICRH heats ions (and electrons), and Lower Hybrid heating targets electrons and is particularly useful for current drive — these are the three resonant frequency ranges exploited in magnetically confined plasmas. (Lecture 10, Folie 30)' },
  { id: 'qz_kf_l10_18', category: 'L10 — Plasma Heating Systems', question: 'In RF heating, resonant absorption occurs at the radial location where…', options: ['the plasma density equals the critical density for wave reflection', 'the plasma temperature reaches its maximum value along the radius', 'the confining magnetic field passes exactly through zero', 'the launched frequency matches the local cyclotron frequency'], correct: 3, explanation: 'Since the cyclotron frequencies depend on the local magnetic field (which varies with position in the torus), resonance and strong energy transfer occur only where the fixed launched frequency matches the local ion or electron cyclotron frequency. (Lecture 10, Folie 32)' },
  { id: 'qz_kf_l10_27', category: 'L10 — Plasma Heating Systems', question: 'A key physics advantage of ECRH over other RF heating schemes highlighted in the lecture is that…', options: ['the launcher needs no vacuum window of any kind at all', 'near-100% single-pass absorption gives very localized heating', 'it always heats the plasma ions before it heats the electrons', 'it cannot be used to assist the plasma start-up phase at all'], correct: 1, explanation: 'ECRH benefits from near-complete single-pass wave absorption at the fundamental (or second harmonic) electron cyclotron frequency, giving strong, localized, and controllable heating/current drive without needing multiple wave passes or an antenna near the plasma. (Lecture 10, Folie 39)' },
  { id: 'qz_kf_l10_28', category: 'L10 — Plasma Heating Systems', question: 'The high-power millimeter waves for ECRH are generated by a device called the…', options: ['gyrotron', 'klystron', 'tetrode', 'diacrode'], correct: 0, explanation: 'The gyrotron is a high-power linear-beam vacuum tube in which an annular electron beam passes through a cavity in a strong DC magnetic field, converting beam energy into millimeter-wave power; latest gyrotrons (e.g. for W7-X, ITER) can produce 1 MW in steady state. (Lecture 10, Folie 40)' },
],

      {
        id: 'kf11', name: 'Cryogenic Technology', icon: '❄️', color: '#30d158', examWeight: 9,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 11 - Cryogenic Technology.pdf',
        quiz: [
  { id: 'qz_kf_l11_01', category: 'L11 — Cryogenic Technology', question: 'Cryogenics is best defined as the branch of physics studying…', options: ['vacuum technology and the pumping of gases', 'superconductivity at any given temperature', 'plasma confinement below the Coulomb barrier', 'materials and processes below roughly 120 K'], correct: 3, explanation: 'The lecture defines cryogenics (from Greek "cryos" = cold and "genis" = generating) as the study of very low temperatures (< 120 K), how to produce them, and how materials behave there. (Lecture 11, Folie 5)' },
  { id: 'qz_kf_l11_03', category: 'L11 — Cryogenic Technology', question: 'Among the fluids listed with their boiling points, which has the lowest boiling point?', options: ['Neon (27.09 K)', 'Hydrogen (20.27 K)', 'Helium-3 (3.19 K)', 'Helium-4 (4.214 K)'], correct: 2, explanation: 'The boiling-point table shows Helium-3 at 3.19 K as the lowest of the listed fluids, even lower than Helium-4 at 4.214 K, due to its lighter isotope mass affecting intermolecular binding. (Lecture 11, Folie 5)' },
  { id: 'qz_kf_l11_06', category: 'L11 — Cryogenic Technology', question: 'In the context of fusion, cryogenic technology is primarily applied to…', options: ['superconducting magnets and cryo vacuum pumps', 'the radiofrequency antennas for plasma heating', 'the lithium-bearing tritium breeding blankets', 'the plasma-facing armour of the divertor targets'], correct: 0, explanation: 'The lecture\'s list of cryogenics applications specifically names superconducting magnets and cryo vacuum pumps as the fusion-relevant uses of cryogenic technology. (Lecture 11, Folie 7)' },
  { id: 'qz_kf_l11_07', category: 'L11 — Cryogenic Technology', question: 'Why is helium the only practical fluid for cooling below about 5 K?', options: ['It is chemically inert and hence simply the safest choice', 'It alone never solidifies at low T as long as p < ~25 bar', 'It has the highest thermal conductivity of all the elements', 'It has the largest latent heat of vaporization of any fluid'], correct: 1, explanation: 'The slide explains that all other elements are solid at these temperatures, whereas helium uniquely remains a fluid (never solidifying) at low temperature as long as pressure stays below about 25 bar, making it the only usable coolant near 5 K. (Lecture 11, Folie 8)' },
  { id: 'qz_kf_l11_08', category: 'L11 — Cryogenic Technology', question: 'Superfluid helium (He II) is best described as…', options: ['a quantum state below 2.17 K with zero viscosity and superb heat flow', 'the supercritical phase of helium that is found above 5.2 K', 'a metastable solid phase of helium formed under high pressure', 'helium gas ionized into a plasma-like, electrically conductive state'], correct: 0, explanation: 'The lecture describes He II (superfluid helium, existing below the lambda point at 2.17 K) as a quantum state where all molecules behave collectively, producing zero viscosity and near-perfect heat transport, unlike normal He I. (Lecture 11, Folie 8)' },
  { id: 'qz_kf_l11_16', category: 'L11 — Cryogenic Technology', question: 'For an ideal multilayer insulation (MLI) blanket with N reflective layers between flat surfaces, the theoretical reduction factor in radiative heat exchange compared to no shielding is…', options: ['N × N', '2 × N', 'N + 1', 'N − 1'], correct: 2, explanation: 'The lecture states that for N layers under ideal conditions (flat surfaces, uniform emissivity), the radiative heat flux reduction factor is N+1, which is the theoretical basis for using many thin reflective layers in MLI. (Lecture 11, Folie 13)' },
  { id: 'qz_kf_l11_19', category: 'L11 — Cryogenic Technology', question: 'The fundamental difference between a refrigerator and a liquefier is that…', options: ['a refrigerator runs on helium only, a liquefier on nitrogen only', 'a liquefier needs no work input at all, whereas a refrigerator does', 'a refrigerator works only above 80 K, a liquefier only below it', 'a refrigerator cools isothermally, a liquefier makes liquid'], correct: 3, explanation: 'The lecture distinguishes the two: a refrigerator provides continuous isothermal cooling capacity at the working fluid\'s liquid temperature, whereas a liquefier converts a portion of the working fluid into liquid product as the final output of the process. (Lecture 11, Folie 17)' },
  { id: 'qz_kf_l11_22', category: 'L11 — Cryogenic Technology', question: 'The Claude process used for helium liquefaction is best described as…', options: ['a pure Joule-Thomson throttling process without any moving parts', 'a combination of Brayton expansion-engine and JT throttling steps', 'a purely mechanical refrigeration cycle using compressors alone', 'a variant of the Hampson-Linde cycle used for nitrogen only'], correct: 1, explanation: 'The lecture explicitly defines the Claude process as combining the Brayton expansion-engine effect with the Joule-Thomson throttling effect, and states it is the process used for liquefying helium. (Lecture 11, Folie 18, Folie 22)' },
  { id: 'qz_kf_l11_23', category: 'L11 — Cryogenic Technology', question: 'The Joule-Thomson effect describes…', options: ['the heat released when tritium is bred inside a blanket module', 'the pressure drop across the blade of a turbo-expander turbine', 'the temperature change of a real gas throttled at an orifice', 'the field change during the quench of a superconducting magnet'], correct: 2, explanation: 'The Joule-Thomson effect is defined as the temperature change of a real gas or liquid when forced through an adiabatic orifice, a process called throttling, and is the basis of the Joule-Thomson liquefaction process. (Lecture 11, Folie 19)' },
  { id: 'qz_kf_l11_24', category: 'L11 — Cryogenic Technology', question: 'At room temperature, which of the following gases WARMS (rather than cools) upon Joule-Thomson expansion through an orifice?', options: ['Helium', 'Oxygen', 'Argon', 'Nitrogen'], correct: 0, explanation: 'The lecture states that at room temperature, all gases except hydrogen, helium, and neon cool upon Joule-Thomson expansion; helium instead warms because room temperature is below its JT inversion temperature. (Lecture 11, Folie 19)' },
  { id: 'qz_kf_l11_26', category: 'L11 — Cryogenic Technology', question: 'Why can helium not be cooled directly from room temperature to cryogenic levels using simple Joule-Thomson throttling alone?', options: ['because helium has no measurable Joule-Thomson coefficient at all', 'because throttling can only ever work for liquids and not for gases', 'because helium chemically attacks the orifice at high pressures', 'its inversion temperature is only ~40 K, so at 300 K it warms up'], correct: 3, explanation: 'Since helium\'s inversion temperature at 1 bar is about 40 K, throttling it from 300 K (above the inversion temperature) causes warming rather than cooling; the lecture example shows He at 200 bar, 300 K warming to 312 K after expansion to 1 bar. (Lecture 11, Folie 21)' },
  { id: 'qz_kf_l11_41', category: 'L11 — Cryogenic Technology', question: 'The primary function of thermal shields (such as the ITER VVTS, CTS, and PTS) in a fusion reactor is to…', options: ['breed the tritium fuel from lithium inside the blanket modules', 'shield the cold mass from heat radiated by warm parts', 'generate the toroidal magnetic field of the whole machine', 'provide the vacuum sealing of the cryostat outer wall'], correct: 1, explanation: 'Thermal shields are complex insulating structures that intercept radiative heat from warm surfaces (cryostat, vacuum vessel) before it reaches the cold superconducting magnets, and are split into vacuum vessel (VVTS), cryostat (CTS), and port (PTS) thermal shields. (Lecture 11, Folie 39)' },
  { id: 'qz_kf_l11_43', category: 'L11 — Cryogenic Technology', question: 'Thermal shields are actively cooled at around 80 K mainly because…', options: ['80 K is required to keep the vacuum vessel adequately warm', '80 K happens to be the boiling point of liquid helium', 'cheap LN2 at 80 K takes most of the load off the 4 K loop', 'it prevents the confined plasma from disrupting during a pulse'], correct: 2, explanation: 'Cooling shields with LN2 at ~80 K is cost-effective since nitrogen is cheap and abundant, and the lecture shows quantitatively that the radiative term between 300 K and 80 K is about 200 times larger than between 80 K and 4 K, so intercepting heat at 80 K greatly reduces the load on the expensive 4 K refrigeration loop. (Lecture 11, Folie 40, Folie 41)' },
],

      {
        id: 'kf12', name: 'Assembly and Commissioning', icon: '🏗️', color: '#ff9f0a', examWeight: 7,
        slideDeck: 'Folien_Kernfusion/MW1112 - Lecture 12 - Assembly and Commissioning.pdf',
        quiz: [
  { id: 'qz_kf_l12_01', category: 'L12 — Assembly and Commissioning', question: 'Which of the following is NOT one of the technical challenges of fusion experiment assembly listed in the lecture?', options: ['Transportation of the components to the assembly site', 'Precise positioning and measurement of the components', 'Breeding the tritium inventory before the first plasma', 'Welding and non-destructive examination done on site'], correct: 2, explanation: 'The lecture lists seven assembly challenges: transportation to the assembly site, incoming inspections, handling of large components, precise positioning and measurement, mechanical connections, welding and NDE on site, and electrical connections and insulation. Tritium breeding is an operational task of the blanket, not an assembly challenge. (Lecture 12, Folie 5)' },
  { id: 'qz_kf_l12_02', category: 'L12 — Assembly and Commissioning', question: 'Why do the components of a large fusion experiment have to be moved as exceptional convoys at all?', options: ['because every component has to be re-manufactured on the site', 'because production site and assembly site rarely coincide', 'because the components are too radioactive to travel by daylight', 'because commercial shipping firms refuse any oversized transport'], correct: 1, explanation: 'In most cases the production site of the components does not coincide with the assembly site, so they must be shipped by land, sea or — exceptionally — air. These transports sit at the very top end of what commercial shipping companies can do and need dedicated planning and tools. (Lecture 12, Folie 6)' },
  { id: 'qz_kf_l12_03', category: 'L12 — Assembly and Commissioning', question: 'The ITER convoys travelling at night between the harbour of Marseille and the site at Cadarache are characterised by roughly…', options: ['25 convoys in total, the heaviest about 80 tonnes', '2500 convoys in total, the heaviest about 8 tonnes', '250 convoys in total, the heaviest about 80 tonnes', '250 convoys in total, the heaviest about 800 tonnes'], correct: 3, explanation: 'About 250 exceptional convoys are expected. The heaviest weighs some 800 t including the 200-t, 352-wheel transport vehicle; the tallest is 10.4 m high, the longest 33 m and the widest 11.5 m. Roads were widened, bridges reinforced and intersections rebuilt for them. (Lecture 12, Folie 6)' },
  { id: 'qz_kf_l12_04', category: 'L12 — Assembly and Commissioning', question: 'The incoming inspections carried out on site before installation serve mainly to…', options: ['make sure that no damage has occurred during transportation', 'qualify the welding procedures that will later be used on site', 'measure the neutron activation the component has picked up', 'replace the quality documentation supplied by the manufacturer'], correct: 0, explanation: 'Once components arrive on site and before they are installed, a comprehensive series of tests is run to make sure that no damage occurred during transport: visual test of the packaging, check of shock/temperature loggers, visual test of the component, pressure/flow/leak tests, electrical insulation tests and dimensional tests. (Lecture 12, Folie 15)' },
  { id: 'qz_kf_l12_05', category: 'L12 — Assembly and Commissioning', question: 'Shock and tilt indicators fixed to the packaging tell the receiving team that…', options: ['the cooling channels of the component are free of blockage', 'the electrical insulation of the component is still intact', 'the package has been subjected to an impact or to mishandling', 'the component has reached its specified cryogenic temperature'], correct: 2, explanation: 'Shock and tilt indicators are part of the check of packaging integrity: if they are triggered, the package and the component have been subject to impact or mishandling. Shock and temperature loggers additionally record all abnormal events during the journey. (Lecture 12, Folie 16-17)' },
  { id: 'qz_kf_l12_06', category: 'L12 — Assembly and Commissioning', question: 'During the visual incoming inspection, the operators look above all for…', options: ['deviations of the critical current from its specified value', 'traces of oil, cutting fluid or paint, dents and swarf', 'deviations of the helium mass flow from its design value', 'deviations of the neutron shielding factor from the requirement'], correct: 1, explanation: 'If the shock indicators show no issue the packaging is opened and the component is checked against the cleanliness and finishing requirements: traces of oil or grease, cutting fluid, paint or markings, dents or scratches on interface surfaces, and foreign material such as filings, swarf, dust or rust. A checklist guides the operators through all critical points. (Lecture 12, Folie 18)' },
  { id: 'qz_kf_l12_07', category: 'L12 — Assembly and Commissioning', question: 'Pressure, flow and leak tests are performed on arrival above all for those components that…', options: ['carry an electrical current during the plasma discharge', 'are made of a ceramic breeder material for the tritium', 'sit outside the cryostat and stay at room temperature', 'are actively cooled and carry a coolant circuit'], correct: 3, explanation: 'For actively cooled components, pressure, flow and leak tests are usually performed as incoming inspection tests, to establish that packing and shipment have not damaged the component before it is connected to the cooling system of the experiment. (Lecture 12, Folie 22)' },
  { id: 'qz_kf_l12_08', category: 'L12 — Assembly and Commissioning', question: 'The electrical incoming inspection of magnet coils, current leads and joint boxes typically consists of…', options: ['high-voltage DC and AC tests plus sensor and cable checks', 'a laser tracking survey and a photogrammetric 3D measurement', 'a helium leak test followed by a pressure and a flow test', 'an ultrasonic weld inspection and a dye penetrant examination'], correct: 0, explanation: 'The electrical tests are repeated on arrival because an electrical fault during operation can jeopardise both machine operation and the overall investment. They comprise high-voltage DC tests, high-voltage AC tests, sensor tests, and sensor cable continuity and resistance-to-ground tests. (Lecture 12, Folie 26)' },
  { id: 'qz_kf_l12_09', category: 'L12 — Assembly and Commissioning', question: 'The dimensional check on arrival is done by laser metrology while the component is still on its transport frame, in order to…', options: ['save the cost of a full quality documentation from the factory', 'measure every single dimension of the component in full detail', 'exclude deformations that could have occurred during transport', 'replace the laser tracker survey carried out later in the pit'], correct: 2, explanation: 'All components leave the factory with a complete QA documentation that already includes the geometrical dimensions, so only the most important dimensions are re-measured on arrival — the purpose of this metrology is specifically to exclude deformations that occurred during transport, so that there are no surprises in the assembly hall. (Lecture 12, Folie 31)' },
  { id: 'qz_kf_l12_10', category: 'L12 — Assembly and Commissioning', question: 'Handling fusion components is unusually demanding compared with conventional plant engineering mainly because…', options: ['the assembly hall is far larger than a conventional plant site', 'their weight-to-volume ratio is high: single lifts exceed 1000 t', 'the components may only be moved by hand and never by crane', 'the individual components are much lighter than conventional ones'], correct: 1, explanation: 'For fusion components the ratio of weight to volume is particularly high: several components weighing 1000 t and more have to be moved in a single lift. In conventional engineering the plants may be larger, but the individual components are generally lighter — which is why ITER needed dedicated lifting, uplifting, sub-assembly and in-pit tools. (Lecture 12, Folie 34)' },
  { id: 'qz_kf_l12_11', category: 'L12 — Assembly and Commissioning', question: 'The pre-assembled ITER module that is lowered into the tokamak pit in one single lift consists of…', options: ['the complete central solenoid together with all the PF coils', 'the divertor cassettes together with the blanket modules', 'the cryostat base together with the lower cylinder section', 'a vacuum vessel sector, its thermal shield and two TF coils'], correct: 3, explanation: 'A complete module — one vacuum vessel sector, the corresponding thermal shield and two toroidal field coils — is pre-assembled with the sub-assembly tools and then moved and lowered into the pit as one piece, with a total weight of 1380 t. (Lecture 12, Folie 50-54)' },
  { id: 'qz_kf_l12_12', category: 'L12 — Assembly and Commissioning', question: 'Metrology, the science of measurement, is applied during assembly mainly by means of…', options: ['laser tracking, laser scanning and photogrammetry', 'ultrasonic testing, radiography and eddy current probes', 'strain gauges, thermocouples and pressure transducers', 'glow discharge cleaning, baking and helium leak detection'], correct: 0, explanation: 'Metrology gives several tools for validating the assembly work: laser tracking, laser scanning and photogrammetry. They can be used together or individually to verify the position of installed components and to monitor their deformation during installation and operation. (Lecture 12, Folie 55)' },
  { id: 'qz_kf_l12_13', category: 'L12 — Assembly and Commissioning', question: 'A laser tracker determines the position of a point on a component by measuring…', options: ['the point cloud of a whole surface, without any reflector', 'the time of flight of an ultrasonic pulse through the air', 'the distance to a reflector plus its own head angles', 'the deflection of a mechanical probe touching the surface'], correct: 2, explanation: 'A laser tracker optically measures the distance between its laser source and a special reflector, plus the head angles of rotation with respect to its base, reaching a precision of 10 microns and better — provided that stationary reference points are measured together with the object. (Lecture 12, Folie 56)' },
  { id: 'qz_kf_l12_14', category: 'L12 — Assembly and Commissioning', question: 'Compared with a laser tracker, a laser scanner is characterised by the fact that it…', options: ['reaches a precision that is far better than that of a tracker', 'collects whole point clouds and needs no reflector at all', 'needs one reflector for every single point that it measures', 'can only be used on flat surfaces and never on curved ones'], correct: 1, explanation: 'A laser scanner repeats the distance measurement many times per second over large solid angles and thus collects point clouds without needing reflectors; the clouds are almost as precise as tracker points and allow complex surfaces to be reconstructed in 3D for digital mock-ups, so an assembly step can be tested virtually before anything is moved. (Lecture 12, Folie 58)' },
  { id: 'qz_kf_l12_15', category: 'L12 — Assembly and Commissioning', question: 'Bolted (removable) connections rather than welds are used for outer flanges and intercoil connections because…', options: ['bolted joints are the only ones that stay leak-tight under UHV', 'welded joints cannot transfer any mechanical load at all', 'bolts are cheaper than welds for every kind of connection', 'extensive welding heat could damage conductors and insulation'], correct: 3, explanation: 'Removable connections are used where components may need to be replaced or maintained and where there is no pressure-holding requirement. Bolts are used on outer flanges, which must be opened to connect new diagnostics, and on intercoil connections, where excessive welding heat could damage the conductors and the electrical insulation. Shear keys or pins are added for large shear loads. (Lecture 12, Folie 63)' },
  { id: 'qz_kf_l12_16', category: 'L12 — Assembly and Commissioning', question: 'The most delicate welding operation on the assembly site is the one on the vacuum vessel, because…', options: ['it is the main nuclear container and must be UHV-compatible', 'it is the only component on site that is made of aluminium', 'it has to be welded while the magnets are already energized', 'it is the lightest component and therefore hard to position'], correct: 0, explanation: 'Welded connections are preferred for all pressure boundaries and permanently joined components; the vacuum vessel is always welded because UHV compatibility is mandatory. It is the main nuclear container of the experiment, its geometry is challenging and its double-walled design demands careful planning, extensive validation of welding procedures and high NDT/QA standards. (Lecture 12, Folie 65)' },
  { id: 'qz_kf_l12_17', category: 'L12 — Assembly and Commissioning', question: 'The electrical joints of the magnet coils are produced either by soldering or by…', options: ['mechanical compression with a soft metal like indium', 'a bolted flange with an elastomer sealing gasket in between', 'a shrink fit produced by cooling the joint down to 4 K', 'gluing the two conductors with a glass-epoxy adhesive'], correct: 0, explanation: 'The electrical contact is normally obtained either by soldering or by mechanical compression with an intermediate soft metal such as indium. The joint must then be insulated against ground, and it has to survive more than 10000 operating cycles without any possibility of inspection or replacement. (Lecture 12, Folie 69)' },
  { id: 'qz_kf_l12_18', category: 'L12 — Assembly and Commissioning', question: 'Why is a failure of the high-voltage insulation of a magnet joint so dangerous in a machine the size of ITER?', options: ['because the whole tritium inventory would escape immediately', 'the several GJ of stored energy can drive a metal-melting arc', 'because the plasma would drop straight from H-mode into L-mode', 'because the coolant helium would boil off and warm the cryostat'], correct: 1, explanation: 'The DC voltage against ground can reach 56 kV at ITER. A failure of the HV insulation could escalate into an arc which, given the enormous stored energies at play (several GJ), would result in a devastating discharge able to melt metal and severely damage the component involved. (Lecture 12, Folie 69)' },
],
