document.getElementById('flipCard').addEventListener('click', () => {
  if (!State.cardFlipped) {
    State.cardFlipped = true;
    document.getElementById('flipCard').classList.add('flipped');
    document.getElementById('sm2Row').style.opacity = '1';
    document.getElementById('sm2Row').style.pointerEvents = 'all';
  }
});

document.getElementById('sm2Row').addEventListener('click', e => {
  const btn = e.target.closest('.sm2-btn');
  if (!btn) return;
  const rating = parseInt(btn.dataset.rating);
  const item = State.sessionItems[State.sessionIndex];
  SM2.review(item.id, rating);
  Store.markResult(item.id, rating >= 3);
  Game.addXP(rating >= 3 ? 8 : 2);
  State.sessionIndex++;
  renderStudyItem();
});

// ── Quiz Mode ────────────────────────────────────────────────────────────────
function renderQuiz(item) {
  const el = document.getElementById('mode-quiz');
  el.classList.remove('hidden');

  document.getElementById('quizCategory').textContent = item.category || '';
  document.getElementById('quizQuestion').innerHTML = formatCardText(item.question);

  const optEl = document.getElementById('quizOptions');
  const order = shuffleArray(item.options.map((_, i) => i));
  const fmtOption = s => escapeHtml(s).replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>').replace(/\^(-?[0-9]+)/g, '<sup>$1</sup>');
  optEl.innerHTML = order.map(origIdx =>
    `<button class="quiz-opt" data-idx="${origIdx}">${fmtOption(item.options[origIdx])}</button>`
  ).join('');

  document.getElementById('quizFeedback').classList.add('hidden');
  document.getElementById('quizNext').classList.add('hidden');

  const combo = document.getElementById('comboBadge');
  if (State.combo >= 2) {
    combo.classList.remove('hidden');
    document.getElementById('comboCount').textContent = State.combo;
  } else {
    combo.classList.add('hidden');
  }

  optEl.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => handleQuizAnswer(parseInt(btn.dataset.idx), item));
  });
}

/** Turn a trailing "(Lecture N, Folie X)" reference into a highlighted badge. */
function formatExplanation(text) {
  if (!text) return '';
  const escaped = formatCardText(text);
  return escaped.replace(/\((Lecture[^)]+)\)/, '<br><span class="slide-ref">📄 $1</span>');
}

function handleQuizAnswer(chosen, item) {
  const optEls = [...document.querySelectorAll('.quiz-opt')];
  optEls.forEach(b => { b.disabled = true; });

  const correct = chosen === item.correct;
  const chosenBtn = optEls.find(b => parseInt(b.dataset.idx) === chosen);
  const correctBtn = optEls.find(b => parseInt(b.dataset.idx) === item.correct);
  if (chosenBtn) chosenBtn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct && correctBtn) correctBtn.classList.add('correct');

  const fb = document.getElementById('quizFeedback');
  fb.className = 'quiz-feedback ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = (correct ? '✓ Richtig! ' : '✗ Leider falsch. Die richtige Antwort ist oben markiert. ') + formatExplanation(item.explanation);
  fb.classList.remove('hidden');

  document.getElementById('quizNext').classList.remove('hidden');
  Store.markResult(item.id, correct);
  QuizSRS.record(item.id, correct);

  if (correct) {
    State.sessionCorrect++;
    State.combo++;
    State.bestCombo = Math.max(State.bestCombo, State.combo);
    const xp = 10 + Math.min(State.combo - 1, 5) * 2; // combo bonus, capped
    Game.addXP(xp);
    showXPToast(`+${xp} XP${State.combo >= 3 ? ` · 🔥 ${State.combo}er-Combo` : ''}`);
  } else {
    State.combo = 0;
    Game.addXP(2);
  }
}

document.getElementById('quizNext').addEventListener('click', () => {
  State.sessionIndex++;
  renderStudyItem();
});

// ── Klausur-Simulation ───────────────────────────────────────────────────────
const EXAM_QUESTION_COUNT = 20;
const EXAM_SECONDS_PER_Q = 45;
let examTimerInterval = null;

function startExamSession(module) {
  const allQuiz = getModuleItemIds(module, 'quiz').map(id => DATA.getItem(id)).filter(Boolean);
  if (allQuiz.length === 0) return;
  const items = shuffleArray([...allQuiz]).slice(0, Math.min(EXAM_QUESTION_COUNT, allQuiz.length));

  State.activeModule = module;
  State.activeTopic = null;
  State.activeMode = 'quiz';
  State.examMode = true;
  State.sessionItems = items;
  State.sessionIndex = 0;
  State.sessionCorrect = 0;
  State.cardFlipped = false;
  State.combo = 0;
  State.bestCombo = 0;

  Store.updateStreak();
  showScreen('study');
  startExamTimer(items.length * EXAM_SECONDS_PER_Q);
  renderStudyItem();
}

function startExamTimer(totalSec) {
  stopExamTimer();
  const el = document.getElementById('examTimer');
  let remaining = totalSec;
  el.classList.remove('hidden', 'low');
  const tick = () => {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    el.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;
    if (remaining <= 60) el.classList.add('low');
    if (remaining <= 0) {
      stopExamTimer();
      State.sessionIndex = State.sessionItems.length;
      renderStudyItem();
      return;
    }
    remaining--;
  };
  tick();
  examTimerInterval = setInterval(tick, 1000);
}

function stopExamTimer() {
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  const el = document.getElementById('examTimer');
  if (el) el.classList.add('hidden');
}

// ── Fill Blank Mode ──────────────────────────────────────────────────────────
function renderFillBlank(item) {

  const input = document.getElementById('fillInput');

  document.getElementById('fillFeedback').classList.remove('correct','wrong');

document.getElementById('fillHint').addEventListener('click', () => {
  document.getElementById('fillHintText').classList.remove('hidden');
});

document.getElementById('fillCheck').addEventListener('click', () => checkFillBlank());
document.getElementById('fillInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkFillBlank();
});

function checkFillBlank() {
  const item = State.sessionItems[State.sessionIndex];
  const userAnswer = document.getElementById('fillInput').value.trim().toLowerCase();
  const correct = item.blank.toLowerCase();

  // Accept partial match — any correct word/phrase in the answer
  const correctParts = correct.split('/').map(p => p.trim());
  const isCorrect = correctParts.some(part =>
    userAnswer === part ||
    userAnswer.includes(part) ||
    part.includes(userAnswer)
  );

  const fb = document.getElementById('fillFeedback');
  fb.className = 'fill-feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect
    ? `✓ Richtig! Die Antwort lautet: <strong>${escapeHtml(item.blank)}</strong>`
    : `✗ Nicht ganz. Richtig wäre: <strong>${escapeHtml(item.blank)}</strong>`;
  fb.classList.remove('hidden');

  document.getElementById('fillNext').classList.remove('hidden');
  Store.markResult(item.id, isCorrect);
  Game.addXP(isCorrect ? 8 : 2);
  if (isCorrect) State.sessionCorrect++;
}

document.getElementById('fillNext').addEventListener('click', () => {
  State.sessionIndex++;
  renderStudyItem();
});

// ── Open Question Mode ───────────────────────────────────────────────────────
function renderOpenQuestion(item) {
  const el = document.getElementById('mode-open');
  el.classList.remove('hidden');

  document.getElementById('openCategory').textContent = State.activeTopic?.name || '';
  document.getElementById('openPoints').textContent = item.points || '';
  document.getElementById('openQuestion').innerHTML = formatCardText(item.question);

  const ta = document.getElementById('openAnswer');
  ta.value = '';

  document.getElementById('modelAnswer').classList.add('hidden');
  document.getElementById('selfRate').classList.add('hidden');
  document.getElementById('openReveal').classList.remove('hidden');

  document.getElementById('modelAnswer').innerHTML = formatCardText(item.answer);
}

document.getElementById('openReveal').addEventListener('click', () => {
  document.getElementById('modelAnswer').classList.remove('hidden');
  document.getElementById('selfRate').classList.remove('hidden');
  document.getElementById('openReveal').classList.add('hidden');
});

document.getElementById('selfRate').addEventListener('click', e => {
  const btn = e.target.closest('.sr-btn');
  if (!btn) return;
  const val = parseInt(btn.dataset.val);
  const item = State.sessionItems[State.sessionIndex];
  const correct = val >= 1;
  Store.markResult(item.id, correct);
  // Map self-rating to SM-2 rating for flashcard-like cards
  const sm2rating = val === 0 ? 0 : val === 1 ? 2 : 4;
  SM2.review(item.id, sm2rating);
  Game.addXP(val === 2 ? 10 : val === 1 ? 5 : 2);
  if (correct) State.sessionCorrect++;
  State.sessionIndex++;
  renderStudyItem();
});

// ── Session Complete ─────────────────────────────────────────────────────────
function showSessionComplete() {
  const total = State.sessionItems.length;
  const correct = State.sessionCorrect;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  const isGraded = State.activeMode !== 'guided' && State.activeMode !== 'open';
  const wasExam = State.examMode;
  if (wasExam) stopExamTimer();

  Game.reportCombo(State.bestCombo);
  let bonus = '';
  if (isGraded && total >= 5 && pct === 100) {
    Game.addXP(25);
    bonus = '<div style="font-size:13px;color:var(--yellow);font-weight:700;margin-bottom:12px;">🏆 Perfekte Runde! +25 Bonus-XP</div>';
  }

  document.querySelectorAll('.mode-container').forEach(c => c.classList.add('hidden'));

  const el = document.createElement('div');
  el.className = 'mode-container';
  el.style.textAlign = 'center';
  el.style.paddingTop = '40px';

  const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📚';
  const msg = wasExam ? 'Klausur-Simulation beendet' : (pct >= 80 ? 'Starke Leistung!' : pct >= 50 ? 'Guter Fortschritt!' : 'Dranbleiben!');

  let gradeHtml = '';
  if (wasExam) {
    const g = pct >= 95 ? '1,0' : pct >= 90 ? '1,3' : pct >= 85 ? '1,7' : pct >= 80 ? '2,0'
            : pct >= 75 ? '2,3' : pct >= 70 ? '2,7' : pct >= 65 ? '3,0' : pct >= 60 ? '3,3'
            : pct >= 55 ? '3,7' : pct >= 50 ? '4,0' : '5,0';
    const passed = pct >= 50;
    gradeHtml = `<div style="margin:6px auto 14px;width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${passed ? 'rgba(48,209,88,0.12)' : 'rgba(255,69,58,0.12)'};border:2px solid ${passed ? 'var(--green)' : 'var(--red)'};">
      <div style="font-size:30px;font-weight:800;color:${passed ? 'var(--green)' : 'var(--red)'};">${g}</div>
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);">Note</div>
    </div>`;
  }

  el.innerHTML = `
    <div style="font-size:56px;margin-bottom:16px;">${wasExam ? '🎓' : emoji}</div>
    <div style="font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px;">${msg}</div>
    ${gradeHtml}
    <div style="font-size:15px;color:var(--text-dim);margin-bottom:8px;">
      ${isGraded
        ? `${correct} / ${total} richtig (${pct}%)${State.bestCombo >= 3 ? ` · 🔥 beste Combo ${State.bestCombo}` : ''}`
        : `${total} Einheiten abgeschlossen`}
    </div>
    ${bonus}
    <div style="display:flex;flex-direction:column;gap:12px;max-width:320px;margin:24px auto 0;">
      <button class="btn-primary" id="btnStudyAgain">${wasExam ? '🎓 Neue Simulation' : 'Nochmal üben'}</button>
      <button class="btn-secondary" id="btnBackToTopics">Zurück zu den Themen</button>
    </div>
  `;

  document.getElementById('screen-study').appendChild(el);

  document.getElementById('btnStudyAgain').addEventListener('click', () => {
    el.remove();
    if (wasExam) startExamSession(State.activeModule);
    else startStudySession();
  });
  document.getElementById('btnBackToTopics').addEventListener('click', () => {
    el.remove();
    State.examMode = false;
    showScreen('topics');
  });

  updateStudyProgress();
  document.getElementById('studyProgressBar').style.width = '100%';
}

// ── Stats Screen ─────────────────────────────────────────────────────────────
function renderStats() {
  const el = document.getElementById('statsContent');
  const streak = Store.getStreak();
  const activeModules = MODULES.filter(m => !m.locked);

  // Global quiz breakdown across every module
  const allQuizIds = activeModules.flatMap(m => getModuleItemIds(m, 'quiz'));
  const quizGlobal = QuizSRS.getStats(allQuizIds);

  // Badge context
  const d = Store.load();
  const totalAnswered = Object.values(d).filter(x => x.seen > 0).length;
  const modulesTouched = activeModules.filter(m => getModuleItemIds(m).some(id => d[id] && d[id].seen > 0)).length;
  const perfectTopics = activeModules.flatMap(m => m.topics).filter(t => {
    const ids = getTopicItemIds(t, 'quiz');
    if (ids.length === 0) return false;
    const s = QuizSRS.getStats(ids);
    return s.mastered === ids.length;
  }).length;
  const kf = MODULES.find(m => m.id === 'kernfusion');
  const kfStats = kf ? QuizSRS.getStats(getModuleItemIds(kf, 'quiz')) : { mastered: 0, total: 1 };
  const levelInfo = Game.getLevelInfo();
  const ctx = {
    totalAnswered, streakDays: streak.dates.length, bestCombo: Game.getBestCombo(),
    quizMastered: quizGlobal.mastered, perfectTopics, level: levelInfo.level,
    kfMasteredPct: Math.round((kfStats.mastered / Math.max(kfStats.total, 1)) * 100),
    modulesTouched,
  };

  const badgeCells = BADGES.map(b => {
    const earned = b.check(ctx);
    return `<div class="badge-cell ${earned ? 'earned' : 'locked'}"><div>${b.icon}</div><div class="badge-label">${b.label}</div></div>`;
  }).join('');

  // Per-module breakdown cards
  const moduleCards = activeModules.map(m => {
    const quizIds = getModuleItemIds(m, 'quiz');
    const fcIds = getModuleItemIds(m, 'flashcard');
    const qs = QuizSRS.getStats(quizIds);
    const fs = SM2.getStats(fcIds);

    const ring = quizIds.length > 0
      ? renderMultiRing([
          { value: qs.mastered, color: '#30d158' },
          { value: qs.learning, color: '#0a84ff' },
          { value: qs.wrong, color: '#ff453a' },
          { value: qs.unseen, color: 'rgba(255,255,255,0.08)' },
        ], '', `<span>${qs.total ? Math.round((qs.mastered/qs.total)*100) : 0}%</span><div class="ring-sub">gemeistert</div>`)
      : renderRing(getModuleProgressPct(m), '#0a84ff', '', `<span>${getModuleProgressPct(m)}%</span>`);

    const topicRows = m.topics.map(t => {
      const prog = Store.getTopicProgress(t.id);
      return `
        <div class="stat-topic-row">
          <div class="st-name">${t.icon} ${t.name}</div>
          <div class="st-bar"><div class="st-fill" style="width:${prog}%;background:${t.color||'var(--blue)'}"></div></div>
          <div class="st-pct">${prog}%</div>
        </div>
      `;
    }).join('');

    return `
      <div class="module-stat-card">
        <div class="module-stat-head">
          <div style="font-size:22px;">${m.icon}</div>
          <div class="msc-name">${m.name}</div>
          ${ring}
        </div>
        ${quizIds.length > 0 ? `
          <div class="msc-legend" style="margin-bottom:12px;">
            <span><span class="msc-dot" style="background:#30d158"></span>${qs.mastered} gemeistert</span>
            <span><span class="msc-dot" style="background:#0a84ff"></span>${qs.learning} lernend</span>
            <span><span class="msc-dot" style="background:#ff453a"></span>${qs.wrong} falsch</span>
            <span><span class="msc-dot" style="background:rgba(255,255,255,0.3)"></span>${qs.unseen} neu</span>
          </div>
        ` : ''}
        ${fcIds.length > 0 ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">🗂️ Karteikarten: ${fs.learned} gelernt${fs.due > 0 ? ` · <span style="color:var(--yellow)">${fs.due} fällig</span>` : ''}</div>` : ''}
        <div style="margin-top:4px;">${topicRows}</div>
      </div>
    `;
  }).join('');

  // Streak dots (last 14 days)
  const today = new Date().toDateString();
  const last14 = Array.from({length:14}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (13-i));
    return d.toDateString();
  });
  const dots = last14.map(d => {
    const done = streak.dates.includes(d);
    const isToday = d === today;
    return `<div class="streak-dot ${done ? (isToday ? 'today' : 'done') : ''}"></div>`;
  }).join('');

  el.innerHTML = `
    <div class="stat-section" style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <h3 style="align-self:flex-start;">Alle Quizfragen im Überblick</h3>
      ${renderMultiRing([
        { value: quizGlobal.mastered, color: '#30d158' },
        { value: quizGlobal.learning, color: '#0a84ff' },
        { value: quizGlobal.wrong, color: '#ff453a' },
        { value: quizGlobal.unseen, color: 'rgba(255,255,255,0.08)' },
      ], 'ring-lg', `<span>${quizGlobal.total}</span><div class="ring-sub">Fragen gesamt</div>`)}
      <div class="msc-legend">
        <span><span class="msc-dot" style="background:#30d158"></span>${quizGlobal.mastered} gemeistert</span>
        <span><span class="msc-dot" style="background:#0a84ff"></span>${quizGlobal.learning} lernend</span>
        <span><span class="msc-dot" style="background:#ff453a"></span>${quizGlobal.wrong} falsch beantwortet</span>
        <span><span class="msc-dot" style="background:rgba(255,255,255,0.3)"></span>${quizGlobal.unseen} noch nicht gesehen</span>
      </div>
    </div>
    <div class="stat-section">
      <h3>Achievements</h3>
      <div class="badge-grid">${badgeCells}</div>
    </div>
    <div class="stat-section">
      <h3>Lern-Streak (letzte 14 Tage)</h3>
      <div class="streak-row">${dots}</div>
      <div style="margin-top:10px;font-size:13px;color:var(--text-dim);">
        ${streak.dates.length} Tage insgesamt gelernt · 🔥 beste Combo: ${Game.getBestCombo()}
      </div>
    </div>
    <div class="stat-section">
      <h3>Fortschritt pro Klausur</h3>
      ${moduleCards}
    </div>
    <div class="stat-section">
      <h3>Daten zurücksetzen</h3>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">Löscht den gesamten Lernfortschritt, XP und Level.</p>
      <button class="btn-secondary" id="btnReset" style="width:100%">Gesamten Fortschritt zurücksetzen</button>
    </div>
  `;

  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('Wirklich ALLEN Fortschritt zurücksetzen? Das kann nicht rückgängig gemacht werden.')) {
      SM2.resetAll();
      QuizSRS.resetAll();
      Game.resetAll();
      localStorage.removeItem(Store.KEY);
      localStorage.removeItem(Store.STREAK_KEY);
      localStorage.removeItem('game_best_combo_v1');
      renderStats();
      renderHome();
    }
  });
}

document.getElementById('btnQuickStudy').addEventListener('click', () => {
  // Across all unlocked modules, find the topic with the most "work to do":
  // due flashcards + quiz questions currently marked wrong.
  let bestTopic = null, bestModule = null, bestMode = 'guided', maxWork = -1;

  MODULES.filter(m => !m.locked).forEach(m => {
    m.topics.forEach(t => {
      const fcDue = SM2.getDueCards(getTopicItemIds(t, 'flashcard')).length;
      const quizWeak = QuizSRS.getStats(getTopicItemIds(t, 'quiz')).wrong;
      const work = fcDue + quizWeak;
      if (work > maxWork) {
        maxWork = work;
        bestTopic = t;
        bestModule = m;
        bestMode = fcDue >= quizWeak ? (fcDue > 0 ? 'flashcard' : 'quiz') : 'quiz';
      }
    });
  });

  if (!bestTopic) {
    const m = MODULES.find(m => !m.locked);
    bestModule = m;
    bestTopic = m.topics[0];
    bestMode = moduleHasMode(m, 'guided') ? 'guided' : 'quiz';
  }

  State.activeModule = bestModule;
  State.activeTopic = bestTopic;
  State.activeMode = bestMode;
  startStudySession();
});

// ── Utilities ────────────────────────────────────────────────────────────────
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/** Format the inside of a $...$ math segment: _x → subscript, ^x → superscript. */
function fmtMathInner(expr) {
  return expr
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
    .replace(/_([A-Za-z0-9äöüÄÖÜßπγτλσαβεδμρφθ'+\-]+)/g, '<sub>$1</sub>')
    .replace(/\^([A-Za-z0-9πγτλσαβεδμρφθ+\-]+)/g, '<sup>$1</sup>')
    .replace(/\*/g, '·');
}

/**
 * Rich text renderer for all study content:
 *  - $...$   → styled math with sub/superscripts
 *  - **x**   → bold, `x` → inline code
 *  - lines starting with • → bullet list
 *  - blank lines → paragraphs
 */
function formatCardText(text) {
  if (!text) return '';
  let s = escapeHtml(String(text));
  s = s.replace(/\$([^$\n]+)\$/g, (m, expr) => `<span class="math">${fmtMathInner(expr)}</span>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

  const lines = s.split('\n');
  let html = '', inList = false, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.join('<br>')}</p>`; para = []; } };
  const flushList = () => { if (inList) { html += '</ul>'; inList = false; } };
  lines.forEach(line => {
    const t = line.trim();
    if (t.startsWith('•')) {
      flushPara();
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${t.slice(1).trim()}</li>`;
    } else if (t === '') {
      flushList(); flushPara();
    } else {
      flushList();
      para.push(t);
    }
  });
  flushList(); flushPara();
  return `<div class="rt">${html}</div>`;
}
