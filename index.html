    /* ── Basics & Bauteile ─────────────────────────────────────────────────
     * Nachschlage-Sektion: jeder Begriff in genau einem prägnanten Satz.
     * Bewusst auf das Prüfungsrelevante beschränkt — kein Ersatz für die Folien.
     */
    basics: [
      { group: 'Fusion — die Grundlagen', groupEn: 'Fusion — The Basics', icon: '⚛️', items: [
        { term: 'Kernfusion', termEn: 'Nuclear Fusion', text: 'Zwei leichte Kerne verschmelzen zu einem schwereren; die dabei fehlende Masse (Massendefekt) wird nach ΔE = Δm·c² als Energie frei.', textEn: 'Two light nuclei merge into a heavier one; the missing mass (mass defect) is released as energy according to ΔE = Δm·c².' },
        { term: 'Bindungsenergie', termEn: 'Binding Energy', text: 'Ergebnis des Wettstreits zwischen anziehender starker Kernkraft und abstoßender Coulomb-Kraft — pro Nukleon maximal bei A ≈ 56 (Eisen/Nickel).', textEn: 'Result of the contest between the attractive strong nuclear force and the repulsive Coulomb force — per nucleon, maximum at A ≈ 56 (iron/nickel).' },
        { term: 'Warum Fusion Energie liefert', termEn: 'Why Fusion Releases Energy', text: 'Energie wird frei, wenn das Produkt eine höhere Gesamt-Bindungsenergie hat als die Ausgangskerne — deshalb lohnt Fusion links und Spaltung rechts von A ≈ 56.', textEn: 'Energy is released when the product has a higher total binding energy than the starting nuclei — that is why fusion pays off left of A ≈ 56, and fission pays off to the right.' },
        { term: 'D-T-Reaktion', termEn: 'D-T Reaction', text: 'D + T → ⁴He (3,52 MeV) + n (14,1 MeV) = 17,59 MeV; wegen niedriger Zündtemperatur, großem Wirkungsquerschnitt und hoher Ausbeute die einzig praktikable Reaktion.', textEn: 'D + T → ⁴He (3.52 MeV) + n (14.1 MeV) = 17.59 MeV; the only practical reaction thanks to its low ignition temperature, large cross section, and high yield.' },
        { term: 'Coulomb-Barriere & Tunneleffekt', termEn: 'Coulomb Barrier & Tunnel Effect', text: 'Die gleichnamig geladenen Kerne stoßen sich ab; Fusion gelingt trotzdem deutlich unterhalb der klassischen Barriere, weil die Kerne quantenmechanisch hindurchtunneln.', textEn: 'Like-charged nuclei repel each other; fusion still succeeds well below the classical barrier because the nuclei quantum-mechanically tunnel through it.' },
        { term: 'Wirkungsquerschnitt σ', termEn: 'Cross Section σ', text: 'Maß für die Wahrscheinlichkeit, dass zwei Kerne reagieren (Einheit barn = 10⁻²⁸ m²).', textEn: 'Measure of the probability that two nuclei react (unit: barn = 10⁻²⁸ m²).' },
        { term: 'Reaktivität ⟨σv⟩', termEn: 'Reactivity ⟨σv⟩', text: 'σ mal Geschwindigkeit, gemittelt über die Maxwell-Verteilung — die eigentliche Kenngröße der Reaktionsrate r = n₁n₂⟨σv⟩.', textEn: 'Cross section times velocity, averaged over the Maxwellian distribution — the actual figure of merit behind the reaction rate r = n₁n₂⟨σv⟩.' },
        { term: 'Tritium', termEn: 'Tritium', text: 'Radioaktives Wasserstoffisotop mit 12,3 Jahren Halbwertszeit — auf der Erde praktisch nicht vorhanden und deshalb im Reaktor aus Lithium zu erbrüten.', textEn: 'Radioactive hydrogen isotope with a 12.3-year half-life — virtually absent on Earth, so it has to be bred inside the reactor from lithium.' },
        { term: 'Vorteil der Fusion', termEn: 'Advantage of Fusion', text: 'CO₂-frei, und die Brennstoffe Deuterium und Lithium sind in Erdkruste und Meerwasser reichlich vorhanden.', textEn: 'CO₂-free, and the fuels deuterium and lithium are abundant in the Earth\'s crust and seawater.' },
      ]},

      { group: 'Plasma & Kennzahlen', groupEn: 'Plasma & Key Parameters', icon: '🌪️', items: [
        { term: 'Plasma', termEn: 'Plasma', text: 'Quasineutrales Gas geladener Teilchen mit kollektivem Verhalten — im einfachsten Bild vollständig durch Dichte n und Temperatur T beschrieben.', textEn: 'Quasi-neutral gas of charged particles showing collective behaviour — in the simplest picture fully described by density n and temperature T.' },
        { term: 'Kollektives Verhalten', termEn: 'Collective Behaviour', text: 'Anders als im neutralen Gas wirken die Teilchen über weitreichende elektromagnetische Felder auch auf weit entfernte Bereiche.', textEn: 'Unlike in a neutral gas, particles interact through long-range electromagnetic fields that reach into distant regions too.' },
        { term: 'Debye-Länge λD', termEn: 'Debye Length λD', text: 'Länge, über die eine eingebrachte Ladung im Plasma abgeschirmt wird; erst wenn λD ≪ Systemgröße L gilt, verhält sich das Gas wie ein Plasma.', textEn: 'Length over which an inserted charge is screened inside the plasma; only once λD ≪ system size L does the gas actually behave like a plasma.' },
        { term: 'Larmorradius ρ = m·v⊥/(q·B)', termEn: 'Larmor Radius ρ = m·v⊥/(q·B)', text: 'Radius der Gyration um eine Feldlinie — Ionen kreisen wegen ihrer größeren Masse deutlich weiter als Elektronen.', textEn: 'Radius of the gyration around a field line — ions orbit at a much larger radius than electrons because of their greater mass.' },
        { term: 'Energieeinschlusszeit τE = E/PL', termEn: 'Energy Confinement Time τE = E/PL', text: 'Verhältnis von gespeicherter Plasmaenergie zu Verlustleistung — das Maß dafür, wie gut das Plasma seine Energie hält.', textEn: 'Ratio of stored plasma energy to power loss — the measure of how well the plasma holds onto its energy.' },
        { term: 'Zündung (Ignition)', termEn: 'Ignition', text: 'Die Alphateilchen-Heizung allein deckt die Verluste, die externe Heizung kann abgeschaltet werden.', textEn: 'Alpha-particle heating alone covers the losses, so the external heating can be switched off.' },
        { term: 'Lawson-Kriterium', termEn: 'Lawson Criterion', text: 'n·τE > 1,5·10²⁰ m⁻³s bei optimalen T = 30 keV — die Zündbedingung für D-T.', textEn: 'n·τE > 1.5·10²⁰ m⁻³s at the optimal T = 30 keV — the ignition condition for D-T.' },
        { term: 'Tripelprodukt n·T·τE', termEn: 'Triple Product n·T·τE', text: '> 3·10²¹ m⁻³·keV·s: die Gütezahl, mit der man misst, wie weit ein Gerät noch von der Zündung entfernt ist.', textEn: '> 3·10²¹ m⁻³·keV·s: the figure of merit that measures how far a device still is from ignition.' },
        { term: 'Fusionsverstärkung Q', termEn: 'Fusion Gain Q', text: 'Fusionsleistung / externe Heizleistung; Q = 1 ist Break-even, Q ≈ 10 gilt als wirtschaftliches Minimum, bei Zündung geht Q → ∞.', textEn: 'Fusion power divided by external heating power; Q = 1 is breakeven, Q ≈ 10 counts as the economic minimum, and Q → ∞ at ignition.' },
        { term: 'Beta β', termEn: 'Beta β', text: 'Kinetischer Teilchendruck geteilt durch magnetischen Druck — hoch ist wirtschaftlich (kleinerer, billigerer Magnet), im Tokamak aber durch Stabilitätsgrenzen limitiert.', textEn: 'Kinetic particle pressure divided by magnetic pressure — high β is economically desirable (smaller, cheaper magnet) but limited by stability constraints in a tokamak.' },
        { term: 'Sicherheitsfaktor q = 2π/ι', termEn: 'Safety Factor q = 2π/ι', text: 'Zahl der toroidalen Umläufe einer Feldlinie pro poloidalem Umlauf — höheres q ist MHD-stabiler, verschlechtert aber den Einschluss.', textEn: 'Number of toroidal turns a field line makes per poloidal turn — higher q is more MHD-stable but worsens confinement.' },
        { term: 'Plasmawiderstand', termEn: 'Plasma Resistivity', text: 'Fällt mit steigender Temperatur (∝ T^-3/2) — anders als im Metall; genau deshalb reicht ohmsche Heizung allein nicht bis zur Fusionstemperatur.', textEn: 'Falls as temperature rises (∝ T^-3/2) — unlike in a metal; exactly why ohmic heating alone cannot reach fusion temperature.' },
        { term: 'Bremsstrahlung', termEn: 'Bremsstrahlung', text: 'Strahlungsverlust durch Elektronen, die im Coulomb-Feld der Ionen abgebremst werden — wächst stark mit Zeff.', textEn: 'Radiative loss from electrons decelerated in the Coulomb field of the ions — grows strongly with Zeff.' },
        { term: 'Hoch-Z-Verunreinigungen', termEn: 'High-Z Impurities', text: 'Aus der Wand gesputterte schwere Ionen (Fe, Cr, Ni) treiben über Zeff die Strahlungsverluste hoch und müssen unbedingt ferngehalten werden.', textEn: 'Heavy ions sputtered from the wall (Fe, Cr, Ni) drive up radiative losses via Zeff and must be kept out at all costs.' },
        { term: 'Runaway-Elektronen', termEn: 'Runaway Electrons', text: 'Bei sinkender Stoßrate auf relativistische Energien beschleunigte Elektronen, die aus dem Einschluss ausbrechen und die erste Wand beschädigen.', textEn: 'Electrons accelerated to relativistic energies as the collision rate falls, breaking out of confinement and damaging the first wall.' },
      ]},

      { group: 'Einschluss-Konzepte', groupEn: 'Confinement Concepts', icon: '🧭', items: [
        { term: 'Magnetischer Einschluss', termEn: 'Magnetic Confinement', text: 'Geladene Teilchen gyrieren um die Feldlinien, laufen aber frei entlang — deshalb muss das Feld in sich geschlossen sein.', textEn: 'Charged particles gyrate around field lines but move freely along them — so the field must form a closed loop.' },
        { term: 'Warum ein reines Toroidalfeld nicht reicht', termEn: 'Why a Pure Toroidal Field Is Not Enough', text: 'Krümmung und 1/R-Ungleichförmigkeit erzeugen Driften; die Ladungstrennung baut ein E-Feld auf, dessen E×B-Drift alles nach außen an die Wand schiebt.', textEn: 'Curvature and the 1/R non-uniformity create drifts; the resulting charge separation builds up an E-field whose E×B drift pushes everything outward to the wall.' },
        { term: 'Poloidalfeld', termEn: 'Poloidal Field', text: 'Verdrillt die Feldlinien zu Helices, sodass ein Teilchen oben und unten vorbeikommt und sich keine dauerhafte Ladungstrennung aufbauen kann.', textEn: 'Twists the field lines into helices so a particle passes both the top and the bottom, preventing any lasting charge separation from building up.' },
        { term: 'Tokamak', termEn: 'Tokamak', text: 'Toroidalfeld aus Spulen plus Poloidalfeld aus dem im Plasma induzierten Strom; weil der Solenoidstrom sättigt, ist er prinzipbedingt gepulst.', textEn: 'Toroidal field from coils plus a poloidal field from the current induced in the plasma; because the solenoid current saturates, it is inherently pulsed.' },
        { term: 'Stellarator', termEn: 'Stellarator', text: 'Beide Feldkomponenten kommen aus externen (helikalen bzw. modularen) Spulen — kein Plasmastrom nötig, deshalb echter Dauerbetrieb möglich.', textEn: 'Both field components come from external (helical or modular) coils — no plasma current needed, so genuine steady-state operation is possible.' },
        { term: 'Trägheitseinschluss (ICF)', termEn: 'Inertial Confinement (ICF)', text: 'Ein Pellet wird so schnell komprimiert und geheizt, dass es fusioniert, bevor es auseinanderfliegt — die eigene Trägheit ist der Einschluss.', textEn: 'A pellet is compressed and heated so fast that it fuses before it can fly apart — its own inertia is the confinement.' },
        { term: 'Hohlraum', termEn: 'Hohlraum', text: 'Beim indirekten Antrieb heizt der Laser die Innenwand einer kleinen Kapsel, deren Röntgenstrahlung dann das Pellet implodiert.', textEn: 'In indirect drive, the laser heats the inner wall of a small capsule, whose X-rays then implode the pellet.' },
        { term: 'Magnetspiegel', termEn: 'Magnetic Mirror', text: 'Bei erhaltenem μ wächst v⊥ und v∥ schrumpft, wenn B ansteigt — erreicht v∥ null, wird das Teilchen zurückreflektiert.', textEn: 'With μ conserved, v⊥ grows and v∥ shrinks as B increases — once v∥ reaches zero, the particle is reflected back.' },
      ]},

      { group: 'Magnetsystem', groupEn: 'Magnet System', icon: '🧲', items: [
        { term: 'Toroidalfeldspule (TF)', termEn: 'Toroidal Field Coil (TF)', text: 'Dauerhaft bestromt, erzeugt das toroidale Hauptfeld für den Einschluss und muss riesige zentripetale und Out-of-plane-Kräfte aushalten.', textEn: 'Permanently energized, it produces the main toroidal confinement field and must withstand huge centripetal and out-of-plane forces.' },
        { term: 'Zentralsolenoid (CS)', termEn: 'Central Solenoid (CS)', text: 'Die Primärwicklung des Transformators: Ihr Stromanstieg induziert den Plasmastrom und heizt das Plasma zugleich ohmisch.', textEn: 'The transformer\'s primary winding: its rising current induces the plasma current and ohmically heats the plasma at the same time.' },
        { term: 'Poloidalfeldspulen (PF)', termEn: 'Poloidal Field Coils (PF)', text: 'Sorgen für vertikale Stabilität, Formgebung und Positionsregelung des Plasmaquerschnitts.', textEn: 'Provide vertical stability, shaping, and position control of the plasma cross-section.' },
        { term: 'Supraleitung', termEn: 'Superconductivity', text: 'Unterhalb Tc verschwindet der Widerstand vollständig, ein einmal eingeprägter Strom fließt ohne Stromquelle weiter.', textEn: 'Below Tc, resistance vanishes entirely; a current once induced keeps flowing without any power source.' },
        { term: 'Meissner-Effekt', termEn: 'Meissner Effect', text: 'Unterhalb Tc verdrängt der Supraleiter das Magnetfeld aus seinem Inneren; es dringt nur wenige 100 nm ein.', textEn: 'Below Tc, the superconductor expels the magnetic field from its interior; it penetrates only a few hundred nm.' },
        { term: 'Typ I vs. Typ II', termEn: 'Type I vs. Type II', text: 'Typ I (reine Metalle) verliert die Supraleitung abrupt bei einem einzigen Bc; Typ II (Legierungen, Keramiken) geht graduell über und erreicht höhere Tc und Bc.', textEn: 'Type I (pure metals) loses superconductivity abruptly at a single Bc; Type II (alloys, ceramics) transitions gradually and reaches higher Tc and Bc.' },
        { term: 'Kritische Fläche', termEn: 'Critical Surface', text: 'Supraleitung existiert nur innerhalb der drei Grenzen Tc, Bc und Jc — wird eine überschritten, wird der Leiter normalleitend.', textEn: 'Superconductivity exists only within the three limits Tc, Bc, and Jc — exceed any one of them and the conductor goes normal.' },
        { term: 'Quench', termEn: 'Quench', text: 'Plötzlicher Rückfall in den normalleitenden Zustand: Die gespeicherte Magnetenergie wird schlagartig frei und heizt Leiter und Kühlmittel — Schutzsystem zwingend.', textEn: 'Sudden collapse back into the resistive state: the stored magnet energy is released all at once and heats conductor and coolant — a protection system is essential.' },
        { term: 'NbTi vs. Nb₃Sn', termEn: 'NbTi vs. Nb₃Sn', text: 'NbTi bis etwa 6-7 T (ITER: PF-Spulen), Nb₃Sn bis etwa 14 T (TF-Spulen und CS) — dafür teurer und mit Wärmebehandlung.', textEn: 'NbTi up to about 6-7 T (ITER: PF coils), Nb₃Sn up to about 14 T (TF coils and CS) — but more expensive and requiring heat treatment.' },
        { term: 'CICC (Cable-in-Conduit)', termEn: 'CICC (Cable-in-Conduit Conductor)', text: 'Viele supraleitende Litzen in einem tragenden Mantel, der zugleich als Kühlkanal dient — der Leitertyp der ITER-Magnete.', textEn: 'Many superconducting strands inside a load-bearing jacket that doubles as the cooling channel — the conductor type used in the ITER magnets.' },
        { term: 'Warum überhaupt supraleitend', termEn: 'Why Superconducting at All', text: 'Nur so bekommt man die für das Tripelprodukt nötigen hohen Felder bei vertretbarem Bauraum und ohne Joulesche Verluste.', textEn: 'It is the only way to get the high fields the triple product needs, in a reasonable footprint and without any Joule losses.' },
      ]},

      { group: 'In-Vessel-Komponenten', groupEn: 'In-Vessel Components', icon: '🛡️', items: [
        { term: 'In-Vessel Components', termEn: 'In-Vessel Components', text: 'Sammelbegriff für alles, was innerhalb des Vakuumgefäßes sitzt; die beiden Hauptsysteme sind Shielding Blanket System und Divertor.', textEn: 'Umbrella term for everything sitting inside the vacuum vessel; the two main systems are the Shielding Blanket System and the Divertor.' },
        { term: 'Plasma Facing Component (PFC)', termEn: 'Plasma Facing Component (PFC)', text: 'Aufbau immer gleich: plasmaseitige Panzerung (armour), darunter die Wärmesenke (heat sink), dahinter Stützstruktur und Kühlrohre.', textEn: 'Always the same build: plasma-side armour, a heat sink underneath it, then a support structure and cooling pipes.' },
        { term: 'Erste Wand / Blanket', termEn: 'First Wall / Blanket', text: 'Umschließt fast die ganze Plasmaoberfläche, schirmt Gefäß und Magnete gegen Wärme und Neutronen ab und hält Verunreinigungen klein.', textEn: 'Encloses almost the entire plasma surface, shields the vessel and magnets from heat and neutrons, and keeps impurities low.' },
        { term: 'Beryllium', termEn: 'Beryllium', text: 'Panzerung der ersten Wand — niedrige Ordnungszahl, erzeugt also selbst bei Erosion nur wenig Zeff im Plasma.', textEn: 'Armour of the first wall — low atomic number, so even if eroded it only contributes little Zeff to the plasma.' },
        { term: 'Wolfram', termEn: 'Tungsten', text: 'Panzerung der Divertor-Targets — höchster Schmelzpunkt aller Metalle und damit der beste Werkstoff für die extremen Wärmeflüsse.', textEn: 'Armour of the divertor targets — the highest melting point of any metal, and therefore the best material for the extreme heat fluxes.' },
        { term: 'CuCrZr', termEn: 'CuCrZr', text: 'Standard-Wärmesenke unter der Panzerung: hohe Wärmeleitfähigkeit bei gleichzeitig guter Warmfestigkeit und Duktilität.', textEn: 'Standard heat sink under the armour: high thermal conductivity combined with good strength at temperature and ductility.' },
        { term: 'Modularität des Blankets', termEn: 'Blanket Modularity', text: 'Einzelne Module (bei ITER ≈ 4,5 t) lassen sich per Fernhantierung durch die Ports tauschen, ohne die Maschine zu zerlegen.', textEn: 'Individual modules (about 4.5 t at ITER) can be swapped out through the ports by remote handling, without disassembling the machine.' },
        { term: 'Divertor', termEn: 'Divertor', text: 'Sitzt am Boden des Gefäßes, führt Leistung und Helium-Asche ab, begrenzt die Verunreinigung des Kernplasmas und schirmt die Wände ab.', textEn: 'Sits at the bottom of the vessel, exhausts power and helium ash, limits contamination of the core plasma, and shields the walls.' },
        { term: 'Divertor-Wärmefluss', termEn: 'Divertor Heat Flux', text: 'Die vertikalen Targets müssen etwa 10 MW/m² stationär und bis 20 MW/m² bei langsamen Transienten aushalten (erste Wand: ~5 MW/m²).', textEn: 'The vertical targets must withstand about 10 MW/m² in steady state and up to 20 MW/m² during slow transients (first wall: ~5 MW/m²).' },
        { term: 'Erosion / Sputtering', termEn: 'Erosion / Sputtering', text: 'Abgetragenes Wandmaterial erhöht Zeff und die Strahlungsverluste, verdünnt den Brennstoff und bindet über Ko-Deposition Tritium.', textEn: 'Eroded wall material raises Zeff and radiative losses, dilutes the fuel, and traps tritium through codeposition.' },
      ]},

      { group: 'Vakuumgefäß & Kryostat', groupEn: 'Vacuum Vessel & Cryostat', icon: '🔩', items: [
        { term: 'Vakuumgefäß (VV)', termEn: 'Vacuum Vessel (VV)', text: 'Hermetisch geschweißter, doppelwandiger Stahlbehälter: erste Sicherheitsbarriere, UHV-Umgebung für das Plasma und mechanischer Träger der In-Vessel-Teile.', textEn: 'Hermetically welded, double-walled steel container: first safety barrier, UHV environment for the plasma, and mechanical support for the in-vessel parts.' },
        { term: 'Ports', termEn: 'Ports', text: 'Die 44 Öffnungen des ITER-Gefäßes geben Zugang für Fernhantierung, Diagnostik, Heizsysteme und das Abpumpen.', textEn: 'The 44 openings in the ITER vessel give access for remote handling, diagnostics, heating systems, and pumping.' },
        { term: 'Werkstoff SS 316L(N)-IG', termEn: 'Material SS 316L(N)-IG', text: 'Hauptmaterial von Gefäßkörper und doppelwandigen Ports — fest, korrosionsbeständig, gut fertigbar und vergleichsweise günstig.', textEn: 'Main material of the vessel body and the double-walled ports — strong, corrosion-resistant, easy to fabricate, and comparatively cheap.' },
        { term: 'Kobalt-Limit', termEn: 'Cobalt Limit', text: 'Kobalt hat einen großen Neutroneneinfangquerschnitt und aktiviert stark zu Gammastrahlern, deshalb im Stahl auf < 500 ppm begrenzt.', textEn: 'Cobalt has a large neutron capture cross section and activates strongly into gamma emitters, so it is capped in the steel at < 500 ppm.' },
        { term: 'Vollständig geschweißt', termEn: 'Fully Welded', text: 'Das ITER-Gefäß wird als nukleare Sicherheitsanforderung durchgehend geschweißt — Schraub-/Dichtungsflansche wären Leckpfade.', textEn: 'The ITER vessel is welded throughout as a nuclear safety requirement — bolted/gasketed flanges would be leak paths.' },
        { term: 'Kryostat', termEn: 'Cryostat', text: 'Große Vakuumkammer, die Gefäß und sämtliche Magnete umschließt; sie unterbindet konvektive Wärme zur kalten Masse und ist die zweite Barriere.', textEn: 'Large vacuum chamber enclosing the vessel and all the magnets; it blocks convective heat to the cold mass and is the second barrier.' },
        { term: 'Drücke', termEn: 'Pressures', text: 'Kryostat 10⁻⁷…10⁻⁸ mbar, Plasmakammer 10⁻⁹ mbar oder besser (UHV).', textEn: 'Cryostat 10⁻⁷…10⁻⁸ mbar, plasma chamber 10⁻⁹ mbar or better (UHV).' },
        { term: 'Bälge (bellows)', termEn: 'Bellows', text: 'Nehmen zwischen Kryostat und Vakuumgefäß die thermische Dehnung und Schrumpfung auf, damit keine Spannungen entstehen.', textEn: 'Take up the thermal expansion and contraction between cryostat and vacuum vessel so no stresses build up.' },
        { term: 'Kryopumpe', termEn: 'Cryopump', text: 'Friert Gasmoleküle an heliumkalten Flächen aus; nur so bleibt die Entladung bei langen Pulsen sauber (Helium-Asche, unverbrannter Brennstoff).', textEn: 'Freezes gas molecules onto helium-cold surfaces; the only way to keep the discharge clean during long pulses (helium ash, unburnt fuel).' },
      ]},

      { group: 'Brennstoffkreislauf & Blanket', groupEn: 'Fuel Cycle & Blanket', icon: '♻️', items: [
        { term: 'Geschlossener Brennstoffkreislauf', termEn: 'Closed Fuel Cycle', text: 'Abgas absaugen, Wasserstoffisotope trennen, unverbranntes D und T wieder einspeisen — nichts vom wertvollen Brennstoff wird verworfen.', textEn: 'Extract the exhaust gas, separate the hydrogen isotopes, reinject unburnt D and T — none of the valuable fuel is discarded.' },
        { term: 'Tritium-Brüten', termEn: 'Tritium Breeding', text: 'Fusionsneutronen werden im lithiumhaltigen Blanket eingefangen und erzeugen neues Tritium — die einzige Quelle für den Brennstoff.', textEn: 'Fusion neutrons are captured in the lithium-bearing blanket and produce new tritium — the only source of this fuel.' },
        { term: 'Die vier Blanket-Funktionen', termEn: 'The Four Blanket Functions', text: 'Tritium brüten, Leistung auskoppeln, physikalische Plasmagrenze bilden und Strahlung abschirmen.', textEn: 'Breed tritium, extract power, form the physical plasma boundary, and shield against radiation.' },
        { term: 'Brutreaktionen', termEn: 'Breeding Reactions', text: 'n + ⁶Li → ⁴He + T + 4,78 MeV (exotherm, langsame Neutronen) und n + ⁷Li → ⁴He + T + n − 2,5 MeV (endotherm, gibt ein Neutron zurück).', textEn: 'n + ⁶Li → ⁴He + T + 4.78 MeV (exothermic, slow neutrons) and n + ⁷Li → ⁴He + T + n − 2.5 MeV (endothermic, gives back a neutron).' },
        { term: 'Neutronenmultiplikator', termEn: 'Neutron Multiplier', text: 'Beryllium oder Blei vervielfachen die Neutronen; Be ist günstig, reagiert aber mit Wasser und Luft und bindet Tritium.', textEn: 'Beryllium or lead multiply the neutrons; Be is cheap but reacts with water and air and traps tritium.' },
        { term: 'TBR (Tritium Breeding Ratio)', termEn: 'TBR (Tritium Breeding Ratio)', text: 'Erbrütetes geteilt durch verbranntes Tritium — muss über 1 liegen, ausgelegt wird typisch auf 1,02-1,05.', textEn: 'Tritium bred divided by tritium burnt — must exceed 1, typically designed for 1.02-1.05.' },
        { term: 'HCPB-Blanket', termEn: 'HCPB Blanket', text: 'Heliumgekühltes Feststoffkonzept: keramische Brüter-Pebbles und Beryllid-Multiplikator-Pebbles in einer RAFM-Stahlstruktur.', textEn: 'Helium-cooled solid-breeder concept: ceramic breeder pebbles and beryllide multiplier pebbles inside a RAFM steel structure.' },
      ]},

      { group: 'Heizsysteme & Stromtrieb', groupEn: 'Heating Systems & Current Drive', icon: '🔥', items: [
        { term: 'Ohmsche Heizung', termEn: 'Ohmic Heating', text: 'Der Plasmastrom heizt über den Plasmawiderstand — versagt bei hoher Temperatur, weil der Widerstand mit T^-3/2 einbricht.', textEn: 'The plasma current heats via the plasma\'s own resistance — fails at high temperature because resistivity collapses as T^-3/2.' },
        { term: 'NBI (Neutralinjektion)', termEn: 'NBI (Neutral Beam Injection)', text: 'Ionen werden beschleunigt und vor dem Eintritt neutralisiert, weil geladene Teilchen vom Magnetfeld abgelenkt würden.', textEn: 'Ions are accelerated and then neutralized before entering, because charged particles would be deflected by the magnetic field.' },
        { term: 'Negative Ionen', termEn: 'Negative Ions', text: 'Oberhalb ~100 keV unverzichtbar: Die Neutralisationsausbeute positiver Ionen fällt auf null, die negativer bleibt bei etwa 60 %.', textEn: 'Essential above ~100 keV: the neutralization yield of positive ions falls to zero, while that of negative ions stays around 60%.' },
        { term: 'Cäsium in der Ionenquelle', termEn: 'Caesium in the Ion Source', text: 'Senkt die Austrittsarbeit der Oberfläche und steigert so die Ausbeute an negativen Ionen.', textEn: 'Lowers the surface work function and thereby boosts the yield of negative ions.' },
        { term: 'Shine-through', termEn: 'Shine-Through', text: 'Der nicht absorbierte Strahlanteil fliegt durch das Plasma hindurch und trifft die gegenüberliegende Wand.', textEn: 'The unabsorbed part of the beam flies straight through the plasma and hits the opposite wall.' },
        { term: 'RF-Heizung', termEn: 'RF Heating', text: 'Drei Frequenzbereiche: Elektron-Zyklotron (ECRH), Ion-Zyklotron (ICRH) und Lower Hybrid — geheizt wird dort, wo die eingestrahlte Frequenz der lokalen Zyklotronfrequenz entspricht.', textEn: 'Three frequency ranges: electron cyclotron (ECRH), ion cyclotron (ICRH), and lower hybrid — heating occurs wherever the launched frequency matches the local cyclotron frequency.' },
        { term: 'ECRH & Gyrotron', termEn: 'ECRH & Gyrotron', text: 'Millimeterwellen aus dem Gyrotron werden zu nahezu 100 % in einem einzigen Durchgang absorbiert — daher sehr lokal und gut steuerbar.', textEn: 'Millimetre waves from the gyrotron are absorbed almost 100% in a single pass — hence very localized and well controllable.' },
        { term: 'Bootstrap-Strom', termEn: 'Bootstrap Current', text: 'Nicht-induktiver Plasmastrom, den der Druckgradient selbst antreibt — ein Baustein für den Dauerbetrieb.', textEn: 'Non-inductive plasma current driven by the pressure gradient itself — a building block for steady-state operation.' },
      ]},

      { group: 'Kryotechnik', groupEn: 'Cryogenics', icon: '❄️', items: [
        { term: 'Kryotechnik', termEn: 'Cryogenics', text: 'Physik und Technik unterhalb von etwa 120 K; in der Fusion vor allem für supraleitende Magnete und Kryopumpen.', textEn: 'Physics and technology below about 120 K; in fusion, used above all for superconducting magnets and cryopumps.' },
        { term: 'Helium', termEn: 'Helium', text: 'Einziges Kühlmittel unter etwa 5 K, weil es als einziger Stoff unterhalb ~25 bar überhaupt nicht fest wird.', textEn: 'The only coolant below about 5 K, because it is the one substance that never solidifies below ~25 bar.' },
        { term: 'Supraflüssiges He II', termEn: 'Superfluid He II', text: 'Quantenzustand unterhalb 2,17 K mit verschwindender Viskosität und nahezu perfektem Wärmetransport.', textEn: 'Quantum state below 2.17 K with vanishing viscosity and near-perfect heat transport.' },
        { term: 'Joule-Thomson-Effekt', termEn: 'Joule-Thomson Effect', text: 'Temperaturänderung eines realen Gases beim Drosseln durch eine Blende; Helium erwärmt sich dabei bei 300 K, weil seine Inversionstemperatur nur ~40 K beträgt.', textEn: 'Temperature change of a real gas when throttled through an orifice; helium actually warms up at 300 K because its inversion temperature is only ~40 K.' },
        { term: 'Claude-Prozess', termEn: 'Claude Process', text: 'Kombination aus Brayton-Entspannungsmaschine und JT-Drosselung — das Verfahren zur Heliumverflüssigung.', textEn: 'Combination of a Brayton expansion engine and JT throttling — the process used to liquefy helium.' },
        { term: 'Kälteanlage vs. Verflüssiger', termEn: 'Refrigerator vs. Liquefier', text: 'Die Kälteanlage kühlt isotherm auf Siedetemperatur, der Verflüssiger liefert flüssiges Produkt als Ausgang.', textEn: 'The refrigerator cools isothermally at the boiling temperature, the liquefier delivers liquid product as its output.' },
        { term: 'MLI (Vielschichtisolation)', termEn: 'MLI (Multi-Layer Insulation)', text: 'N reflektierende Folien senken den Strahlungsaustausch im Idealfall um den Faktor N+1.', textEn: 'N reflective foils reduce the radiative exchange, ideally by a factor of N+1.' },
        { term: 'Thermische Schilde (VVTS/CTS/PTS)', termEn: 'Thermal Shields (VVTS/CTS/PTS)', text: 'Fangen die Wärmestrahlung warmer Strukturen ab, bevor sie die kalte Masse erreicht — aktiv mit billigem Stickstoff bei ~80 K gekühlt.', textEn: 'Intercept the radiated heat of warm structures before it reaches the cold mass — actively cooled with cheap nitrogen at ~80 K.' },
      ]},

      { group: 'Betrieb & Instabilitäten', groupEn: 'Operation & Instabilities', icon: '📈', items: [
        { term: 'Entladungszyklus', termEn: 'Discharge Cycle', text: 'Ramp-up (Stromaufbau) → Flat-top (Brennphase) → Ramp-down; die Dauer begrenzt der verfügbare Fluss des Zentralsolenoids.', textEn: 'Ramp-up (current build-up) → flat-top (burn phase) → ramp-down; its duration is limited by the available flux of the central solenoid.' },
        { term: 'Separatrix', termEn: 'Separatrix', text: 'Letzte geschlossene Flussfläche zwischen eingeschlossenem Plasma und Scrape-off-Layer, sobald die Divertor-Konfiguration gefahren wird.', textEn: 'Last closed flux surface between the confined plasma and the scrape-off layer, once the divertor configuration is established.' },
        { term: 'X-Punkt (Null-Punkt)', termEn: 'X-Point (Null Point)', text: 'Kreuzungspunkt der Separatrix — einer unten bei Single-Null, ein zweiter oben bei Double-Null.', textEn: 'Crossing point of the separatrix — one at the bottom for single-null, a second at the top for double-null.' },
        { term: 'L-Mode / H-Mode', termEn: 'L-Mode / H-Mode', text: 'Oberhalb einer Heizleistungsschwelle springt der Einschluss sprunghaft um fast den Faktor 2 in die H-Mode (1982 an ASDEX entdeckt).', textEn: 'Above a heating-power threshold, confinement jumps by nearly a factor of 2 into H-mode (discovered on ASDEX in 1982).' },
        { term: 'ELMs', termEn: 'ELMs', text: 'Edge Localized Modes — die typischen Randinstabilitäten der H-Mode, auf die die Skalierung IPB98(y,2) zugeschnitten ist.', textEn: 'Edge Localized Modes — the typical edge instabilities of H-mode, which the IPB98(y,2) scaling is tailored to.' },
        { term: 'Elongation κ = b/a', termEn: 'Elongation κ = b/a', text: 'Vertikale Streckung des Querschnitts: erlaubt höhere Plasmaströme ohne größeren Hauptradius, macht das Plasma aber vertikal instabil.', textEn: 'Vertical stretching of the cross-section: allows higher plasma currents without a larger major radius, but makes the plasma vertically unstable.' },
        { term: 'Kink-Instabilität', termEn: 'Kink Instability', text: 'Stromgetriebene Mode, bei der die Plasmasäule seitlich aus ihrer Mittellinie auswandert und die Auslenkung sich selbst verstärkt.', textEn: 'Current-driven mode in which the plasma column drifts sideways off its centreline, and the displacement reinforces itself.' },
        { term: 'Disruption', termEn: 'Disruption', text: 'Plötzlicher Verlust des Einschlusses in vier Phasen: Pre-Precursor → Precursor → Thermal Quench → Current Quench.', textEn: 'Sudden loss of confinement in four phases: pre-precursor → precursor → thermal quench → current quench.' },
        { term: 'VDE', termEn: 'VDE', text: 'Vertical Displacement Event — das gestreckte Plasma wandert unkontrolliert vertikal aus, oft nach Reglerausfall oder als Folge einer Disruption.', textEn: 'Vertical Displacement Event — the elongated plasma drifts vertically out of control, often after a control failure or as the consequence of a disruption.' },
        { term: 'Halo-Strom', termEn: 'Halo Current', text: 'Der Anteil des Plasmastroms, der sich bei einer VDE über die leitenden In-Vessel-Strukturen schließt und dort große Kräfte erzeugt.', textEn: 'The share of the plasma current that closes through the conductive in-vessel structures during a VDE, generating large forces there.' },
      ]},

      { group: 'Montage & Inbetriebnahme', groupEn: 'Assembly & Commissioning', icon: '🏗️', items: [
        { term: 'Sondertransporte', termEn: 'Special Transports', text: 'Fertigungs- und Montageort fallen fast nie zusammen: Für ITER rund 250 nächtliche Konvois von Marseille nach Cadarache, der schwerste ~800 t.', textEn: 'Manufacturing and assembly sites almost never coincide: for ITER, about 250 night-time convoys from Marseille to Cadarache, the heaviest about 800 t.' },
        { term: 'Eingangsprüfung', termEn: 'Incoming Inspection', text: 'Vor dem Einbau wird geprüft, ob der Transport das Bauteil beschädigt hat: Verpackung, Logger, Sichtprüfung, Druck-/Durchfluss-/Lecktest, Elektro- und Maßprüfung.', textEn: 'Before installation, checks confirm transport has not damaged the component: packaging, loggers, visual inspection, pressure/flow/leak test, electrical and dimensional checks.' },
        { term: 'Schock- und Kippindikatoren', termEn: 'Shock and Tilt Indicators', text: 'Sind sie ausgelöst, hat das Paket einen Stoß oder eine Fehlbehandlung erlebt.', textEn: 'If triggered, the package has been subjected to an impact or to mishandling.' },
        { term: 'Sichtprüfung', termEn: 'Visual Inspection', text: 'Gesucht wird nach Öl, Schneidflüssigkeit, Farbresten, Dellen und Fremdmaterial wie Spänen oder Rost — anhand einer Checkliste.', textEn: 'Looks for oil, cutting fluid, paint residue, dents, and foreign material like filings or rust — following a checklist.' },
        { term: 'Maßprüfung auf dem Transportgestell', termEn: 'Dimensional Check on the Transport Frame', text: 'Nur die wichtigsten Maße werden nachgemessen, und zwar gezielt, um Transportverformungen auszuschließen — die volle QA-Doku kommt aus dem Werk.', textEn: 'Only the most important dimensions are re-measured, specifically to rule out transport deformation — the full QA documentation comes from the factory.' },
        { term: 'Handhabung', termEn: 'Handling', text: 'Fusionsbauteile haben ein extrem hohes Gewichts-zu-Volumen-Verhältnis: Einzelhübe über 1000 t erzwingen eigens entwickelte Hebe- und Montagewerkzeuge.', textEn: 'Fusion components have an extremely high weight-to-volume ratio: single lifts over 1000 t require purpose-built lifting and assembly tools.' },
        { term: 'Modul-Hub', termEn: 'Module Lift', text: 'Vakuumgefäßsektor + Thermalschild + zwei TF-Spulen werden als ein 1380-t-Modul vormontiert und in die Grube abgelassen.', textEn: 'A vacuum vessel sector plus thermal shield plus two TF coils are pre-assembled as a single 1380-t module and lowered into the pit.' },
        { term: 'Metrologie', termEn: 'Metrology', text: 'Lasertracker (Abstand zum Reflektor plus Kopfwinkel, ~10 µm), Laserscanner (Punktwolken ohne Reflektor) und Photogrammetrie.', textEn: 'Laser tracker (distance to a reflector plus head angles, ~10 µm), laser scanner (point clouds without a reflector), and photogrammetry.' },
        { term: 'Geschraubt vs. geschweißt', termEn: 'Bolted vs. Welded', text: 'Geschweißt wird an Druck- und Vakuumgrenzen (Vakuumgefäß, UHV-Pflicht); geschraubt wird dort, wo demontiert werden muss oder Schweißwärme Leiter und Isolation schädigen würde.', textEn: 'Welding is used at pressure and vacuum boundaries (vacuum vessel, UHV requirement); bolting is used wherever disassembly is needed or welding heat would damage conductors and insulation.' },
        { term: 'Elektrische Joints', termEn: 'Electrical Joints', text: 'Gelötet oder mit Weichmetall (Indium) verpresst; sie müssen über 10 000 Zyklen ohne Inspektion halten und bis 56 kV DC gegen Erde isoliert sein.', textEn: 'Soldered or pressed together with a soft metal (indium); they must last over 10,000 cycles without inspection and be insulated up to 56 kV DC to ground.' },
      ]},
    ],
  },

  {
    id: 'rennsport',
    name: 'Rennsporttechnik',
    subtitle: 'FTM · TU München',
    icon: '🏎️',
    locked: false,
    topics: [
      {
        id: 'rst1', name: 'Einführung & Reglement', icon: '🏁', color: '#0a84ff', examWeight: 10,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_1_Einfuehrung_Reglement.pdf',
        guided: [
          { id: 'g_rst1_1', badge: 'Reglement-Ziele', title: 'Die 3 Ziele von Reglements', body: 'Jedes Motorsport-Reglement verfolgt drei Kernziele — ein Klausur-Dauerbrenner:\n\n• (Fairer) Wettbewerb: Spielregeln, an die sich jeder Teilnehmer halten muss; sie beschreiben im Detail die Grenzen, die nicht überschritten werden dürfen.\n• Sicherheit: Schutz von Fahrern, Teilnehmern und Streckenposten — über Fahrzeug (Käfig, Tank, Sitz/Gurte), Fahrerequipment (HANS, Helm, feuerfester Overall) und Strecke (Auslaufzonen, Infrastruktur).\n• Kostenkontrolle: Budget Cap, Einheitsteile, konstruktive Vorgaben (Materialien, Lebensdauer) und operative Limits (Personal, Test-, Reifen- oder Sensorlimits).', example: '🔑 Gedächtnisprotokoll: „Nenne die 3 Ziele des Reglements“ — Fairer Wettbewerb, Sicherheit, Kostenkontrolle.' },
          { id: 'g_rst1_2', badge: 'Reglement-Arten', title: 'Aufteilung des Reglements', body: 'Das Reglement gliedert sich in drei Arten:\n\n• Homologation Regulations: technische Rahmenbedingungen für den BAU von Rennfahrzeugen.\n• Technisches Reglement: notwendige KONFIGURATION eines Rennwagens, um in einer Serie starten zu dürfen.\n• Sportliches Reglement: die Spielregeln einer Rennserie — Strafen, Rennmodus, verpflichtende Boxenstopps, Flaggen, Track-Limits, Punkteverteilung.\n\nGrundprinzip in der Praxis: Was im Reglement nicht ausdrücklich erlaubt ist, ist verboten! Dazwischen liegt die Grauzone (z.B. Flexi-Bodywork, nicht dokumentierte Teile).', example: '🔑 Klausurfrage „Wie wird das Reglement unterteilt?“ → Homologation / Technisch / Sportlich.' },
          { id: 'g_rst1_3', badge: 'Behörden', title: 'FIA, ASN, Promoter — die Motorsportbehörde', body: 'Die FIA ist der internationale Dachverband aller nationalen Automobilclubs. Nur sie darf Weltmeisterschaften ausschreiben.\n\nAufgaben der Motorsportbehörde: Reglements erstellen und durchsetzen, Sicherheit gewährleisten, Homologation von Fahrzeugen und Strecken, Überwachung des Wettbewerbs, Ausschreibung von Meisterschaften.\n\nReglementsgestaltung (von unten nach oben):\n1. Technical Working Group (TWG): alle Hersteller + FIA auf technischer Ebene\n2. GT Commission: FIA, ASNs + zwei gewählte Herstellervertreter\n3. Circuit Sport Commission: FIA + ASN-Vertreter (allgemeiner Rundstreckensport)\n4. World Motorsport Council: alle ASNs stimmen mit der FIA ab\n\nDie ASN sind die nationalen Sportbehörden, die Promoter die Veranstalter der Rennserien.', example: '🔑 WS16/17/18-Klausur: „Nenne die Aufgaben der Motorsportbehörde“ und „Welche Organisation darf Weltmeisterschaften ausschreiben?“ (FIA).' },
          { id: 'g_rst1_4', badge: 'Hersteller', title: 'Warum betreibt ein Hersteller Motorsport?', body: 'Pro (aus Herstellersicht):\n• Marketing & Markenimage („Born on the racetrack. Made for the streets.“) — Spillover auf Serienprodukte\n• Technologietransfer & Innovations-Testfeld: sequentielle Getriebe, Launch Control, KERS/Hybrid, Verbundwerkstoffe, Gussverfahren, Metall-3D-Druck\n• Relevanz für Zukunftsthemen: Elektrifizierung, autonomes Fahren, E-Fuels, Wasserstoff — Motorsport = reglementierter Wettbewerb als F&E-Beschleuniger\n\nContra:\n• Hohe Kosten (Budget, Personal, Logistik)\n• Reputationsrisiko bei Misserfolg oder Skandalen\n• Direkte Bauteilübernahme Rennwagen → Straße ist selten (zu unterschiedliche Anforderungen an Funktion und Kosten)', example: '🔑 WS24/25: „3 Vorteile/Nachteile für Hersteller, am Motorsport teilzunehmen.“ Je 3 nennen können!' },
          { id: 'g_rst1_5', badge: 'Kategorien', title: 'Motorsport-Kategorien & Formate', body: 'Kategorien (Fahrzeugtypen):\n• Formel-Fahrzeuge: F1, F2, Formel E (offene Räder, Monoposto)\n• Prototypen: LMH, LMDh, LMP2/LMP3\n• Grand Touring: GT3, GT4\n• Rally (WRC), Rally-Cross (WRX), Cross-Country (Dakar)\n• Markenpokale (z.B. Carrera Cup), US Racing (IndyCar, NASCAR), Kart, E-Sport\n\nFormate: Sprint, Endurance (Langstrecke), Cross-Country, Hill Climb, Drag Racing, Drift, Land Speed Records.', example: '🔑 WS24/25: „2 verschiedene Autoarten den Motorsport-Kategorien zuordnen (Formel und Prototyp)“ — Formel = offene Räder/Monoposto, Prototyp = geschlossener Zweisitzer (z.B. LMDh).' },
        ],
        flashcards: [
          { id: 'fc_rst1_1', front: 'Nenne die 3 Ziele von Reglements.', back: '• (Fairer) Wettbewerb\n• Sicherheit\n• Kostenkontrolle' },
          { id: 'fc_rst1_2', front: 'Wie wird das Reglement unterteilt?', back: '• Homologation Regulations (Rahmen für den BAU)\n• Technisches Reglement (Konfiguration fürs Starten in einer Serie)\n• Sportliches Reglement (Spielregeln: Strafen, Boxenstopps, Flaggen)' },
          { id: 'fc_rst1_3', front: 'Welche Aufgaben hat die Motorsportbehörde (FIA)?', back: '• Reglements erstellen & durchsetzen\n• Sicherheit gewährleisten\n• Homologation (Fahrzeuge & Strecken)\n• Überwachung des Wettbewerbs\n• Ausschreibung von (Welt-)Meisterschaften' },
          { id: 'fc_rst1_4', front: 'Welche Organisation darf Weltmeisterschaften ausschreiben?', back: 'Die FIA — der internationale Dachverband aller nationalen Automobilclubs (ASNs).' },
          { id: 'fc_rst1_5', front: 'Welche Parteien sind an der Reglementsgestaltung beteiligt?', back: '• FIA (Dachverband) mit Gremien: TWG → GT Commission → Circuit Sport Commission → World Motorsport Council\n• ASN (nationale Sportbehörden)\n• Promoter (Veranstalter der Rennserien)\n• Hersteller (in TWG und Kommissionen vertreten)' },
          { id: 'fc_rst1_6', front: 'Grundprinzip des Reglements in der Praxis?', back: '„Was im Reglement nicht ausdrücklich erlaubt ist, ist verboten!“ Dazwischen: die Grauzone (z.B. flexible Bodywork, nicht dokumentierte Teile).' },
          { id: 'fc_rst1_7', front: 'Nenne je 3 Gründe pro und contra Motorsport-Engagement eines Herstellers.', back: 'Pro: Marketing/Image, Technologietransfer/Testfeld, Nachwuchs & Zukunftstechnologien (BEV, autonom, E-Fuels).\nContra: hohe Kosten, Reputationsrisiko bei Misserfolg, seltene direkte Bauteilübernahme in die Serie.' },
          { id: 'fc_rst1_8', front: 'Womit wird im Reglement Kostenkontrolle erreicht?', back: '• Budget Cap\n• Einheitsteile (bis hin zum Rolling Chassis)\n• Konstruktive Vorgaben (Material, Lebensdauer)\n• Operative Limits (Personal, Teststunden, Reifen-/Sensorlimit)' },
          { id: 'fc_rst1_9', front: 'Nenne Beispiele für Technologietransfer Motorsport → Serie.', back: 'Sequentielle Getriebe & Launch Control, KERS/Hybridkonzepte, Verbundwerkstoffe (CFK-Knowhow), Gussverfahren für Motorblöcke, Härte-/Oberflächenbehandlungen, Metall-3D-Druck, Elektronikkomponenten.' },
          { id: 'fc_rst1_10', front: 'Was regelt das sportliche Reglement konkret?', back: 'Definition des Wettbewerbs (Renndistanz, Punkte), zulässiges Verhalten (Track-Limits, Flaggen), Boxenstopps (Anzahl Mechaniker, Mindeststandzeit) und Sonderfälle (Rennabbruch).' },
        ],
        quiz: [
          { id: 'qz_rst1_1', category: 'RST 1 — Reglement', question: 'Welche drei Ziele verfolgt jedes Motorsport-Reglement?', options: ['Geschwindigkeit, Show, Gewinnmaximierung', 'Fairer Wettbewerb, Sicherheit, Kostenkontrolle', 'Homologation, Marketing, Nachhaltigkeit', 'Innovation, Tradition, Internationalität'], correct: 1, explanation: 'Die drei Kernziele sind (fairer) Wettbewerb, Sicherheit und Kostenkontrolle — Standardfrage aus den Gedächtnisprotokollen.' },
          { id: 'qz_rst1_2', category: 'RST 1 — Reglement', question: 'Das technische Reglement beschreibt…', options: ['die Spielregeln einer Rennserie wie Strafen und Boxenstopps', 'die nötige Konfiguration eines Rennwagens für den Serienstart', 'die groben Rahmenbedingungen für den Bau von Rennfahrzeugen', 'die Verteilung der Punkte am Ende eines Rennens in der Praxis'], correct: 1, explanation: 'Homologation = Bau-Rahmen, technisches Reglement = Konfiguration für die Startberechtigung, sportliches Reglement = Spielregeln.' },
          { id: 'qz_rst1_3', category: 'RST 1 — Reglement', question: 'Welche Organisation darf Weltmeisterschaften ausschreiben?', options: ['Der Promoter der jeweiligen Serie', 'Die nationale Sportbehörde (ASN)', 'Die FIA', 'Der jeweilige Hersteller-Verband'], correct: 2, explanation: 'Nur die FIA als internationaler Dachverband aller nationalen Automobilclubs darf Weltmeisterschaften ausschreiben.' },
          { id: 'qz_rst1_4', category: 'RST 1 — Reglement', question: 'In welchem Gremium diskutieren Vertreter ALLER Hersteller mit der FIA auf technischer Ebene über Reglementänderungen?', options: ['World Motorsport Council', 'Circuit Sport Commission', 'GT Commission', 'Technical Working Group (TWG)'], correct: 3, explanation: 'Die TWG ist die technische Arbeitsebene mit allen Herstellern; darüber folgen GT Commission, Circuit Sport Commission und World Motorsport Council.' },
          { id: 'qz_rst1_5', category: 'RST 1 — Reglement', question: 'Was gilt als Grundprinzip im Reglement der Praxis?', options: ['Was nicht ausdrücklich verboten ist, gilt als erlaubt', 'Was nicht ausdrücklich erlaubt ist, gilt als verboten', 'Die Grauzone des Reglements ist grundsätzlich legal', 'Nur das sportliche Reglement ist überhaupt bindend'], correct: 1, explanation: 'Im Motorsport gilt: Was nicht ausdrücklich erlaubt ist, ist verboten — die Grauzone wird von der FIA fallweise bewertet.' },
          { id: 'qz_rst1_6', category: 'RST 1 — Reglement', question: 'Welches Fahrzeug gehört zur Kategorie „Prototypen“?', options: ['GT3', 'Formel E', 'LMDh', 'WRC Rally1'], correct: 2, explanation: 'LMH, LMDh und LMP2/LMP3 sind Sportprototypen; GT3 ist Grand Touring, Formel E ein Formelfahrzeug, WRC Rally.' },
          { id: 'qz_rst1_7', category: 'RST 1 — Reglement', question: 'Die Sicherheitsvorgaben des Reglements betreffen drei Bereiche. Welche?', options: ['Fahrzeug, Fahrerequipment, Strecke', 'Motor, Getriebe, Aerodynamik', 'Training, Qualifying, Rennen', 'Team, Promoter, Behörde'], correct: 0, explanation: 'Sicherheit wird über das Fahrzeug (Käfig, Tank, Gurte), das Fahrerequipment (HANS, Helm, Overall) und die Strecke (Auslaufzonen) geregelt.' },
          { id: 'qz_rst1_8', category: 'RST 1 — Reglement', question: 'Warum erfolgt eine direkte Übernahme von Bauteilen zwischen Rennwagen und Straßenfahrzeug nur äußerst selten?', options: ['Weil das Reglement die Übernahme grundsätzlich verbietet meist', 'Weil Anforderungen an Funktion und Kosten zu verschieden sind', 'Weil Rennteile durchweg patentrechtlich geschützt sind meist', 'Weil Straßenfahrzeuge keine Rennteile aufnehmen können meist'], correct: 1, explanation: 'Die Anforderungen bzgl. Funktion, Lebensdauer und Kosten unterscheiden sich zu stark — Transfer erfolgt über Wissen und Verfahren, nicht 1:1 über Bauteile.' },
        ],
        open: [
          { id: 'op_rst1_1', points: '3 Pkt.', question: 'Nenne die drei Ziele von Motorsport-Reglements.', answer: '• (Fairer) Wettbewerb — Spielregeln und Grenzen für alle Teilnehmer (1).\n• Sicherheit — Schutz von Fahrern, Teilnehmern, Streckenposten (1).\n• Kostenkontrolle — Budget Cap, Einheitsteile, operative Limits (1).' },
          { id: 'op_rst1_2', points: '3 Pkt.', question: 'Wie ist das Reglement aufgeteilt? Beschreibe jede Art kurz.', answer: '• Homologation Regulations: technische Rahmenbedingungen für den Bau von Rennfahrzeugen (1).\n• Technisches Reglement: notwendige Konfiguration, um in einer Serie an den Start gehen zu dürfen (1).\n• Sportliches Reglement: Spielregeln der Rennserie — Strafen, Rennmodus, Pflicht-Boxenstopps (1).' },
          { id: 'op_rst1_3', points: '4 Pkt.', question: 'Nenne die Aufgaben der Motorsportbehörde.', answer: '• Erstellen und Durchsetzen der Reglements (1).\n• Gewährleistung der Sicherheit (1).\n• Homologation von Fahrzeugen und Strecken (1).\n• Überwachung des Wettbewerbs / Ausschreibung von Meisterschaften (nur die FIA darf Weltmeisterschaften ausschreiben) (1).' },
          { id: 'op_rst1_4', points: '6 Pkt.', question: 'Nenne je drei Vorteile und Nachteile für einen Hersteller, am Motorsport teilzunehmen.', answer: '• Vorteile: Marketing/Markenimage mit Spillover auf die Serie (1), Technologietransfer & Testfeld für Zukunftstechnologien (1), Anziehung von Talenten / „Vorsprung durch Technik“-Nachweis im reglementierten Wettbewerb (1).\n• Nachteile: sehr hohe Kosten (1), Reputationsrisiko bei Misserfolg/Skandal (1), kaum direkte Bauteilübernahme — Anforderungen zu unterschiedlich (1).' },
        ],
      },
      {
        id: 'rst2', name: 'Autonomer Motorsport', icon: '🤖', color: '#5e5ce6', examWeight: 9,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_2_Autonomer_Motorsport.pdf',
        guided: [
          { id: 'g_rst2_1', badge: 'Software-Stack', title: 'Die Softwarearchitektur eines autonomen Rennfahrzeugs', body: 'Der Software-Stack gliedert sich in drei große Gruppen (klausurrelevant: „Nenne und beschreibe 2 Gruppen der Softwarearchitektur“):\n\n• Perception (Wahrnehmung): Localization/State Estimation (GNSS, LiDAR, RaDAR, Multi-Sensor-Fusion) und Object Detection (LiDAR-Preprocessing, PointRCNN, YOLO+LiDAR-Fusion, Tracking mit Kalman-Filter).\n• Planning (Planung): Prediction (Bewegungsvorhersage anderer Fahrzeuge), Global Planning und Local Planning, Behavior/State Machine.\n• Control (Regelung): Umsetzung der Trajektorie in Aktuatorbefehle, z.B. mit PID, LQR oder MPC (Tube-MPC mit 100 Hz).', example: '🔑 Merke die Pipeline: Perception → Prediction → Planning → Control. Für jede Gruppe 1-2 Algorithmen nennen können (z.B. Detection: PointRCNN/YOLO; Control: MPC/LQR/PID).' },
          { id: 'g_rst2_2', badge: 'Planning', title: 'Global vs. Local Planning', body: 'Global Planning:\n• Statische Umgebung, keine bewegten Objekte\n• Plant die schnellste Trajektorie (Ideallinie) um die Rennstrecke — Rundenzeit-Minimierung als Optimalsteuerungsproblem (NLP), Fahrzeug als Einspur-/Zweispurmodell\n• Primär OFFLINE, einmalige Ausführung (Laufzeit 5–10 min); Grip-Karte integrierbar\n\nLocal Planning:\n• Dynamische Umgebung: Race, Follow, Overtake\n• Plant eine sichere Trajektorie vom Ego-Fahrzeug bis zum Planungshorizont\n• Nur ONLINE — Echtzeit-Neuberechnung; z.B. samplingbasierte Suche + Re-Optimierung mit MPC', example: '🔑 WS24/25: „Local und Global Planning Begriffe zuordnen“ — global = offline/statisch/schnellste Linie; lokal = online/dynamisch/sicher bis Planungshorizont.' },
          { id: 'g_rst2_3', badge: 'Warum autonom?', title: 'Motivation & Herausforderungen des autonomen Rennsports', body: 'Autonomous Racing = Forschungszweig des autonomen Fahrens: mit hoher Geschwindigkeit, in einem adversarialen Multi-Fahrzeug-Umfeld, in Simulation und Realität, bei internationalen Wettbewerben (IAC seit 2021, Dallara AV-21/24, bis 280 km/h; A2RL seit 2024, Dallara SF-23, 250 km/h).\n\nDrei Kernherausforderungen:\n1. Detecting the limits — Grip-Schätzung (GripMap), befahrbare Fläche, hohe Unsicherheit\n2. Decision making at the limits — Überholen bei hohen Geschwindigkeiten, Strategie, kleine Reaktionszeiten\n3. Handling at the limits — hochgradig nichtlineares Fahrverhalten bei hohen Beschleunigungen', example: '🔑 Werkzeuge: ROS2 als Middleware, C++ für performancekritische Module, Python für Tooling/ML-Training, Container für Deployment.' },
          { id: 'g_rst2_4', badge: 'Perception', title: 'Objekterkennung & Sensorfusion', body: 'Sensorik: LiDAR, Kamera, RaDAR, GPS/GNSS + IMU.\n\nLiDAR-Preprocessing (reduziert Rechenzeit, ~25–30 ms): Geometrie- & Staubfilter, Bodenfilter (Ground Filter), Wandfilter (Wall Filter).\n\nDeep-Learning-Detektion: PointRCNN (basiert auf PointNet, Two-Stage-Detektor, 3D, braucht gelabelte Trainingsdaten); Kamera: YOLO + LiDAR-Frustum-Fusion (>120 m Reichweite, Kalibrierung/Synchronisation nötig).\n\nLate Fusion & Tracking: Transformation in globale Koordinaten → Plausibilitätscheck → Objekt-Matching (Ungarische Methode) → Zustandsschätzung (Extended Kalman Filter) → Delay-Kompensation.', example: '🔑 Reihenfolge des Tracking-Schritts merken: Transformation → Plausibilität → Matching (Hungarian) → EKF → Delay-Kompensation.' },
        ],
        flashcards: [
          { id: 'fc_rst2_1', front: 'Nenne und beschreibe die Gruppen der Softwarearchitektur eines autonomen Rennfahrzeugs.', back: '• Perception: Lokalisierung + Objekterkennung aus Sensordaten (LiDAR, Kamera, RaDAR, GNSS)\n• Planning: Prediction + globale/lokale Trajektorienplanung\n• Control: Umsetzung der Trajektorie in Aktuatorbefehle (MPC, LQR, PID)' },
          { id: 'fc_rst2_2', front: 'Global Planning vs. Local Planning — Unterschiede?', back: 'Global: statische Umgebung, schnellste Runde (Ideallinie), offline, einmalig (5–10 min NLP-Optimierung).\nLocal: dynamische Umgebung (Race/Follow/Overtake), sichere Trajektorie bis Planungshorizont, online in Echtzeit.' },
          { id: 'fc_rst2_3', front: 'Welche 3 Kernherausforderungen hat autonomer Rennsport?', back: '1. Detecting the limits (Grip-/Reibwertschätzung, Streckenerkennung)\n2. Decision making at the limits (Überholen, Strategie, kurze Reaktionszeit)\n3. Handling at the limits (nichtlineare Fahrdynamik am Limit)' },
          { id: 'fc_rst2_4', front: 'Welche Middleware und Sprachen nutzt der TUM-Autonomous-Motorsport-Stack?', back: 'ROS2 als Middleware (modularer Aufbau, Multi-Core), C++ für performancekritische Module, Python für Tooling & ML-Training, ONNX/TensorRT für ML-Inferenz, Container für Deployment.' },
          { id: 'fc_rst2_5', front: 'Welche Filter nutzt das LiDAR-Preprocessing?', back: 'Geometrie- & Staubfilter, Bodenfilter (Ground Filter), Wandfilter (Wall Filter) — reduziert die Punktwolke, Gesamtzeit ~25–30 ms.' },
          { id: 'fc_rst2_6', front: 'Was ist PointRCNN?', back: 'LiDAR-Deep-Learning-Objektdetektor: basiert auf PointNet, Two-Stage-Detektor, liefert 3D-Detektionen, benötigt gelabelte Trainingsdaten.' },
          { id: 'fc_rst2_7', front: 'Welche Schritte umfasst Late Fusion & Tracking?', back: '1. Transformation lokal→global\n2. Plausibilitätscheck (Track-Merge, Out-of-Track-Filter)\n3. Objekt-Matching (Ungarische Methode)\n4. Zustandsschätzung (Extended Kalman Filter)\n5. Delay-Kompensation (Backward-Forward-Integration)' },
          { id: 'fc_rst2_8', front: 'Was macht die GripMap?', back: 'Online-Learning-Modul im Planning: schätzt/prädiziert das lokal verfügbare Beschleunigungspotenzial (Reibwert-Skalierung je Streckenzelle) → adaptive, sichere Trajektorienplanung.' },
          { id: 'fc_rst2_9', front: 'Welcher Regler wird beim TUM-Stack für die Fahrzeugregelung eingesetzt und warum?', back: 'Robust Tube MPC: Punktmasse-Modell + Aktuatordynamik, kombinierte Längs-/Querreifenlimits, glättet die Planner-Trajektorie, keine Constraint-Verletzung, läuft mit 100 Hz.' },
          { id: 'fc_rst2_10', front: 'Nenne die zwei großen autonomen Rennserien mit Basisfahrzeug.', back: '• Indy Autonomous Challenge (IAC), seit Okt. 2021, Dallara AV-21/AV-24, bis 280 km/h\n• Abu Dhabi Autonomous Racing League (A2RL), seit April 2024, Dallara SF-23, bis 250 km/h' },
        ],
        quiz: [
          { id: 'qz_rst2_1', category: 'RST 2 — Autonomer Motorsport', question: 'Die drei großen Gruppen der Softwarearchitektur eines autonomen Rennfahrzeugs sind…', options: ['Sensorik, Aktorik, Telemetrie', 'Perception, Planning, Control', 'Mapping, Routing, Parking', 'Simulation, Training, Deployment'], correct: 1, explanation: 'Perception (Wahrnehmung/Lokalisierung), Planning (Prädiktion + Trajektorienplanung) und Control (Regelung) bilden den Stack.' },
          { id: 'qz_rst2_2', category: 'RST 2 — Autonomer Motorsport', question: 'Global Planning zeichnet sich dadurch aus, dass es…', options: ['es reagiert in Echtzeit auf die anderen Fahrzeuge im Normalbetrieb', 'es plant die schnellste Trajektorie offline in statischer Umgebung', 'es übernimmt einzig die unterlagerte Fahrzeugregelung im Regelfall', 'es verarbeitet ausschließlich die Kamerabilder im Normalbetrieb meist'], correct: 1, explanation: 'Global Planning: statische Umgebung, keine bewegten Objekte, schnellste Linie, primär offline (NLP, 5–10 min Laufzeit).' },
          { id: 'qz_rst2_3', category: 'RST 2 — Autonomer Motorsport', question: 'Local Planning unterscheidet sich vom Global Planning dadurch, dass es…', options: ['es wird nur ein einziges Mal pro Rennen ausgeführt generell', 'es berechnet vorrangig die Boxenstopp-Strategie im Regelfall', 'es plant online sichere Trajektorien in dynamischer Umgebung', 'es kommt vollständig ohne jede Sensordaten aus in der Praxis'], correct: 2, explanation: 'Local Planning arbeitet in dynamischer Umgebung (Race, Follow, Overtake) und rechnet die Trajektorie online permanent neu.' },
          { id: 'qz_rst2_4', category: 'RST 2 — Autonomer Motorsport', question: 'Beim Objekt-Matching im Tracking wird welches Verfahren eingesetzt?', options: ['Die Ungarische Methode', 'K-Means-Clustering', 'RANSAC', 'A*-Suche'], correct: 0, explanation: 'Das Matching mehrerer Objektlisten erfolgt mit der Ungarischen Methode; die Zustandsschätzung übernimmt ein Extended Kalman Filter.' },
          { id: 'qz_rst2_5', category: 'RST 2 — Autonomer Motorsport', question: 'Welche Middleware dient im TUM-Stack als Basis für den Datenaustausch zwischen Softwaremodulen?', options: ['AUTOSAR', 'MQTT', 'ROS2', 'CANopen'], correct: 2, explanation: 'ROS2 ist die Haupt-Middleware; modulare Software nutzt Multi-Core-CPUs und schnelle Entwicklungszyklen.' },
          { id: 'qz_rst2_6', category: 'RST 2 — Autonomer Motorsport', question: 'Warum wird das LiDAR-Preprocessing (Ground/Wall/Dust-Filter) eingesetzt?', options: ['Um die aufgenommene Punktwolke farblich einzufärben generell', 'Um irrelevante Punkte zu entfernen und Rechenzeit zu sparen', 'Um die effektive Reichweite des LiDAR-Sensors zu erhöhen', 'Um kurzzeitige GPS-Ausfälle zuverlässig zu kompensieren meist'], correct: 1, explanation: 'Die meisten Punkte sind für die Fahraufgabe irrelevant; effizientes Preprocessing (~25–30 ms) beschleunigt die Detektion.' },
          { id: 'qz_rst2_7', category: 'RST 2 — Autonomer Motorsport', question: 'Der Tube-MPC-Regler des TUM-Stacks…', options: ['läuft mit 1 Hz und nutzt ein detailliertes Reifenmodell im Regelfall', 'ersetzt vollständig die Lokalisierung des Fahrzeugs im Normalbetrieb', 'plant die Ideallinie für die komplette Rennrunde im Normalbetrieb', 'nutzt ein Punktmasse-Modell, hält Constraints ein, läuft mit 100 Hz'], correct: 3, explanation: 'Tube-MPC: Punktmasse + Aktuatordynamik, kombinierte Reifenlimits, robust gegen Störungen, 100 Hz.' },
          { id: 'qz_rst2_8', category: 'RST 2 — Autonomer Motorsport', question: 'Was schätzt das GripMap-Modul?', options: ['Die momentane Temperatur der einzelnen Reifen generell', 'Das lokal verfügbare Reibwert-/Beschleunigungspotenzial', 'Die aktuelle Position der gegnerischen Fahrzeuge meist', 'Den Energieverbrauch des Fahrzeugs pro Runde generell'], correct: 1, explanation: 'Die GripMap kartiert lokale Grip-Skalierungen, damit der Planner adaptive, sichere Trajektorien am Limit planen kann.' },

        open: [
          { id: 'op_rst2_1', points: '4 Pkt.', question: 'Nenne und beschreibe zwei Gruppen der Softwarearchitektur eines autonomen Rennfahrzeugs.', answer: '• Perception: Verarbeitung der Sensordaten (LiDAR, Kamera, RaDAR, GNSS) zu Lokalisierung und Objektlisten — State Estimation, Detection, Tracking (2).\n• Planning: Vorhersage anderer Fahrzeuge + Planung der Trajektorie — global (offline, schnellste Linie) und lokal (online, sichere Trajektorie) (2).\n• (Alternativ Control: Umsetzung der geplanten Trajektorie in Lenk-/Antriebs-/Bremsbefehle, z.B. per MPC.)' },
          { id: 'op_rst2_2', points: '4 Pkt.', question: 'Ordne die Begriffe zu: „statische Umgebung“, „Echtzeit-Neuberechnung“, „schnellste Trajektorie“, „Planungshorizont“ — Global oder Local Planning?', answer: '• Statische Umgebung → Global Planning (1).\n• Echtzeit-Neuberechnung → Local Planning (1).\n• Schnellste Trajektorie (Rundenzeit-Minimierung) → Global Planning (1).\n• Trajektorie bis zum Planungshorizont → Local Planning (1).' },
          { id: 'op_rst2_3', points: '3 Pkt.', question: 'Beschreibe die Sensor-Setup-Kette eines autonomen Rennfahrzeugs (Dallara AV-21) und die Aufgabe der Sensorfusion.', answer: '• Sensoren: LiDAR, Kameras, RaDAR, GPS/GNSS + IMU (1).\n• Jede Modalität hat Stärken/Schwächen (Reichweite, Geschwindigkeit, Wetter) → Fusion kombiniert sie zu einer einheitlichen Objektliste (1).\n• Late Fusion & Tracking: Transformation → Plausibilisierung → Matching (Ungarische Methode) → EKF → Delay-Kompensation (1).' },

      {
        id: 'rst3', name: 'Rennreifen', icon: '🛞', color: '#ff9f0a', examWeight: 12,
        slideDeck: 'Folien_Rennsporttechnik/VL_RST_4_Rennreifen_v2.pdf',
        guided: [
          { id: 'g_rst3_1', badge: 'Haftung', title: 'Die 2 Haftungsmechanismen des Reifens', body: 'Absoluter Klausur-Klassiker: Welche Effekte sorgen für Reibung beim Reifen?\n\n1. Molekulare Adhäsion: Kräfte durch molekulare Anziehung zwischen Reifen und Straße. Verbindungen entstehen, werden gestreckt und brechen kontinuierlich. Dominiert bei TROCKENEN Oberflächen und geringen Gleitgeschwindigkeiten. Maximal beim profillosen Slick; ein Trennfilm (Wasser, Öl) hebt sie auf.\n\n2. Hysterese (Rauigkeitseffekte): Der viskoelastische Gummi kehrt nach Verformung nicht sofort in die Ausgangslage zurück → asymmetrisches Kraftfeld mit tangentialer Komponente. Dominiert bei höheren Gleitgeschwindigkeiten und auf nasser Fahrbahn.\n\nGesamtreibkraft: $F = F_Adhäsion + F_Hysterese$', example: '🔑 Klausur: „Welche Haftungsmechanismen hat der Reifen und welche Anteile gehen in die Gesamthaftung ein?“ → Adhäsion (dominant trocken/langsames Gleiten) + Hysterese (dominant nass/schnelles Gleiten, signifikanter Anteil durch Fahrbahnrauigkeit).' },
          { id: 'g_rst3_2', badge: 'Viskoelastisch', title: 'Gummi: E-Modul & Hysterese über Temperatur und Frequenz', body: 'Gummi ist VISKOELASTISCH — zwischen Feder und viskoser Flüssigkeit. Kraft und Verformung sind nicht phasengleich; die innere Reibung der Molekülketten absorbiert Energie → Wärme.\n\nElastizität (E-Modul) = Spannung/Verformung. „Weich“ = niedriger E-Modul. Verlustfaktor: $tan δ = E\'\'/E\'$\n\nFrequenzeinfluss: niedrige Frequenz → geringe Hysterese, elastisch; steigende Frequenz → Phasenverzug, viskoelastisch, Hysterese-MAXIMUM im optimalen Arbeitsbereich; sehr hohe Frequenz → Gummi versprödet (Glasverhalten), Steifigkeit maximal, Hysterese sinkt wieder.\n\nTemperatureinfluss (spiegelbildlich): niedrige Temperatur → steif und spröde (Glas); Glasübergangstemperatur → höchste Hysterese; hohe Temperatur → weich, Federverhalten.', example: '🔑 WS18-Klausur: „Wie verändert sich E-Modul und Hysterese in Abhängigkeit der Temperatur bzw. Frequenz?“ — Hohe Frequenz wirkt wie niedrige Temperatur (Glasverhalten)!' },
          { id: 'g_rst3_3', badge: 'Kräfte', title: 'Schlupf, Schräglauf & Radlastdegressivität', body: 'Für JEDE Kraftübertragung braucht der Reifen eine Relativbewegung:\n\n• Längs: Schlupf = Verhältnis Umfangs- zu Mittelpunktsgeschwindigkeit. Gummielemente haften erst (Formschlupf/Shear), gleiten dann (Gleitschlupf). Reibungskoeffizient $μ_x = F_x/F_z$. Wichtig für ABS, Traktionskontrolle, Launch Control.\n• Quer: Der Reifen läuft unter Schräglaufwinkel α. Seitenkraft greift um den Reifennachlauf versetzt an → Rückstellmoment $M_z = F_y · Nachlauf$. Mit zunehmendem Schräglauf sinkt der Nachlauf → Lenkung wird „leichter“, BEVOR das Seitenkraftmaximum erreicht ist.\n\nRadlastdegressivität: Mit zunehmender Radlast $F_z$ sinkt der Reibwert $μ_y$! Folgen:\n• Forderung nach möglichst tiefem Schwerpunkt (weniger Radlastverlagerung = mehr Gesamtgrip)\n• Balanceänderung über Rollmomentenverteilung möglich\n• Doppelte Radlast ⇒ NICHT doppelte Querkraft ⇒ nicht doppelte Querbeschleunigung', example: '🔑 WS24/25: „Erkläre, warum doppelte Radlast nicht doppelte Querbeschleunigung bedeutet“ → Radlastdegressivität des Reibwerts: μ nimmt mit Fz ab, Fy wächst unterproportional.' },
          { id: 'g_rst3_4', badge: 'Setup-Einflüsse', title: 'Sturz, Luftdruck & Temperaturfenster', body: 'Sturz: Erhöhung steigert das Querkraftpotenzial am kurvenÄUSSEREN Reifen (Abstützeffekt), verringert aber das Querkraftpotenzial am kurveninneren Reifen und das Längskraftpotenzial.\n\nLuftdruck: Druck erhöhen → kleinerer Contact Patch, höhere Reifensteifigkeit, höherer Energieeintrag. Rennreifen werden mit STICKSTOFF befüllt: geringerer Druckverlust (größere N₂-Moleküle diffundieren schlechter), stabilere Druckverhältnisse, geringer Wasserdampfgehalt (feuchte Luft → unkontrollierte Druckerhöhung durch Dampfbildung).\n\nTemperatur: Rennreifen haben sehr hohe Haftung, aber nur in einem SCHMALEN Temperaturfenster (F1 ~100–110 °C Optimum). Heizdecken (gezieltes Temperaturniveau) oder Reifenofen (erwärmt Reifen + Felge, Positionen tauschen) helfen beim Erreichen; das Setup stabilisiert die Temperatur im Rennen.', example: '🔑 Anders als beim PKW steigt beim F1-Reifen der Reibwert mit der Temperatur (bis zum Optimum) — beim Straßenreifen baut er ab.' },
          { id: 'g_rst3_5', badge: 'Modelle', title: 'Reifenmodellierung: Pacejka, TameTire, BRIT, F-Tire', body: 'Empirische Modelle (numerisch effizient):\n• Pacejka Magic Formula: berechnet $F_x$, $F_y$, $M_z$ aus $F_z$, Sturz, Schlupf & Schräglauf über Koeffizienten aus Messdaten. Kurze Rechenzeit, geringer Parametrieraufwand — aber KEINE thermischen Effekte, geringe Dynamik.\n• Abweichung von realer Haftung: Pacejka-Schräglaufsteifigkeit ist HÖHER als real und das Schräglaufwinkel-Optimum zu KLEINEREN Werten verschoben, weil die Messprozedur den Reifen nicht auf Idealtemperatur hält.\n\nSemi-physikalisch: TameTire — mechanisches Brush-Modell + Gummimischungs-Beschreibung + thermisches Modell (Oberflächen-/Innentemperatur).\n\nPhysikalisch (hohe Detaillierung): BRIT (Brush & Ring), F-Tire (Gürtel als flexibler Ring aus Punktmassen mit nichtlinearen Feder-/Dämpferelementen; volles nichtlineares 3D-Modell, hoher Parametrieraufwand).', example: '🔑 Klausur: „Zeichne die Abweichung der Pacejka Magic Formula von der realen Haftung“ — Pacejka: steilerer Anstieg, Peak bei kleinerem Schräglaufwinkel, zu hohes Maximum.' },
          { id: 'g_rst3_6', badge: 'Versuch', title: 'Prüfstände & Messungen', body: 'Reifenprüfstände (2 Beispiele nennen können!):\n• Innentrommelprüfstand: Kacheln mit realem Fahrbahnbelag, Bewässerung möglich\n• Außentrommelprüfstand: Stahltrommel mit Beschichtung, teils abweichende Eigenschaften\n• Flachband-Prüfstand: reale Krümmungsverhältnisse Reifen/Fahrbahn\n• Mess-Anhänger: Messung auf realer (auch nasser) Fahrbahn, geringere Messqualität\n\nTemperaturmessung: Infrarotsensoren/-kameras (Oberfläche, sehr dynamisch) und Einstechthermometer (~4 mm tief, Core-Temperatur zwischen Lauffläche und Gürtel; innen/Mitte/außen).\n\nDegradation im Rennen: Fahrzeug wird durch Reifenabbau langsamer, durch Kraftstoffverbrauch aber schneller — Reifendegradation = Rundenzeitverlust + Gewichtseffekt-Gewinn.', example: '🔑 WS24/25: „2 Beispiele für Reifenprüfstände“ — z.B. Flachbandprüfstand (reale Aufstandsgeometrie) und Innentrommel (realer Belag, bewässerbar).' },

        flashcards: [
          { id: 'fc_rst3_1', front: 'Welche Haftungsmechanismen hat ein Reifen? Wann dominiert welcher?', back: '• Molekulare Adhäsion: dominiert trocken & bei geringen Gleitgeschwindigkeiten; durch Trennfilm (Wasser/Öl) unwirksam.\n• Hysterese (Rauigkeitseffekte): viskoelastische Verformung an Fahrbahnrauigkeiten; dominiert bei höheren Gleitgeschwindigkeiten & Nässe.\n$F = F_Adhäsion + F_Hysterese$' },
          { id: 'fc_rst3_2', front: 'Wie verhalten sich E-Modul und Hysterese von Gummi über der Temperatur?', back: 'Niedrige T: steif & spröde (Glasverhalten), hoher E-Modul.\nGlasübergangstemperatur: mittlere Steifigkeit, HÖCHSTE Hysterese.\nHohe T: weich, Federverhalten, geringe Hysterese.\n(Frequenz wirkt spiegelbildlich: hohe Frequenz ≙ niedrige Temperatur.)' },
          { id: 'fc_rst3_3', front: 'Was ist Radlastdegressivität und welche 2 Konsequenzen folgen daraus?', back: 'Der Reibwert μ sinkt mit zunehmender Radlast Fz (Seitenkraft wächst unterproportional).\n→ 1. Möglichst tiefer Schwerpunkt (weniger Radlastverlagerung = mehr Gesamtpotenzial).\n→ 2. Balanceabstimmung über Rollmomentenverteilung möglich.' },
          { id: 'fc_rst3_4', front: 'Warum bedeutet doppelte Radlast nicht doppelte Querbeschleunigung?', back: 'Wegen der Radlastdegressivität: μy nimmt mit steigender Radlast ab → Fy = μy·Fz wächst unterproportional. Zusätzlich erhöht Radlastverlagerung (hoher Schwerpunkt) die Last außen und senkt so das Gesamtgrip-Potenzial.' },
          { id: 'fc_rst3_5', front: 'Definition Schlupf und Schräglaufwinkel?', back: 'Schlupf (längs) = Verhältnis von Umfangsgeschwindigkeit zu Mittelpunktsgeschwindigkeit des Rades.\nSchräglaufwinkel α (quer) = Winkel zwischen Radebene und Bewegungsrichtung — nötig, um Seitenkraft aufzubauen.' },
          { id: 'fc_rst3_6', front: 'Was ist das Rückstellmoment und warum wird die Lenkung vor dem Seitenkraftmaximum „leichter“?', back: '$M_z = F_y · Reifennachlauf$. Die Seitenkraft greift um den Nachlauf versetzt an. Mit zunehmendem Schräglauf nimmt der Nachlauf (durch Gleiten) ab → Mz sinkt, obwohl Fy noch steigt.' },
          { id: 'fc_rst3_7', front: 'Wie wirkt Sturz auf das Kraftpotenzial?', back: 'Mehr Sturz: Querkraftpotenzial am kurvenäußeren Reifen steigt (Abstützeffekt), am kurveninneren sinkt es — und das Längskraftpotenzial sinkt ebenfalls.' },
          { id: 'fc_rst3_8', front: 'Warum werden Rennreifen mit Stickstoff befüllt?', back: '• Geringerer Druckverlust (größere N₂-Moleküle diffundieren schlechter durch Gummi)\n• Stabilere Druckverhältnisse\n• Geringer Wasserdampfgehalt → keine unkontrollierte Druckerhöhung durch Dampfbildung' },
          { id: 'fc_rst3_9', front: 'Welche Arten der Reifenmodellierung gibt es? Nenne Beispiele.', back: '• Empirisch: Pacejka Magic Formula (Kennlinien-Nachbildung, schnell, ohne Thermik)\n• Semi-physikalisch: TameTire (Brush-Modell + Gummibeschreibung + Thermomodell)\n• Physikalisch: BRIT (Brush & Ring), F-Tire (flexibler Ring, volles nichtlineares 3D-Modell)' },
          { id: 'fc_rst3_10', front: 'Wie weicht die Pacejka Magic Formula von der realen Haftung eines Rennreifens ab?', back: '• Schräglaufsteifigkeit höher als real\n• Schräglaufwinkel-Optimum zu kleineren Werten verschoben\n• Maximale Haftung unrealistisch\nGrund: Messprozedur hält den Reifen nicht auf geeigneter Temperatur → Rennreifen brauchen thermischen Modellansatz.' },
          { id: 'fc_rst3_11', front: 'Nenne 2 Beispiele für Reifenprüfstände.', back: 'Innentrommelprüfstand (realer Fahrbahnbelag, bewässerbar), Außentrommelprüfstand (Stahltrommel), Flachband-Prüfstand (reale Krümmungsverhältnisse), Mess-Anhänger (reale/nasse Fahrbahn).' },
          { id: 'fc_rst3_12', front: 'Wie wird die Reifentemperatur gemessen?', back: '• Oberfläche: Infrarotsensoren/-kameras (sehr dynamisch: Schlupf, Schräglauf, Last)\n• Core: Einstechthermometer ~4 mm tief (zwischen Lauffläche und Gürtel), an 3 Stellen: innen, Mitte, außen.' },
          { id: 'fc_rst3_13', front: 'Radial- vs. Diagonalreifen — Hauptunterschiede?', back: 'Radial: Karkasse radial, Gürtellagen sichern Steifigkeit, Aufstandsfläche vom steifen Gürtel bestimmt, geringerer Rollwiderstand & Abnutzung.\nDiagonal: ≥2 Lagen gummierter Cordfäden, Eigenschaften vom Fadenwinkel bestimmt, keine Stahlgürtel (dyn. Radius steigt mit v), geringeres Trägheitsmoment.' },

        quiz: [

          { id: 'qz_rst3_2', category: 'RST 3 — Rennreifen', question: 'Warum wirken Adhäsionskräfte auf nasser Fahrbahn kaum noch?', options: ['Weil das Regenwasser den Gummi stark abkühlt meist', 'Ein Trennfilm unterbindet die molekulare Anziehung', 'Weil der Reifendruck auf nasser Bahn ansteigt meist', 'Weil die Hysterese das Wasser vollständig verdrängt'], correct: 1, explanation: 'Besteht ein Trennfilm (Wasser, Öl) zwischen Fahrbahn und Gummi, können die molekularen Adhäsionsverbindungen nicht entstehen.' },
          { id: 'qz_rst3_3', category: 'RST 3 — Rennreifen', question: 'Bei welcher Bedingung erreicht die Hysterese des Gummis ihr Maximum?', options: ['Bei sehr niedriger mechanischer Anregungsfrequenz meist', 'Genau bei der maximal möglichen Gummitemperatur generell', 'Nahe der Glasübergangstemperatur bzw. mittlerer Frequenz', 'Sie ist von Frequenz und Temperatur völlig unabhängig'], correct: 2, explanation: 'An der Glasübergangstemperatur (bzw. im mittleren Frequenzbereich) ist die Hysterese maximal — der optimale Arbeitsbereich der Mischung.' },
          { id: 'qz_rst3_4', category: 'RST 3 — Rennreifen', question: 'Radlastdegressivität bedeutet…', options: ['Der Reibwert steigt proportional zur Radlast', 'Die Radlast sinkt mit der Geschwindigkeit meist', 'Der Reifen verschleißt bei hoher Last langsamer', 'Der Reibwert nimmt mit zunehmender Radlast ab'], correct: 3, explanation: 'μy sinkt mit Fz — deshalb tiefer Schwerpunkt und Balanceabstimmung über Rollmomentenverteilung.' },
          { id: 'qz_rst3_5', category: 'RST 3 — Rennreifen', question: 'Warum wird die Lenkung „leichter“, bevor das Seitenkraftmaximum erreicht ist?', options: ['Weil die Servolenkung an dieser Stelle eingreift generell', 'Das Rückstellmoment sinkt mit dem Nachlauf, Fy steigt noch', 'Weil sich der Radsturz in der Kurve verringert im Regelfall', 'Weil der Reifenluftdruck in der Kurve abfällt im Regelfall'], correct: 1, explanation: 'Mz = Fy · Nachlauf; mit zunehmendem Schräglauf (mehr Gleiten) schrumpft der Nachlauf → Mz fällt vor dem Fy-Maximum.' },
          { id: 'qz_rst3_6', category: 'RST 3 — Rennreifen', question: 'Was bewirkt eine Erhöhung des Reifenluftdrucks?', options: ['Größerer Contact Patch bei weicherer Karkasse generell', 'Kleinerer Contact Patch und höhere Reifensteifigkeit', 'Niedrigere Reifentemperatur bei gleichem Eintrag meist', 'Höherer Verschleiß bei zugleich geringerer Steifigkeit'], correct: 1, explanation: 'Druck erhöhen → Contact Patch kleiner, Steifigkeit höher, Energieeintrag höher — ein zentrales Setup-Werkzeug.' },
          { id: 'qz_rst3_7', category: 'RST 3 — Rennreifen', question: 'Die Pacejka Magic Formula berücksichtigt KEINE…', options: ['Längskräfte', 'Rückstellmomente', 'thermischen Effekte', 'Schräglaufwinkel'], correct: 2, explanation: 'Pacejka ist rein empirisch (Fx, Fy, Mz aus Fz, Sturz, Schlupf, Schräglauf) — Thermik fehlt, daher braucht Rennreifen-Simulation oft einen thermischen Ansatz (z.B. TameTire).' },
          { id: 'qz_rst3_8', category: 'RST 3 — Rennreifen', question: 'Aus welchen drei Teilmodellen besteht TameTire?', options: ['Mechanisches Brush-Modell, Gummimischung und Thermik', 'Feder-, Dämpfer- und ein Massemodell des Reifens meist', 'Karkassen-, Gürtel- und ein Profilmodell im Regelfall', 'Slick-, Intermediate- und ein Regenmodell generell'], correct: 0, explanation: 'TameTire = semi-empirisch: Brush-Type-Mechanik + Gummieigenschaften im Reibungskoeffizienten + Thermomodell (Konvektion, Wärmeleitung, Reibungswärme).' },
          { id: 'qz_rst3_9', category: 'RST 3 — Rennreifen', question: 'Welcher Prüfstand bildet die realen Krümmungsverhältnisse zwischen Reifen und Fahrbahn ab?', options: ['Außentrommelprüfstand', 'Flachband-Prüfstand', 'Innentrommelprüfstand', 'Schwungmassenprüfstand'], correct: 1, explanation: 'Nur das Flachband hat eine ebene Kontaktfläche wie die reale Straße; Trommeln krümmen die Aufstandsfläche.' },
          { id: 'qz_rst3_10', category: 'RST 3 — Rennreifen', question: 'Wie unterscheiden sich F1- und Straßenreifen im Temperaturverhalten des Reibwerts?', options: ['Beide verlieren mit steigender Temperatur an Grip', 'F1: Reibwert steigt bis ~100-110 °C; Straße: baut ab', 'Nur Straßenreifen brauchen vorgewärmte Heizdecken', 'F1-Reifen sind im Reibwert temperaturunabhängig meist'], correct: 1, explanation: 'Rennmischungen haben ihr schmales Optimum bei ~100–110 °C; Straßenreifen sind auf breite Bedingungen ausgelegt und verlieren mit steigender Temperatur.' },

        open: [
          { id: 'op_rst3_1', points: '4 Pkt.', question: 'Benenne die Haftungsmechanismen Reifen → Straße sowie deren Anteile an der Gesamthaftung.', answer: '• Molekulare Adhäsion: Anziehung zwischen Gummimolekülen und Fahrbahn; dominant bei trockener Fahrbahn und geringen Gleitgeschwindigkeiten; maximal beim Slick; durch Trennfilm aufgehoben (2).\n• Hysterese: viskoelastische Verformung an der Fahrbahnrauigkeit (Makro-/Mikrorauigkeit) erzeugt asymmetrisches Kraftfeld; signifikanter Anteil, dominant bei höheren Gleitgeschwindigkeiten/Nässe (2).' },
          { id: 'op_rst3_2', points: '4 Pkt.', question: 'Erkläre mit der Radlastdegressivität, warum eine doppelte Radlast nicht die doppelte Querbeschleunigung ermöglicht.', answer: '• Der Reibwert μy nimmt mit zunehmender Radlast Fz ab (Radlastdegressivität) (1).\n• Die Seitenkraft Fy = μy(Fz)·Fz wächst daher unterproportional zur Last (1).\n• Bei Radlastverlagerung (hoher Schwerpunkt) verliert das entlastete Rad mehr, als das belastete gewinnt (1).\n• → Gesamtquerkraft/Querbeschleunigung sinkt; deshalb möglichst tiefer Schwerpunkt (1).' },

      {
        id: 'rst4', name: 'E-Antriebe im Motorsport', icon: '⚡', color: '#30d158', examWeight: 9,
